<!DOCTYPE html>
<html lang="es">
<head>
<!-- publicación precompilada · el fuente vive en la rama main -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ventas Freelance · Comisionista</title>
<script src="./lib/react-18.3.1.min.js"></script>
<script src="./lib/react-dom-18.3.1.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
  :root{
    --field:#15392B; --field-700:#1E4D3A; --maize:#F2A900; --maize-deep:#BF7A00;
    --field-soft:#EEF3EF; --field-soft-line:#CFE0D5; --field-soft-txt:#1E4D3A;
    --paper:#F7F5EF; --card:#FFFFFF; --ink:#18211C; --muted:#6F7A6F;
    --line:#E7E1D3; --clay:#B5613C; --ok:#2E7D52;
    --shadow:0 1px 2px rgba(21,57,43,.06),0 8px 24px rgba(21,57,43,.06);
    --fs:1; /* escala de fuente (Ajustes: normal=1, grande=1.12) */
  }
  /* ═══ TEMAS (Ajustes) ═══ */
  /* Sol · alto contraste para leer bajo sol directo */
  [data-tema="sol"]{
    --field:#0B2A1E; --field-700:#123B2A; --maize:#F59E00; --maize-deep:#B36B00;
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0F0C; --muted:#4A554C;
    --line:#D6D2C4; --clay:#A34A28; --ok:#1F6B41;
    --field-soft:#EAF1EC; --field-soft-line:#C3D6C9; --field-soft-txt:#0B2A1E;
    --shadow:0 1px 2px rgba(0,0,0,.10),0 6px 18px rgba(0,0,0,.08);
  }
  /* Noche · oscuro, para madrugada y poca luz */
  [data-tema="noche"]{
    --field:#0E1A14; --field-700:#16261D; --maize:#E9B44C; --maize-deep:#C08F2E;
    --paper:#111A15; --card:#182420; --ink:#E6EDE8; --muted:#93A399;
    --line:#26332C; --clay:#D08160; --ok:#57A773;
    --field-soft:#1B2A23; --field-soft-line:#2C3D34; --field-soft-txt:#DCE8E0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  /* Grafito · neutro y serio, para reuniones */
  [data-tema="grafito"]{
    --field:#22262A; --field-700:#2F353A; --maize:#D9A441; --maize-deep:#AD7F2A;
    --paper:#F4F5F6; --card:#FFFFFF; --ink:#1A1E21; --muted:#6C757D;
    --line:#DFE3E6; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#EDEFF1; --field-soft-line:#D3D8DC; --field-soft-txt:#22262A;
    --shadow:0 1px 2px rgba(20,25,30,.07),0 8px 22px rgba(20,25,30,.07);
  }
  /* Arena · cálido, menos fatiga en uso prolongado */
  [data-tema="arena"]{
    --field:#4A3B22; --field-700:#5E4B2C; --maize:#E0A82E; --maize-deep:#B4801C;
    --paper:#FAF4E8; --card:#FFFCF6; --ink:#2A2317; --muted:#7A6E58;
    --line:#E8DCC4; --clay:#B26A3C; --ok:#5C7C48;
    --field-soft:#F3EADA; --field-soft-line:#DFCFB0; --field-soft-txt:#4A3B22;
    --shadow:0 1px 2px rgba(74,59,34,.07),0 8px 22px rgba(74,59,34,.08);
  }
  /* Brote · verde claro y suave, descansado */
  [data-tema="brote"]{
    --field:#2F6B4F; --field-700:#3D8461; --maize:#F7CB72; --maize-deep:#B87D0C;
    --paper:#F4F8F5; --card:#FFFFFF; --ink:#17251E; --muted:#66786D;
    --line:#DCE8E0; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E9F3ED; --field-soft-line:#C6DED1; --field-soft-txt:#2F6B4F;
    --shadow:0 1px 2px rgba(47,107,79,.06),0 8px 22px rgba(47,107,79,.07);
  }
  /* Río · azul suave, tranquilo */
  [data-tema="rio"]{
    --field:#1F4E6B; --field-700:#2C6688; --maize:#EBB247; --maize-deep:#B2761A;
    --paper:#F3F7FA; --card:#FFFFFF; --ink:#14212A; --muted:#647682;
    --line:#D9E4EC; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E8F1F6; --field-soft-line:#C4DAE7; --field-soft-txt:#1F4E6B;
    --shadow:0 1px 2px rgba(31,78,107,.06),0 8px 22px rgba(31,78,107,.07);
  }
  [data-tema="sol"] .card{border-color:#DAD6C8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* Blindaje anti-desborde: en filas flex, los campos ceden espacio en vez de empujar botones fuera */
  input,select,textarea{min-width:0;max-width:100%}
  button{max-width:100%}
  html,body{height:100%}
  body{background:var(--field);font-family:Inter,system-ui,sans-serif;color:var(--ink);
    font-size:calc(16px * var(--fs))}
  #root{height:100%}
  .num{font-family:'Space Grotesk',sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:16px}
  /* phone shell */
  /* ── piezas compartidas con el ecosistema ── */
  /* micrófono de dictado */
  .micb{background:none;border:none;padding:0 4px;cursor:pointer;display:flex;align-items:center;flex-shrink:0}
  .micb.rec svg{animation:micPulso 1s ease-in-out infinite}
  @keyframes micPulso{0%,100%{opacity:1}50%{opacity:.4}}
  /* botón flotante de crear */
  .fab-zona{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;pointer-events:none;z-index:55}
  .fab{position:absolute;width:48px;height:48px;border-radius:50%;
    background:var(--maize,#F2A900);color:#3A2E12;border:none;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 4px 14px rgba(74,59,34,.28),0 2px 4px rgba(74,59,34,.18);
    transform:translateY(-50%);touch-action:none;transition:box-shadow .15s,transform .12s}
  .fab:active{transform:translateY(-50%) scale(.94)}
  .fab.mov{box-shadow:0 8px 26px rgba(74,59,34,.38);opacity:.92}
  .fab,.fab-mas{font-size:26px}
  .fab-mas{font-weight:400;line-height:1;margin-top:-2px;font-family:Inter,system-ui,sans-serif}
  /* buscador predictivo para filtros */
  .fb{position:relative;min-width:0;width:100%}
  .fb-box{display:flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px 9px 10px;width:100%;min-width:0}
  .fb-box input{flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:12.5px;color:var(--field,#2E7D52);padding:0;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
  .fb-box input::placeholder{color:var(--muted)}
  .fb-box.act{background:var(--card);border-color:var(--field,#2E7D52)}
  .fb-box.act input{font-weight:700}
  .fb-cara{font-size:13px;color:var(--muted);flex-shrink:0;padding-left:3px;
    margin-left:2px;border-left:1px solid var(--line)}
  .fb-clr{border:none;background:transparent;color:var(--muted);font-size:16px;
    line-height:1;padding:0 2px;cursor:pointer;flex-shrink:0}
  .fb-pop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.13);
    max-height:230px;overflow-y:auto;z-index:40}
  .fb-opt{padding:10px 12px;font-size:12.5px;border-bottom:1px solid #F4F1E9;
    cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb-opt:last-child{border-bottom:none}
  .fb-none{padding:12px;font-size:12px;color:var(--muted);text-align:center}
  /* indicadores compactos */
  /* pestañas: no estaban definidas y salían como texto plano */
  .eq-tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:12px}
  .eq-tabs button{flex:1;min-width:0;background:none;border:none;border-radius:9px;
    padding:9px 8px;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;justify-content:center}
  .eq-tabs button.on{background:var(--card);color:var(--field);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .eq-tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
    border-radius:9px;background:#C2603A;color:#fff;font-size:10px;font-weight:800;margin-left:5px;padding:0 4px}
  /* buscador de cliente destacado en Tomar pedido (igual que en la app del freelance) */
  .busc-cliente .box{border:2px solid var(--field);background:#F7FBF8}
  .busc-cliente .mag{color:var(--field);font-weight:800}
  @keyframes buscHalo{0%,100%{box-shadow:0 0 0 0 rgba(46,107,67,.28)}50%{box-shadow:0 0 0 6px rgba(46,107,67,0)}}
  .busc-cliente{animation:buscHalo 2.4s ease-in-out 3}
  @media (prefers-reduced-motion:reduce){.busc-cliente{animation:none!important}}
  /* Cliente como TÍTULO de la pantalla, FIJO al hacer scroll (ya viene elegido) */
  .cli-titulo{position:sticky;top:-10px;z-index:20;background:var(--paper);
    font-size:21px;font-weight:800;color:var(--field);line-height:1.2;
    margin:-10px -18px 11px;padding:14px 18px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 6px 12px -8px rgba(21,57,43,.25)}
  .mini-kpi{display:flex;gap:7px;margin:10px 0 11px}
  .mini-kpi button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
    gap:1px;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:9px 5px;font-family:inherit;cursor:pointer}
  .mk-v{font-size:17px;font-weight:800;color:var(--field,#2E7D52);line-height:1.15}
  .mk-k{font-size:9.5px;color:var(--muted);font-weight:600;text-align:center;
    line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  /* los diálogos nativos no crecen con la escala de texto */
  input[type="date"],input[type="time"],input[type="datetime-local"],input[type="month"]{
    font-size:16px;line-height:1.2}
  /* ── estilo neumórfico (tarjetas suaves) ── */
  .neu{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;
    box-shadow:6px 6px 16px rgba(23,43,32,.07), -6px -6px 16px rgba(255,255,255,.85);
    border:none}
  .neu-in{background:var(--paper);border-radius:16px;padding:14px;
    box-shadow:inset 3px 3px 8px rgba(23,43,32,.06), inset -3px -3px 8px rgba(255,255,255,.9)}
  .neu-t{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:2px}
  .neu-s{font-size:10.5px;color:var(--muted);margin-bottom:14px}
  .neu-chips{display:inline-flex;gap:4px;background:var(--paper);border-radius:99px;padding:3px;
    box-shadow:inset 2px 2px 6px rgba(23,43,32,.07), inset -2px -2px 6px rgba(255,255,255,.9)}
  .neu-chip{border:none;background:transparent;border-radius:99px;padding:6px 14px;font-family:inherit;
    font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s ease}
  .neu-chip.on{background:var(--card);color:var(--field);
    box-shadow:2px 2px 6px rgba(23,43,32,.09), -2px -2px 6px rgba(255,255,255,.9)}
  /* en Sol el relieve se atenúa para no perder contraste bajo el sol */
  [data-tema="sol"] .neu{box-shadow:0 1px 3px rgba(0,0,0,.10),0 6px 16px rgba(0,0,0,.07);border:1px solid #E3E0D4}
  [data-tema="sol"] .neu-in{box-shadow:none;border:1px solid #E3E0D4}
  /* ── Ajustes ── */
  .aj-paletas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .aj-pal{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    background:var(--card);border:2px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;text-align:left}
  .aj-pal.on{border-color:var(--field)}
  .aj-pal-muestra{display:flex;gap:3px;flex-shrink:0}
  .aj-pal-muestra span{width:15px;height:15px;border-radius:4px;display:block}
  .aj-pal-nom{font-size:12.5px;font-weight:600;color:var(--ink)}
  .aj-pal-check{position:absolute;top:10px;right:11px;color:var(--field);font-weight:800}
  .cl-wrap{position:relative;margin-bottom:9px}
  .cl-inp{width:100%;padding:12px 42px 12px 13px;border:1px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
  .cl-inp:focus{outline:none;border-color:var(--field)}
  .cl-ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
    border:none;background:transparent;font-size:15px;cursor:pointer;opacity:.6}
  .cl-lbl{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
  .cl-barra{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 5px}
  .cl-barra i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
  .cl-nota{font-size:11px;line-height:1.45;margin:0 2px 10px}
  .aj-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
  .aj-k{font-size:14px;font-weight:600;color:var(--ink)}
  .aj-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .aj-switch{width:46px;height:27px;border-radius:999px;background:#CDD4CD;position:relative;flex-shrink:0;transition:background .2s}
  .aj-switch.on{background:var(--ok)}
  .aj-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .aj-switch.on .aj-knob{left:22px}
  .aj-sel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;color:var(--field)}
  .aj-salir{width:100%;background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:13px;
    padding:14px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:18px}
  .aj-about{text-align:center;padding:10px 0 20px;color:var(--muted)}
  .aj-about-t{font-weight:800;color:var(--field);letter-spacing:.04em}
  .aj-about-s{font-size:11.5px;margin-top:2px}
  .pot-filtros{display:flex;flex-wrap:nowrap;gap:7px;margin-bottom:14px;
    overflow-x:auto;padding-right:14px;scrollbar-width:none}
  .pot-filtros::-webkit-scrollbar{display:none}
  .pot-filtros button{flex-shrink:0;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 12px;
    font-size:12px;font-weight:600;font-family:inherit;color:var(--field);cursor:pointer}
  .pot-filtros button.on{background:var(--field);color:#fff;border-color:var(--field)}
  /* ── menú lateral (drawer) ── */
  /* el encabezado de esta app es CLARO: los controles van en verde, no en blanco */
  .ham{background:rgba(21,57,43,.07);border:1px solid rgba(21,57,43,.12);color:var(--field);
    width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:700}
  .ham:active{background:rgba(21,57,43,.14)}
  .drawer-ov{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    background:rgba(0,0,0,0);visibility:hidden;z-index:60;transition:background .25s}
  .drawer-ov.on{background:rgba(0,0,0,.42);visibility:visible}
  .drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--paper);
    transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;
    box-shadow:2px 0 20px rgba(0,0,0,.2)}
  .drawer.on{transform:translateX(0)}
  .drawer-head{background:var(--field,#15392B);padding:18px 16px 16px;display:flex;
    align-items:flex-start;justify-content:space-between;gap:10}
  .drawer-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;
    border-radius:8px;font-size:17px;cursor:pointer;flex-shrink:0}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 13px 20px}
  .drawer-it{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:inherit;text-align:left}
  .drawer-it:active{background:var(--paper)}
  .di-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:16px;flex-shrink:0}
  .di-t{font-size:13.5px;font-weight:700;color:var(--ink)}
  .di-s{font-size:11px;color:var(--muted);margin-top:1px}
  .di-a{color:var(--muted);font-size:15px;flex-shrink:0}
  .drawer-acc{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    margin-bottom:8px;font-size:13px;font-weight:700;color:var(--field);font-family:inherit;
    cursor:pointer;text-align:left}
  .drawer-acc.on{background:#E9EEE9;border-color:#CFE0D4}
  .drawer-acc-fl{font-size:11px;color:var(--muted);flex-shrink:0}
  .drawer-salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
    background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:13px;padding:13px;
    font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .shell{max-width:430px;margin:0 auto;height:100dvh;background:var(--paper);
    position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.4)}
  @media(min-width:480px){.shell{min-height:auto;height:100dvh;margin:0 auto;border-radius:0}}
  /* top bar */
  .top{background:var(--field-soft);color:var(--field-soft-txt);padding:12px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .top .who{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .top .name{font-size:16px;font-weight:600;margin-top:2px;color:var(--field)}
  .top-nav{display:flex;align-items:center;gap:8px}
  .topbtn{display:flex;align-items:center;gap:5px;color:var(--field-soft-txt);font-size:14px;font-weight:600;
    background:rgba(30,77,58,.08);border-radius:999px;padding:7px 14px}
  .topbtn:active{background:rgba(30,77,58,.16)}
  .net{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(30,77,58,.06);
    padding:6px 10px;border-radius:999px;color:var(--field-soft-txt);font-weight:600}
  .net:active{background:rgba(30,77,58,.12)}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.on{background:#6FD39B} .dot.off{background:var(--maize)}
  .sync-intro{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .sync-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .sync-ic{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sync-t{font-size:14px;font-weight:600;color:var(--ink)}
  .sync-ok{text-align:center;padding:18px 0}
  .sync-nota{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;
    background:var(--paper);border-radius:10px;padding:10px 12px}
  /* alerta de clientes por visitar */
  .alerta-visita{display:flex;align-items:center;gap:10px;width:100%;background:#FBF0D8;
    border:1px solid #E8C98A;border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .alerta-visita:active{background:#F6E8C4}
  .av-ic{font-size:18px;flex-shrink:0}
  .av-t{font-size:14px;font-weight:700;color:var(--field)}
  .av-s{font-size:12px;color:#9A7B2E;margin-top:1px}
  .av-arrow{font-size:20px;color:#B79235}
  .visita-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sem{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .sem.rojo{background:#D9534F;box-shadow:0 0 0 4px rgba(217,83,79,.15)}
  .sem.ambar{background:#E0A33A;box-shadow:0 0 0 4px rgba(224,163,58,.15)}
  .sem-lbl{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .sem-lbl.rojo{background:#FBE3E2;color:#B0413D}
  .sem-lbl.ambar{background:#FBF0D8;color:#9A7B2E}
  .visita-leyenda{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:11.5px;color:var(--muted)}
  .visita-leyenda span{display:flex;align-items:center;gap:8px}
  .visita-leyenda .sem{width:11px;height:11px;box-shadow:none}
  /* solicitudes al proveedor */
  .sol-op{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
  .sol-op:active{background:var(--paper)}
  .sol-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0}
  .sol-elegido{background:var(--paper);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700;
    color:var(--field);margin-bottom:14px}
  .adjuntar{width:100%;background:var(--paper);border:1px dashed var(--line);border-radius:11px;
    padding:13px;font-size:13.5px;font-weight:600;color:var(--field)}
  .adjuntar:active{background:var(--card)}
  .sol-op.sel{border-color:var(--field);background:#EAF0EA}
  .fact-item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .fact-inp{width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;text-align:right}
  .fact-total{display:flex;justify-content:space-between;align-items:center;background:var(--field-soft);color:var(--field-soft-txt);
    border-radius:12px;padding:13px 15px;margin-top:6px;font-size:14px;font-weight:600}
  .fact-total .num{font-size:19px;font-weight:700}
  .resol-box{background:#E4F1E9;border:1px solid #A9D5BC;border-radius:11px;padding:12px 14px;
    font-size:13px;color:var(--ink);margin-top:10px;line-height:1.5}
  /* scroll body */
  .body{flex:1;overflow-y:auto;padding:10px 18px 96px}
  /* hero commission */
  .hero{background:linear-gradient(155deg,var(--field-soft) 0%,#E4ECE6 100%);
    border-radius:20px;padding:22px;color:var(--field-soft-txt);position:relative;overflow:hidden;border:1px solid var(--field-soft-line)}
  .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
    background:radial-gradient(circle,rgba(242,169,0,.22),transparent 70%)}
  .hero .lbl{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .hero .big{font-size:42px;font-weight:700;margin-top:4px;line-height:1;color:var(--field)}
  .hero .big small{font-size:20px;color:var(--muted);font-weight:500}
  .hero .split{display:flex;gap:14px;margin-top:18px}
  .hero .split div{flex:1;background:rgba(30,77,58,.06);border-radius:12px;padding:11px 13px}
  .hero .split .v{font-size:19px;font-weight:600;margin-top:3px;color:var(--field)}
  .hero .split .k{font-size:11px;color:var(--muted)}
  /* hero ampliado */
  .hero-top{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1}
  .hero-corte{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}
  .meta-ring{position:relative;width:118px;height:118px;flex-shrink:0}
  .meta-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mr-pct{font-size:24px;font-weight:700;color:var(--field);line-height:1}
  .mr-lbl{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.2}
  .meta-mensual{display:flex;align-items:center;gap:10px;background:rgba(30,77,58,.06);border-radius:12px;
    padding:10px 14px;margin-top:14px;position:relative;z-index:1}
  .meta-mensual span{font-size:18px}
  .mm-k{font-size:11px;color:var(--muted)}
  .mm-v{font-size:17px;font-weight:700;color:var(--field)}
  .vermas{width:100%;margin-top:14px;background:rgba(30,77,58,.09);border:1px solid rgba(30,77,58,.14);
    border-radius:11px;padding:11px;font-size:13px;font-weight:600;color:var(--field-soft-txt);position:relative;z-index:1}
  .vermas:active{background:rgba(30,77,58,.14)}
  /* detalle del mes: filas compactas en vez de tarjetas grandes */
  .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;
    margin-top:10px;position:relative;z-index:1}
  .hg-card{background:rgba(30,77,58,.06);border-radius:10px;padding:8px 9px;text-align:left;
    display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
  .hg-ic{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;
    justify-content:center;font-size:13px;margin:0;flex-shrink:0}
  .hg-k{font-size:10px;color:var(--muted);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hg-v{font-size:14px;font-weight:800;color:var(--field);line-height:1.15}
  .hg-s{display:none}
  .proy{display:flex;align-items:center;gap:9px;background:rgba(30,77,58,.06);border-radius:11px;
    padding:10px 11px;margin-top:8px;width:100%;position:relative;z-index:1;min-width:0;overflow:hidden}
  .proy-ic{font-size:20px;color:#2E7D52}
  .proy-t{font-size:12.5px;font-weight:700;color:var(--field-soft-txt);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proy-s{font-size:10.5px;color:var(--muted);margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proy-v{font-size:16px;font-weight:800;color:#2E7D52;flex-shrink:0}
  .proy-arrow{font-size:16px;color:var(--muted);flex-shrink:0}
  .proy-ic{flex-shrink:0}
  /* ===== Comisiones (módulo comisionista) ===== */
  .cu-resumen{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .cu-total{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .cu-total-k{font-size:12.5px;color:var(--muted);font-weight:600}
  .cu-total-v{font-size:30px;font-weight:800;color:var(--field);margin-top:3px}
  .cu-split{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .cu-part{display:flex;align-items:center;gap:12px}
  .cu-part-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .cu-part-k{font-size:13.5px;font-weight:700;color:var(--ink)}
  .cu-part-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .cu-part-v{font-size:16px;font-weight:800;color:var(--field)}
  .cu-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;padding-right:14px;margin-bottom:12px;scrollbar-width:none}
  .cu-chips::-webkit-scrollbar{display:none}
  .cu-chip{flex-shrink:0;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .cu-chip.on{background:var(--field-soft);color:var(--field-soft-txt);border-color:var(--field)}
  .cu-lista{display:flex;flex-direction:column;gap:10px}
  .cu-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .cu-item-top{display:flex;align-items:flex-start;gap:10px}
  .cu-item-cli{font-size:14.5px;font-weight:700;color:var(--ink)}
  .cu-item-prod{font-size:12px;color:var(--muted);margin-top:2px}
  .cu-badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;flex-shrink:0;white-space:nowrap}
  .cu-item-bot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .cu-item-fecha{font-size:12px;color:var(--muted)}
  .cu-item-com{font-size:17px;font-weight:800;color:var(--field)}
  .cu-vacio{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
  /* section */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 12px}
  .sec-h h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .sec-h .grain{flex:1;height:1px;background:var(--line);margin:0 12px;position:relative}
  /* quick actions */
  /* dos columnas que nunca se desbordan: minmax(0,1fr) permite encoger el contenido */
  .qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 11px;text-align:left;box-shadow:var(--shadow);transition:transform .08s;
    display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}
  .qa button:active{transform:scale(.97)}
  .qa .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:17px;margin:0;flex-shrink:0}
  .qa .t{font-size:13px;font-weight:700;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qa .s{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cli{font-size:15px;font-weight:600}
  .meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .amt{font-size:16px;font-weight:600}
  .amt small{font-size:12px;color:var(--muted);font-weight:500}
  /* chips */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:4px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%}
  .c-sync{background:#FBF0D8;color:var(--maize-deep)} .c-sync .d{background:var(--maize)}
  .c-warn{background:#FBF3DC;color:#8A6D12} .c-warn .d{background:#C9A227}
  .wa-cta{display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .c-ok{background:#E4F1E9;color:var(--ok)} .c-ok .d{background:var(--ok)}
  .c-wait{background:#EDEAE0;color:#7A6F50} .c-wait .d{background:#A89A6E}
  .c-live{background:#E9EEE9;color:var(--field)} .c-live .d{background:var(--field-700)}
  .c-bad{background:#F6E3DA;color:var(--clay)} .c-bad .d{background:var(--clay)}
  .pipe{display:flex;gap:4px;margin-top:12px}
  .pipe span{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .pipe span.done{background:var(--field-700)} .pipe span.now{background:var(--maize)}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px 20px;z-index:30}
  /* b364 · la barra se desliza fuera al leer y vuelve sola */
  .nav{transition:transform .22s ease, opacity .18s ease}
  .nav.baja{transform:translate(-50%,120%);opacity:0;pointer-events:none}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;color:var(--muted);font-weight:500;padding:6px 0}
  .nav button.act{color:var(--field)}
  .nav-center .nIco{background:var(--maize);color:var(--field);width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:1px}
  .nav-center{color:var(--field);font-weight:700}
  .nav .nIco{font-size:21px;line-height:1;position:relative}
  .nav .badge{position:absolute;top:-6px;left:13px;min-width:17px;height:17px;padding:0 4px;
    background:#D9534F;color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
  .nav .badge.ok{background:#2E7D52;left:auto;right:13px}
  .det-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .det-sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 4px}
  /* ===== Comisiones rediseñada ===== */
  .cu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .cu-toggle{display:flex;background:var(--paper);border-radius:999px;padding:3px;flex-shrink:0}
  .cu-toggle button{font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;color:var(--muted)}
  .cu-toggle button.on{background:var(--field-soft);color:var(--field-soft-txt)}
  .cu-hero{background:linear-gradient(150deg,var(--field-soft),#E4ECE6);border-radius:22px;padding:24px 22px;color:var(--field-soft-txt);border:1px solid var(--field-soft-line);
    position:relative;overflow:hidden}
  .cu-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;
    background:radial-gradient(circle,rgba(242,169,0,.25),transparent 70%)}
  .cu-hero-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;position:relative}
  .cu-hero-big{font-size:48px;font-weight:700;line-height:1;margin:8px 0 6px;position:relative}
  .cu-hero-sub{font-size:12.5px;color:var(--muted);position:relative}
  .cu-var{display:flex;align-items:center;gap:8px;margin-top:14px;position:relative}
  .cu-var-pill{font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px}
  .cu-var-pill.up{background:rgba(111,211,155,.2);color:#A9D977}
  .cu-var-pill.down{background:rgba(217,83,79,.25);color:#F0A6A3}
  .cu-var-txt{font-size:12px;color:var(--muted)}
  .cu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .cu-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .cu-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:9px}
  .cu-v{font-size:20px;font-weight:700;color:var(--field)}
  .cu-k{font-size:11.5px;color:var(--muted);margin-top:2px}
  .cu-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:6px}
  .cu-block-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:10px}
  .cu-pct{font-size:18px;font-weight:700;color:var(--field)}
  .cu-bar{height:12px;background:var(--paper);border-radius:999px;overflow:hidden}
  .cu-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2E7D52,#A9D977)}
  .cu-bar-fill.gold{background:linear-gradient(90deg,#C77F00,#F2A900,#FFD46B)}
  .cu-block-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
  .cu-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px}
  .cu-line b{font-weight:700;color:var(--field)}
  .cu-hint{font-size:12px;color:var(--ok);background:#E4F1E9;border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.4}
  .cu-rank{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FBF0D8,#F6E8C4);
    border:1px solid #E8C98A;border-radius:16px;padding:16px;margin-top:12px}
  .cu-rank-ic{font-size:30px}
  .cu-rank-t{font-size:15px;font-weight:700;color:var(--field)}
  .cu-rank-s{font-size:12px;color:#9A7B2E;margin-top:1px}
  /* gamificada */
  .cu-game-hero{background:linear-gradient(150deg,#F3E6C8,var(--field-soft));border-radius:22px;padding:24px 20px;color:var(--field-soft-txt);text-align:center;margin-bottom:12px;border:1px solid var(--field-soft-line)}
  .cu-game-rank{font-size:46px;font-weight:700;line-height:1;color:#FFD46B}
  .cu-game-rank-lbl{font-size:13px;color:var(--muted);margin-top:2px}
  .cu-game-meta{font-size:12.5px;color:var(--muted);margin-top:8px}
  .cu-streak{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:6px}
  .cu-streak-n{font-size:26px;font-weight:700;color:#C77F00}
  .cu-streak-t{font-size:14px;font-weight:700;color:var(--field)}
  .cu-logros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
  .cu-logro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .cu-logro.off{opacity:.45}
  .cu-logro-ic{font-size:26px}
  .cu-logro-t{font-size:10.5px;color:var(--ink);margin-top:6px;line-height:1.25}
  .cu-reto{background:linear-gradient(135deg,#FBF0D8,#F6E8C4);border:1px solid #E8C98A;border-radius:16px;padding:16px;margin-top:6px}
  .cu-reto-h{font-size:14px;font-weight:700;color:var(--field)}
  .cu-reto-t{font-size:13px;color:#7a5e1e;margin-top:3px}
  .nav .plus{margin-top:-30px}
  .nav .plus .nIco{background:var(--maize);color:var(--field);width:54px;height:54px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:0 6px 18px rgba(242,169,0,.4);font-weight:600}
  .nav .plus.act .nIco{background:var(--maize-deep)}
  /* form */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  /* Tarjetas de armado de pedido: Cantidad y Precio, separadas y con título resaltado */
  .tarjeta-pedido{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 15px;margin-bottom:14px;box-shadow:0 2px 10px rgba(21,57,43,.06)}
  .tarjeta-pedido.tp-precio{border-color:var(--maize-deep);
    box-shadow:0 3px 14px rgba(201,162,39,.14)}
  .tarjeta-pedido .field{margin-bottom:0}
  .tp-titulo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;
    color:var(--field);letter-spacing:.01em;margin-bottom:12px}
  .tp-titulo .tp-ic{font-size:17px}

  .tarjeta-pedido.tp-precio .tp-titulo{color:var(--maize-deep)}
  /* b147 · precio base abreviado a la derecha del titulo: el vendedor ve contra que compara */
  .tp-titulo .tp-base{margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:700;
    color:var(--muted);letter-spacing:0;white-space:nowrap;font-family:'Space Grotesk',sans-serif}
  /* Split 2 columnas: foto + referencia | controles (cantidad + precio) */
  .pedido-split{display:grid;grid-template-columns:0.72fr 1fr;gap:11px;align-items:stretch;margin-bottom:14px}
  /* b145 · cuando el tipo trae campos extra (P3/P4/P6) la foto se estira al alto de la
     columna derecha: antes quedaba un hueco blanco grande debajo del saco. */
  .pedido-split.split-alto .ps-izq{align-self:stretch}
  .pedido-split.split-alto .ps-foto{aspect-ratio:auto;height:100%;min-height:226px}
  .ps-izq{display:flex;flex-direction:column;gap:9px;min-width:0}
  /* la FOTO manda el alto del bloque (proporción fija) */
  .ps-foto{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 2px 10px rgba(21,57,43,.06);aspect-ratio:0.677/1}
  .ps-foto img{width:100%;height:100%;object-fit:contain;border-radius:11px}
  /* la derecha ocupa exactamente el alto de la foto: dos tarjetas iguales */
  .ps-controles{display:flex;flex-direction:column;gap:12px;min-width:0;
    aspect-ratio:0.956/1}

  .ps-controles .tarjeta-pedido{margin-bottom:0;flex:1 1 0;min-height:0;
    display:flex;flex-direction:column;justify-content:center}

  .ps-controles .precio-in{text-align:center;font-weight:700;font-size:19px;

  /* la barra comisión/base vive bajo la foto y se APILA (columna angosta) */

  /* dentro de la tarjeta, el label gris del field ya no hace falta como título */

  /* botón flotante para nuevo cliente */

  .ba-card{background:var(--card);border-radius:22px;padding:32px 24px;text-align:center;max-width:340px;width:100%;

  .mini-cta{margin-left:auto;background:var(--field-soft);color:var(--field-soft-txt);font-size:13px;font-weight:700;border-radius:9px;padding:8px 14px}

  .ss{position:relative}

  .stepwrap{opacity:1;transition:opacity .2s}

  /* selector de tipo de precio */
  .tipogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* chips horizontales genéricos (otras pantallas): fila deslizable */
  .tipochips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tipochips::-webkit-scrollbar{display:none}
  .tchip{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:9px 13px;border:1.5px solid var(--line);
    border-radius:11px;background:#fff;white-space:nowrap;cursor:pointer;font-family:inherit}
  .tchip:active{background:var(--paper)}
  .tchip.on{border-color:var(--field);background:var(--field)}
  .tchip .tchip-cod{font-size:11px;font-weight:800;letter-spacing:.03em;font-family:'Space Grotesk',sans-serif;color:var(--maize-deep)}
  .tchip.on .tchip-cod{color:var(--maize)}
  .tchip .tchip-nom{font-size:12.5px;font-weight:600;color:#2C3A32}
  .tchip.on .tchip-nom{color:#fff}
  /* tipos de precio: los 5 en UNA fila, código arriba y nombre corto abajo */
  .tipochips.precios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;padding-bottom:2px}
  .tipochips.precios .tchip{flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
    min-width:0;padding:7px 2px;white-space:normal;text-align:center}
  .tipochips.precios{align-items:stretch}
  .tipochips.precios .tchip .tchip-cod{line-height:1}
  .tipochips.precios .tchip .tchip-nom{font-size:11px;font-weight:700;line-height:1.15;
    width:100%;white-space:nowrap}
  /* tipo no aplicable (sin promociones vigentes): gris y apagado */
  .tipochips.precios .tchip.nodisp{opacity:.42;background:var(--paper);border-style:dashed}
  .tipochips.precios .tchip.nodisp .tchip-cod,
  .tipochips.precios .tchip.nodisp .tchip-nom{color:var(--muted)}
  .tipobtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 13px;

  /* historial de última compra */

  /* timeline de trazabilidad */
  .tl{position:relative;margin-top:6px}

  .ped-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .ped-emoji{width:42px;height:42px;border-radius:10px;background:var(--paper);display:flex;
    align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .ped-info{flex:1;min-width:0}
  .ped-nom{font-size:14px;font-weight:700;color:var(--field)}
  .ped-det{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:'Space Grotesk',sans-serif}
  .ped-com{font-size:11.5px;color:var(--ok);font-weight:700;margin-top:2px;font-family:'Space Grotesk',sans-serif}
  .ped-del{background:none;border:none;color:var(--clay);font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit}
  .ped-tot{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 12px;
    font-size:14px;font-weight:700;color:var(--field)}
  .ped-tot b{font-size:18px;font-family:'Space Grotesk',sans-serif}
  .ped-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
  /* botón fijo abajo: mostrar pedido */
  .mostrar-pedido{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;
    background:var(--field-soft);color:var(--field-soft-txt);border:none;border-radius:14px;padding:16px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 6px 20px rgba(14,42,32,.28)}
  .mostrar-pedido:active{background:var(--field-700,#1E4D3A)}
  .primera-compra{background:#EAF4EF;border:1px solid #BFE0D0;border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--field);font-weight:600;margin-bottom:16px}
  .opt-mas{padding:10px 14px;font-size:11.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);background:var(--paper)}
  .prod-ficha{display:flex;align-items:center;gap:13px;padding:6px 2px;width:100%}
  .pf-img{width:56px;height:56px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .pf-info{flex:1;min-width:0}
  .pf-nom{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.25}
  .pf-pres{font-size:12.5px;color:var(--muted);margin-top:3px}
  .pf-ar{font-size:20px;color:var(--muted);flex-shrink:0}
  /* módulo en 2 pasos */
  .volver-paso{background:none;border:none;color:var(--field);font-weight:700;font-size:14px;
    cursor:pointer;padding:4px 0;margin-bottom:12px;font-family:inherit}
  .prod-elegido{display:flex;align-items:center;gap:12px;background:#F0EEE4;border:1px solid var(--line);
    border-radius:13px;padding:12px 14px;margin-bottom:18px}
  .pe-emoji{width:48px;height:48px;border-radius:11px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .pe-nom{font-size:15px;font-weight:700;color:var(--field)}
  .pe-sub{font-size:12px;color:var(--muted);margin-top:2px}
  /* productos favoritos del cliente */
  .fav-wrap{margin-bottom:16px}
  .fav-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#FBF3DD;border:1px solid var(--maize);border-radius:12px;padding:13px 15px;
    font-size:13.5px;font-weight:700;color:var(--maize-deep);cursor:pointer;text-align:left}
  .fav-n{background:var(--maize);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;margin-left:4px}
  .fav-vacio{font-size:12.5px;color:var(--muted);padding:11px 13px;margin-top:8px;background:#FBFCFD;border:1px dashed var(--line);border-radius:9px;line-height:1.35}
  .fav-ar{font-size:11px}
  .fav-lista{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .fav-item{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:14px 15px;cursor:pointer;text-align:left;transition:border .15s}
  .fav-item:active{border-color:var(--field);background:#F7FBF9}
  .fav-emoji{width:56px;height:56px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .fav-info{flex:1;min-width:0}
  .fav-nom{font-size:15.5px;font-weight:700;color:var(--field);line-height:1.25}
  .fav-pres{font-size:12.5px;color:var(--muted);margin-top:2px}
  .fav-det{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:'Space Grotesk',sans-serif}
  .fav-det b{color:var(--field)}
  .fav-tipo{display:inline-block;background:var(--field-soft);color:var(--field-soft-txt);border-radius:5px;padding:1px 6px;
    font-size:9.5px;font-weight:700;margin-left:6px;font-family:'Space Grotesk',sans-serif;vertical-align:middle}
  .fav-det2{font-size:11px;color:var(--muted);margin-top:2px;font-family:'Space Grotesk',sans-serif}
  .fav-add{font-size:13px;font-weight:700;color:var(--field);white-space:nowrap;flex-shrink:0}
  /* precio: tipo en uso + último precio clickeable */
  .precio-tipo{font-size:11px;color:var(--muted);margin-bottom:6px}
  .precio-tipo b{color:var(--field);font-weight:700}
  .precio-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  /* barra informativa: precio base (o nueva compra) */
  /* ═══ NORMA DE CONTRASTE (sellada, aplica a TODA tarjeta del proyecto) ═══
     Toda tarjeta con fondo propio debe tener contraste suficiente:
     - fondo CLARO  → textos var(--ink) / var(--field-soft-txt); apagados var(--muted); bordes var(--field-soft-line)
     - fondo OSCURO → textos #EAF0EA; apagados #9DB6A6; bordes rgba(255,255,255,.15)
     PROHIBIDO: texto #fff o #9DB6A6 sobre fondo claro; texto var(--ink) sobre fondo oscuro.
     Al cambiar el fondo de una tarjeta, revisar SIEMPRE sus textos, iconos, anillos y bordes. */
  .base-barra{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#EEF2EE;border:1px solid var(--line);color:var(--field);border-radius:11px;
    padding:11px 15px;font-size:13.5px;font-weight:700;margin-bottom:10px}
  .base-barra.nueva{background:#EAF4EF;border-color:#BFE0D0}
  .base-barra b{font-size:16px;font-family:'Space Grotesk',sans-serif}
  /* barra "usar último precio" a lo ancho */
  .ult-barra{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#FBF3DD;border:1px solid var(--maize);color:var(--maize-deep);border-radius:11px;
    padding:11px 15px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:inherit}
  .ult-barra:active{background:var(--maize);color:#fff}
  .ult-barra b{font-size:16px;font-family:'Space Grotesk',sans-serif}
  /* precio con botones − / + */
  .precio-row{display:flex;align-items:stretch;gap:8px}
  .pm-btn{width:52px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:11px;
    font-size:24px;font-weight:700;color:var(--field);cursor:pointer;font-family:inherit}
  .pm-btn:active{background:var(--paper)}
  /* al mantener aplastado no debe seleccionar texto ni abrir el menú del sistema */
  .pm-btn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .precio-in{flex:1;text-align:center}
  .precio-ult{background:#FBF3DD;border:1px solid var(--maize);color:var(--maize-deep);
    border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;white-space:nowrap}
  .precio-ult:active{background:var(--maize);color:#fff}
  /* panel de cupo de crédito */
  .cupo-box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-bottom:10px}
  @keyframes sacudida{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .arc-sacudida{animation:sacudida .3s ease 1}
  @media (prefers-reduced-motion:reduce){.arc-sacudida{animation:none!important}}
  .cupo-box.cupo-excede{border-color:#E8B4A0;background:#FDF6F2}
  .cupo-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--field);margin-bottom:6px}
  .cupo-badge{font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px}
  .cupo-badge.ok{background:#E4F1E9;color:#2E7D52}
  .cupo-badge.warn{background:#FBF0D8;color:var(--maize-deep)}
  .cupo-badge.bad{background:#FBE3DA;color:#B5613C}
  .cupo-barra{position:relative;height:8px;background:#EEEbE2;border-radius:6px;overflow:hidden;margin-bottom:12px}
  .cupo-fill{height:100%;background:var(--field-soft-txt);border-radius:6px;transition:width .3s}
  .cupo-excede .cupo-fill{background:#C2603A}
  .cupo-lines{display:flex;flex-direction:column;gap:6px}
  /* cupo en dos columnas: medidor a la izquierda, detalle a la derecha */
  .cupo-cols{display:grid;grid-template-columns:0.92fr 1fr;gap:11px;align-items:center}
  .cupo-cols .cupo-col-arco{min-width:0}
  .cupo-cols .cupo-barra{margin-bottom:0;margin-top:6px;height:7px}
  .cupo-cols .cupo-lines{justify-content:center;gap:3px;border-left:1px solid var(--line);padding-left:11px}
  @media(max-width:359px){.cupo-cols{grid-template-columns:1fr}}
  .cupo-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
  .cupo-l span{color:var(--muted)}
  .cupo-l b{font-family:'Space Grotesk',sans-serif;color:var(--field)}
  .cupo-disp{border-top:1px solid var(--line);padding-top:6px;margin-top:3px;font-weight:700;font-size:12.5px}
  .cupo-disp span{color:var(--field);font-weight:700}
  .cupo-excede .cupo-disp b{color:#C2603A}
  .cupo-aviso{margin-top:12px;background:#FBE3DA;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;color:#8A4A2E}

    @keyframes fxEntrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  button:active:not([disabled]){transform:translateY(1px)}

@keyframes pfZoom{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

/* ── Cotización: al imprimir (o "guardar como PDF" del celular) sale SOLO la hoja ── */
@media print{
  body *{ visibility:hidden !important; }
  .cot-hoja, .cot-hoja *{ visibility:visible !important; }
  .cot-hoja{ position:absolute !important; left:0 !important; top:0 !important; right:0 !important;
             width:100% !important; max-height:none !important; overflow:visible !important;
             border-radius:0 !important; box-shadow:none !important; }
  .cot-noprint{ display:none !important; }

/* ══ EL DEDO PIDE 44 px (26 jul · guía de Android y de iPhone) ══
   Un botón de 30 px se falla en el campo: con el teléfono en movimiento, con
   las manos sucias, con guantes. Se agranda el ÁREA QUE RESPONDE al toque,
   NO el dibujo: en pantalla todo se ve exactamente igual.
   · Los redondos y chicos (menú, cerrar, micrófono, campana) crecen en las dos
     direcciones hasta 44.
   · Los anchos y bajitos (pestañas de arriba, filtrar, ver más) crecen SOLO a
     lo alto: a lo ancho ya sobra, y así no le roban el toque al de al lado. */
.ham, .drawer-x, .micb, .topbtn, .filtrar-btn, .vermas,
.tocable, .net, .drawer-acc, .ba-demo{ position:relative; }
.ham::after, .drawer-x::after, .micb::after, .tocable::after{
  content:""; position:absolute; left:50%; top:50%;
  width:44px; height:44px; transform:translate(-50%,-50%);
}
.topbtn::after, .filtrar-btn::after, .vermas::after,
.net::after, .drawer-acc::after, .ba-demo::after{
  content:""; position:absolute; left:0; right:0; top:50%;
  height:44px; transform:translateY(-50%);
}
/* la campana de avisos no tiene clase: se la reconoce por su etiqueta */
button[aria-label="Notificaciones"]{ position:relative; }
button[aria-label="Notificaciones"]::after{
  content:""; position:absolute; left:50%; top:50%;
  width:46px; height:46px; transform:translate(-50%,-50%);
}

) y cuántas unidades regalas. El cliente recibe la cantidad más las gratis, pero paga solo la cantidad. El costo de lo gratis se descuenta de TU comisión: la promo la pagas tú."},{mod:"Pedidos",ic:"📣",t:"P4 · promoción del freelance",d:"La promoción ya viene armada por el freelance con su propia base. Elígela primero: sin ella no se puede calcular tu comisión."},{mod:"Pedidos",ic:"✋",t:"P5 · precio especial",d:"Es el precio que negociaste con el cliente y la comisión que propones por unidad. El freelance puede aprobarla, ajustarla o rechazarla, y el pedido queda pendiente de autorización."},{mod:"Comisiones",ic:"🔓",t:"Cuándo se libera tu comisión",d:"Cuando el proveedor confirma el pago efectivo de la factura. Cobrar al cliente o depositar su cheque no la libera."},{mod:"Cartera",ic:"📅",t:"Cheques posfechados",d:"Ocupan cupo del cliente hasta que se efectivizan."},{mod:"Stock",ic:"⏳",t:"Cuánto le dura al cliente",d:"El cálculo usa su consumo diario. Cinco días o menos aparece en rojo: toca reponer."},{mod:"Novedades",ic:"📦",t:"Qué se pide aquí",d:"Post-venta: cambios de producto, devoluciones y notas de crédito. Se elige la factura y los ítems exactos."},{mod:"Pedidos",ic:"📡",t:"Pedidos sin enviar",d:"Los que tomaste sin señal quedan en tu teléfono. Al recuperar internet se suben solos."},{mod:"Pedidos",ic:"🔒",t:"Qué precios ves",d:"Trabajas sobre tu base por tipo de precio. El costo del proveedor y el margen del freelance no son visibles para tu perfil."},{mod:"Pedidos",ic:"🏬",t:"Precio sugerido por canal",d:"Cada canal (bodega, mayorista, supermercado…) tiene un precio sugerido que cuida la distribución de la zona. Si vendes por debajo, la línea se pone naranja y avisa que el precio no corresponde al canal."}];const S={phone:{width:390,minHeight:844,background:CL.fondo,fontFamily:BODY,position:"relative",overflow:"hidden",borderRadius:40,boxShadow:"0 32px 80px rgba(0,0,0,0.35)",margin:"0 auto"},screen:{height:844,overflowY:"auto",overflowX:"hidden",scrollbarWidth:    A6 = 105×148 mm dibujado a 826×1165 px (200 ppp). */function imgComprobante(d){const W=826,P=40;const money2=n=>"$"+Number(n||0).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});const F=(px,peso)=>`${peso||600} ${px}px Inter, system-ui, -apple-system, sans-serif`;/* paleta azul del comprobante */const AZUL="#1B3A5C",AZUL2="#2C5F8A",AZULSUAVE="#EAF2FA",TINTA="#1A2733",GRIS="#6B7A88",LINEA="#E3E9EF",AMBAR="#B8860B",AMBARBG="#FBEFD0",OK="#2E7D52";const lineas=d.lineas||[],facs=d.facturas||[],obs=d.obs||[];let H=560+lineas.length*44+facs.length*72+(obs.length?54+obs.length*34:0);H=Math.max(1165,H+90);const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#F2F5F8";x.fillRect(0,0,W,H);x.fillStyle="#fff";redonda(x,P,P,W-P*2,H-P*2,24);x.fill();const IX=P+38,IW=W-P*2-76;let y=P+64;/* cabecera centrada */x.textAlign="center";x.fillStyle=TINTA;x.font=F(25,700);x.fillText(recorta(x,String(d.prov||"—"),IW),W/2,y);y+=76;x.fillStyle=AZUL;x.font=F(68,800);x.fillText(money2(d.monto),W/2,y);y+=36;x.fillStyle=GRIS;x.font=F(16,500);x.fillText([d.nRecibo,d.fecha||fechaHoy()].filter(Boolean).join(" · "),W/2,y);/* chip del estado */y+=38;const et="Pendiente de verificación";x.font=F(17,700);const aw=x.measureText(et).width+40;x.fillStyle=AMBARBG;redonda(x,(W-aw)/2,y-24,aw,38,19);x.fill();x.fillStyle=AMBAR;x.fillText(et,W/2,y+2);x.textAlign="left";y+=34;separa(y);y+=40;/* bloque destacado del cliente */const BH=d.atendido?162:118;x.fillStyle=AZULSUAVE;redonda(x,IX,y-26,IW,BH,16);x.fill();x.fillStyle=AZUL2;x.font=F(15,700);x.fillText("CLIENTE",IX+24,y+2);x.fillStyle=AZUL;x.font=F(36,800);x.fillText(recorta(x,String(d.cli||"—"),IW-48),IX+24,y+50);if(d.ruc){x.fillStyle=AZUL2;x.font=F(18,500);x.fillText("RUC "+rucCorto(d.ruc),IX+24,y+84);}if(d.atendido){x.strokeStyle="#D3E2F0";x.lineWidth=1;x.beginPath();x.moveTo(IX+24,y+104);x.lineTo(IX+IW-24,y+104);x.stroke();x.fillStyle=GRIS;x.font=F(16,500);x.fillText("Atendido por" e();x.fillStyle=alerta?CLAY:TINTA;x.font=F(16,500);x.fillText(recorta(x,String(izq),IW-200),IX+2,y);x.textAlign="right";x.font=F(17,700);x.fillText(String(der),IX+IW-2,y);x.textAlign="left";y+=42;}function fila(izq,der,alerta){x.fillStyle=TINTA;x.font=F(16,500);x.fillText(recorta(x,String(izq),IW-220),IX+2,y);x.fillStyle=alerta?CLAY:TINTA;x.textAlign="right";x.font=F(17,700);x.fillText(String(der),IX+IW-2,y);x.textAlign="left";x.fillStyle=TINTA;y+=40;}function totalFila(){y+=6;x.fillStyle=CREMA;redonda(x,IX,y-22,IW,44,8);x.fill();x.fillStyle=TINTA;x.font=F(15,800);x.fillText("TOTAL PENDIENTE",IX+14,y+4);x.textAlign="right";x.font=F(19,800);x.fillStyle=tot>0?MAIZ:"#2E7D52";x.fillText(money2(tot),IX+IW-14,y+4);x.textAlign="left";y+=48;}function vencida(v){return /vencid/i.test(String(v||""));}function punteada(yy){x.strokeStyle=LINEA;x.lineWidth=1.5;x.setLineDash([5,5]);x.beginPath();x.moveTo(IX,yy);x.lineTo(IX+IW,yy);x.stroke();x.setLineDash([]);}function redonda(ctx,a,b,w,h,r){ctx.beginPath();ctx.moveTo(a+r,b);ctx.lineTo(a+w-r,b);ctx.quadraticCurveTo(a+w,b,a+w,b+r);ctx.lineTo(a+w,b+h-r);ctx.quadraticCurveTo(a+w,b+h,a+w-r,b+h);ctx.lineTo(a+r,b+h);ctx.quadraticCurveTo(a,b+h,a,b+h-r);ctx.lineTo(a,b+r);ctx.quadraticCurveTo(a,b,a+r,b);ctx.closePath();}function recorta(ctx,t,max){t=String(t);if(ctx.measureText(t).width<=max)return t;let s=t;while(s.length>3&&ctx.measureText(s+"…").width>max)s=s.slice(0,-1);return s+"…";}function fechaHoy(){const n=new Date(),M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return`${String(n.getDate()).padStart(2,"0")} ${M[n.getMonth()]} ${n.getFullYear()}`;}}/* Comparte el estado de cuenta como imagen (solo si queda saldo) */async function compartirImgEstado(d,toast){try{const lienzo=imgEstadoCuenta(d);const blob=await new Promise(r=>lienzo.toBlob(r,"image/png",0.95));if(!blob)return false;const nombre=`Estado_${String(d.cli||"cliente").replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"_")}.png`;const archivo=new File([blob],nombre,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[archivo]})){await navigator.share({files:[archivo],title:"Estado de cuenta"});return true;}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;}catch(e){return false;}}/* Comparte el comprobante como imagen; si el equipo no lo permite, la descarga *//* Comparte comprobante y estado de cuenta EN UN SOLO GESTO.

<script>
/* ═ Nivel 2 de notificaciones + modo offline + aviso de versión nueva ═
   El service worker se registra SOLO en HTTPS (GitHub Pages); abriendo el archivo
   local no hace nada ni molesta.

   AVISO DE VERSIÓN NUEVA (patrón único de las 5 apps): cuando hay una versión
   publicada, el service worker nuevo queda ESPERANDO en segundo plano y aquí se
   muestra una barra abajo. La app NO se recarga sola: si el usuario está a mitad
   de un pedido o un cobro, perdería el trabajo. Él decide, y puede posponerlo. ═ */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  var mostrarAvisoActualizar = function(reg){
    if (document.getElementById("aviso-actualizar")) return;
    var barra = document.createElement("div");
    barra.id = "aviso-actualizar";
    barra.style.cssText = "position:fixed;left:12px;right:12px;z-index:99999;"+
      "bottom:calc(78px + env(safe-area-inset-bottom,0px));"+
      "background:#1E3A2B;color:#EAF0EA;border-radius:14px;padding:12px 14px;"+
      "display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);"+
      "font-family:inherit;font-size:13.5px";
    barra.innerHTML =
      '<span style="flex:1;min-width:0;line-height:1.3">Hay una versión nueva disponible.</span>'+
      '<button id="btn-actualizar" style="flex-shrink:0;background:#E9C46A;color:#1E3A2B;'+
      'border:none;border-radius:10px;padding:8px 15px;font-weight:800;font-size:13px;'+
      'font-family:inherit;cursor:pointer">Actualizar</button>'+
      '<button id="btn-despues" style="flex-shrink:0;background:transparent;'+
      'color:rgba(234,240,234,.72);border:none;font-size:12.5px;font-family:inherit;'+
      'cursor:pointer;padding:8px 2px">Después</button>';
    document.body.appendChild(barra);
    document.getElementById("btn-despues").onclick = function(){ barra.remove(); };
    document.getElementById("btn-actualizar").onclick = function(){
      var b = document.getElementById("btn-actualizar");
      b.textContent = "Actualizando…"; b.disabled = true;
      var esperando = reg.waiting;
      if (esperando) { esperando.postMessage({ tipo: "activar-ya" }); }
      /* 900 ms: le da tiempo al service worker nuevo a tomar el control. Con menos,
         a veces recarga con el viejo y el aviso vuelve a salir. */
      setTimeout(function(){ location.reload(); }, 900);
    };
  };
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    /* ya había una versión esperando al abrir */
    if (reg.waiting && navigator.serviceWorker.controller) mostrarAvisoActualizar(reg);

    reg.addEventListener("updatefound", function(){
      var nuevo = reg.installing;
      if (!nuevo) return;
      nuevo.addEventListener("statechange", function(){
        /* controller existe = no es la primera instalación, es una actualización */
        if (nuevo.state === "installed" && navigator.serviceWorker.controller) {
          mostrarAvisoActualizar(reg);
        }
      });
    });
    /* revisa al abrir y cada vez que se vuelve a la app */
    reg.update();
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") reg.update();
    });

     la app cargando para siempre. El usuario decide con el botón. */
}
