/* ‚ïê‚ïê PUENTE WHATSAPP (Fase 4) ‚ïê‚ïê
   Abre WhatsApp directo en el chat del cliente usando el tel√©fono de su ficha.
   Hoy: el mensaje va al chat correcto; el PDF sigue yendo por el men√∫ de compartir
   (el navegador no puede adjuntar un archivo a un n√∫mero espec√≠fico).
   En Fase 4: el PDF se sube a Supabase Storage y aqu√≠ se agrega su enlace.
   Destino final: WhatsApp Cloud API despacha todo desde el servidor, sin tocar nada. */
function telE164(tel){
  const d=String(tel||"").replace(/\D/g,"");
  if(!d) return null;
  if(d.startsWith("593")) return d;              /* ya viene con pa√≠s */
  if(d.startsWith("0")) return "593"+d.slice(1); /* 09xxxxxxxx ‚Üí 5939xxxxxxxx */
  if(d.length===9) return "593"+d;               /* 9xxxxxxxx */
  return d;
}
function telDeCliente(nombre){
  const n=(nombre && nombre.nombre) || nombre;
  if(!n) return null;
  /* acceso protegido: estas tablas se declaran m√°s abajo en el archivo (const = zona muerta) */
  const leer = (fn)=>{ try{ return fn(); }catch(e){ return null; } };
  const f = leer(()=>FICHA_CLIENTE[n]);
  if(f && f.tel) return telE164(f.tel);
  const c = leer(()=>CLIENTES_MAESTRO.find(x=>x.nombre===n));
  if(c && c.tel) return telE164(c.tel);
  return null;
}
/* Abre el chat del cliente si hay tel√©fono; si no, cae al men√∫ de compartir de siempre */
function waCliente(nombre, texto){
  const t=telDeCliente(nombre);
  const url = t ? `https://wa.me/${t}?text=${encodeURIComponent(texto)}`
                : `https://wa.me/?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
  return !!t;   /* true = fue directo al chat del cliente */
}


/* Unidad abreviada para mostrar comisiones: "Quintal"‚Üíqq, "Saco 25 kg"‚Üísaco, "Funda 2 kg"‚Üífunda */
const uniCorta = (u)=>{
  const t=(u||"").trim();
  if(!t) return "unidad";
  if(/quintal/i.test(t)) return "qq";
  if(/arroba/i.test(t)) return "@";
  if(/saco/i.test(t)) return "saco";
  if(/funda/i.test(t)) return "funda";
  if(/caja/i.test(t)) return "caja";
  if(/unidad/i.test(t)) return "u";
  return t.split(" ")[0].toLowerCase();
};

/* PROMO-04 ¬∑ la fecha del TEL√âFONO, no la de Greenwich. Con toISOString(), en
   Ecuador (UTC-5) desde las 19h ya ser√≠a ma√±ana: una promoci√≥n que muere hoy
   desaparecer√≠a del selector cinco horas antes de tiempo, aunque la base la
   siguiera concediendo. Es el mismo colador que usa el cat√°logo. */
const HOY_ISO = (()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
const promoVigente = pm => (pm.activa!==false)
  && (!pm.desde || pm.desde<=HOY_ISO) && (!pm.hasta || pm.hasta>=HOY_ISO);
const promosVigentes = lista => (lista||[]).filter(promoVigente);
/* gratis proporcional en unidades de la presentaci√≥n de la promo */
const gratisDePromo = (pm,cant) => (!pm||!pm.minimo||!pm.gratis||!(cant>0)) ? 0
  : Math.round((cant/pm.minimo)*pm.gratis*100)/100;
/* equivalencia en qq de una presentaci√≥n por su nombre */
const qqDeTam = t => { if(!t) return 1;
  if(/quintal/i.test(t)) return 1;
  if(/arroba/i.test(t)) return 0.25;
  let m=t.match(/([\d.]+)\s*kg/i); if(m) return (parseFloat(m[1])||0)/45.4;
  m=t.match(/([\d.]+)\s*lb/i); if(m) return (parseFloat(m[1])||0)/100;
  return 1; };
/* ‚ïê‚ïê‚ïê EL DESGLOSE DE LAS UNIDADES GRATIS ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Cu√°nto grano se REGALA y en qu√© presentaciones sale de la bodega. Dos reglas,
   las dos aprendidas a golpes:

   1) La equivalencia sale de la OFERTA (`equiv`), NUNCA del texto de la unidad.
      ¬´10 libras¬ª son 0,1 qq en la oferta y el conversor por texto devuelve 1:
      diez veces m√°s grano regalado del que la piladora despacha. Es el mismo
      antecedente del transportista, donde una parada de 65 qq se ve√≠a como
      ¬´22 qq¬ª porque los quintales sal√≠an del NOMBRE del producto.

   2) Las presentaciones hermanas se emparejan por PRODUCTO (`prodId`), nunca
      por marca: hay productos vivos con la marca en blanco (P-00197 ¬´Arroz
      Crecedor¬ª), y con el filtro por marca no calzaban con nada, as√≠ que el
      desglose sal√≠a VAC√çO y en pantalla solo quedaba el aviso naranja ¬´No calza
      N qq en presentaciones¬ª. Y solo entran las de la MISMA piladora: no se
      puede regalar un saco que esa piladora no despacha.

   En la demostraci√≥n no hay oferta ni `prodId`: solo ah√≠ se cae a la marca y a
   qqDeTam, el conversor por texto que el resto de la app ya usa.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
const equivDe = p => (p && Number(p.equiv)>0) ? Number(p.equiv) : qqDeTam(p && p.unidad);
const hermanasDe = (prod, lista) => {
  if(!prod) return [];
  const todas = (lista && lista.length) ? lista : PRESENTACIONES;
  return todas.filter(p => (prod.prodId && p.prodId)
    ? (p.prodId===prod.prodId && (!prod.provId || !p.provId || p.provId===prod.provId))
    : (p.marca!=null && p.marca===prod.marca));
};
const descomponerGratis = (qq, prod, lista) => {
  const dispo = hermanasDe(prod, lista)
    .map(p=>({tam:p.unidad, eq:equivDe(p)})).filter(p=>p.eq>0).sort((a,b)=>b.eq-a.eq);
  const partes=[]; let resto=Math.round(qq*10000)/10000;
  for(const p of dispo){
    const n=Math.floor(resto/p.eq + 1e-9);
    if(n>0){ partes.push({tam:p.tam, n}); resto=Math.round((resto-n*p.eq)*10000)/10000; }
  }
  return {partes, resto};
};
const textoDesglose = d => d.partes.map(p=>p.n+" "+p.tam).join(" + ");

/* ‚îÄ‚îÄ Lector de comprobantes (OCR): el usuario digita el valor, la foto llena el resto ‚îÄ‚îÄ */
let _OCRW=null;
async function ocrComprobante(img){
  try{
    if(!window.Tesseract) return null;
    if(!_OCRW) _OCRW = window.Tesseract.createWorker("spa");
    const w = await _OCRW;
    const r = await w.recognize(img);
    return extraerComprobante((r && r.data && r.data.text) || "");
  }catch(e){ _OCRW=null; return null; }
}
function parseMontoOCR(s){
  s=String(s).trim();
  const pc=s.lastIndexOf(","), pd=s.lastIndexOf(".");
  if(pc>-1 && pd>-1){ s = pc>pd ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(pc>-1){ const dec=s.length-pc-1; s = dec===3 ? s.replace(/,/g,"") : s.replace(/,/g,"."); }
  const n=parseFloat(s.replace(/[^\d.]/g,""));
  return (isFinite(n) && n>0) ? Math.round(n*100)/100 : null;
}
function extraerComprobante(txt){
  const T=String(txt).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  /* diccionario por banco: palabra clave ‚Üí nombre del cat√°logo */
  const CLAVES=[["PICHINCHA","Pichincha"],["PACIFICO","Pac√≠fico"],["GUAYAQUIL","Guayaquil"],
    ["PRODUBANCO","Produbanco"],["INTERNACIONAL","Internacional"],["BOLIVARIANO","Bolivariano"],
    ["AUSTRO","Austro"],["MACHALA","Machala"],["JEP","JEP"],["BANECUADOR","BanEcuador"]];
  let banco=null;
  for(const [k,v] of CLAVES){ if(T.includes(k)){ banco=BANCOS.find(x=>x.toUpperCase().includes(k))||null; if(banco) break; } }
  let valor=null;
  const mv=T.match(/(?:VALOR|MONTO|TOTAL|DEBITADO|ACREDITADO|USD)[^\d\-]{0,12}([\d][\d.,]{2,14})/);
  if(mv) valor=parseMontoOCR(mv[1]);
  if(valor==null){
    const todos=[...T.matchAll(/\$\s*([\d][\d.,]{2,14})/g)].map(m=>parseMontoOCR(m[1])).filter(x=>x!=null);
    if(todos.length) valor=todos[0];
  }
  let numero=null;
  const mn=T.match(/(?:COMPROBANTE|TRANSACCION|REFERENCIA|SECUENCIAL|DOCUMENTO|OPERACION|OP)\.?[^\d]{0,10}(\d{5,15})/);
  if(mn) numero=mn[1];
  let fecha=null;
  const mf=T.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(mf){ fecha=`${mf[3]}-${String(mf[2]).padStart(2,"0")}-${String(mf[1]).padStart(2,"0")}`; }
  else{
    const MES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,OCT:10,NOV:11,DIC:12};
    const mm=T.match(/(\d{1,2})\s+(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)[A-Z]*\s+(\d{4})/);
    if(mm) fecha=`${mm[3]}-${String(MES[mm[2]]).padStart(2,"0")}-${String(mm[1]).padStart(2,"0")}`;
  }
  if(!banco && valor==null && !numero && !fecha) return null;
  return {banco, numero, fecha, valor};
}

   (modo privado, memoria llena) o el dato qued√≥ corrupto, sigue con la semilla. */
function cargarUsos(){
  const base = JSON.parse(JSON.stringify(USOS_SEMILLA));
  try{
    const g = JSON.parse(localStorage.getItem(USOS_KEY) || "null");
    if(!g || typeof g!=="object") return base;
    for(const cat in g){
      if(!g[cat] || typeof g[cat]!=="object") continue;
      base[cat] = Object.assign(base[cat]||{}, g[cat]);
    }
  }catch(e){}
  return base;
}

  (USOS[cat] = USOS[cat] || {});

/* ordena una lista por uso (mayor‚Üímenor), con desempate alfab√©tico */
const ordUso = (cat, lista) => {
  if(!cat || USO_FIJO.includes(cat) || !Array.isArray(lista)) return lista;
  const c = USOS[cat] || {};

    const ka=usoClave(a), kb=usoClave(b);
    const fa=USO_ULTIMO.includes(ka)?1:0, fb=USO_ULTIMO.includes(kb)?1:0;
    if(fa!==fb) return fa-fb;                      /* "Otro" siempre al fondo */

};

/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê 4.4 ¬∑ COLA OFFLINE IDEMPOTENTE ‚Äî "ning√∫n cobro se pierde" ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Tres garant√≠as:
   1) IDENTIDAD: cada operaci√≥n nace con un op_id √∫nico e irrepetible. Al conectar Supabase,
      la tabla ops_procesadas rechaza cualquier op_id ya visto ‚Üí reintentar JAM√ÅS duplica.
   2) PERSISTENCIA: la cola se guarda en el almacenamiento del tel√©fono (localStorage).
      Cerrar la app, quedarse sin se√±al o reiniciar NO borra lo pendiente.
      Honestidad t√©cnica: algunos visores de archivos locales a√≠slan el almacenamiento;
      al publicar la app en internet (HTTPS) la persistencia queda garantizada al 100%.
   3) TODO-O-NADA: una operaci√≥n sale de la cola SOLO cuando el servidor confirma que la
      proces√≥. Falla el env√≠o ‚Üí sigue en la cola ‚Üí se reintenta con el MISMO op_id.       */
const COLA_KEY = "freelance_cola_ops_v1";
function opId(){ return "OP-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).slice(2,8).toUpperCase(); }
function colaPuedePersistir(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; }
}
function colaLeer(){
  try { return JSON.parse(localStorage.getItem(COLA_KEY) || "[]"); } catch(e){ return []; }
}
function colaEscribir(lista){
  try { localStorage.setItem(COLA_KEY, JSON.stringify(lista)); } catch(e){ /* visor sin almacenamiento: la cola vive en memoria esta sesi√≥n */ }
}
function colaAgregar(op){
  /* op = { op_id, comando, datos, tipo, cli, detalle, cuando } ‚Äî nace ANTES de intentar enviar */
  const lista = colaLeer();
  if (lista.some(x => x.op_id === op.op_id)) return lista;   /* idempotencia tambi√©n local */
  lista.push(op);
  colaEscribir(lista);
  return lista;
}
function colaConfirmar(op_id){
  /* SOLO se llama cuando el servidor confirm√≥ la operaci√≥n */
  const lista = colaLeer().filter(x => x.op_id !== op_id);
  colaEscribir(lista);
  return lista;
}

/* ‚îÄ‚îÄ Pila de ventanas abiertas: el bot√≥n atr√°s cierra la √∫ltima ‚îÄ‚îÄ */
const MODALES=[];
function useModal(abierto, cerrar){
  React.useEffect(()=>{
    if(!abierto) return;
    const item={cerrar};
    MODALES.push(item);
    return ()=>{ const i=MODALES.indexOf(item); if(i>=0) MODALES.splice(i,1); };
  },[abierto,cerrar]);
}
function cerrarUltimoModal(){
  if(MODALES.length===0) return false;
  const m=MODALES[MODALES.length-1];
  try{ m.cerrar(); }catch(e){}
  return true;
}

/* ‚îÄ‚îÄ Pila de retrocesos por m√≥dulo ‚îÄ‚îÄ */
const RETROCESOS=[];
function useRetroceso(fn){
  const ref=React.useRef(fn);
  ref.current=fn;
  React.useEffect(()=>{
    const item={ run:()=>ref.current() };
    RETROCESOS.push(item);
    return ()=>{ const i=RETROCESOS.indexOf(item); if(i>=0) RETROCESOS.splice(i,1); };
  },[]);
}
function retrocederEnModulo(){
  for(let i=RETROCESOS.length-1;i>=0;i--){
    try{ if(RETROCESOS[i].run()) return true; }catch(e){}
  }
  return false;
}

/* ‚îÄ‚îÄ Gesto: deslizar desde el borde izquierdo abre el men√∫ lateral ‚îÄ‚îÄ */
/* Mantener aplastado un bot√≥n para repetir la acci√≥n (usado en ‚àí / + de cantidad).
   Un toque corto hace un solo paso; al sostener, arranca tras 400 ms y va acelerando. */
function usarRepetir(accion){
  const ref = React.useRef({t:null, i:null, fn:null});
  ref.current.fn = accion;
  const parar = React.useCallback(()=>{
    const r=ref.current;
    if(r.t){ clearTimeout(r.t); r.t=null; }
    if(r.i){ clearInterval(r.i); r.i=null; }
  },[]);
  const arrancar = React.useCallback(()=>{
    const r=ref.current;
    parar();
    r.fn();                                   /* el primer paso es inmediato */
    r.t = setTimeout(()=>{
      let ms = 140, pasos = 0;
      const tic = ()=>{
        r.fn(); pasos++;
        if(pasos===6 && ms>60){ ms=60; clearInterval(r.i); r.i=setInterval(tic,ms); }
      };
      r.i = setInterval(tic, ms);
    }, 400);
  },[parar]);
  React.useEffect(()=>parar,[parar]);         /* limpia si la pantalla se cierra */
  return {
    onPointerDown:(e)=>{ e.preventDefault(); arrancar(); },
    onPointerUp:parar, onPointerLeave:parar, onPointerCancel:parar,
  };
}

/* ‚ïê‚ïê NORMA DEL MEN√ö LATERAL (transversal a las 5 apps) ‚ïê‚ïê
   Hasta 5 m√≥dulos: lista plana. Desde 6: ACORDE√ìN por grupos, igual que
   freelance-completo ‚Äî un solo grupo abierto a la vez; tocar el abierto lo cierra. */
const MENU_AGRUPA_DESDE = 6;

function useGestoDrawer(abrir, activo){
  React.useEffect(()=>{
    if(!activo) return;
    const BORDE=20, MINIMO=60;
    let x0=0, y0=0, valido=false;
    const inicio=(e)=>{
      const t=e.touches&&e.touches[0]; if(!t) return;
      const caja=document.querySelector(".shell");
      const izq=caja ? caja.getBoundingClientRect().left : 0;
      valido = (t.clientX - izq) <= BORDE && MODALES.length===0;
      x0=t.clientX; y0=t.clientY;
    };
    const mover=(e)=>{
      if(!valido) return;
      const t=e.touches&&e.touches[0]; if(!t) return;
      const dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
      if(dx>MINIMO && dx>dy*2){ valido=false; abrir(); }
      if(dy>28) valido=false;
    };
    const fin=()=>{ valido=false; };
    document.addEventListener("touchstart", inicio, {passive:true});
    document.addEventListener("touchmove", mover, {passive:true});
    document.addEventListener("touchend", fin, {passive:true});
    document.addEventListener("touchcancel", fin, {passive:true});
    return ()=>{
      document.removeEventListener("touchstart", inicio);
      document.removeEventListener("touchmove", mover);
      document.removeEventListener("touchend", fin);
      document.removeEventListener("touchcancel", fin);
    };
  },[abrir,activo]);
}

/* ‚îÄ‚îÄ Dictado por voz: bot√≥n de micr√≥fono reutilizable ‚îÄ‚îÄ */
/* ‚ïê‚ïê DESLIZAR PARA CAMBIAR DE P√ÅGINA ‚ïê‚ïê
   En el celular, arrastrar de derecha a izquierda avanza y al rev√©s retrocede.
   Cuidados: (1) se ignoran los 30 px de cada borde para no pelear con el gesto
   "atr√°s" de Android; (2) el recorrido debe superar 60 px y ser m√°s horizontal
   que vertical, para no dispararse al hacer scroll normal; (3) los botones
   Anterior/Siguiente se quedan: el gesto es un atajo, no el √∫nico camino.
   Uso: <Deslizable pag={p} total={t} onPag={setP}> ‚Ä¶filas‚Ä¶ </Deslizable> */
function Deslizable({ pag, total, onPag, children }){
  const ini = React.useRef(null);
  const [arrastre, setArrastre] = useState(0);   // px de desplazamiento visual
  const [entrando, setEntrando] = useState(0);   // -1 llega de la derecha ¬∑ 1 de la izquierda
  const pagAnt = React.useRef(pag);
  const BORDE = 30, MINIMO = 60;

  /* Al cambiar de p√°gina la lista nueva ENTRA con un peque√±o desplazamiento.
     Sin esto el cambio es instant√°neo y da la impresi√≥n de que no pas√≥ nada. */
  React.useEffect(() => {
    if (pagAnt.current === pag) return;
    const dir = pag > pagAnt.current ? -1 : 1;
    pagAnt.current = pag;
    setEntrando(dir);
    const t = setTimeout(() => setEntrando(0), 20);   // el navegador pinta el inicio y anima al final
    return () => clearTimeout(t);
  }, [pag]);

  const empezar = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const ancho = window.innerWidth || 400;
    if (t.clientX < BORDE || t.clientX > ancho - BORDE) { ini.current = null; return; }
    ini.current = { x: t.clientX, y: t.clientY };
  };
  const mover = (e) => {
    if (!ini.current || !total || total <= 1) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - ini.current.x, dy = t.clientY - ini.current.y;
    if (Math.abs(dy) > Math.abs(dx)) { ini.current = null; setArrastre(0); return; }  // es scroll
    /* no deja arrastrar m√°s all√° de la primera ni de la √∫ltima */
    const tope = (dx > 0 && pag <= 1) || (dx < 0 && pag >= total);
    setArrastre(Math.max(-90, Math.min(90, tope ? dx * 0.25 : dx)));
  };
  const soltar = () => {
    const dx = arrastre;
    ini.current = null; setArrastre(0);
    if (!total || total <= 1 || Math.abs(dx) < MINIMO) return;
    if (dx < 0 && pag < total) onPag(p => Math.min(total, p + 1));
    if (dx > 0 && pag > 1)     onPag(p => Math.max(1, p - 1));
  };

  /* Mientras se arrastra manda el dedo; al soltar, manda la animaci√≥n de entrada. */
  const desplaz = arrastre || entrando * 26;
  return (
    <div onTouchStart={empezar} onTouchMove={mover} onTouchEnd={soltar} onTouchCancel={soltar}
      style={{ touchAction:"pan-y",
        transform:`translateX(${desplaz}px)`,
        opacity: entrando ? .35 : 1,
        transition: arrastre ? "none" : "transform .26s cubic-bezier(.2,.8,.3,1), opacity .26s ease-out" }}>
      {children}
    </div>
  );
}

/* Puntitos de posici√≥n, como en una galer√≠a de fotos. */
function PuntosPag({ pag, total }){
  const [salto, setSalto] = useState(false);
  const ant = React.useRef(pag);
  /* el punto activo pega un saltito al cambiar: confirma que s√≠ se movi√≥ */
  React.useEffect(() => {
    if (ant.current === pag) return;
    ant.current = pag;
    setSalto(true);
    const t = setTimeout(() => setSalto(false), 260);
    return () => clearTimeout(t);
  }, [pag]);

  if (!total || total <= 1) return null;
  const max = 7, desde = total <= max ? 1 : Math.max(1, Math.min(pag - 3, total - max + 1));
  const cuantos = Math.min(max, total);
  return (
    <div className="row" style={{justifyContent:"center",gap:6,marginTop:10,alignItems:"center"}}>
      {Array.from({length:cuantos}, (_,i)=>desde+i).map(n=>{
        const on = n===pag;
        return (
          <span key={n} style={{
            width: on ? (salto ? 26 : 18) : 6,
            height: on && salto ? 8 : 6,
            borderRadius:99,
            background: on ? "var(--field)" : "#D9D3C4",
            transition:"width .26s cubic-bezier(.2,.8,.3,1), height .26s, background .2s" }}/>
        );
      })}
      <span className="num" style={{fontSize:10.5,color:"var(--muted)",marginLeft:6}}>{pag}/{total}</span>
    </div>
  );
}

function MicBtn({onTexto, toast}){
  const [rec,setRec]=useState(false);
  const refRec=React.useRef(null);
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Reconocedor) return null;
  const dictar=()=>{
    if(rec){ try{ refRec.current && refRec.current.stop(); }catch(e){} setRec(false); return; }
    const r=new Reconocedor();
    r.lang="es-EC"; r.interimResults=false; r.maxAlternatives=1;
    r.onresult=ev=>{ const t=ev.results[0][0].transcript.trim(); if(t) onTexto(t); };
    r.onerror=ev=>{ setRec(false); if(ev.error==="not-allowed" && toast) toast("Permite el micr√≥fono para dictar"); };
    r.onend=()=>setRec(false);
    refRec.current=r;
    try{ r.start(); setRec(true); }catch(e){ setRec(false); }
  };
  return (
    <button type="button" className={"micb"+(rec?" rec":"")} onClick={dictar} aria-label="Buscar por voz">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke={rec?"#C2603A":"var(--muted)"} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0"/><path d="M12 17.5V21M9 21h6"/>
      </svg>
    </button>
  );
}

/* ‚îÄ‚îÄ Bot√≥n flotante de crear (+): arrastrable, recuerda su posici√≥n ‚îÄ‚îÄ */
function BotonCrear({onClick, titulo}){
  const LADO_INI="der", ALTO_INI=0.72;
  const leer=()=>{
    try{
      const g=JSON.parse(localStorage.getItem("fabPos")||"null");
      if(g && (g.lado==="izq"||g.lado==="der") && typeof g.y==="number") return g;
    }catch(e){}
    return {lado:LADO_INI, y:ALTO_INI};
  };
  const [pos,setPos]=useState(leer);
  const [moviendo,setMoviendo]=useState(false);
  const ref=React.useRef(null);
  const drag=React.useRef({activo:false, movido:false, x:0, y:0});
  const guardar=(p)=>{ setPos(p); try{ localStorage.setItem("fabPos",JSON.stringify(p)); }catch(e){} };
  const el_zona=(btn)=>{ const z=btn&&btn.parentElement; return z ? z.getBoundingClientRect() : null; };
  const inicio=(e)=>{
    const t=e.touches?e.touches[0]:e;
    drag.current={activo:true, movido:false, x:t.clientX, y:t.clientY};
    setMoviendo(true);
  };
  const mover=(e)=>{
    if(!drag.current.activo) return;
    const t=e.touches?e.touches[0]:e;
    const dx=Math.abs(t.clientX-drag.current.x), dy=Math.abs(t.clientY-drag.current.y);
    if(dx>6||dy>6) drag.current.movido=true;
    if(!drag.current.movido) return;
    if(e.cancelable) e.preventDefault();
    const alto=window.innerHeight;
    let y=t.clientY/alto;
    y=Math.min(0.88, Math.max(0.12, y));
    const zona=el_zona(ref.current);
    const medio = zona ? zona.left + zona.width/2 : window.innerWidth/2;
    const lado = t.clientX < medio ? "izq" : "der";
    setPos({lado, y});
  };
  const fin=()=>{
    if(!drag.current.activo) return;
    const eraMovimiento=drag.current.movido;
    drag.current.activo=false; setMoviendo(false);
    if(eraMovimiento) guardar(pos); else onClick();
  };
  React.useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.addEventListener("touchmove", mover, {passive:false});
    return ()=>el.removeEventListener("touchmove", mover);
  });
  return (
    <div className="fab-zona">
      <button ref={ref} className={"fab"+(moviendo?" mov":"")}
        style={{top:`${pos.y*100}%`, [pos.lado==="izq"?"left":"right"]:"16px"}}
        title={titulo||"Crear"} aria-label={titulo||"Crear"}
        onTouchStart={inicio} onTouchEnd={fin} onTouchCancel={fin}
        onMouseDown={inicio} onMouseMove={mover} onMouseUp={fin}
        onMouseLeave={()=>{drag.current.activo=false;setMoviendo(false);}}>
        <span className="fab-mas">+</span>
      </button>
    </div>
  );
}

/* ‚îÄ‚îÄ Buscador predictivo compacto para filtros (reemplaza al select nativo) ‚îÄ‚îÄ */
function FiltroBuscador({items, value, onPick, todos, etiquetaTodos, render, estilo, obligatorio, cat}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const txt=(it)=>render?render(it):String(it);
  /* norma sellada: lo m√°s elegido va primero (el contador nunca se muestra) */
  const opciones=[{__todos:true}, ...ordUso(cat, items)];
  const filtrados = q.trim()==="" ? opciones
    : opciones.filter(it=>it.__todos ? false
        : norm(q).split(/\s+/).filter(Boolean).every(w=>norm(txt(it)).includes(w)));
  const elegido = value===todos ? "" : txt(value);
  return (
    <div className="fb" style={estilo}>
      <div className={"fb-box"+(elegido&&!open&&!obligatorio?" act":"")}>
        <input value={open?q:elegido}
          placeholder={etiquetaTodos}
          onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>{setQ("");setOpen(true);}}
          onBlur={()=>setTimeout(()=>setOpen(false),160)}/>
        {elegido && !open && !obligatorio && (
          <button className="fb-clr" onMouseDown={e=>{e.preventDefault();onPick(todos);}}>√ó</button>
        )}
        <MicBtn onTexto={t=>{setQ(t);setOpen(true);}}/>
        <span className="fb-cara">‚ñæ</span>
      </div>
      {open && (
        <div className="fb-pop">
          {filtrados.length===0
            ? <div className="fb-none">Sin resultados para ‚Äú{q}‚Äù</div>
            : filtrados.map((it,i)=>(
              <div className="fb-opt" key={i}
                onMouseDown={e=>{e.preventDefault();onPick(it.__todos?todos:it);setOpen(false);setQ("");}}>
                {it.__todos ? <span style={{fontWeight:700,color:"var(--muted)"}}>{etiquetaTodos}</span> : txt(it)}
              </div>))}
        </div>)}
    </div>
  );
}

// Buscador con autocompletar (cliente, proveedor, producto)
/* Nombre corto del cliente para mostrarlo (como en el sistema web):
   persona natural ‚Üí primer nombre + primer apellido; empresa ‚Üí nombre de la empresa. */
function refCortoCliente(nombre){
  var refs = (typeof REFERENCIALES!=="undefined" && REFERENCIALES[nombre]) ? REFERENCIALES[nombre] : [];
  var rs = String((refs && refs[0]) || nombre || "").trim();
  if(!rs) return nombre;
  var rsUp = rs.toUpperCase().replace(/\./g,"");
  var esJuridica = /\b(SA|SAS|CA|CIA|C√çA|LTDA|COMPANIA|COMPA√ëIA)\b/.test(rsUp);
  if(esJuridica) return rs;
  var w = rs.split(/\s+/).filter(Boolean);
  if(w.length<=2) return rs;
  return w[0]+" "+w[w.length-2];
}
function SearchSelect({label, hint, items, value, onPick, onClear, disabled, placeholder, render, sortBy, multiPalabra, maxItems, sinLabel, className, onAbrir, cat, sinLapiz, fijo, fuzzy}) {
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const [reabrir,setReabrir]=useState(false);   // al tocar la tarjeta: limpiar y desplegar la lista de una
  const inpRef=React.useRef(null);
  /* avisa hacia afuera si la lista est√° abierta (para ocultar lo que quede debajo) */
  React.useEffect(()=>{ if(onAbrir) onAbrir(open); },[open]);
  /* venimos de tocar la tarjeta: abre la lista y pone el cursor, sin pasos extra */
  React.useEffect(()=>{
    if(!reabrir) return;
    setReabrir(false); setOpen(true);
    const t=setTimeout(()=>{ if(inpRef.current) inpRef.current.focus(); },0);
    return ()=>clearTimeout(t);
  },[reabrir]);
  const ocultarLabel = sinLabel || (label && placeholder && label.trim().toLowerCase()===placeholder.trim().toLowerCase());
  if(value){
    return (<div className="field">{!ocultarLabel && <label>{label}</label>}
      <div className={"ss"+(className?" "+className:"")}>
        {/* norma: sin bot√≥n "Cambiar"; se toca la tarjeta y vuelve al buscador */}
        <div className={"pick"+(disabled?" dis":"")+(fijo?" fijo":"")} role={(disabled||fijo)?undefined:"button"}
          onClick={(disabled||fijo)?undefined:()=>{onClear();setQ("");setReabrir(true);}}
          style={(disabled||fijo)?undefined:{cursor:"pointer"}}>
          <div style={{flex:1,minWidth:0}}>{render.picked(value)}</div>
          {!disabled && !fijo && !sinLapiz && <span className="chg-ar" aria-hidden="true">‚úé</span>}
        </div></div></div>);
  }
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  // multiPalabra: cada palabra en cualquier orden (nombre de cliente + sus referenciales). Si no, texto seguido.
  const coincide=(texto)=>{
    if(multiPalabra){
      const refs=(typeof REFERENCIALES!=="undefined" && REFERENCIALES[texto]) ? REFERENCIALES[texto].join(" ") : "";
      const t=norm(texto+" "+refs);
      return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w));
    }
    return norm(texto).includes(norm(q));
  };
  let filtrados, rankFuzzy=false;
  if(q.trim()===""){
    filtrados = items;
  } else if(fuzzy && typeof window!=="undefined" && window.uFuzzy){
    try{
      const uf=new window.uFuzzy({intraMode:1,intraIns:1,intraSub:1,intraTrn:1,intraDel:1});
      const hay=items.map(it=>{ const tx=render.text(it); const rf=(typeof REFERENCIALES!=="undefined"&&REFERENCIALES[tx])?REFERENCIALES[tx].join(" "):""; return norm(tx+" "+rf); });
      const ndl=norm(q);
      const ix=uf.filter(hay,ndl);
      if(ix&&ix.length){ const nf=uf.info(ix,hay,ndl); const od=uf.sort(nf,hay,ndl); filtrados=od.map(o=>items[nf.idx[o]]); rankFuzzy=true; }
      else { filtrados=[]; }
    }catch(_){ filtrados=items.filter(it=>coincide(render.text(it))); }
  } else {
    filtrados = items.filter(it=>coincide(render.text(it)));
  }
  /* norma sellada: lo m√°s elegido va primero (el contador nunca se muestra) */
  if(!rankFuzzy){
    if(sortBy) filtrados = [...filtrados].sort(sortBy);
    else if(cat) filtrados = ordUso(cat, filtrados);
  }
  const totalFiltrados = filtrados.length;
  const visibles = maxItems ? filtrados.slice(0, maxItems) : filtrados;
  const hayMas = maxItems ? (totalFiltrados > maxItems) : false;
  return (<div className="field">{!ocultarLabel && <label>{label}</label>}
    <div className={"ss"+(className?" "+className:"")}>
      <div className={"box"+(disabled?" dis":"")}>
        <span className="mag">‚åï</span>
        <input value={q} disabled={disabled} ref={inpRef}
          placeholder={disabled ? placeholder : (placeholder || (label ? `Buscar ${label.toLowerCase()}‚Ä¶` : "Escribe para buscar‚Ä¶"))}
          onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),150)}/>
        {q && <button className="clr" onMouseDown={e=>{e.preventDefault();setQ("");}}>√ó</button>}
        {!disabled && <MicBtn onTexto={t=>{setQ(t);setOpen(true);}}/>}
      </div>
      {open && !disabled && (
        <div className="pop">
          {visibles.length===0
            ? <div className="none">Sin resultados para ‚Äú{q}‚Äù</div>
            : <>
              {visibles.map((it,i)=>(
                <div className="opt" key={i} onMouseDown={e=>{e.preventDefault();regUso(cat,it);onPick(it);setOpen(false);setQ("");}}>
                  {render.option(it)}
                </div>))}
              {hayMas && <div className="opt-mas">Mostrando {maxItems} de {totalFiltrados}. Escribe para buscar el que necesitas.</div>}
            </>}
        </div>)}
    </div>
    {hint && <div className="hint">{hint}</div>}
  </div>);
}

// Mini gr√°fico de l√≠nea (sparkline): evoluci√≥n del precio neto en orden cronol√≥gico (antiguo‚Üíreciente)
function Sparkline({valores}){
  if(!valores || valores.length<2) return null;
  const w=260, h=40, pad=4;
  const min=Math.min(...valores), max=Math.max(...valores);
  const rango=(max-min)||1;
  const pts=valores.map((v,i)=>{
    const x=pad+(i*(w-pad*2)/(valores.length-1));
    const y=pad+(h-pad*2)*(1-(v-min)/rango);
    return [Math.round(x*100)/100, Math.round(y*100)/100];
  });
  const linea=pts.map((p,i)=>(i===0?"M":"L")+p[0]+" "+p[1]).join(" ");
  const area=linea+" L"+pts[pts.length-1][0]+" "+h+" L"+pts[0][0]+" "+h+" Z";
  const sube=valores[valores.length-1]>=valores[0];
  const col=sube?"#B5613C":"#2E7D52";
  return (
    <svg viewBox={"0 0 "+w+" "+h} preserveAspectRatio="none">
      <path d={area} fill={col} opacity="0.08"/>
      <path d={linea} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?3:2} fill={col}/>)}
    </svg>
  );
}

/* ‚ïê‚ïê‚ïê PROMO-04 ¬∑ LAS PROMOCIONES LLEGAN AL CAT√ÅLOGO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Hasta hoy cada l√≠nea del cat√°logo nac√≠a con promosFreelance:[] y
   promosProveedor:[]. Por eso P4 y P6 sal√≠an grises ‚Äî¬´Este producto no tiene
   promociones del freelance vigentes.¬ª‚Äî aunque la promoci√≥n ya estuviera cargada
   en la base. Esto es lo que las reparte.

   EL MISMO COLADOR QUE `gratis_que_concede`, para que la pantalla y el cerrojo de
   la base nunca digan cosas distintas:
     ¬∑ modalidad `compra_lleva`: es la √∫nica que P4/P6 saben mostrar (descuento
       por volumen o sobre la factura no regalan mercader√≠a);
     ¬∑ estado `activa` o `aprobada`. `pendiente` y `rechazada` NO se le ofrecen a
       un vendedor ‚Äîtodav√≠a no son un compromiso de nadie‚Äî y `vencida` e
       `inactiva` ya murieron;
     ¬∑ vigente HOY con la fecha LOCAL del tel√©fono. Con toISOString(), en Ecuador
       (UTC-5) desde las 19h ya ser√≠a ma√±ana y una promoci√≥n regir√≠a cinco horas
       antes o morir√≠a cinco horas despu√©s;
     ¬∑ producto + presentaci√≥n + piladora. `prov_cod` en NULL vale para todas las
       piladoras, igual que en la funci√≥n de la base.

   LA PRESENTACI√ìN NO SE CONVIERTE. ¬´Compra 100 lleva 2¬ª no dice lo mismo en
   quintales que en arrobas (son 4√ó) ni en fundas de 10 libras (0,1 qq: son 10√ó).
   Los n√∫meros del tramo se muestran TAL CUAL, as√≠ que una promoci√≥n solo se
   ofrece en la presentaci√≥n en la que fue escrita; si no fija presentaci√≥n, sus
   n√∫meros est√°n en QUINTALES ‚Äîas√≠ los lee la base‚Äî y entonces solo se ofrece en
   la l√≠nea de equivalencia 1. Convertirlos aqu√≠ ser√≠a inventar una cuenta que
   nadie pidi√≥, y ya hubo un conversor al que el texto ¬´10 libras¬ª enga√±√≥.

   LOS N√öMEROS SON PARA MOSTRAR, NO PARA DECIDIR. `minimo` y `gratis` salen del
   PRIMER escal√≥n de `promocion_tramos` y solo sirven para escribir ¬´por cada 100
   llevas 2¬ª. Cu√°nto se puede regalar de verdad lo sigue diciendo la base, por RPC
   a `gratis_que_concede` (topeRegaloQq), que es la misma cuenta del cerrojo de
   `pedido_items` y de `facturar_pedido`. Dos fuentes para un mismo hecho terminan
   contradici√©ndose. */
const PROMO_ESTADOS_VIVOS = ["activa","aprobada"];
function promosDelCatalogo(promoTbl, hoyISO){
  const tbl = promoTbl || {};
  /* Escal√≥n de ARRANQUE de cada promoci√≥n: el `desde_cant` m√°s bajo. Es el que se
     ense√±a; los dem√°s escalones los aplica la base al calcular el tope. */
  const arranque = {};
  (tbl.tramos||[]).forEach(t=>{
    if(t.modalidad && t.modalidad!=="compra_lleva") return;
    const d=Number(t.desde_cant)||0, g=Number(t.gratis_cant)||0;
    if(!(d>0) || !(g>0)) return;                 // sin n√∫meros no hay nada que ofrecer
    const ya=arranque[t.promo_id];
    if(!ya || d<ya.minimo) arranque[t.promo_id]={ minimo:d, gratis:g };
  });
  const vivas=[];
  (tbl.promos||[]).forEach(p=>{
    if(!p || p.modalidad!=="compra_lleva") return;
    if(p.es_demo===true) return;
    if(PROMO_ESTADOS_VIVOS.indexOf(p.estado)<0) return;
    const d = p.vigente_desde ? String(p.vigente_desde).slice(0,10) : null;
    const h = p.vigente_hasta ? String(p.vigente_hasta).slice(0,10) : null;
    if(d && d >  hoyISO) return;                 // todav√≠a no rige
    if(h && h <  hoyISO) return;                 // el √öLTIMO d√≠a s√≠ cuenta, igual que en la base
    const t = arranque[p.promo_id];
    if(!t) return;                               // cabecera sin escalones: no se ofrece lo que no se puede cumplir
    vivas.push({ prodId:p.prod_id, presCod:p.pres_cod||null, provCod:p.prov_cod||null, origen:p.origen,
      promo:{ id:p.promo_id, nombre:p.nombre, minimo:t.minimo, gratis:t.gratis,
        detalle: p.detalle || ("compra "+t.minimo+" lleva "+t.gratis),
        base: (p.base!=null ? Math.round(Number(p.base)*100)/100 : null),
        desde:d, hasta:h, paga:(p.origen==="proveedor" ? "proveedor" : "freelance") } });
  });
  /* Devuelve las promociones de UNA l√≠nea del cat√°logo, ya repartidas: las del
     freelance van a P4 y las del proveedor a P6. */
  return function(prodId, presCod, provCod, equiv, baseContado){
    const f=[], v=[];
    vivas.forEach(x=>{
      if(x.prodId !== prodId) return;
      if(x.presCod ? (x.presCod !== presCod) : Number(equiv)!==1) return;
      if(x.provCod && provCod && x.provCod !== provCod) return;
      const pm = Object.assign({}, x.promo);
      /* Promoci√≥n sin base propia: manda el precio de la oferta. Con base 0 la
         comisi√≥n saldr√≠a siendo el precio ENTERO de la l√≠nea. */
      if(pm.base==null) pm.base = baseContado;
      (x.origen==="proveedor" ? v : f).push(pm);
    });
    return { freelance:f, proveedor:v };
  };
}

/* ‚îÄ‚îÄ FA-0011 ¬∑ el PEDIDO sale de las OFERTAS, ya no de `precios` ‚îÄ‚îÄ
   El sistema web dej√≥ de escribir en `precios`: hoy un producto nuevo nace con sus
   ofertas en `ofertas_piladora` y CERO filas en `precios`. Leyendo `precios`, el
   vendedor ve√≠a el producto en el cat√°logo pero NO lo pod√≠a PEDIR. Medido contra
   producci√≥n el 05/08/2026: 59 productos activos ¬∑ 58 con fila en `precios` ¬∑ 59
   con oferta vigente. El que faltaba era P-00197 ¬´Arroz Crecedor¬ª, sin marca,
   2 presentaciones y 2 ofertas vivas de Piladora San Agust√≠n.

   OJO CON EL PRECIO ‚Äî aqu√≠ NO es el mismo que en la ficha de Productos:
   la l√≠nea del pedido se cobra por la PRESENTACI√ìN, y `precio_contado` de la
   oferta YA viene por presentaci√≥n ($37,00 el quintal, $9,25 la arroba). Entra
   DIRECTO: ni se multiplica ni se divide por equiv_qq. Antes se multiplicaba
   porque `precios.base_contado` ven√≠a por quintal. Confundirlo saca el pedido con
   importes falsos. El equiv_qq sigue viajando en `equiv` porque al guardar todo se
   convierte a quintales (cantidad_qq = cant √ó equiv ¬∑ precio_usd = precio √∑ equiv).

   La oferta define QU√â vende cada piladora y a qu√© precio: en el pedido la piladora
   se elige primero, as√≠ que cada una muestra SU precio. Sin producto activo o sin
   oferta vigente, la oferta no se ofrece. */
function construirCatalogoPedido(provs, ofertas, prods, presenTbl, promoTbl){
  /* `presenTbl` no se usa aqu√≠ (esta app no trae foto por presentaci√≥n); se recibe
     para que las tres apps se llamen EXACTAMENTE igual y ning√∫n arn√©s ni ninguna
     pantalla tenga que acordarse de en cu√°l va el argumento en otro puesto. */
  const r2=n=>Math.round(n*100)/100;
  const nomDe={}, lineaDe={}, fotoDe={};
  /* Un producto dado de baja no se puede pedir aunque su oferta siga viva: la
     consulta ya filtra por estado, pero la regla vive AQU√ç para que no dependa
     de que quien llame se acuerde de filtrar. */
  (prods||[]).forEach(p=>{ if(p.estado && p.estado!=="activo") return;
    nomDe[p.prod_id]=p.nombre||p.marca||p.prod_id; lineaDe[p.prod_id]=p.linea||"Otros"; fotoDe[p.prod_id]=p.foto||null; });
  /* La fecha del TEL√âFONO, no la de Greenwich: con toISOString(), en Ecuador
     (UTC-5) desde las 19h ya ser√≠a "ma√±ana" y una oferta entrar√≠a a regir cinco
     horas antes de tiempo. */
  const _h=new Date();
  const hoyISO=_h.getFullYear()+"-"+String(_h.getMonth()+1).padStart(2,"0")+"-"+String(_h.getDate()).padStart(2,"0");
  /* PROMO-04 ¬∑ las promociones vivas, listas para colgarlas de cada l√≠nea */
  const promosDe = promosDelCatalogo(promoTbl, hoyISO);
  /* Una sola l√≠nea por piladora + producto + presentaci√≥n: si la base trajera dos
     ofertas vivas para la misma, manda la M√ÅS BARATA (nunca se ofrece de m√°s). */
  const porClave={};
  (ofertas||[]).forEach(o=>{
    if(o.activo === false) return;
    if(o.vigente_desde && String(o.vigente_desde).slice(0,10) >  hoyISO) return;
    if(o.vigente_hasta && String(o.vigente_hasta).slice(0,10) <= hoyISO) return;
    const nom=nomDe[o.prod_id];
    if(!nom) return;                                   // producto de baja o inexistente
    const eq=Number(o.equiv_qq)||0;
    if(!(eq>0)) return;                                // sin equivalencia no se puede pasar a quintales
    const pc=Number(o.precio_contado)||0;
    if(!(pc>0)) return;                                // sin precio no se inventa uno
    const pk=Number(o.precio_credito)||pc;
    const clave=o.prod_id+"-"+o.pres_cod+"|"+(o.prov_cod||"");
    const ya=porClave[clave];
    if(ya && ya.baseContado <= r2(pc)) return;
    const prom = promosDe(o.prod_id, o.pres_cod, o.prov_cod, eq, r2(pc));
    porClave[clave]={ id:o.prod_id+"-"+o.pres_cod, prodId:o.prod_id, presCod:o.pres_cod, equiv:eq, provId:o.prov_cod, linea:lineaDe[o.prod_id],
      marca:nom, nombre:nom+" ¬∑ "+o.presentacion, unidad:o.presentacion, foto:fotoDe[o.prod_id]||null, diasCredito:30,
      baseContado:r2(pc), baseCredito:r2(pk),
      costo:o.costo!=null?r2(Number(o.costo)):null,
      promosFreelance:prom.freelance, promosProveedor:prom.proveedor };
  });
  const pres=Object.keys(porClave).map(k=>porClave[k]);
  return { provs:(provs||[]).map(p=>({id:p.prov_cod, nombre:p.nombre})), pres };
}

/* nombre del cliente ‚Üí su c√≥digo real. Lo llena el m√≥dulo Pedido al cargar. */
const CLI_ID_DE = {};

/* ‚ïê‚ïê‚ïê PROMO-03 ¬∑ EL TOPE DEL REGALO LO DICE LA BASE, NO LA APP ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Decisi√≥n del Product Owner (06/08/2026): si el vendedor pone m√°s regalo del
   que concede la promoci√≥n, el pedido NO se guarda y se le muestra el n√∫mero
   exacto que s√≠ concede. Es mercader√≠a regalada: mejor frenar antes que
   reclamar despu√©s.

   El n√∫mero NO se calcula aqu√≠. Se le PREGUNTA a la base, a la funci√≥n
   `gratis_que_concede`, que es la misma que usa el cerrojo de `pedido_items`
   y la misma que usa `facturar_pedido` al confirmar el despacho. Si la app
   tuviera su propia f√≥rmula, el d√≠a que una de las dos se corrija sin la otra
   saldr√≠a grano regalado que nadie autoriz√≥: dos fuentes para un mismo hecho
   siempre terminan contradici√©ndose.

   Todo viaja EN QUINTALES, que es como lo guarda `pedido_items`: la cantidad
   y el regalo se multiplican por el `equiv` de la OFERTA, nunca por lo que
   parezca decir el nombre de la presentaci√≥n. Una arroba son 0,25 qq y ¬´10
   libras¬ª son 0,1 qq: adivinarlo por el texto es regalar diez veces m√°s grano
   del que la piladora despacha (el mismo golpe de `descomponerGratis`).

   Devuelve: n√∫mero = quintales que concede ¬∑ null = no hay promoci√≥n vigente
   ¬∑ undefined = no se pudo preguntar (sin se√±al), y entonces manda el cerrojo
   de la base, que igual no deja pasar la l√≠nea. */
async function topeRegaloQq({prodId, presCod, provId, cantidadQq}){
  if(!window.SB || !window.SB.rpc) return undefined;
  try{
    const { data, error } = await window.SB.rpc("gratis_que_concede", {
      p_prod_id: prodId || null, p_pres_cod: presCod || null,
      p_prov_cod: provId || null, p_cantidad_qq: Number(cantidadQq)||0,
      p_es_demo: false });
    if(error) return undefined;
    return (data===null || data===undefined) ? null : Number(data);
  }catch(e){ return undefined; }
}

/* Revisa el pedido l√≠nea por l√≠nea. Devuelve null si todo est√° en orden, o el
   aviso ‚Äîen criollo, para leerlo en el celular‚Äî de la PRIMERA l√≠nea que se
   pasa. Mientras haya aviso, el pedido no se guarda ni en el tel√©fono.

   P3 queda fuera a prop√≥sito: ese regalo lo arma el vendedor y sale de SU
   comisi√≥n, no de ninguna promoci√≥n. Bloquearlo contra una promoci√≥n que no
   existe ser√≠a matar una funci√≥n que hoy trabaja. */
async function revisarRegaloDePromo(items, provId){
  const r2 = x => Math.round(x*100)/100;
  for(const it of (items||[])){
    if(!it || !it.prod) continue;
    if(it.tipo === "P3") continue;
    if(!it.prod.prodId) continue;              /* producto de demostraci√≥n: no llega a la base */
    const eq = Number(it.prod.equiv)>0 ? Number(it.prod.equiv) : 1;
    const regaloQq = r2((Number(it.gratis)||0)*eq);
    if(!(regaloQq > 0)) continue;
    const cantQq = r2((Number(it.cant)||0)*eq);
    const tope = await topeRegaloQq({ prodId:it.prod.prodId, presCod:it.prod.presCod,
      provId: provId, cantidadQq: cantQq });
    if(tope === undefined) continue;
    const nom = it.prodNombre || it.prod.nombre || "ese producto";
    if(tope === null)
      return "üö´ No se puede regalar en " + nom + "\n\n" +
             "Ese producto no tiene promoci√≥n vigente ahora mismo.\n\n" +
             "Quita el regalo, o usa ¬´Promo vendedor¬ª, que sale de tu comisi√≥n.";
    if(regaloQq > tope + 0.005)
      return "üö´ Te pasaste con el regalo en " + nom + "\n\n" +
             "Pusiste " + r2(regaloQq) + " qq de regalo y por " + r2(cantQq) +
             " qq la promoci√≥n concede " + r2(tope) + " qq.\n\n" +
             "Baja el regalo a " + r2(tope) + " qq o sube la cantidad, y vuelve a guardar.";
  }
  return null;
}

async function guardarPedidoEnBase({cli, prov, carrito, ubic, retiro, asumeFlete, asumeEstibada}){
  try{
    if(!window.SB || !window.SB.auth) return { ok:false, motivo:"sin_conexion" };
    const { data:s } = await window.SB.auth.getSession();
    if(!s || !s.session) return { ok:false, motivo:"sin_sesion" };
    const cliId = CLI_ID_DE[(cli && cli.nombre) || cli];
    if(!cliId) return { ok:false, motivo:"cliente_demo" };
    const items = (carrito||[]).filter(it=>it && it.prod);
    if(!items.length || items.some(it=>!it.prod.prodId || !it.prod.equiv)) return { ok:false, motivo:"producto_demo" };
    /* PROMO-03 ¬∑ antes de tocar la base: el regalo no puede pasar de lo que
       concede la promoci√≥n. Si se pasa, no nace ni la cabecera del pedido. */
    const avisoRegalo = await revisarRegaloDePromo(items, (prov && prov.id)||null);
    if(avisoRegalo) return { ok:false, motivo:avisoRegalo, regalo:true };
    const condicion=items.some(it=>it.credito||it.esCredito)?"credito":"contado";
    const opId="COM-PED-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
    const payload={cliente_id:cliId,proveedor_id:(prov&&prov.id)||null,condicion,
      ubicacion_id:retiro?null:((ubic&&ubic.ubic_id)||null),retiro_bodega:!!retiro,
      asume_flete:retiro?null:(asumeFlete||"freelance"),asume_estibada:retiro?null:(asumeEstibada||"freelance"),
      items:items.map(it=>({prod_id:it.prod.prodId,pres_cod:it.prod.presCod,
        cantidad_presentacion:Number(it.cant),gratis_presentacion:Number(it.gratis)||0,
        precio_presentacion:Number(it.precio),tipo_precio:it.tipo,
        condicion:(it.credito||it.esCredito)?"credito":"contado",promo_id:it.promoId||null,
        comision_propuesta:it.tipo==="P5"?(Number(it.comisionTotal)||0):null}))};
    const {data,error}=await window.SB.rpc("registrar_pedido_atomico",{p_payload:payload,p_op_id:opId});
    if(error) return {ok:false,motivo:error.message||"error_pedido"};
    const r=(data&&data[0])||data||{};
    return {ok:true,pedId:r.ped_id||opId,repetido:!!r.repetido};
  }catch(e){ return { ok:false, motivo:"error" }; }
}

/* ‚ïê‚ïê‚ïê EL TOTAL EN QUINTALES DEL PEDIDO EN CURSO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Sale de la EQUIVALENCIA REAL de la oferta (`equiv`), que es la misma con la
   que se graba la l√≠nea (cantidad_qq = cant √ó equiv). Antes la pantalla la
   ADIVINABA del texto de la unidad: ¬´Arroba¬ª no dec√≠a ¬´quintal¬ª ni tra√≠a ¬´kg¬ª,
   as√≠ que val√≠a 1 qq en vez de 0,25 y un pedido de arrobas se ve√≠a CUATRO
   VECES m√°s grande de lo que se guardaba. Dos fuentes para el mismo hecho
   terminan contradici√©ndose; aqu√≠ hay una sola, y es la que viaja a la base.
   En la demostraci√≥n no hay oferta ni equivalencia: solo ah√≠ se cae a qqDeTam,
   el conversor que el resto de la app ya usa.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
function totalQuintalesDeCarrito(carrito){
  const qq = (carrito||[]).reduce((s,it)=>{
    if(!it) return s;
    const eq = it.prod ? Number(it.prod.equiv) : 0;
    return s + ((eq>0 ? eq : qqDeTam(it.unidad)) * (Number(it.cant)||0));
  },0);
  return Math.round(qq*100)/100;
}

/* ‚ïê‚ïê‚ïê CABECERA DEL PEDIDO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   SPRINT-05 ¬∑ Qui√©n compra, a qui√©n y qu√©. Es la identidad del pedido: los
   tres campos que lo definen antes de que se hable de plata.

   Viv√≠a suelta dentro de Pedido, entreverada con el precio, el carrito, el
   historial y el mini-tablero ‚Äî mil l√≠neas donde no se sab√≠a d√≥nde empezaba
   una cosa y terminaba la otra. Ahora es una pieza sola que no sabe nada del
   resto: recibe lo que debe mostrar y avisa lo que el vendedor toc√≥. No
   guarda estado, no calcula precios, no valida nada y no habla con la base.
   Todas esas decisiones siguen donde estaban, en Pedido.

   LA CASCADA ES DELIBERADA Y NO SE TOCA: un campo a la vez, cliente ‚Üí
   proveedor ‚Üí producto. El vendedor de campo trabaja parado, con una mano y
   a veces bajo el sol. Dos campos juntos son dos oportunidades de errar.

   Tres reglas que se le√≠an repetidas en cada condici√≥n y ahora tienen nombre:
     ¬∑ `eligiendo`  mientras no haya producto, ni cliente bloqueado, ni la
                    factura anterior abierta, se sigue eligiendo;
     ¬∑ con producto elegido la cabecera se repliega: el cliente pasa a ser el
                    t√≠tulo y los buscadores desaparecen, para dejarle la
                    pantalla al precio;
     ¬∑ con un pedido en curso no se cambia de cliente ni de proveedor, y se
                    explica por qu√© en vez de solo bloquear.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */

    {/* Ya elegidos cliente y producto: el cliente es el t√≠tulo, sin buscador */}

            <div className="pf-info">

              <div className="pf-pres">{p.unidad}</div>
            </div>
            <span className="pf-ar">‚Ä∫</span>
          </div>),
        picked:p=>(<div className="p1">{p.nombre}</div>)
      }}/></div>}
  </>);
}

/* ‚ïê‚ïê‚ïê AVISO DE CLIENTE BLOQUEADO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê

function Pedido({toast, prodInicial, onConsumir, go, irGuardado, onGuardarPedido}){
  const [cli,setCli]=useState(null);
  const [prov,setProv]=useState(null);
  const [prod,setProd]=useState(null);
  const [ubicPed,setUbicPed]=useState(null);
  const [retiroBodegaPed,setRetiroBodegaPed]=useState(false);
  const [asumeFletePed,setAsumeFletePed]=useState("freelance");
  const [asumeEstibadaPed,setAsumeEstibadaPed]=useState("freelance");
  const [ubicMap,setUbicMap]=useState({});
  /* el bot√≥n atr√°s cierra lo abierto dentro del m√≥dulo antes de salir */
  // Origen del producto elegido: "favorito" (recompra) o "nuevo" (campo Producto nuevo ‚Üí arranca limpio)
  const origenProd = React.useRef(null);
  const [tipo,setTipo]=useState("P1"); // cr√©dito por defecto (90% de las ventas)
  const [cant,setCant]=useState(50);
  const [dashAbierto,setDashAbierto]=useState(null);  // tarjeta del panel desplegada
  const [histAbierto,setHistAbierto]=useState(false); // historial 3 meses colapsado por defecto
  const [verFact,setVerFact]=useState(false);
  const [guardadoOk,setGuardadoOk]=useState(null);   // ventana tras guardar: avisar al cliente        // desplegar la √∫ltima factura del cliente
  const [favAbierto,setFavAbierto]=useState(false);   // panel de productos que ya compr√≥ el cliente
  const [precio,setPrecio]=useState("");
  const [gratis,setGratis]=useState("");        // unidades gratis (P3)
  const [condP3,setCondP3]=useState("contado"); // P3: piso contado o cr√©dito
  const [promoF,setPromoF]=useState(null);       // promo elegida del freelance (P4)
  const [promoP,setPromoP]=useState(null);       // promo elegida del proveedor (P6)
  const [comProp,setComProp]=useState("");       // comisi√≥n propuesta (P5)
  const [motivo,setMotivo]=useState("");
  const [carrito,setCarrito]=useState([]);        // productos del pedido (carrito)
  const [verCarrito,setVerCarrito]=useState(false); // ventana tras guardar
  useModal(verCarrito, React.useCallback(()=>setVerCarrito(false),[]));
  useModal(!!guardadoOk, React.useCallback(()=>setGuardadoOk(null),[]));  // el bot√≥n atr√°s la cierra
  const [codigo,setCodigo]=useState("");           // c√≥digo de desbloqueo ingresado
  const [desbloqueado,setDesbloqueado]=useState(false);

  /* ‚îÄ‚îÄ b170 ¬∑ con sesi√≥n, piladoras, cat√°logo y clientes vienen de la base ‚îÄ‚îÄ
     Si la base no responde o no hay sesi√≥n, se queda con la demostraci√≥n de
     siempre: la app nunca se queda sin cat√°logo en la mitad del campo. */
  const [vivoPed,setVivoPed]=useState(null);
  React.useEffect(()=>{
    if(!window.SB || !window.SB.auth) return;
    let activo=true;
    (async ()=>{
      try{
        const { data:s } = await window.SB.auth.getSession();
        if(!s || !s.session) return;
        /* FA-0011 ¬∑ las ofertas se traen CRUDAS de `ofertas_piladora`, no de la vista
           `v_ofertas_vigentes`: esa vista corta con CURRENT_DATE, que es el d√≠a del
           servidor, no el del tel√©fono. La vigencia se filtra en construirCatalogoPedido
           con la fecha local. Y `precios` ya no se consulta: el precio es el de la oferta. */
        const [{ data:provs }, { data:ofertas }, { data:prods }, { data:clis }, { data:ubics }, { data:promos }, { data:tramos }] = await Promise.all([
          window.SB.from("proveedores").select("prov_cod,nombre").eq("es_demo",false).order("nombre"),
          window.SB.from("ofertas_piladora")
            .select("prod_id,pres_cod,presentacion,equiv_qq,prov_cod,costo,costo_contado,precio_contado,precio_credito,activo,vigente_desde,vigente_hasta")
            .limit(4000),
          window.SB.from("productos").select("prod_id,nombre,marca,linea,foto").eq("estado","activo").limit(500),
          window.SB.from("clientes").select("cli_id,nombre,razon_social").eq("es_demo",false).eq("activo",true).eq("bloqueado",false).order("nombre").limit(1000),
          window.SB.from("ubicaciones_cliente").select("ubic_id,cli_id,nombre,principal,ciudad,direccion").eq("activo",true).limit(3000),
          /* PROMO-04 ¬∑ las promociones se traen CRUDAS y se filtran en
             construirCatalogoPedido: qui√©n entra y qui√©n no lo decide un solo
             sitio, con la fecha del tel√©fono. */
          window.SB.from("promociones")
            .select("promo_id,nombre,detalle,modalidad,origen,prov_cod,prod_id,pres_cod,base,estado,vigente_desde,vigente_hasta,es_demo")
            .eq("es_demo",false).limit(2000),
          window.SB.from("promocion_tramos").select("promo_id,modalidad,desde_cant,gratis_cant")
            .eq("es_demo",false).limit(4000),
        ]);
        if(!activo || !provs || !provs.length || !ofertas || !ofertas.length) return;
        const cat=construirCatalogoPedido(provs, ofertas, prods, [], { promos, tramos });
        if(!cat.pres.length) return;
        (clis||[]).forEach(c=>{ CLI_ID_DE[c.nombre]=c.cli_id; if(c.razon_social && c.razon_social!==c.nombre) REFERENCIALES[c.nombre]=[c.razon_social]; });
        cat.clis = (clis||[]).map(c=>c.nombre);
        setVivoPed(cat);
        const mapU={}; (ubics||[]).forEach(u=>{ (mapU[u.cli_id]=mapU[u.cli_id]||[]).push(u); }); setUbicMap(mapU);
      }catch(e){}
    })();
    return ()=>{ activo=false; };
  },[]);
  const PROVS_PED = vivoPed ? vivoPed.provs : PROVEEDORES;
  const PRES_PED  = vivoPed ? vivoPed.pres  : PRESENTACIONES;
  const CLIS_PED  = (vivoPed && vivoPed.clis && vivoPed.clis.length) ? vivoPed.clis : CLIENTES;

  // bloqueo autom√°tico del cliente
  const motivos = cli ? motivosBloqueo(cli) : [];
  const bloqueado = motivos.length>0 && !desbloqueado;

  // precarga desde Productos: fija proveedor y producto, deja al vendedor elegir cliente y precio
  React.useEffect(()=>{
    if(prodInicial){
      const pv=PROVS_PED.find(x=>x.id===prodInicial.provId);
      if(pv) setProv(pv);
      setProd(prodInicial);
      if(onConsumir) onConsumir();
    }
  },[prodInicial]);

  const reset=()=>{setTipo("P1");setPrecio("");setGratis("");setCondP3("contado");setPromoF(null);setPromoP(null);setComProp("");setMotivo("");};
  // agregar el producto actual al carrito y limpiar para el siguiente
  const resetProducto=()=>{setProd(null);setCant(50);reset();};
  // cerrar pedido completo: vuelve de cero
  const cerrarPedido=()=>{setCli(null);setProv(null);setUbicPed(null);setRetiroBodegaPed(false);setCarrito([]);setVerCarrito(false);setCodigo("");setDesbloqueado(false);resetProducto();};
  React.useEffect(()=>{
    setRetiroBodegaPed(false);
    const lista = ubicMap[CLI_ID_DE[cli]] || [];
    if(lista.length===0){ setUbicPed(null); return; }
    if(lista.length===1){ setUbicPed(lista[0]); return; }
    setUbicPed(lista.find(u=>u.principal) || null);
  },[cli, ubicMap]);
  /* ‚àí / + de cantidad: un toque = 50; mantener aplastado = sube o baja r√°pido */
  const menosCant = usarRepetir(()=>setCant(c=>Math.max(1,(parseInt(c)||0)-50)));
  const masCant   = usarRepetir(()=>setCant(c=>(parseInt(c)||0)+50));

  /* Bot√≥n atr√°s inteligente: retrocede paso a paso dentro del m√≥dulo antes de salir.
     Va aqu√≠, despu√©s de declarar los estados y funciones que consulta. */
  useRetroceso(()=>{
    if(guardadoOk){ setGuardadoOk(null); return true; }   // cierra el aviso de "pedido guardado"
    if(favAbierto){ setFavAbierto(false); return true; }
    if(histAbierto){ setHistAbierto(false); return true; }
    if(dashAbierto){ setDashAbierto(null); return true; }
    if(verCarrito){ setVerCarrito(false); return true; }   // cierra el "Pedido en curso"
    if(verFact){ setVerFact(false); return true; }         // cierra el detalle de la √∫ltima factura
    if(prod){ resetProducto(); return true; }              // quita el producto, vuelve a elegir
    /* con carrito en curso NO se pierde el pedido: se avisa y no se sale */
    if(carrito.length>0){ toast("Tienes un pedido en curso. Ci√©rralo o vac√≠alo para salir."); return true; }
    if(prov){ setProv(null); setProd(null); reset(); return true; }  // quita proveedor
    if(cli){ cerrarPedido(); return true; }                          // quita cliente
    return false;                                          // nada que retroceder: sale del m√≥dulo
  });

  const totalComisionCarrito = carrito.reduce((s,it)=>s+it.comisionTotal,0);
  // Valor total de la factura del pedido (precio x cantidad de cada item)
  const totalFacturaCarrito = Math.round(carrito.reduce((s,it)=>s+(it.precio*it.cant),0)*100)/100;
  // Total en quintales: con la equivalencia REAL de la oferta, la misma que se graba
  const totalQuintalesCarrito = totalQuintalesDeCarrito(carrito);
  const productosDelProv = prov ? PRES_PED.filter(p=>p.provId===prov.id) : [];
  // Productos que ESE cliente ya compr√≥ antes (con este proveedor), seg√∫n su historial.
  // Se ocultan los que ya est√°n en el pedido para no elegirlos dos veces.
  const enCarrito = new Set(carrito.map(it=>it.prod?it.prod.id:it.prodId));
  const favoritos = (cli && prov) ? productosDelProv
    .map(p=>{ const h=HISTORIAL_3M[(cli.nombre||cli)+"|"+p.id]; return h&&h.length>0 ? {prod:p, ultima:h[0], nCompras:h.length} : null; })
    .filter(Boolean)
    .filter(f=>!enCarrito.has(f.prod.id))
    .sort((a,b)=>b.nCompras-a.nCompras) : [];

  // base seg√∫n el tipo de precio elegido
  const base = !prod ? 0
    : tipo==="P1" ? prod.baseCredito
    : tipo==="P2" ? prod.baseContado
    : tipo==="P3" ? (condP3==="credito"?prod.baseCredito:prod.baseContado) // piso seg√∫n condici√≥n
    : tipo==="P4" ? (promoF?promoF.base:0)
    : tipo==="P6" ? (promoP?promoP.base:0)       // P6: base de la promo del proveedor
    : 0;                                         // P5: no hay base, se propone
  const precioNum = parseFloat(precio)||0;
  /* P4 y P6 sin promoci√≥n elegida: no hay base, as√≠ que no se calcula comisi√≥n (evita tomar el precio entero) */
  const sinBaseP4 = tipo==="P4" && !promoF;
  const sinBaseP6 = tipo==="P6" && !promoP;
  const sinBasePromo = sinBaseP4 || sinBaseP6;
  const dif = (prod && precio!=="" && !sinBasePromo) ? Math.round((precioNum-base)*100)/100 : 0;
  const bajoBase = tipo!=="P5" && prod && precio!=="" && precioNum < base;
  const comPropNum = parseFloat(comProp)||0;

  const esP5 = tipo==="P5";
  const esP6 = tipo==="P6";
  /* b149 ¬∑ unidades gratis: en P3 las arma el vendedor; en P4/P6 son PROPORCIONALES
     a la cantidad seg√∫n la promo (cant/minimo √ó gratis, con decimales, sin tope) */
  const gratisNum = tipo==="P3" ? (parseInt(gratis)||0)
    : (tipo==="P4" && promoF) ? gratisDePromo(promoF, Math.max(0,parseInt(cant)||0))
    : (esP6 && promoP) ? gratisDePromo(promoP, Math.max(0,parseInt(cant)||0)) : 0;
  /* QUI√âN PAGA LA PROMOCI√ìN:
     P3 la paga el VENDEDOR ‚Üí el costo de lo gratis se descuenta de su comisi√≥n.
     P4 la paga el FREELANCE ‚Üí sale de SU margen; la comisi√≥n del vendedor no baja.
     P6 la paga el PROVEEDOR ‚Üí NO se descuenta nada; el vendedor cobra comisi√≥n completa.
     En todos: la comisi√≥n se calcula sobre los qq PAGADOS, nunca sobre los entregados. */
  const costoGratis = tipo==="P3" ? Math.round(base*gratisNum*100)/100 : 0;
  const cantN = Math.max(0, parseInt(cant)||0);   // cantidad como n√∫mero seguro (cant puede ser texto mientras se escribe)
  const comisionUnidad = esP5 ? comPropNum : dif;
  const comisionBruta = Math.round(comisionUnidad*cantN*100)/100;
  const comisionTotal = Math.round((comisionBruta - costoGratis)*100)/100;
  const comisionPromedio = cantN>0 ? Math.round((comisionTotal/cantN)*100)/100 : 0;

  // ‚îÄ‚îÄ Control de cupo de cr√©dito ‚îÄ‚îÄ
  const fichaCli = cli ? FICHA_CLIENTE[cli] : null;
  const esCredito = tipo==="P1" || (tipo==="P3" && condP3==="credito"); // P1=cr√©dito; contado (P2) no consume cupo
  const cupoTotal = fichaCli ? (fichaCli.cupo||0) : 0;
  const deudaActual = fichaCli ? (fichaCli.debe||0) : 0;
  const cupoDisponible = Math.round((cupoTotal - deudaActual)*100)/100;
  // Cr√©dito ya comprometido en el carrito (√≠tems a cr√©dito)
  const creditoEnCarrito = carrito.filter(it=>it.esCredito).reduce((s,it)=>s+(it.precio*it.cant),0);
  const montoLinea = esCredito ? Math.round(precioNum*cantN*100)/100 : 0;
  const expuestoTotal = Math.round((deudaActual + creditoEnCarrito + montoLinea)*100)/100;
  const excedeCupo = esCredito && cupoTotal>0 && expuestoTotal > cupoTotal;
  const excesoMonto = excedeCupo ? Math.round((expuestoTotal - cupoTotal)*100)/100 : 0;

  const requiereAutorizacion = esP5 || excedeCupo;   // P5 o exceder cupo ‚Üí requiere autorizaci√≥n del freelance

  /* b149 ¬∑ promociones VIGENTES del producto (vencidas o inactivas no se listan) */

  /* b149 ¬∑ bajo el m√≠nimo de la promo: se BLOQUEA el guardado */
  const promoActiva = tipo==="P4" ? promoF : esP6 ? promoP : null;
  const bajoMinimo = !!(promoActiva && promoActiva.minimo && cantN < promoActiva.minimo);

  // validaciones por tipo

    motivoAuth: excedeCupo ? "Excede cupo de cr√©dito" : (esP5 ? "Precio especial" : null)
  });
  const histo = (cli && prod) ? HISTORIAL[cli+"|"+prod.id] : null;
  // Historial extendido 3 meses (igualado con app Freelance)
  const histo3m = (cli && prod) ? (HISTORIAL_3M[(cli.nombre||cli)+"|"+prod.id]||[]) : [];
  const ultimaCompra = histo3m.length>0 ? histo3m[0] : null;
  // Producto nuevo para este cliente: hay producto elegido pero sin compras previas
  const esProductoNuevo = !!(cli && prod && !ultimaCompra);
  // Al ELEGIR un producto: fija el tipo, el precio y la cantidad de la √∫ltima compra (o base/50 si es nuevo)
  const prodPrevio = React.useRef(null);
  const tipoPrevio = React.useRef(tipo);
  /* Qu√© producto se acaba de cargar desde una l√≠nea del pedido, al tocar
     "Editar". Sin esta marca, el efecto de abajo pisaba la cantidad y el
     precio que el vendedor ya hab√≠a escrito y los dejaba en la base:
     escrib√≠a 77 qq a $65, tocaba Editar y le aparec√≠an 50 qq al precio base.
     Si no se daba cuenta y volv√≠a a agregar, su comisi√≥n se iba a cero. */
  const lineaCargada = React.useRef(null);
  React.useEffect(()=>{
    if(prod && prod.id !== prodPrevio.current){
      prodPrevio.current = prod.id;
      /* Viene de "Editar" una l√≠nea: la cantidad, el tipo y el precio ya los
         puso el bot√≥n con lo que el vendedor hab√≠a escrito. No se tocan. */
      if(lineaCargada.current === prod.id){ lineaCargada.current = null; return; }
      // Producto elegido desde "Producto nuevo": SIEMPRE arranca limpio (P1, cantidad 0, precio base)
      if(origenProd.current === "nuevo"){
        setTipo("P1");
        tipoPrevio.current = "P1";
        setCant(50);
        if(prod.baseCredito>0) setPrecio(prod.baseCredito.toFixed(2));
      } else if(ultimaCompra){
        const t = (ultimaCompra.tipo && TIPOS_PRECIO.some(x=>x.id===ultimaCompra.tipo)) ? ultimaCompra.tipo : tipo;
        setTipo(t);
        tipoPrevio.current = t;   // sincroniza para que el PRIMER cambio manual s√≠ se detecte
        setPrecio(String(ultimaCompra.precio));
        if(ultimaCompra.cant) setCant(ultimaCompra.cant);
      } else {
        // Sin historial y sin origen definido: tambi√©n limpio (P1, cantidad 0, precio base)
        setTipo("P1");
        tipoPrevio.current = "P1";
        setCant(50);
        if(prod.baseCredito>0) setPrecio(prod.baseCredito.toFixed(2));
      }
    }
    if(!prod) prodPrevio.current = null;
  }, [prod]);
  // Al CAMBIAR el tipo: si vuelve al tipo de la √∫ltima compra ‚Üí √∫ltimo precio; si es otro ‚Üí base de ese tipo
  React.useEffect(()=>{
    if(prod && tipo !== tipoPrevio.current){
      tipoPrevio.current = tipo;
      if(esP5){ setCant(0); setPrecio(""); return; }
      if(ultimaCompra && tipo === ultimaCompra.tipo){
        // volvi√≥ al tipo de la √∫ltima venta ‚Üí precio y cantidad tal cual esa venta
        setPrecio(String(ultimaCompra.precio));
        setCant(ultimaCompra.cant || 0);
      } else {

        setCant(50);
        if(base>0) setPrecio(base.toFixed(2));

  }, [tipo]);
  /* b149 ¬∑ preselecci√≥n: si hay UNA sola promo vigente, viene elegida (P4 y P6);
     con varias, se obliga a elegir conscientemente. VA DESPU√âS del efecto de
     cambio de tipo (el orden de declaraci√≥n manda): as√≠ su cantidad m√≠nima

  React.useEffect(()=>{
    if(tipo==="P4" && prod && !promoF && promosFVig.length===1){
      const pm=promosFVig[0]; setPromoF(pm); setPrecio("");
      if(pm.minimo) setCant(c=>((parseInt(c)||0)<pm.minimo)?pm.minimo:c);
    }

    }
  },[tipo,prod]);
  const imgProd = prod ? (EMOJI_LINEA[prod.linea]||"üì¶") : null;

  }

  return (<>

    />
    {cli && !bloqueado && !verFact && !prod && (
      <div style={{marginBottom:12}}>

        <div style={{display:"flex",gap:8}}>
          <button type="button" onClick={()=>setRetiroBodegaPed(false)}
            style={{flex:1,minWidth:0,textAlign:"center",padding:"9px 8px",borderRadius:11,cursor:"pointer",fontSize:12.5,fontWeight:700,border:`1.5px solid ${!retiroBodegaPed?"#2E7D52":"#d8ddd7"}`,background:!retiroBodegaPed?"#E7F3EC":"#fff",color:"#1E4D3A"}}>üè† Entrega a domicilio</button>
          <button type="button" onClick={()=>{setRetiroBodegaPed(true);setUbicPed(null);}}
            style={{flex:1,minWidth:0,textAlign:"center",padding:"9px 8px",borderRadius:11,cursor:"pointer",fontSize:12.5,fontWeight:700,border:`1.5px solid ${retiroBodegaPed?"#B45309":"#d8ddd7"}`,background:retiroBodegaPed?"#FFF7ED":"#fff",color:"#9a3412"}}>üè≠ Retira de Piladora</button>
        </div>
        {!retiroBodegaPed && (ubicMap[CLI_ID_DE[cli]]||[]).length>1 && (
          <div style={{marginTop:8}}>

            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {(ubicMap[CLI_ID_DE[cli]]||[]).map(u=>{

              </span>

      const repetir=()=>{

    {/* mini-dashboard de entrada: qu√© hay pendiente antes de tomar el pedido.

    {!cli && carrito.length===0 && (()=>{

      const porEntregar=PEDIDOS_INI.filter(p=>["Facturado","Despachado","Enviado al proveedor","En ruta"].includes(p.estado));

      const TARJETAS=[

/* ‚ïê‚ïê‚ïê TABLERO DEL SALDO DEL COBRO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   SPRINT-08 ¬∑ Lo que el vendedor mira mientras arma el cobro: cu√°nto se va a
   cobrar, cu√°nto lleva cubierto y cu√°nto falta. Es la pieza que le dice si
   el cobro cuadra, y por eso es la que no se puede equivocar.

   SOLO PINTA. No calcula: recibe el total y el saldo ya calculados en Cobros,
   donde vive la plata. Ni una f√≥rmula cruz√≥ para ac√°.

   Tres estados y tres colores, deliberados: falta (√°mbar), cuadra (verde),
   se pas√≥ (rojo). El vendedor est√° de pie frente al cliente contando
   billetes; tiene que saber de un vistazo si ya est√°, sin leer.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
function TableroSaldoCobro({ total, restante, money }) {
  const cubierto = total - restante;
  const pct = total > 0 ? Math.round(cubierto / total * 100) : 0;
  return (
    <div className="montobox" style={{marginBottom:14,padding:"14px 16px",
      border: restante===0 && total>0 ? "1.5px solid var(--ok)" : undefined}}>

        <span style={{fontWeight:800,fontSize:14,letterSpacing:".02em"}}>SALDO</span>
        <b className="num" style={{fontSize:24,fontWeight:800,
          color: restante>0?"var(--maize-deep)":restante<0?"var(--clay)":"var(--ok)"}}>
          {(restante<0?"-":"")+money(Math.abs(restante))}</b>
      </div>
      <div style={{marginTop:10,height:10,background:"#EFEBE0",borderRadius:6,overflow:"hidden",
        boxShadow:"inset 1px 1px 3px rgba(21,57,43,.08)"}}>
        <div style={{width:Math.min(100,total>0?pct:0)+"%",height:"100%",borderRadius:6,
          transition:"width .45s ease, background-color .45s ease",
          background: restante<0?"var(--clay)":restante===0?"var(--ok)":"var(--maize-deep)"}}></div>
      </div>
      <div className="meta" style={{marginTop:4,textAlign:"right",fontSize:11}}>
        {total>0?Math.min(999,pct):0}% cubierto</div>
      {restante===0 && total>0 && (
        <div style={{marginTop:10,background:"var(--ok)",color:"#fff",borderRadius:12,padding:"11px 12px",
          textAlign:"center",fontWeight:800,fontSize:14.5,letterSpacing:".03em",
          boxShadow:"0 3px 10px rgba(46,125,82,.35)"}}>
          ‚úì PAGO COMPLETO ‚Äî listo para reportar
        </div>
      )}
      {restante<0 && <div className="meta" style={{color:"var(--clay)",marginTop:5,textAlign:"right"}}>Las formas de pago superan el total</div>}
    </div>
  );
}

/* ‚ïê‚ïê B√ìVEDA DE CHEQUES ‚ïê‚ïê

   El traspaso exige doble confirmaci√≥n: quien entrega genera un c√≥digo de un solo uso,

];

const TRASPASOS_PEND = [];

/* ‚ïê‚ïê COMPROBANTE DE ANULACI√ìN (PNG, A6) ‚ïê‚ïê
   Se emite al anular un recibo ya entregado al cliente: es la constancia de que
   ese comprobante qued√≥ sin efecto. Mismo lenguaje visual del recibo pero en ROJO,
   y dice con claridad QU√â recibo anula y cu√°nto vuelve a deber. */
function imgAnulacion(d){
  const W=826, P=40;
  const money2=n=>"$"+Number(n||0).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
  const F=(px,peso)=>`${peso||600} ${px}px Inter, system-ui, -apple-system, sans-serif`;
  const ROJO="#9A2A2A", ROJO2="#C2603A", ROJOSUAVE="#FBEDE8", TINTA="#1A2733",
        GRIS="#6B7A88", LINEA="#E3E9EF";

  const facs=(d.facturas||[]);
  let H = 620 + facs.length*72;
  H = Math.max(1165, H+90);

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#F8F4F2"; x.fillRect(0,0,W,H);
  x.fillStyle="#fff"; redonda(x,P,P,W-P*2,H-P*2,24); x.fill();

  const IX=P+38, IW=W-P*2-76;
  let y=P+64;

  /* cabecera */
  x.textAlign="center";
  x.fillStyle=TINTA; x.font=F(25,700); x.fillText(recorta(x,String(d.prov||"‚Äî"),IW), W/2, y);
  y+=54; x.fillStyle=ROJO; x.font=F(40,800); x.fillText("COMPROBANTE ANULADO", W/2, y);
  y+=54; x.fillStyle=ROJO; x.font=F(58,800); x.fillText(money2(d.monto), W/2, y);
  y+=34; x.fillStyle=GRIS; x.font=F(16,500);
  x.fillText("valor que queda sin efecto", W/2, y);
  y+=42; const et="Sin validez";
  x.font=F(17,700); const aw=x.measureText(et).width+40;
  x.fillStyle=ROJOSUAVE; redonda(x,(W-aw)/2,y-24,aw,38,19); x.fill();
  x.fillStyle=ROJO; x.fillText(et, W/2, y+2);
  x.textAlign="left";

  y+=34; separa(y); y+=40;

  /* qu√© recibo se anula */
  x.fillStyle=ROJOSUAVE; redonda(x,IX,y-26,IW,150,16); x.fill();
  x.fillStyle=ROJO2; x.font=F(15,700); x.fillText("ANULA EL COMPROBANTE", IX+24, y+2);
  x.fillStyle=ROJO; x.font=F(34,800);

  x.fillStyle=ROJO2; x.font=F(18,500);
  x.fillText(`Emitido el ${d.fechaRecibo||"‚Äî"}${d.horaRecibo?" ¬∑ "+d.horaRecibo:""}`, IX+24, y+82);

  y+=168;

  /* cliente */

  x.fillStyle=TINTA; x.font=F(26,800);
  x.fillText(recorta(x,String(d.cli||"‚Äî"),IW), IX, y); y+=40;
  if(d.ruc) fila("RUC", rucCorto(d.ruc));

  /* motivo */
  separa(y-10); sec("MOTIVO DE LA ANULACI√ìN");
  x.fillStyle=TINTA; x.font=F(19,700);
  x.fillText(recorta(x,String(d.motivo||"‚Äî"),IW), IX, y); y+=34;
  if(d.comentario){
    x.fillStyle=GRIS; x.font=F(16,500);
    envuelve(String(d.comentario), IW).forEach(l=>{ x.fillText(l, IX, y); y+=28; });
  }
  y+=8;

  /* facturas que vuelven a quedar pendientes */
  if(facs.length){
    separa(y-10); sec("FACTURAS QUE VUELVEN A QUEDAR PENDIENTES");
    facs.forEach(f=>{
      x.fillStyle=TINTA; x.font=F(18,700);
      x.fillText(recorta(x,String(f.factura),IW-160), IX, y);

  filaFuerte("SALDO ACTUAL", money2(d.saldoDespues||0), ROJO);

  /* pie */
  y+=10; separa(y-16);
  x.fillStyle=GRIS; x.font=F(15,500);

  if(d.au){ x.fillStyle=ROJO2; x.font=F(15,700);
    x.fillText(`Auditor√≠a ${d.au}`, IX, y+70); }

  return c;

  function sec(t){ y+=18; x.fillStyle=ROJO2; x.font=F(16,800); x.fillText(t, IX, y); y+=36; }
  function fila(izq, der, soloIzq){
    x.fillStyle=TINTA; x.font=F(18,500);
    const aw2 = der ? x.measureText(String(der)).width+20 : 0;
    x.fillText(recorta(x, String(izq), IW-aw2), IX, y);
    if(der){ x.textAlign="right"; x.font=F(18,700); x.fillText(String(der), IX+IW, y); x.textAlign="left"; }
    y+= soloIzq ? 30 : 36;
  }
  function filaFuerte(izq, der, color){
    x.fillStyle=TINTA; x.font=F(19,800); x.fillText(izq, IX, y);
    x.fillStyle=color; x.textAlign="right"; x.font=F(24,800);
    x.fillText(der, IX+IW, y); x.textAlign="left"; x.fillStyle=TINTA;

  function separa(yy){
    x.strokeStyle=LINEA; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(IX,yy); x.lineTo(IX+IW,yy); x.stroke();
  }
  function envuelve(t, max){
    const pal=String(t).split(/\s+/), out=[]; let ln="";
    pal.forEach(p=>{ const pr=ln?ln+" "+p:p;
      if(x.measureText(pr).width>max){ if(ln) out.push(ln); ln=p; } else ln=pr; });
    if(ln) out.push(ln);
    return out.slice(0,3);
  }
  function rucCorto(r){ const s=String(r||""); return s.length>7 ? s.slice(0,4)+"‚Ä¢‚Ä¢‚Ä¢‚Ä¢‚Ä¢"+s.slice(-3) : s; }
  function redonda(ctx,a,b,w,h,r){
    ctx.beginPath();
    ctx.moveTo(a+r,b); ctx.lineTo(a+w-r,b); ctx.quadraticCurveTo(a+w,b,a+w,b+r);
    ctx.lineTo(a+w,b+h-r); ctx.quadraticCurveTo(a+w,b+h,a+w-r,b+h);
    ctx.lineTo(a+r,b+h); ctx.quadraticCurveTo(a,b+h,a,b+h-r);
    ctx.lineTo(a,b+r); ctx.quadraticCurveTo(a,b,a+r,b); ctx.closePath();
  }
  function recorta(ctx,t,max){
    t=String(t);
    if(ctx.measureText(t).width<=max) return t;
    let s=t;
    while(s.length>3 && ctx.measureText(s+"‚Ä¶").width>max) s=s.slice(0,-1);
    return s+"‚Ä¶";
  }
  function fechaHoy(){
    const n=new Date(), M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${String(n.getDate()).padStart(2,"0")} ${M[n.getMonth()]} ${n.getFullYear()}`;
  }
}

/* Env√≠a la constancia de anulaci√≥n al cliente por WhatsApp (mensaje + imagen) */
async function enviarAnulacion(d, toast){
  const texto = `Estimado/a ${d.cli}:\n\n`
    + `Le informamos que el comprobante ${d.nRecibo} por ${money(d.monto)}, `
    + `emitido el ${d.fechaRecibo||"‚Äî"}, ha sido ANULADO y queda sin validez.\n\n`
    + `Motivo: ${d.motivo}${d.comentario?" ¬∑ "+d.comentario:""}\n\n`
    + `Su saldo actual es ${money(d.saldoDespues||0)}.\n\n`
    + `Si usted conserva una copia del comprobante anterior, por favor consid√©rela sin efecto. `
    + `Ante cualquier duda comun√≠quese con su asesor comercial. üåæ`;
  try{
    const lienzo = imgAnulacion(d);
    const blob = await new Promise(r=>lienzo.toBlob(r, "image/png", 0.95));
    const nombre = `Anulacion_${String(d.nRecibo||"recibo").replace(/[^\w-]+/g,"_")}.png`;
    const archivo = new File([blob], nombre, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:"Comprobante anulado", text:texto});
      return true;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=nombre; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast && toast("Constancia descargada ¬∑ comp√°rtela con el cliente");
    return true;
  }catch(e){ toast && toast("No se pudo generar la constancia"); return false; }
}
