<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FREELANCE ¬∑ App del Freelance</title>
<script src="./lib/react-18.3.1.min.js"></script>
<script src="./lib/react-dom-18.3.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#15392B; --field-700:#1E4D3A; --maize:#F2A900; --maize-deep:#BF7A00;
    --paper:#F7F5EF; --card:#FFFFFF; --ink:#18211C; --muted:#6F7A6F;
    --line:#E7E1D3; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#EEF3EF; --field-soft-line:#CFE0D5; --field-soft-txt:#1E4D3A;
    --shadow:0 1px 2px rgba(21,57,43,.06),0 8px 24px rgba(21,57,43,.06);
    --fs:1; /* escala de fuente (Ajustes: normal=1, grande=1.12) */
  }
  /* ‚ïê‚ïê‚ïê TEMAS (Ajustes) ‚ïê‚ïê‚ïê */
  /* Sol ¬∑ alto contraste para leer bajo sol directo */
  [data-tema="sol"]{
    --field:#0B2A1E; --field-700:#123B2A; --maize:#F59E00; --maize-deep:#B36B00;
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0F0C; --muted:#4A554C;
    --line:#D6D2C4; --clay:#A34A28; --ok:#1F6B41;
    --field-soft:#EAF1EC; --field-soft-line:#C3D6C9; --field-soft-txt:#0B2A1E;
    --shadow:0 1px 2px rgba(0,0,0,.10),0 6px 18px rgba(0,0,0,.08);
  }
  /* Noche ¬∑ oscuro, para madrugada y poca luz */
  [data-tema="noche"]{
    --field:#0E1A14; --field-700:#16261D; --maize:#E9B44C; --maize-deep:#C08F2E;
    --paper:#111A15; --card:#182420; --ink:#E6EDE8; --muted:#93A399;
    --line:#26332C; --clay:#D08160; --ok:#57A773;
    --field-soft:#1B2A23; --field-soft-line:#2C3D34; --field-soft-txt:#DCE8E0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  /* Grafito ¬∑ neutro y serio, para reuniones */
  [data-tema="grafito"]{
    --field:#22262A; --field-700:#2F353A; --maize:#D9A441; --maize-deep:#AD7F2A;
    --paper:#F4F5F6; --card:#FFFFFF; --ink:#1A1E21; --muted:#6C757D;
    --line:#DFE3E6; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#EDEFF1; --field-soft-line:#D3D8DC; --field-soft-txt:#22262A;
    --shadow:0 1px 2px rgba(20,25,30,.07),0 8px 22px rgba(20,25,30,.07);
  }
  /* Arena ¬∑ c√°lido, menos fatiga en uso prolongado */
  [data-tema="arena"]{
    --field:#4A3B22; --field-700:#5E4B2C; --maize:#E0A82E; --maize-deep:#B4801C;
    --paper:#FAF4E8; --card:#FFFCF6; --ink:#2A2317; --muted:#7A6E58;
    --line:#E8DCC4; --clay:#B26A3C; --ok:#5C7C48;
    --field-soft:#F3EADA; --field-soft-line:#DFCFB0; --field-soft-txt:#4A3B22;
    --shadow:0 1px 2px rgba(74,59,34,.07),0 8px 22px rgba(74,59,34,.08);
  }
  /* Brote ¬∑ verde claro y suave, descansado */
  [data-tema="brote"]{
    --field:#2F6B4F; --field-700:#3D8461; --maize:#F7CB72; --maize-deep:#B87D0C;
    --paper:#F4F8F5; --card:#FFFFFF; --ink:#17251E; --muted:#66786D;
    --line:#DCE8E0; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E9F3ED; --field-soft-line:#C6DED1; --field-soft-txt:#2F6B4F;
    --shadow:0 1px 2px rgba(47,107,79,.06),0 8px 22px rgba(47,107,79,.07);
  }
  /* R√≠o ¬∑ azul suave, tranquilo */
  [data-tema="rio"]{
    --field:#1F4E6B; --field-700:#2C6688; --maize:#EBB247; --maize-deep:#B2761A;
    --paper:#F3F7FA; --card:#FFFFFF; --ink:#14212A; --muted:#647682;
    --line:#D9E4EC; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E8F1F6; --field-soft-line:#C4DAE7; --field-soft-txt:#1F4E6B;
    --shadow:0 1px 2px rgba(31,78,107,.06),0 8px 22px rgba(31,78,107,.07);
  }
  /* Sol y Grafito: fondo de tarjetas blanco puro, texto bien oscuro */
  [data-tema="sol"] .card{border-color:#DAD6C8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* Blindaje anti-desborde: en filas flex, los campos ceden espacio en vez de empujar botones fuera */
  input,select,textarea{min-width:0;max-width:100%}
  button{max-width:100%}
  html,body{height:100%;overscroll-behavior-y:contain}   /* apaga el "recargar" de Chrome: el arrastre lo maneja la app */
  body{background:var(--field);font-family:Inter,system-ui,sans-serif;color:var(--ink);
    font-size:calc(16px * var(--fs))}
  #root{height:100%}
  .num{font-family:'Space Grotesk',sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:16px}
  /* Los di√°logos nativos (calendario y reloj de Android) heredan el tama√±o del campo.
     Si la app est√° en "texto grande", el di√°logo crece y corta el bot√≥n "Establecer".
     Se fijan a tama√±o normal para que el di√°logo del sistema siempre quepa. */
  input[type="date"],input[type="time"],input[type="datetime-local"],input[type="month"]{
    font-size:16px;line-height:1.2}
  /* phone shell ‚Äî de borde a borde en el tel√©fono, centrado en pantallas anchas */
  .shell{width:100%;max-width:100%;margin:0 auto;height:100dvh;background:var(--paper);
    position:relative;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right)}
  /* en tablets/escritorio: centrar con un ancho c√≥modo */
  @media(min-width:560px){
    .shell{max-width:480px;min-height:auto;height:100dvh;box-shadow:0 0 60px rgba(0,0,0,.4)}
  }
  /* top bar */
  .top{background:var(--field);color:#EAF0EA;padding:14px 20px 16px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .top .who{font-size:12px;color:#9DB6A6;letter-spacing:.04em;text-transform:uppercase}
  .top .name{font-size:16px;font-weight:600;margin-top:2px}
  .top-nav{display:flex;align-items:center;gap:8px}
  .ham{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:10px;
    font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .drawer-ov{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(0,0,0,0);visibility:hidden;z-index:60;transition:background .25s}
  .drawer-ov.on{background:rgba(0,0,0,.45);visibility:visible}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:80%;max-width:320px;background:var(--paper);
    transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,.2)}
  .drawer.on{transform:translateX(0)}
  .drawer-head{background:var(--field);padding:14px 18px 13px;display:flex;align-items:center;justify-content:space-between}
  .drawer-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:20px;cursor:pointer}
  .drawer-body{flex:1;overflow-y:auto;padding:12px 14px}
  .drawer-salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
    background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:12px;padding:11px;
    font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .drawer-salir:active{background:#F6DDD4}
  .drawer-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 4px 7px}
  .drawer-acc{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,#F7FAF7,#EEF4EF);border:1.5px solid #C9D8CD;border-left:4px solid var(--field-700);
    border-radius:12px;padding:13px 14px 13px 12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(21,57,43,.06);
    font-size:13.5px;font-weight:800;color:var(--field);font-family:inherit;cursor:pointer;text-align:left}
  .drawer-acc.on{background:linear-gradient(135deg,#E4F1E9,#F1F7F3);border-color:#8FBA9D;box-shadow:0 4px 12px rgba(21,57,43,.10)}
  .drawer-acc-fl{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--field);background:rgba(21,57,43,.08);flex-shrink:0}
  .drawer-it{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;margin-bottom:7px;cursor:pointer;text-align:left}
  .di-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .di-t{font-size:13px;font-weight:600;color:var(--field)}
  .di-s{font-size:10.5px;color:var(--muted);margin-top:0}
  .di-a{font-size:16px;color:var(--muted)}
  .prov-cab{display:flex;align-items:center;gap:13px}
  .prov-logo{width:52px;height:52px;border-radius:14px;color:#fff;font-weight:800;font-size:18px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Space Grotesk',sans-serif}
  .prov-tipo{font-size:11px;font-weight:700;color:var(--field);background:var(--paper);border-radius:6px;padding:3px 9px}
  .prov-chips{display:flex;flex-wrap:wrap;gap:7px}
  .prov-chip{font-size:12px;font-weight:600;color:var(--field);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .prov-doc-ic{width:38px;height:38px;border-radius:10px;background:#FBE9E4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .wa-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:#E8F3EC;color:#3B7355;border:1px solid #CDE6D6;border-radius:9px;
    padding:7px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
  .wa-btn:active{background:#DCEDE2}
  .wa-btn.full{width:100%;margin-top:10px}
  .doc-item .doc-estado{display:inline-block;color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:6px}
  .doc-foto{display:inline-block;font-size:10.5px;color:var(--muted);margin-left:8px}
  .doc-chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);
    font-size:16px;font-weight:700;color:var(--muted);margin-top:8px}
  .doc-chk.on{background:#E4F1E9;border-color:#2E7D52;color:#2E7D52}
  .doc-foto-btn{width:100%;margin-top:6px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;
    padding:11px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:inherit;cursor:pointer}
  .doc-foto-btn.on{background:#E4F1E9;border-color:#2E7D52;border-style:solid;color:#2E7D52}
  .doc-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .doc-acc-b{font-size:12px;font-weight:600;font-family:inherit;color:var(--field);background:var(--paper);
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
  .doc-acc-b.prim{background:#EAF0F6;color:#3A6EA5;border-color:#CADBEB}
  .doc-dep-aviso{margin-top:6px;font-size:11.5px;color:#7A5BA8;background:#F3EDF9;border-radius:8px;padding:6px 10px}
  /* bit√°cora como l√≠nea de tiempo vertical: los puntos se conectan con una l√≠nea */
  .doc-bita{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .doc-bita-row{position:relative;display:flex;flex-direction:column;gap:1px;
    font-size:11px;padding:0 0 9px 17px}
  .doc-bita-row:last-child{padding-bottom:0}
  /* la l√≠nea que une los puntos, salvo en el √∫ltimo */
  .doc-bita-row:not(:last-child)::before{content:"";position:absolute;left:3.5px;top:9px;
    bottom:-1px;width:1.5px;background:var(--line)}
  .doc-bita-dot{position:absolute;left:0;top:3px;width:8px;height:8px;border-radius:50%;
    flex-shrink:0;box-shadow:0 0 0 2px var(--card)}
  .doc-bita-e{font-weight:700;color:var(--ink);line-height:1.25}
  .doc-bita-m{color:var(--muted);font-size:10.5px;line-height:1.25}
  .c-info{background:#EAF0F6;color:#3A6EA5} .c-info .d{background:#3A6EA5}
  .dest-sug{margin-top:6px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
  .dest-sug-it{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 13px;
    background:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
  .dest-sug-it:last-child{border-bottom:none}
  .dest-sug-it b{font-size:13.5px;color:var(--ink)}
  .dest-sug-it span{font-size:11.5px;color:var(--muted)}
  .dest-sel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#E4F1E9;
    border:1px solid #CDE6D6;border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--field)}
  .acta{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .acta-h{font-size:13px;font-weight:800;text-align:center;color:var(--field);letter-spacing:.02em;line-height:1.3}
  .acta-sub{font-size:11px;text-align:center;color:var(--muted);margin:4px 0 14px}
  .acta-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .acta-row span{color:var(--muted)}
  .acta-tabla{width:100%;border-collapse:collapse;margin:12px 0;font-size:11px}
  .acta-tabla th,.acta-tabla td{border:1px solid var(--line);padding:5px 6px;text-align:left}
  .acta-tabla th{background:var(--paper);font-weight:700;color:var(--muted)}
  .acta-firmas{display:flex;gap:18px;margin-top:24px}
  .acta-firma{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}
  .acta-linea{border-top:1.5px solid var(--ink);margin-bottom:6px}
  .acta-novedad{margin-top:14px;font-size:11.5px;color:#B5613C;background:#FBE9E4;border-radius:8px;padding:8px 11px}
  .aj-paletas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .aj-pal{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    background:var(--card);border:2px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;text-align:left}
  .aj-pal.on{border-color:var(--field)}
  .aj-pal-muestra{display:flex;gap:3px;flex-shrink:0}
  .aj-pal-muestra span{width:15px;height:15px;border-radius:4px;display:block}
  .aj-pal-nom{font-size:12.5px;font-weight:600;color:var(--ink)}
  .aj-pal-check{position:absolute;top:10px;right:11px;color:var(--field);font-weight:800}
  .cl-wrap{position:relative;margin-bottom:9px}
  .cl-inp{width:100%;padding:12px 42px 12px 13px;border:1px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
  .cl-inp:focus{outline:none;border-color:var(--field)}
  .cl-ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
    border:none;background:transparent;font-size:15px;cursor:pointer;opacity:.6}
  .cl-lbl{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
  .cl-barra{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 5px}
  .cl-barra i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
  .cl-nota{font-size:11px;line-height:1.45;margin:0 2px 10px}
  .aj-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
  .aj-k{font-size:14px;font-weight:600;color:var(--ink)}
  .aj-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .aj-switch{width:46px;height:27px;border-radius:999px;background:#CDD4CD;position:relative;flex-shrink:0;transition:background .2s}
  .aj-switch.on{background:var(--ok)}
  .aj-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .aj-switch.on .aj-knob{left:22px}
  .aj-sel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;color:var(--field)}
  .aj-salir{width:100%;background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:13px;
    padding:14px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:18px}
  .aj-about{text-align:center;padding:10px 0 20px;color:var(--muted)}
  .aj-about-t{font-weight:800;color:var(--field);letter-spacing:.04em}
  .aj-about-s{font-size:11.5px;margin-top:2px}
  .topbtn{display:flex;align-items:center;gap:5px;color:#EAF0EA;font-size:14px;font-weight:600;
    background:rgba(255,255,255,.10);border-radius:999px;padding:7px 14px}
  .topbtn:active{background:rgba(255,255,255,.2)}
  .net{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.08);
    padding:6px 10px;border-radius:999px;color:#EAF0EA;font-weight:600}
  .net:active{background:rgba(255,255,255,.16)}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.on{background:#6FD39B;box-shadow:0 0 4px rgba(111,211,155,.45)}   /* en l√≠nea: verde suave, luz tenue */
  .dot.off{background:var(--maize)}
  .dot.sync{background:var(--maize);animation:latido .9s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
  /* Refresco propio: no recarga la p√°gina, no saca al usuario del sistema */
  .ptr{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:60}
  .ptr-c{background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 14px rgba(21,57,43,.16);
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--field)}
  .ptr-c.gira{animation:girar .8s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  @keyframes burbujaLatido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .sync-intro{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .sync-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .sync-ic{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sync-t{font-size:14px;font-weight:600;color:var(--ink)}
  .sync-ok{text-align:center;padding:18px 0}
  .sync-nota{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;
    background:var(--paper);border-radius:10px;padding:10px 12px}
  /* alerta de clientes por visitar */
  .alerta-visita{display:flex;align-items:center;gap:12px;width:100%;background:#FBF0D8;

  /* hero commission */
  /* ‚ïê‚ïê‚ïê NORMA DE CONTRASTE (sellada, aplica a TODA tarjeta del proyecto) ‚ïê‚ïê‚ïê
     Toda tarjeta con fondo propio debe tener contraste suficiente:
     - fondo CLARO  ‚Üí textos var(--ink) / var(--field-soft-txt); apagados var(--muted); bordes var(--field-soft-line)
     - fondo OSCURO ‚Üí textos #EAF0EA; apagados #9DB6A6; bordes rgba(255,255,255,.15)
     PROHIBIDO: texto #fff o #9DB6A6 sobre fondo claro; texto var(--ink) sobre fondo oscuro.
     Al cambiar el fondo de una tarjeta, revisar SIEMPRE sus textos, iconos, anillos y bordes. */
  .hero{background:linear-gradient(155deg,var(--field-soft) 0%,#E4ECE6 100%);border:1px solid var(--field-soft-line);

  /* b384 ¬∑ FOCO CON TECLADO EN LA PUERTA
     Los campos tienen `outline:none` para que se vea la raya de abajo y no
     un recuadro del navegador. Eso est√° bien con el dedo, pero deja ciego a
     quien navega con teclado. `:focus-visible` solo se enciende cuando de
     verdad se est√° usando teclado, as√≠ que no ensucia el toque. */
  .puerta :focus-visible{outline:3px solid #2E7D52;outline-offset:2px;border-radius:6px}
  .puerta input:focus-visible{outline-offset:0;border-radius:4px}
  /* sobre un bot√≥n oscuro el verde se pierde: ah√≠ el anillo va en ma√≠z */
  .puerta button[style*="rgb(21, 57, 43)"]:focus-visible{outline-color:#F2A900}
  /* b384 ¬∑ LA LLEGADA DE LA PUERTA
     Una sola secuencia de ~600 ms cuando la pantalla abre: la franja baja,
     la tarjeta sube, los campos entran uno tras otro y el bot√≥n √∫ltimo.
     No es adorno: mientras llega, el ojo aprende en qu√© orden se lee.
     Despu√©s no se mueve nada solo. Todo con transform y opacity, que es lo
     √∫nico que un tel√©fono barato anima sin trabarse. */
  @keyframes ptBaja{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ptSube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ptVer {from{opacity:0}to{opacity:1}}
  .puerta .pt-franja {animation:ptBaja .5s cubic-bezier(.2,.8,.3,1) both}
  .puerta .pt-tarjeta{animation:ptSube .5s cubic-bezier(.2,.7,.3,1) .14s both}
  .puerta .pt-c1     {animation:ptSube .44s cubic-bezier(.2,.7,.3,1) .28s both}
  .puerta .pt-c2     {animation:ptSube .44s cubic-bezier(.2,.7,.3,1) .34s both}
  .puerta .pt-cta    {animation:ptSube .44s cubic-bezier(.2,.7,.3,1) .42s both}
  .puerta .pt-pie    {animation:ptVer  .45s ease .54s both}
  /* Quien pidi√≥ menos movimiento en su tel√©fono no ve ninguno. */
  @media (prefers-reduced-motion: reduce){
    .puerta .pt-franja,.puerta .pt-tarjeta,.puerta .pt-c1,.puerta .pt-c2,
    .puerta .pt-cta,.puerta .pt-pie{animation-duration:.01ms;animation-delay:0ms}
  }

  /* ‚ïê‚ïê‚ïê UI KIT NEUM√ìRFICO (m√≥dulos financieros) ‚ïê‚ïê‚ïê */

  /* en Sol el relieve se aten√∫a para no perder contraste bajo el sol */
  [data-tema="sol"] .neu{box-shadow:0 1px 3px rgba(0,0,0,.10),0 6px 16px rgba(0,0,0,.07);border:1px solid #E3E0D4}

<script type="text/babel">
const {useState} = React;

/* ‚ïê‚ïê RUNTIME OPERATIVO ¬∑ fecha Ecuador, errores visibles y cola durable ‚ïê‚ïê */
const ZONA_HORARIA_EC="America/Guayaquil";
function partesFechaEC(fecha=new Date()){
  const p={};
  new Intl.DateTimeFormat("en-CA",{timeZone:ZONA_HORARIA_EC,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"})
    .formatToParts(fecha).forEach(x=>{ if(x.type!=="literal") p[x.type]=x.value; });
  return p;
}
function hoyEC(){ const p=partesFechaEC(); return `${p.year}-${p.month}-${p.day}`; }
function ahoraEC(){ const p=partesFechaEC(); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}-05:00`; }
let ORG_ACTIVA_MEM={uid:null,org:null};
async function orgActivaActual(){
  if(!window.SB||!window.SB.auth) throw new Error("Sin conexi√≥n con la organizaci√≥n activa.");
  const {data:s}=await window.SB.auth.getSession();
  const uid=s&&s.session&&s.session.user&&s.session.user.id;
  if(!uid) throw new Error("No hay una sesi√≥n activa.");
  if(ORG_ACTIVA_MEM.uid===uid&&ORG_ACTIVA_MEM.org) return ORG_ACTIVA_MEM.org;
  const {data,error}=await window.SB.rpc("mi_org_activa");
  if(error||!data) throw new Error((error&&error.message)||"El usuario no tiene organizaci√≥n activa.");
  ORG_ACTIVA_MEM={uid,org:String(data)}; return ORG_ACTIVA_MEM.org;
}
const ERRORES_LOCAL_KEY="freelance_errores_locales_v1";
function registrarError(contexto,error,opciones={}){
  const mensaje=(error&&error.message)||String(error||"Error desconocido");
  const fila={fecha:ahoraEC(),contexto,mensaje,online:navigator.onLine!==false};
  try{ const a=JSON.parse(localStorage.getItem(ERRORES_LOCAL_KEY)||"[]"); a.unshift(fila); localStorage.setItem(ERRORES_LOCAL_KEY,JSON.stringify(a.slice(0,80))); }
  catch(storageError){ console.error("No se pudo guardar el error local",storageError); }
  console.error(`[${contexto}]`,error);
  if(opciones.toast) opciones.toast("No se pudo completar la operaci√≥n. Intenta nuevamente.");
  return fila;
}

const COLA_DB="freelance_operaciones_offline_v1", COLA_STORE="operaciones";
const MODO_DEMO_ACTIVO=typeof location!=="undefined" && new URLSearchParams(location.search).get("demo")==="1";
function abrirColaOffline(){
  return new Promise((resolve,reject)=>{ if(!window.indexedDB){ reject(new Error("IndexedDB no disponible")); return; }
    const q=indexedDB.open(COLA_DB,1); q.onupgradeneeded=()=>{ if(!q.result.objectStoreNames.contains(COLA_STORE)) q.result.createObjectStore(COLA_STORE,{keyPath:"id"}); };
    q.onsuccess=()=>resolve(q.result); q.onerror=()=>reject(q.error||new Error("No se pudo abrir la cola offline")); });
}
async function colaOfflineListar(){ const db=await abrirColaOffline(); return new Promise((resolve,reject)=>{ const tx=db.transaction(COLA_STORE,"readonly"),q=tx.objectStore(COLA_STORE).getAll(); q.onsuccess=()=>resolve(q.result||[]); q.onerror=()=>reject(q.error); tx.oncomplete=()=>db.close(); }); }
async function colaOfflineGuardar(op){ const db=await abrirColaOffline(); return new Promise((resolve,reject)=>{ const tx=db.transaction(COLA_STORE,"readwrite"); tx.objectStore(COLA_STORE).put(op); tx.oncomplete=()=>{db.close();resolve(op);}; tx.onerror=()=>{db.close();reject(tx.error);}; }); }
async function colaOfflineBorrar(id){ const db=await abrirColaOffline(); return new Promise((resolve,reject)=>{ const tx=db.transaction(COLA_STORE,"readwrite"); tx.objectStore(COLA_STORE).delete(id); tx.oncomplete=()=>{db.close();resolve(true);}; tx.onerror=()=>{db.close();reject(tx.error);}; }); }
const money = n => "$" + n.toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ‚ïê‚ïê COMPROBANTE EN IMAGEN (PNG, tama√±o A6) ‚ïê‚ïê
   Estilo aprobado: azul institucional, bloque destacado del cliente,
   etiquetas de secci√≥n en azul y chip √°mbar del estado.
   A6 = 105√ó148 mm dibujado a 826√ó1165 px (200 ppp). */
function imgComprobante(d){
  const W=826, P=40;
  const money2=n=>"$"+Number(n||0).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
  const F=(px,peso)=>`${peso||600} ${px}px Inter, system-ui, -apple-system, sans-serif`;
  /* paleta azul del comprobante */
  const AZUL="#1B3A5C", AZUL2="#2C5F8A", AZULSUAVE="#EAF2FA", TINTA="#1A2733",
        GRIS="#6B7A88", LINEA="#E3E9EF", AMBAR="#B8860B", AMBARBG="#FBEFD0", OK="#2E7D52";

  const lineas=(d.lineas||[]), facs=(d.facturas||[]), obs=(d.obs||[]);
  let H = 560 + lineas.length*44 + facs.length*72 + (obs.length?54+obs.length*34:0);
  H = Math.max(1165, H+90);

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#F2F5F8"; x.fillRect(0,0,W,H);
  x.fillStyle="#fff"; redonda(x,P,P,W-P*2,H-P*2,24); x.fill();

  const IX=P+38, IW=W-P*2-76;
  let y=P+64;

  /* cabecera centrada */
  x.textAlign="center";
  x.fillStyle=TINTA; x.font=F(25,700); x.fillText(recorta(x,String(d.prov||"‚Äî"),IW), W/2, y);
  y+=76; x.fillStyle=AZUL; x.font=F(68,800); x.fillText(money2(d.monto), W/2, y);
  y+=36; x.fillStyle=GRIS; x.font=F(16,500);
  x.fillText([d.nRecibo, d.fecha||fechaHoy()].filter(Boolean).join(" ¬∑ "), W/2, y);
  /* chip del estado */
  y+=38; const et="Pendiente de verificaci√≥n";
  x.font=F(17,700); const aw=x.measureText(et).width+40;
  x.fillStyle=AMBARBG; redonda(x,(W-aw)/2,y-24,aw,38,19); x.fill();
  x.fillStyle=AMBAR; x.fillText(et, W/2, y+2);
  x.textAlign="left";

  y+=34; separa(y); y+=40;

  /* bloque destacado del cliente */
  const BH = d.atendido ? 162 : 118;
  x.fillStyle=AZULSUAVE; redonda(x,IX,y-26,IW,BH,16); x.fill();
  x.fillStyle=AZUL2; x.font=F(15,700); x.fillText("CLIENTE", IX+24, y+2);
  x.fillStyle=AZUL; x.font=F(36,800);
  x.fillText(recorta(x,String(d.cli||"‚Äî"),IW-48), IX+24, y+50);
  if(d.ruc){ x.fillStyle=AZUL2; x.font=F(18,500);
    x.fillText("RUC "+rucCorto(d.ruc), IX+24, y+84); }
  if(d.atendido){
    x.strokeStyle="#D3E2F0"; x.lineWidth=1;
    x.beginPath(); x.moveTo(IX+24,y+104); x.lineTo(IX+IW-24,y+104); x.stroke();
    x.fillStyle=GRIS; x.font=F(16,500); x.fillText("Atendido por", IX+24, y+130);
    x.textAlign="right"; x.fillStyle=TINTA;
    x.fillText(recorta(x,String(d.atendido),IW-220), IX+IW-24, y+130); x.textAlign="left";
  }
  y+=BH+18;

  /* resumen del pago */
  if(lineas.length){
    sec("RESUMEN DEL PAGO");
    lineas.forEach(l=>{
      const det=[l.modalidad, l.banco, l.numero].filter(Boolean).join(" ¬∑ ");
      fila(det, money2(parseFloat(l.monto)||0), true);
    });
    separa(y-14);
  }

  /* aplicaci√≥n del pago */
  if(facs.length){
    sec("APLICACI√ìN DEL PAGO");
    facs.forEach(f=>{
      const resta=(f.saldoRest!=null)?f.saldoRest:0;
      fila("Factura "+f.factura, money2(f.aplicado), true);
      y-=8; x.fillStyle=GRIS; x.font=F(15,500);
      const sub = (f.saldoAnt!=null)

  const VERDE="#1B3A5C", MAIZ="#B8860B", CLAY="#C2603A", TINTA="#1A2733", GRIS="#6B7A88", LINEA="#E3E9EF", CREMA="#EAF2FA";

  const fmt = d.formato || "resumen";
  const fs  = (d.facturas||[]).filter(f=>(f.saldo||0)>0.004);   /* solo lo que sigue pendiente */
  const movs= (d.movimientos||[]).slice(-8);                     /* cuenta corriente: √∫ltimos movimientos */
  const tot = Math.round(fs.reduce((s,f)=>s+(f.saldo||0),0)*100)/100;

  /* alto seg√∫n el formato */
  let filas = fmt==="cuenta" ? movs.length
            : fmt==="simple" ? 2
            : fmt==="resumen" ? 4
            : fs.length;
  let H = Math.max(1165, 420 + filas*46 + 180);

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#F2F5F8"; x.fillRect(0,0,W,H);
  x.fillStyle="#fff"; redonda(x,P,P,W-P*2,H-P*2,22); x.fill();

  const IX=P+34, IW=W-P*2-68;
  let y=P+58;

  /* cabecera */
  x.textAlign="center";
  x.fillStyle=VERDE; x.font=F(21,800); x.fillText("ESTADO DE CUENTA", W/2, y);
  y+=30; x.fillStyle=TINTA; x.font=F(19,700);
  x.fillText(recorta(x,String(d.cli||"‚Äî"),IW), W/2, y);
  y+=26; x.fillStyle=GRIS; x.font=F(14,500);
  x.fillText("Actualizado" + (d.nRecibo?(" tras "+d.nRecibo):"") + " ¬∑ " + (d.fecha||fechaHoy()), W/2, y);
  x.textAlign="left";
  y+=22; punteada(y); y+=36;

  /* saldo total, siempre arriba */
  x.fillStyle=CREMA; redonda(x,IX,y-26,IW,72,14); x.fill();
  x.fillStyle=GRIS; x.font=F(14,700); x.fillText("SALDO PENDIENTE", IX+22, y+2);
  x.fillStyle=tot>0?MAIZ:"#2E7D52"; x.font=F(30,800); x.textAlign="right";
  x.fillText(money2(tot), IX+IW-22, y+24); x.textAlign="left";
  y+=76;

  if(fs.length===0 && fmt!=="cuenta"){
    x.fillStyle="#2E7D52"; x.font=F(18,700); x.textAlign="center";
    x.fillText("‚úì Sin facturas pendientes", W/2, y+30); x.textAlign="left";
    return c;
  }

  /* ‚îÄ‚îÄ cada formato dibuja lo suyo ‚îÄ‚îÄ */
  if(fmt==="simple"){
    sec("RESUMEN");
    fila("Facturas pendientes", String(fs.length));
    if(fs[0]) fila("Pr√≥ximo vencimiento", money2(fs[0].saldo)+" ¬∑ "+fs[0].vence);
  }
  else if(fmt==="calendario"){
    sec("POR FECHA DE VENCIMIENTO");
    cabecera("VENCE","VALOR");
    fs.forEach(f=>{ linea(f.vence, money2(f.saldo), vencida(f.vence)); });
    totalFila();
  }
  else if(fmt==="cuenta"){
    sec("CUENTA CORRIENTE");
    cabecera("MOVIMIENTO","DEBE / HABER");
    let acum=0;
    movs.forEach(m=>{
      const v = m.debe!=null ? m.debe : -(m.haber||0);
      acum+=v;
      const txt = (m.debe!=null?"+":"‚àí")+money2(Math.abs(v));
      linea(`${m.fecha} ¬∑ ${m.concepto}`, txt, m.debe==null);
    });
    totalFila();
  }
  else if(fmt==="liq"){
    sec("LIQUIDACI√ìN");
    fila("Saldo anterior", money2(d.saldoAnterior||0));
    fila("Pago recibido", "‚àí"+money2(d.pago||0));
    fila("Facturas pendientes", String(fs.length));
    totalFila();
  }
  else if(fmt==="resumen"){
    sec("RESUMEN POR ANTIG√úEDAD");
    const venc = fs.filter(f=>vencida(f.vence));
    const alDia= fs.filter(f=>!vencida(f.vence));
    const sv=Math.round(venc.reduce((s,f)=>s+f.saldo,0)*100)/100;
    const sd=Math.round(alDia.reduce((s,f)=>s+f.saldo,0)*100)/100;
    fila(`Vencido (${venc.length})`, money2(sv), sv>0);
    fila(`Por vencer (${alDia.length})`, money2(sd));
    if(fs[0]) fila("Pr√≥ximo vencimiento", money2(fs[0].saldo)+" ¬∑ "+fs[0].vence);
  }
  else { /* "factura": detalle por documento */
    sec("DETALLE POR FACTURA");
    cabecera("FACTURA","SALDO");
    fs.forEach(f=>{ linea(f.factura+"  ¬∑  "+f.vence, money2(f.saldo), vencida(f.vence)); });
    totalFila();
  }

  /* pie */
  x.fillStyle=GRIS; x.font=F(13,500); x.textAlign="center";
  x.fillText("Documento informativo ¬∑ FREELANCE", W/2, H-P-24);
  x.textAlign="left";
  return c;

  function sec(t){ y+=10; x.fillStyle=GRIS; x.font=F(14,700); x.fillText(t, IX, y); y+=30; }
  function cabecera(a,b){
    x.fillStyle=VERDE; redonda(x,IX,y-20,IW,34,8); x.fill();
    x.fillStyle="#EAF0EA"; x.font=F(13,700);
    x.fillText(a, IX+14, y+2);
    x.textAlign="right"; x.fillText(b, IX+IW-14, y+2); x.textAlign="left";
    y+=38;
  }
  function linea(izq, der, alerta){
    x.strokeStyle=LINEA; x.lineWidth=1;
    x.beginPath(); x.moveTo(IX,y+14); x.lineTo(IX+IW,y+14); x.stroke();
    x.fillStyle=alerta?CLAY:TINTA; x.font=F(16,500);
    x.fillText(recorta(x,String(izq),IW-200), IX+2, y);
    x.textAlign="right"; x.font=F(17,700);
    x.fillText(String(der), IX+IW-2, y); x.textAlign="left";
    y+=42;
  }
  function fila(izq, der, alerta){
    x.fillStyle=TINTA; x.font=F(16,500); x.fillText(recorta(x,String(izq),IW-220), IX+2, y);
    x.fillStyle=alerta?CLAY:TINTA; x.textAlign="right"; x.font=F(17,700);
    x.fillText(String(der), IX+IW-2, y); x.textAlign="left"; x.fillStyle=TINTA;
    y+=40;
  }
  function totalFila(){
    y+=6;
    x.fillStyle=CREMA; redonda(x,IX,y-22,IW,44,8); x.fill();
    x.fillStyle=TINTA; x.font=F(15,800); x.fillText("TOTAL PENDIENTE", IX+14, y+4);
    x.textAlign="right"; x.font=F(19,800); x.fillStyle=tot>0?MAIZ:"#2E7D52";
    x.fillText(money2(tot), IX+IW-14, y+4); x.textAlign="left";
    y+=48;
  }
  function vencida(v){ return /vencid/i.test(String(v||"")); }
  function punteada(yy){
    x.strokeStyle=LINEA; x.lineWidth=1.5; x.setLineDash([5,5]);
    x.beginPath(); x.moveTo(IX,yy); x.lineTo(IX+IW,yy); x.stroke(); x.setLineDash([]);
  }
  function redonda(ctx,a,b,w,h,r){
    ctx.beginPath();
    ctx.moveTo(a+r,b); ctx.lineTo(a+w-r,b); ctx.quadraticCurveTo(a+w,b,a+w,b+r);
    ctx.lineTo(a+w,b+h-r); ctx.quadraticCurveTo(a+w,b+h,a+w-r,b+h);
    ctx.lineTo(a+r,b+h); ctx.quadraticCurveTo(a,b+h,a,b+h-r);
    ctx.lineTo(a,b+r); ctx.quadraticCurveTo(a,b,a+r,b); ctx.closePath();
  }
  function recorta(ctx,t,max){
    t=String(t);
    if(ctx.measureText(t).width<=max) return t;
    let s=t;
    while(s.length>3 && ctx.measureText(s+"‚Ä¶").width>max) s=s.slice(0,-1);
    return s+"‚Ä¶";
  }
  function fechaHoy(){
    const n=new Date(), M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${String(n.getDate()).padStart(2,"0")} ${M[n.getMonth()]} ${n.getFullYear()}`;
  }
}

/* Comparte el comprobante como imagen; si el equipo no lo permite, la descarga */
/* Comparte comprobante y estado de cuenta EN UN SOLO GESTO.
   navigator.share exige un toque directo del usuario: si se llama dos veces
   con espera en medio, el navegador bloquea el segundo. Por eso van juntas. */
async function compartirCobro(dComp, dEstado, toast){
  const arch=[];
  try{
    const l1=imgComprobante(dComp);
    const b1=await new Promise(r=>l1.toBlob(r,"image/png",0.95));
    if(b1) arch.push(new File([b1], `Cobro_${limpiaNom(dComp.cli)}.png`, {type:"image/png"}));
    if(dEstado){
      const l2=imgEstadoCuenta(dEstado);
      const b2=await new Promise(r=>l2.toBlob(r,"image/png",0.95));
      if(b2) arch.push(new File([b2], `Estado_${limpiaNom(dEstado.cli)}.png`, {type:"image/png"}));
    }
    if(!arch.length){ toast && toast("No se pudo generar la imagen."); return false; }
    if(navigator.canShare && navigator.canShare({files:arch})){
      await navigator.share({files:arch, title:"Comprobante de cobro"});
      return true;
    }
    /* sin compartir nativo: se descargan y se adjuntan a mano */
    arch.forEach(f=>{
      const url=URL.createObjectURL(f);
      const a=document.createElement("a"); a.href=url; a.download=f.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    });
    toast && toast(`${arch.length} imagen(es) descargada(s). Adj√∫ntalas con el clip üìé.`);
    return true;
  }catch(e){ return false; }
  function limpiaNom(n){ return String(n||"cliente").replace(/[^\w√°√©√≠√≥√∫√±√Å√â√ç√ì√ö√ë]+/g,"_"); }
}

/* ‚ïê‚ïê PUENTE WHATSAPP (Fase 4) ‚ïê‚ïê
   Abre WhatsApp directo en el chat del cliente usando el tel√©fono de su ficha.
   Hoy: el mensaje va al chat correcto; el PDF sigue yendo por el men√∫ de compartir
   (el navegador no puede adjuntar un archivo a un n√∫mero espec√≠fico).
   En Fase 4: el PDF se sube a Supabase Storage y aqu√≠ se agrega su enlace.
   Destino final: WhatsApp Cloud API despacha todo desde el servidor, sin tocar nada. */
function telE164(tel){
  const d=String(tel||"").replace(/\D/g,"");
  if(!d) return null;
  if(d.startsWith("593")) return d;              /* ya viene con pa√≠s */
  if(d.startsWith("0")) return "593"+d.slice(1); /* 09xxxxxxxx ‚Üí 5939xxxxxxxx */
  if(d.length===9) return "593"+d;               /* 9xxxxxxxx */
  return d;
}
function telDeCliente(nombre){
  const n=(nombre && nombre.nombre) || nombre;
  if(!n) return null;
  /* acceso protegido: estas tablas se declaran m√°s abajo en el archivo (const = zona muerta) */
  const leer = (fn)=>{ try{ return fn(); }catch(e){ return null; } };
  const f = leer(()=>FICHA_CLIENTE[n]);
  if(f && f.tel) return telE164(f.tel);
  const c = leer(()=> typeof CLIENTES_MAESTRO!=="undefined"
        ? CLIENTES_MAESTRO.find(x=>x.nombre===n) : null);
  if(c && c.tel) return telE164(c.tel);
  return null;
}
/* Abre el chat del cliente si hay tel√©fono; si no, cae al men√∫ de compartir de siempre */
function waCliente(nombre, texto){
  const t=telDeCliente(nombre);
  const url = t ? `https://wa.me/${t}?text=${encodeURIComponent(texto)}`
                : `https://wa.me/?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
  return !!t;   /* true = fue directo al chat del cliente */
}


/* Unidad abreviada para mostrar comisiones: "Quintal"‚Üíqq, "Saco 25 kg"‚Üísaco, "Funda 2 kg"‚Üífunda */
const uniCorta = (u)=>{
  const t=(u||"").trim();
  if(!t) return "unidad";
  if(/quintal/i.test(t)) return "qq";
  if(/arroba/i.test(t)) return "@";
  if(/saco/i.test(t)) return "saco";
  if(/funda/i.test(t)) return "funda";
  if(/caja/i.test(t)) return "caja";
  if(/unidad/i.test(t)) return "u";
  return t.split(" ")[0].toLowerCase();
};

/* ‚ïê‚ïê‚ïê PROMO-04 ¬∑ LAS PROMOCIONES LLEGAN AL CAT√ÅLOGO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Hasta hoy cada l√≠nea del cat√°logo nac√≠a con promosFreelance:[] y
   promosProveedor:[]. Por eso P4 y P6 sal√≠an grises ‚Äî¬´Este producto no tiene
   promociones del freelance vigentes.¬ª‚Äî aunque la promoci√≥n ya estuviera cargada
   en la base. Esto es lo que las reparte.

   EL MISMO COLADOR QUE `gratis_que_concede`, para que la pantalla y el cerrojo de
   la base nunca digan cosas distintas:
     ¬∑ modalidad `compra_lleva`: es la √∫nica que P4/P6 saben mostrar (descuento
       por volumen o sobre la factura no regalan mercader√≠a);
     ¬∑ estado `activa` o `aprobada`. `pendiente` y `rechazada` NO se le ofrecen a
       un vendedor ‚Äîtodav√≠a no son un compromiso de nadie‚Äî y `vencida` e
       `inactiva` ya murieron;
     ¬∑ vigente HOY con la fecha LOCAL del tel√©fono. Con toISOString(), en Ecuador
       (UTC-5) desde las 19h ya ser√≠a ma√±ana y una promoci√≥n regir√≠a cinco horas
       antes o morir√≠a cinco horas despu√©s;
     ¬∑ producto + presentaci√≥n + piladora. `prov_cod` en NULL vale para todas las
       piladoras, igual que en la funci√≥n de la base.

   LA PRESENTACI√ìN NO SE CONVIERTE. ¬´Compra 100 lleva 2¬ª no dice lo mismo en
   quintales que en arrobas (son 4√ó) ni en fundas de 10 libras (0,1 qq: son 10√ó).
   Los n√∫meros del tramo se muestran TAL CUAL, as√≠ que una promoci√≥n solo se
   ofrece en la presentaci√≥n en la que fue escrita; si no fija presentaci√≥n, sus
   n√∫meros est√°n en QUINTALES ‚Äîas√≠ los lee la base‚Äî y entonces solo se ofrece en
   la l√≠nea de equivalencia 1. Convertirlos aqu√≠ ser√≠a inventar una cuenta que
   nadie pidi√≥, y ya hubo un conversor al que el texto ¬´10 libras¬ª enga√±√≥.

   LOS N√öMEROS SON PARA MOSTRAR, NO PARA DECIDIR. `minimo` y `gratis` salen del
   PRIMER escal√≥n de `promocion_tramos` y solo sirven para escribir ¬´por cada 100
   llevas 2¬ª. Cu√°nto se puede regalar de verdad lo sigue diciendo la base, por RPC
   a `gratis_que_concede` (topeRegaloQq), que es la misma cuenta del cerrojo de
   `pedido_items` y de `facturar_pedido`. Dos fuentes para un mismo hecho terminan
   contradici√©ndose. */
const PROMO_ESTADOS_VIVOS = ["activa","aprobada"];
function promosDelCatalogo(promoTbl, hoyISO){
  const tbl = promoTbl || {};
  /* Escal√≥n de ARRANQUE de cada promoci√≥n: el `desde_cant` m√°s bajo. Es el que se
     ense√±a; los dem√°s escalones los aplica la base al calcular el tope. */
  const arranque = {};
  (tbl.tramos||[]).forEach(t=>{
    if(t.modalidad && t.modalidad!=="compra_lleva") return;
    const d=Number(t.desde_cant)||0, g=Number(t.gratis_cant)||0;
    if(!(d>0) || !(g>0)) return;                 // sin n√∫meros no hay nada que ofrecer
    const ya=arranque[t.promo_id];
    if(!ya || d<ya.minimo) arranque[t.promo_id]={ minimo:d, gratis:g };
  });
  const vivas=[];
  (tbl.promos||[]).forEach(p=>{
    if(!p || p.modalidad!=="compra_lleva") return;
    if(p.es_demo===true) return;
    if(PROMO_ESTADOS_VIVOS.indexOf(p.estado)<0) return;
    const d = p.vigente_desde ? String(p.vigente_desde).slice(0,10) : null;
    const h = p.vigente_hasta ? String(p.vigente_hasta).slice(0,10) : null;
    if(d && d >  hoyISO) return;                 // todav√≠a no rige
    if(h && h <  hoyISO) return;                 // el √öLTIMO d√≠a s√≠ cuenta, igual que en la base
    const t = arranque[p.promo_id];
    if(!t) return;                               // cabecera sin escalones: no se ofrece lo que no se puede cumplir
    vivas.push({ prodId:p.prod_id, presCod:p.pres_cod||null, provCod:p.prov_cod||null, origen:p.origen,
      promo:{ id:p.promo_id, nombre:p.nombre, minimo:t.minimo, gratis:t.gratis,
        detalle: p.detalle || ("compra "+t.minimo+" lleva "+t.gratis),
        base: (p.base!=null ? Math.round(Number(p.base)*100)/100 : null),
        desde:d, hasta:h, paga:(p.origen==="proveedor" ? "proveedor" : "freelance") } });
  });
  /* Devuelve las promociones de UNA l√≠nea del cat√°logo, ya repartidas: las del
     freelance van a P4 y las del proveedor a P6. */
  return function(prodId, presCod, provCod, equiv, baseContado){
    const f=[], v=[];
    vivas.forEach(x=>{
      if(x.prodId !== prodId) return;
      if(x.presCod ? (x.presCod !== presCod) : Number(equiv)!==1) return;
      if(x.provCod && provCod && x.provCod !== provCod) return;
      const pm = Object.assign({}, x.promo);
      /* Promoci√≥n sin base propia: manda el precio de la oferta. Con base 0 la
         comisi√≥n saldr√≠a siendo el precio ENTERO de la l√≠nea. */
      if(pm.base==null) pm.base = baseContado;
      (x.origen==="proveedor" ? v : f).push(pm);
    });
    return { freelance:f, proveedor:v };
  };
}

/* ‚îÄ‚îÄ FASE 4 ¬∑ Etapa 2: cat√°logo del pedido con datos REALES ‚îÄ‚îÄ
   Funci√≥n PURA y global (antes de Pedido, que la usa): arma piladoras y presentaciones
   desde la base. Las promociones vivas entran por `promoTbl` (PROMO-04): antes se
   dejaban siempre en [] y P4/P6 sal√≠an grises aunque la base ya las tuviera.

   ‚îÄ‚îÄ FA-0011 ¬∑ el PEDIDO sale de las OFERTAS, ya no de `precios` ‚îÄ‚îÄ
   El sistema web dej√≥ de escribir en `precios`: hoy un producto nuevo nace con sus
   ofertas en `ofertas_piladora` y CERO filas en `precios`. Leyendo `precios`, el
   producto se ve√≠a en la pantalla Productos pero NO se pod√≠a PEDIR. Medido contra
   producci√≥n el 05/08/2026: 59 productos activos ¬∑ 58 con fila en `precios` ¬∑ 59 con
   oferta vigente. El que faltaba era P-00197 ¬´Arroz Crecedor¬ª, sin marca, con 2
   presentaciones y 2 ofertas vivas de Piladora San Agust√≠n.

   OJO CON EL PRECIO ‚Äî aqu√≠ NO es el mismo que en la ficha de Productos:
   la l√≠nea del pedido se cobra por la PRESENTACI√ìN, y `precio_contado` de la oferta YA
   viene por presentaci√≥n ($37,00 el quintal, $9,25 la arroba). Entra DIRECTO: ni se
   multiplica ni se divide por equiv_qq. Antes se multiplicaba porque
   `precios.base_contado` ven√≠a por quintal. Confundirlo saca el pedido con importes
   falsos. El equiv_qq sigue viajando en `equiv` porque al guardar todo se convierte a
   quintales (cantidad_qq = cant √ó equiv ¬∑ precio_usd = precio √∑ equiv).

   La oferta define QU√â vende cada piladora y a qu√© precio: en el pedido la piladora se
   elige primero, as√≠ que cada una muestra SU precio. Sin producto activo o sin oferta
   vigente, la oferta no se ofrece. */
function construirCatalogoPedido(provs, ofertas, prods, presenTbl, promoTbl){
  const r2=n=>Math.round(n*100)/100;
  const nomDe={}, lineaDe={}, fotoDe={}, presFotoDe={};
  /* Un producto dado de baja no se puede pedir aunque su oferta siga viva: la
     consulta ya filtra por estado, pero la regla vive AQU√ç para que no dependa
     de que quien llame se acuerde de filtrar. */
  (prods||[]).forEach(p=>{ if(p.estado && p.estado!=="activo") return;
    nomDe[p.prod_id]=p.nombre||p.marca||p.prod_id; lineaDe[p.prod_id]=p.linea||"Otros"; fotoDe[p.prod_id]=p.foto||null; });
  /* foto POR PRESENTACI√ìN (clave: prod_id|presentacion_cod). Cae a la del producto si a√∫n no tiene la suya. */
  (presenTbl||[]).forEach(p=>{ if(p.foto) presFotoDe[p.prod_id+"|"+p.presentacion_cod]=p.foto; });
  /* La fecha del TEL√âFONO, no la de Greenwich: con toISOString(), en Ecuador (UTC-5)
     desde las 19h ya ser√≠a "ma√±ana" y una oferta entrar√≠a a regir cinco horas antes. */
  const _h=new Date();
  const hoyISO=_h.getFullYear()+"-"+String(_h.getMonth()+1).padStart(2,"0")+"-"+String(_h.getDate()).padStart(2,"0");
  /* PROMO-04 ¬∑ las promociones vivas, listas para colgarlas de cada l√≠nea */
  const promosDe = promosDelCatalogo(promoTbl, hoyISO);
  /* Una sola l√≠nea por piladora + producto + presentaci√≥n: si la base trajera dos
     ofertas vivas para la misma, manda la M√ÅS BARATA (nunca se ofrece de m√°s). */
  const porClave={};
  (ofertas||[]).forEach(o=>{
    if(o.activo === false) return;
    if(o.vigente_desde && String(o.vigente_desde).slice(0,10) >  hoyISO) return;
    if(o.vigente_hasta && String(o.vigente_hasta).slice(0,10) <= hoyISO) return;
    const nom=nomDe[o.prod_id];
    if(!nom) return;                                   // producto de baja o inexistente
    const eq=Number(o.equiv_qq)||0;
    if(!(eq>0)) return;                                // sin equivalencia no se puede pasar a quintales
    const pc=Number(o.precio_contado)||0;
    if(!(pc>0)) return;                                // sin precio no se inventa uno
    const pk=Number(o.precio_credito)||pc;
    const clave=o.prod_id+"-"+o.pres_cod+"|"+(o.prov_cod||"");
    const ya=porClave[clave];
    if(ya && ya.baseContado <= r2(pc)) return;
    const fotoPres = presFotoDe[o.prod_id+"|"+o.pres_cod] || fotoDe[o.prod_id] || null;
    const prom = promosDe(o.prod_id, o.pres_cod, o.prov_cod, eq, r2(pc));
    porClave[clave]={ id:o.prod_id+"-"+o.pres_cod, prodId:o.prod_id, presCod:o.pres_cod, equiv:eq, provId:o.prov_cod, linea:lineaDe[o.prod_id],
      marca:nom, nombre:nom+" ¬∑ "+o.presentacion, unidad:o.presentacion, foto:fotoPres, diasCredito:30,
      baseContado:r2(pc), baseCredito:r2(pk),
      costo:o.costo!=null?r2(Number(o.costo)):null,
      promosFreelance:prom.freelance, promosProveedor:prom.proveedor };
  });
  const pres=Object.keys(porClave).map(k=>porClave[k]);
  return { provs:(provs||[]).map(p=>({id:p.prov_cod, nombre:p.nombre})), pres };
}

/* ‚îÄ‚îÄ FASE 4 ¬∑ Etapa 3: cat√°logo real COMPARTIDO (pantalla Productos + asistente de voz) ‚îÄ‚îÄ
   Cargador √∫nico con sesi√≥n: productos activos √ó OFERTAS vigentes, en la MISMA forma del
   cat√°logo demo. Single-flight (una sola carga por sesi√≥n). Los consumidores transversales
   leen catProds() al momento de responder: si no hay sesi√≥n o a√∫n no carga, demo.

   ‚îÄ‚îÄ FA-0011 ¬∑ el cat√°logo sale de las OFERTAS, ya no de `precios` ‚îÄ‚îÄ
   El sistema web dej√≥ de escribir en `precios`: hoy un producto nuevo nace con sus ofertas
   en `ofertas_piladora` y CERO filas en `precios`. Leyendo `precios`, el celular no lo ve√≠a.
   Medido contra producci√≥n el 05/08/2026: 59 productos activos ¬∑ 58 con fila en `precios`
   (por eso el sello dec√≠a 58) ¬∑ 59 con oferta vigente. El que faltaba era P-00197
   ¬´Arroz Crecedor¬ª, con 2 ofertas vigentes, 2 presentaciones activas y sin marca. */
let CATALOGO_REAL = null;
let _cargandoCat = null;
const catProds = () => CATALOGO_REAL || PRODUCTOS;
async function cargarCatalogoReal(){
  if (CATALOGO_REAL) return CATALOGO_REAL;
  if (_cargandoCat) return _cargandoCat;
  if (!window.SB || !window.SB.auth) return null;
  _cargandoCat = (async () => {
    try{
      const { data:s } = await window.SB.auth.getSession();
      if(!s || !s.session) return null;
      /* RENDIMIENTO: el cat√°logo NO trae fotos (ni de productos ni de presentaciones); solo
         estructura + precios + qu√© presentaciones YA tienen foto (bandera liviana, sin la imagen).
         La foto real se carga en la ficha del producto, bajo demanda, solo la de ese producto. */
      const [{ data:prods }, { data:presen }, { data:ofertasT }, { data:provsTbl }, { data:promos }, { data:tramos }] = await Promise.all([
        window.SB.from("productos").select("prod_id,nombre,marca,linea,proveedor,proveedor_cod")
          .eq("estado","activo").order("nombre").limit(500),
        window.SB.from("presentaciones").select("pres_id,prod_id,presentacion_cod")
          .eq("activo",true).limit(2000),
        window.SB.from("ofertas_piladora")
          .select("prod_id,prov_cod,pres_cod,equiv_qq,precio_contado,precio_credito,costo,costo_contado,activo,vigente_desde,vigente_hasta")
          .limit(4000),
        window.SB.from("proveedores").select("prov_cod,nombre").limit(500),
        /* PROMO-04 ¬∑ las promociones tambi√©n en la ficha de Productos y en lo que
           responde el asistente: si no vinieran aqu√≠, la app dir√≠a que un producto
           no tiene promociones mientras Tomar pedido s√≠ se las ofrece. */
        window.SB.from("promociones")
          .select("promo_id,nombre,detalle,modalidad,origen,prov_cod,prod_id,pres_cod,base,estado,vigente_desde,vigente_hasta,es_demo")
          .eq("es_demo",false).limit(2000),
        window.SB.from("promocion_tramos").select("promo_id,modalidad,desde_cant,gratis_cant")
          .eq("es_demo",false).limit(4000),
      ]);
      if(!prods || !prods.length) return null;
      const r2=n=>Math.round(n*100)/100;
      /* La fecha del TEL√âFONO, no la de Greenwich: con toISOString(), en Ecuador (UTC-5)
         desde las 19h ya ser√≠a "ma√±ana" y una oferta entrar√≠a a regir cinco horas antes. */
      const _h=new Date();
      const hoyISO=_h.getFullYear()+"-"+String(_h.getMonth()+1).padStart(2,"0")+"-"+String(_h.getDate()).padStart(2,"0");
      const ofertasV=(ofertasT||[]).filter(o=>
        o.activo !== false &&
        (!o.vigente_desde || String(o.vigente_desde).slice(0,10) <= hoyISO) &&
        (!o.vigente_hasta || String(o.vigente_hasta).slice(0,10) >  hoyISO));
      /* PRECIO POR QUINTAL desde la oferta: cada presentaci√≥n se lleva a quintales
         (precio √∑ equiv_qq: la arroba de $4,75 con equiv 0,25 es $19 el quintal) y se guarda
         el M√ÅS BARATO, que es el precio que el vendedor puede sostener cuando varias
         piladoras surten el mismo producto. Un producto, un precio. */
      const precioDe={};
      ofertasV.forEach(o=>{
        const eq=Number(o.equiv_qq)||0; if(!(eq>0)) return;
        const c=(Number(o.precio_contado)||0)/eq; if(!(c>0)) return;
        const k=(Number(o.precio_credito)||Number(o.precio_contado)||0)/eq;
        const g=precioDe[o.prod_id];
        if(!g || c < g.base_contado) precioDe[o.prod_id]={ base_contado:r2(c), base_credito:r2(k||c) };
      });
      /* mapa por presentaci√≥n: prod_id|cod -> pres_id */
      const presDe={}; (presen||[]).forEach(p=>{ presDe[p.prod_id+"|"+p.presentacion_cod]=p.pres_id; });
      const infoPres=(prodId,cod)=>{ const pid=presDe[prodId+"|"+cod]||null; return { pres_id:pid }; };
      /* PILADORAS por producto (con su COSTO por presentaci√≥n): un producto puede salir de varias piladoras */
      const nomProv={}; (provsTbl||[]).forEach(p=>{ nomProv[p.prov_cod]=p.nombre; if(p.prov_cod && p.nombre) PROV_REAL_NOMBRES[p.prov_cod]=p.nombre; });
      const pilaSet={}, ofertasDe={};
      ofertasV.forEach(o=>{ if(!o.prov_cod) return; (pilaSet[o.prod_id]=pilaSet[o.prod_id]||new Set()).add(o.prov_cod); (ofertasDe[o.prod_id]=ofertasDe[o.prod_id]||[]).push(o); });
      const piladorasDe=(pid, provFallback, nomFallback)=>{
        const s=pilaSet[pid];
        if(s && s.size){ return [...s].map(c=>({cod:c, nombre:nomProv[c]||c})); }
        return provFallback ? [{cod:provFallback, nombre:nomFallback||nomProv[provFallback]||provFallback}] : [];
      };
      /* PROMO-04 ¬∑ promociones vivas. Aqu√≠ la l√≠nea es del PRODUCTO, no de una
         piladora concreta (un producto puede salir de varias), as√≠ que la piladora
         va en null: valen todas. El colador de estado, vigencia y presentaci√≥n es
         el mismo de Tomar pedido. */
      const promosDe = promosDelCatalogo({ promos, tramos }, hoyISO);
      /* costos por presentaci√≥n (cod QQ/ARR): lista por piladora con costo contado y cr√©dito */
      const costosDe=(pid, cod)=>(ofertasDe[pid]||[]).filter(o=>o.pres_cod===cod).map(o=>({
        provCod:o.prov_cod, piladora:nomProv[o.prov_cod]||o.prov_cod,
        costoContado:Number(o.costo_contado)||0, costoCredito:Number(o.costo)||0 }));
      const lista=prods.map(p=>{
        if(p.proveedor_cod && p.proveedor) PROV_REAL_NOMBRES[p.proveedor_cod]=p.proveedor;
        const pr=precioDe[p.prod_id];
        if(!pr) return null;   // sin OFERTA vigente no se ofrece (no inventar precios)
        const qqC=Number(pr.base_contado)||0, qqK=Number(pr.base_credito)||0;
        const iQQ=infoPres(p.prod_id,"QQ"), iAR=infoPres(p.prod_id,"ARR");
        /* Un producto SIN MARCA no puede quedar en blanco ni invisible: manda su nombre,
           y si tampoco lo tuviera, el c√≥digo. As√≠ ¬´Arroz Crecedor¬ª (marca en NULL) se ve. */
        const provId=p.proveedor_cod||"", linea=p.linea||"Otros", nom=p.nombre||p.marca||p.prod_id;
        const piladoras=piladorasDe(p.prod_id, provId, p.proveedor||"");
        /* cada presentaci√≥n lleva TODO lo que Tomar pedido necesita para venderla directo (foto se carga en la ficha) */
        const base=(cod,tam,eq,bc,bk,info)=>{
          const prom=promosDe(p.prod_id, cod, null, eq, bc);
          return { id:p.prod_id+"-"+(cod==="QQ"?"QQ":"AR"), presId:(info.pres_id||null), presCod:cod, foto:null,
          tam, prodId:p.prod_id, equiv:eq, provId, linea, marca:nom, nombre:nom+" ¬∑ "+tam, unidad:tam,
          diasCredito:30, costo:null, baseContado:bc, baseCredito:bk, costos:costosDe(p.prod_id, cod),
          promosFreelance:prom.freelance, promosProveedor:prom.proveedor }; };
        return { id:p.prod_id, provId, provNombre:p.proveedor||"", piladoras,
          marca:nom, linea, foto:null, presentaciones:[
            base("QQ","Quintal",1,qqC,qqK,iQQ),
            base("ARR","Arroba 25 lb",0.25,r2(qqC*.25),r2(qqK*.25),iAR),
          ] };
      }).filter(Boolean);
      if(lista.length) CATALOGO_REAL = lista;
      return CATALOGO_REAL;
    }catch(e){ return null; }
    finally{ _cargandoCat = null; }
  })();
  return _cargandoCat;
}

/* ‚îÄ‚îÄ AJU-001-R2 ¬∑ el pedido nace completo o no nace ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
   La organizaci√≥n, el usuario, el precio y la comisi√≥n los resuelve la base.
   Cabecera + l√≠neas + auditor√≠a + llave idempotente viven en UNA transacci√≥n;
   el tel√©fono ya no intenta compensar un fallo borrando la cabecera. */
const CLI_ID_DE = {};
/* ‚ïê‚ïê‚ïê PROMO-03 ¬∑ EL TOPE DEL REGALO LO DICE LA BASE, NO LA APP ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Decisi√≥n del Product Owner (06/08/2026): si el vendedor pone m√°s regalo del
   que concede la promoci√≥n, el pedido NO se guarda y se le muestra el n√∫mero
   exacto que s√≠ concede. Es mercader√≠a regalada: mejor frenar antes que
   reclamar despu√©s.

   El n√∫mero NO se calcula aqu√≠. Se le PREGUNTA a la base, a la funci√≥n
   `gratis_que_concede`, que es la misma que usa el cerrojo de `pedido_items`
   y la misma que usa `facturar_pedido` al confirmar el despacho. Si la app
   tuviera su propia f√≥rmula, el d√≠a que una de las dos se corrija sin la otra
   saldr√≠a grano regalado que nadie autoriz√≥: dos fuentes para un mismo hecho
   siempre terminan contradici√©ndose.

   Todo viaja EN QUINTALES, que es como lo guarda `pedido_items`: la cantidad
   y el regalo se multiplican por el `equiv` de la OFERTA, nunca por lo que
   parezca decir el nombre de la presentaci√≥n. Una arroba son 0,25 qq y ¬´10
   libras¬ª son 0,1 qq: adivinarlo por el texto es regalar diez veces m√°s grano
   del que la piladora despacha (el mismo golpe de `descomponerGratis`).

   Devuelve: n√∫mero = quintales que concede ¬∑ null = no hay promoci√≥n vigente
   ¬∑ undefined = no se pudo preguntar (sin se√±al), y entonces manda el cerrojo
   de la base, que igual no deja pasar la l√≠nea. */
async function topeRegaloQq({prodId, presCod, provId, cantidadQq}){
  if(!window.SB || !window.SB.rpc) return undefined;
  try{
    const { data, error } = await window.SB.rpc("gratis_que_concede", {
      p_prod_id: prodId || null, p_pres_cod: presCod || null,
      p_prov_cod: provId || null, p_cantidad_qq: Number(cantidadQq)||0,
      p_es_demo: false });
    if(error) return undefined;
    return (data===null || data===undefined) ? null : Number(data);
  }catch(e){ return undefined; }
}

/* Revisa el pedido l√≠nea por l√≠nea. Devuelve null si todo est√° en orden, o el
   aviso ‚Äîen criollo, para leerlo en el celular‚Äî de la PRIMERA l√≠nea que se
   pasa. Mientras haya aviso, el pedido no se guarda ni en el tel√©fono.

   P3 queda fuera a prop√≥sito: ese regalo lo arma el vendedor y sale de SU
   comisi√≥n, no de ninguna promoci√≥n. Bloquearlo contra una promoci√≥n que no
   existe ser√≠a matar una funci√≥n que hoy trabaja. */
async function revisarRegaloDePromo(items, provId){
  const r2 = x => Math.round(x*100)/100;
  for(const it of (items||[])){
    if(!it || !it.prod) continue;
    if(it.tipo === "P3") continue;
    if(!it.prod.prodId) continue;              /* producto de demostraci√≥n: no llega a la base */
    const eq = Number(it.prod.equiv)>0 ? Number(it.prod.equiv) : 1;
    const regaloQq = r2((Number(it.gratis)||0)*eq);
    if(!(regaloQq > 0)) continue;
    const cantQq = r2((Number(it.cant)||0)*eq);
    const tope = await topeRegaloQq({ prodId:it.prod.prodId, presCod:it.prod.presCod,
      provId: provId, cantidadQq: cantQq });
    if(tope === undefined) continue;
    const nom = it.prodNombre || it.prod.nombre || "ese producto";
    if(tope === null)
      return "üö´ No se puede regalar en " + nom + "\n\n" +
             "Ese producto no tiene promoci√≥n vigente ahora mismo.\n\n" +
             "Quita el regalo, o usa ¬´Promo vendedor¬ª, que sale de tu comisi√≥n.";
    if(regaloQq > tope + 0.005)
      return "üö´ Te pasaste con el regalo en " + nom + "\n\n" +
             "Pusiste " + r2(regaloQq) + " qq de regalo y por " + r2(cantQq) +
             " qq la promoci√≥n concede " + r2(tope) + " qq.\n\n" +
             "Baja el regalo a " + r2(tope) + " qq o sube la cantidad, y vuelve a guardar.";
  }
  return null;
}

async function guardarPedidoEnBase({cli, prov, carrito, ubic, retiro, asumeFlete, asumeEstibada, idempotencia}){
  try{
    if(!window.SB || !window.SB.auth) return { ok:false, motivo:"sin_conexion" };
    const { data:s } = await window.SB.auth.getSession();
    if(!s || !s.session) return { ok:false, motivo:"sin_sesion" };
    const cliId = CLI_ID_DE[(cli && cli.nombre) || cli];
    if(!cliId) return { ok:false, motivo:"cliente_demo" };
    const items = (carrito||[]).filter(it=>it && it.prod);
    if(!items.length || items.some(it=>!it.prod.prodId || !it.prod.equiv)) return { ok:false, motivo:"producto_demo" };
    /* PROMO-03 ¬∑ antes de tocar la base: el regalo no puede pasar de lo que
       concede la promoci√≥n. Si se pasa, no nace ni la cabecera del pedido. */
    const avisoRegalo = await revisarRegaloDePromo(items, (prov && prov.id)||null);
    if(avisoRegalo) return { ok:false, motivo:avisoRegalo, regalo:true };
    const condicion=items.some(it=>it.credito)?"credito":"contado";
    const opId=idempotencia||("PED-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,9).toUpperCase());
    const payload={
      cliente_id:cliId, proveedor_id:(prov&&prov.id)||null, condicion,
      ubicacion_id:retiro?null:((ubic&&ubic.ubic_id)||null), retiro_bodega:!!retiro,
      asume_flete:retiro?null:(asumeFlete||"freelance"),
      asume_estibada:retiro?null:(asumeEstibada||"freelance"),
      items:items.map(it=>({
        prod_id:it.prod.prodId, pres_cod:it.prod.presCod,
        cantidad_presentacion:Number(it.cant), gratis_presentacion:Number(it.gratis)||0,
        precio_presentacion:Number(it.precio), tipo_precio:it.tipo,
        condicion:it.credito?"credito":"contado", promo_id:it.promoId||null,
        comision_propuesta:it.tipo==="P5"?(Number(it.comisionTotal)||0):null,
      })),
    };
    const {data,error}=await window.SB.rpc("registrar_pedido_atomico",{p_payload:payload,p_op_id:opId});
    if(error) return {ok:false,motivo:error.message||"error_pedido",error};
    const r=(data&&data[0])||data||{};
    return {ok:true,pedId:r.ped_id||opId,repetido:!!r.repetido,resumen:r.resumen||null};
  }catch(e){ registrarError("pedido.guardar",e); return { ok:false, motivo:navigator.onLine===false?"sin_conexion":"error", error:e }; }
}

async function encolarPedidoOffline(payload){
  const id=payload.idempotencia||("PD-O"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase());
  const op={id,tipo:"pedido",creado:ahoraEC(),intentos:0,payload:{...payload,idempotencia:id}};
  await colaOfflineGuardar(op); return op;
}
async function procesarColaPedidos(onCambio){
  if(navigator.onLine===false) return {enviados:0,pendientes:(await colaOfflineListar()).length};
  const cola=(await colaOfflineListar()).filter(x=>x.tipo==="pedido").sort((a,b)=>String(a.creado).localeCompare(String(b.creado)));
  let enviados=0;
  for(const op of cola){
    const r=await guardarPedidoEnBase(op.payload);
    if(r.ok){ await colaOfflineBorrar(op.id); enviados++; if(onCambio) onCambio(op,r); continue; }
    op.intentos=(op.intentos||0)+1; op.ultimoError=String(r.motivo||"error"); op.ultimoIntento=ahoraEC(); await colaOfflineGuardar(op);
    if(["sin_conexion","sin_sesion","error"].includes(r.motivo)) break;
  }
  return {enviados,pendientes:(await colaOfflineListar()).filter(x=>x.tipo==="pedido").length};
}

/* ‚ïê‚ïê‚ïê b327 ¬∑ MOTOR DE PROMOCIONES (reglas selladas, r√©plica Comisionista b149) ‚ïê‚ïê‚ïê
   ¬∑ Vigencia desde/hasta obligatoria: fuera de fecha la promo NO aparece.
   ¬∑ Gratis PROPORCIONAL sin tope: (cantidad/minimo)√ógratis, con decimales.
   ¬∑ La comisi√≥n del vendedor se calcula sobre los qq PAGADOS.
   ¬∑ paga:"freelance" sale del margen del freelance; paga:"proveedor" la financia el proveedor.
   ¬∑ El decimal de las gratis se DESCOMPONE en las presentaciones reales del
     producto (mayor‚Üímenor); lo que no calce se redondea abajo y se avisa. */
/* PROMO-04 ¬∑ la fecha del TEL√âFONO, no la de Greenwich. Con toISOString(), en
   Ecuador (UTC-5) desde las 19h ya ser√≠a ma√±ana: una promoci√≥n que muere hoy
   desaparecer√≠a del selector cinco horas antes de tiempo, aunque la base la
   siguiera concediendo. Es el mismo colador que usa el cat√°logo. */
const HOY_PROMO = (()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
const promoVigente = pm => (pm.activa!==false)
  && (!pm.desde || pm.desde<=HOY_PROMO) && (!pm.hasta || pm.hasta>=HOY_PROMO);
const promosVigentes = lista => (lista||[]).filter(promoVigente);
const gratisDePromo = (pm,cant) => (!pm||!pm.minimo||!pm.gratis||!(cant>0)) ? 0
  : Math.round((cant/pm.minimo)*pm.gratis*100)/100;
const qqDeTam = t => { if(!t) return 1;
  if(/quintal/i.test(t)) return 1;
  if(/arroba/i.test(t)) return 0.25;
  let m=t.match(/([\d.]+)\s*kg/i); if(m) return (parseFloat(m[1])||0)/45.4;
  m=t.match(/([\d.]+)\s*lb/i); if(m) return (parseFloat(m[1])||0)/100;
  return 1; };
/* ‚ïê‚ïê‚ïê EL DESGLOSE DE LAS UNIDADES GRATIS ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Cu√°nto grano se REGALA y en qu√© presentaciones sale de la bodega. Dos reglas,
   las dos aprendidas a golpes:

   1) La equivalencia sale de la OFERTA (`equiv`), NUNCA del texto de la unidad.
      ¬´10 libras¬ª son 0,1 qq en la oferta y el conversor por texto devuelve 1:
      diez veces m√°s grano regalado del que la piladora despacha. Es el mismo
      antecedente del transportista, donde una parada de 65 qq se ve√≠a como
      ¬´22 qq¬ª porque los quintales sal√≠an del NOMBRE del producto.

   2) Las presentaciones hermanas se emparejan por PRODUCTO (`prodId`), nunca
      por marca: hay productos vivos con la marca en blanco (P-00197 ¬´Arroz
      Crecedor¬ª), y con el filtro por marca no calzaban con nada, as√≠ que el
      desglose sal√≠a VAC√çO y en pantalla solo quedaba el aviso naranja ¬´No calza
      N qq en presentaciones¬ª. Y solo entran las de la MISMA piladora: no se
      puede regalar un saco que esa piladora no despacha.

   En la demostraci√≥n no hay oferta ni `prodId`: solo ah√≠ se cae a la marca y a
   qqDeTam, el conversor por texto que el resto de la app ya usa.
   ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê */
const equivDe = p => (p && Number(p.equiv)>0) ? Number(p.equiv) : qqDeTam(p && p.unidad);
const hermanasDe = (prod, lista) => {
  if(!prod) return [];
  const todas = (lista && lista.length) ? lista : PRESENTACIONES;
  return todas.filter(p => (prod.prodId && p.prodId)
    ? (p.prodId===prod.prodId && (!prod.provId || !p.provId || p.provId===prod.provId))
    : (p.marca!=null && p.marca===prod.marca));
};
const descomponerGratis = (qq, prod, lista) => {
  const dispo = hermanasDe(prod, lista)
    .map(p=>({tam:p.unidad, eq:equivDe(p)})).filter(p=>p.eq>0).sort((a,b)=>b.eq-a.eq);
  const partes=[]; let resto=Math.round(qq*10000)/10000;
  for(const p of dispo){
    const n=Math.floor(resto/p.eq + 1e-9);
    if(n>0){ partes.push({tam:p.tam, n}); resto=Math.round((resto-n*p.eq)*10000)/10000; }
  }
  return {partes, resto};
};
const textoDesglose = d => d.partes.map(p=>p.n+" "+p.tam).join(" + ");

/* ‚îÄ‚îÄ Registro global de modales abiertos ‚îÄ‚îÄ
   Cualquier ventana emergente se apunta aqu√≠ al abrirse. El bot√≥n atr√°s (app o Android)
   cierra SIEMPRE el √∫ltimo modal abierto antes de retroceder de pantalla. */
const MODALES=[];
/* ‚îÄ‚îÄ Gesto: deslizar desde el borde izquierdo abre el men√∫ lateral ‚îÄ‚îÄ
   Solo se activa si el arrastre empieza en el borde (20 px), es claramente
   horizontal y recorre m√°s de 60 px. No abre si hay una ventana encima. */
/* Mantener aplastado un bot√≥n para repetir la acci√≥n (usado en ‚àí / + de cantidad).
   Un toque corto hace un solo paso; al sostener, arranca tras 400 ms y va acelerando. */
function usarRepetir(accion){
  const ref = React.useRef({t:null, i:null, fn:null});
  ref.current.fn = accion;
  const parar = React.useCallback(()=>{
    const r=ref.current;
    if(r.t){ clearTimeout(r.t); r.t=null; }
    if(r.i){ clearInterval(r.i); r.i=null; }
  },[]);
  const arrancar = React.useCallback(()=>{
    const r=ref.current;
    parar();
    r.fn();                                   /* el primer paso es inmediato */
    r.t = setTimeout(()=>{
      let ms = 140, pasos = 0;
      const tic = ()=>{
        r.fn(); pasos++;
        if(pasos===6 && ms>60){ ms=60; clearInterval(r.i); r.i=setInterval(tic,ms); }
      };
      r.i = setInterval(tic, ms);
    }, 400);
  },[parar]);
  React.useEffect(()=>parar,[parar]);         /* limpia si la pantalla se cierra */
  return {
    onPointerDown:(e)=>{ e.preventDefault(); arrancar(); },
    onPointerUp:parar, onPointerLeave:parar, onPointerCancel:parar,
  };
}

function useGestoDrawer(abrir, activo){
  React.useEffect(()=>{
    if(!activo) return;
    const BORDE=20, MINIMO=60;
    let x0=0, y0=0, valido=false;

    const inicio=(e)=>{
      const t=e.touches&&e.touches[0]; if(!t) return;
      /* debe empezar pegado al borde izquierdo de la app, no de la ventana */
      const caja=document.querySelector(".shell");
      const izq=caja ? caja.getBoundingClientRect().left : 0;
      valido = (t.clientX - izq) <= BORDE && MODALES.length===0;
      x0=t.clientX; y0=t.clientY;
    };
    const mover=(e)=>{
      if(!valido) return;
      const t=e.touches&&e.touches[0]; if(!t) return;
      const dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
      /* horizontal de verdad: avanza al menos el doble de lo que sube o baja */
      if(dx>MINIMO && dx>dy*2){ valido=false; abrir(); }
      /* si se va en vertical, era un desplazamiento normal: se descarta */
      if(dy>28) valido=false;
    };
    const fin=()=>{ valido=false; };

    document.addEventListener("touchstart", inicio, {passive:true});
    document.addEventListener("touchmove", mover, {passive:true});
    document.addEventListener("touchend", fin, {passive:true});
    document.addEventListener("touchcancel", fin, {passive:true});
    return ()=>{
      document.removeEventListener("touchstart", inicio);
      document.removeEventListener("touchmove", mover);
      document.removeEventListener("touchend", fin);
      document.removeEventListener("touchcancel", fin);
    };
  },[abrir,activo]);
}

function useModal(abierto, cerrar){
  React.useEffect(()=>{
    if(!abierto) return;
    const item={cerrar};
    MODALES.push(item);
    return ()=>{ const i=MODALES.indexOf(item); if(i>=0) MODALES.splice(i,1); };
  },[abierto,cerrar]);
}
function cerrarUltimoModal(){
  if(MODALES.length===0) return false;
  const m=MODALES[MODALES.length-1];
  try{ m.cerrar(); }catch(e){}
  return true;
}

/* ‚îÄ‚îÄ Pila de retrocesos por m√≥dulo ‚îÄ‚îÄ
   Cada m√≥dulo montado deja su funci√≥n aqu√≠. El bot√≥n atr√°s consulta del √∫ltimo al primero.
   Con pila (y no una sola variable) ning√∫n m√≥dulo puede borrar el handler de otro. */
const RETROCESOS=[];
function useRetroceso(fn){
  const ref=React.useRef(fn);
  ref.current=fn;
  React.useEffect(()=>{
    const item={ run:()=>ref.current() };
    RETROCESOS.push(item);
    return ()=>{ const i=RETROCESOS.indexOf(item); if(i>=0) RETROCESOS.splice(i,1); };
  },[]);
}
function retrocederEnModulo(){
  for(let i=RETROCESOS.length-1;i>=0;i--){
    try{ if(RETROCESOS[i].run()) return true; }catch(e){}
  }
  return false;
}

  return (

/* Gr√°fico de l√≠nea suave con √°rea y puntos */
function NeuLinea({datos=[], etiquetas=[], color="#2E7D52", alto=130, formato=(v)=>v}){
  if(!datos.length) return <div className="ph">Sin datos.</div>;
  const W=320, H=alto, PX=8, PY=26, PB=20;   // PY amplio: deja aire para la etiqueta del m√°ximo
  const min=Math.min(...datos), max=Math.max(...datos);
  const rango=(max-min)||1;
  const x=i=>PX+(i*(W-PX*2))/Math.max(1,datos.length-1);
  const y=v=>PY+(H-PY-PB)*(1-(v-min)/rango);
  const pts=datos.map((v,i)=>[x(i),y(v)]);
  /* curva suave */
  let d=`M ${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){
    const [px,py]=pts[i-1], [cx2,cy2]=pts[i];
    const mx=(px+cx2)/2;
    d+=` C ${mx},${py} ${mx},${cy2} ${cx2},${cy2}`;
  }
  const area=d+` L ${pts[pts.length-1][0]},${H-PB} L ${pts[0][0]},${H-PB} Z`;
  const idMax=datos.indexOf(max);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      <defs>
        <linearGradient id={"gr"+color.replace("#","")} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".22"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#gr${color.replace("#","")})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map(([px,py],i)=>(
        <circle key={i} cx={px} cy={py} r={i===idMax?4.5:3} fill="var(--card)" stroke={color} strokeWidth="2.4"/>
      ))}
      {idMax>=0 && (
        <text x={pts[idMax][0]} y={pts[idMax][1]-10} textAnchor="middle" fontSize="10" fontWeight="800"
          fill="var(--ink)" fontFamily="'Space Grotesk',sans-serif">{formato(max)}</text>
      )}
      {etiquetas.map((e,i)=>(
        <text key={i} x={x(i)} y={H-5} textAnchor="middle" fontSize="8.5" fill="var(--muted)" fontFamily="inherit">{e}</text>
      ))}
    </svg>
  );
}

/* Calendario del mes con d√≠as destacados */
function NeuCalendario({anio, mes, marcados=[], color="#2E7D52", onDia}){
  const DIAS=["L","M","M","J","V","S","D"];
  const primero=new Date(anio,mes,1);
  const desplazamiento=(primero.getDay()+6)%7;      // lunes primero
  const total=new Date(anio,mes+1,0).getDate();
  const celdas=[];
  for(let i=0;i<desplazamiento;i++) celdas.push(null);
  for(let d=1;d<=total;d++) celdas.push(d);
  const marca=(d)=>marcados.find(m=>m.dia===d);
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:5}}>
        {DIAS.map((d,i)=><span key={i} style={{textAlign:"center",fontSize:9.5,fontWeight:700,color:"var(--muted)"}}>{d}</span>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {celdas.map((d,i)=>{
          if(d===null) return <span key={i}></span>;
          const m=marca(d);
          return (
            <button key={i} onClick={()=>onDia&&m&&onDia(m)} disabled={!m}
              style={{aspectRatio:"1",border:"none",borderRadius:9,fontFamily:"inherit",fontSize:11,
                fontWeight:m?800:500,cursor:m?"pointer":"default",
                background:m?(m.color||color):"transparent",

                boxShadow:m?"2px 2px 6px rgba(23,43,32,.14)":"none",
                display:"flex",alignItems:"center",justifyContent:"center"}}>
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ‚îÄ‚îÄ Lector de comprobantes (OCR): el usuario digita el valor, la foto llena el resto ‚îÄ‚îÄ */
let _OCRW=null;
async function ocrComprobante(img){
  try{
    if(!window.Tesseract) return null;
    if(!_OCRW) _OCRW = window.Tesseract.createWorker("spa");
    const w = await _OCRW;
    const r = await w.recognize(img);
    return extraerComprobante((r && r.data && r.data.text) || "");
  }catch(e){ _OCRW=null; return null; }
}
function parseMontoOCR(s){
  s=String(s).trim();
  const pc=s.lastIndexOf(","), pd=s.lastIndexOf(".");
  if(pc>-1 && pd>-1){ s = pc>pd ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(pc>-1){ const dec=s.length-pc-1; s = dec===3 ? s.replace(/,/g,"") : s.replace(/,/g,"."); }
  const n=parseFloat(s.replace(/[^\d.]/g,""));
  return (isFinite(n) && n>0) ? Math.round(n*100)/100 : null;
}
function extraerComprobante(txt){
  const T=String(txt).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  /* diccionario por banco: palabra clave ‚Üí nombre del cat√°logo */
  const CLAVES=[["PICHINCHA","Pichincha"],["PACIFICO","Pac√≠fico"],["GUAYAQUIL","Guayaquil"],
    ["PRODUBANCO","Produbanco"],["INTERNACIONAL","Internacional"],["BOLIVARIANO","Bolivariano"],
    ["AUSTRO","Austro"],["MACHALA","Machala"],["JEP","JEP"],["BANECUADOR","BanEcuador"]];
  let banco=null;
  for(const [k,v] of CLAVES){ if(T.includes(k)){ banco=BANCOS.find(x=>x.toUpperCase().includes(k))||null; if(banco) break; } }
  let valor=null;
  const mv=T.match(/(?:VALOR|MONTO|TOTAL|DEBITADO|ACREDITADO|USD)[^\d\-]{0,12}([\d][\d.,]{2,14})/);
  if(mv) valor=parseMontoOCR(mv[1]);
  if(valor==null){
    const todos=[...T.matchAll(/\$\s*([\d][\d.,]{2,14})/g)].map(m=>parseMontoOCR(m[1])).filter(x=>x!=null);
    if(todos.length) valor=todos[0];
  }
  let numero=null;
  const mn=T.match(/(?:COMPROBANTE|TRANSACCION|REFERENCIA|SECUENCIAL|DOCUMENTO|OPERACION|OP)\.?[^\d]{0,10}(\d{5,15})/);
  if(mn) numero=mn[1];
  let fecha=null;
  const mf=T.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(mf){ fecha=`${mf[3]}-${String(mf[2]).padStart(2,"0")}-${String(mf[1]).padStart(2,"0")}`; }
  else{
    const MES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,OCT:10,NOV:11,DIC:12};
    const mm=T.match(/(\d{1,2})\s+(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)[A-Z]*\s+(\d{4})/);
    if(mm) fecha=`${mm[3]}-${String(MES[mm[2]]).padStart(2,"0")}-${String(mm[1]).padStart(2,"0")}`;
  }
  if(!banco && valor==null && !numero && !fecha) return null;
  return {banco, numero, fecha, valor};
}

function cargarUsos(){
  const base = JSON.parse(JSON.stringify(USOS_SEMILLA));
  try{
    const g = JSON.parse(localStorage.getItem(USOS_KEY) || "null");
    if(!g || typeof g!=="object") return base;
    for(const cat in g){
      if(!g[cat] || typeof g[cat]!=="object") continue;
      base[cat] = Object.assign(base[cat]||{}, g[cat]);
    }
  }catch(e){}
  return base;
}

const USO_ULTIMO = ["Otro","Otros","Ninguno","No aplica"];
const usoClave = it => typeof it==="string" ? it
  : (it && (it.nombre||it.nom||it.t||it.label||it.cli||it.id)) || String(it);
/* registra una selecci√≥n */
const regUso = (cat, it) => {
  if(!cat || it==null) return it;
  const k = usoClave(it); if(!k) return it;
  (USOS[cat] = USOS[cat] || {});
  USOS[cat][k] = (USOS[cat][k]||0) + 1;
  guardarUsos();
  return it;
};
/* ordena una lista por uso (mayor‚Üímenor), con desempate alfab√©tico */
const ordUso = (cat, lista) => {
  if(!cat || USO_FIJO.includes(cat) || !Array.isArray(lista)) return lista;
  const c = USOS[cat] || {};
  return lista.slice().sort((a,b)=>{
    const ka=usoClave(a), kb=usoClave(b);
    const fa=USO_ULTIMO.includes(ka)?1:0, fb=USO_ULTIMO.includes(kb)?1:0;
    if(fa!==fb) return fa-fb;                      /* "Otro" siempre al fondo */
    return ((c[kb]||0)-(c[ka]||0)) || String(ka).localeCompare(String(kb),"es");
  });
};
