};

function VentasInicio(){
  const anios=Object.keys(VENTAS_PROVEEDOR).map(Number).sort((a,b)=>b-a);
  const ANIO_ACTUAL=new Date().getFullYear();
  const [anio,setAnio]=useState(anios.includes(ANIO_ACTUAL)?ANIO_ACTUAL:(anios[0]||ANIO_ACTUAL));
  const [prov,setProv]=useState("Todos");
  const [linea,setLinea]=useState("Todas");
  const [unidad,setUnidad]=useState("monto"); // monto | qq | caja | unidad
  const [abierto,setAbierto]=useState(false);

  const lineas=Object.keys(LINEAS_CFG);
  const cfg=linea!=="Todas"?LINEAS_CFG[linea]:null;
  let unidadesDisp;
  if(linea==="Todas") unidadesDisp=[["monto","D√≥lares"]];
  else if(cfg.unidad==="qq") unidadesDisp=[["monto","D√≥lares"],["qq","Quintales"]];
  else {
    unidadesDisp=[["monto","D√≥lares"],["caja","Cajas"]];
    if(cfg.uxFardo) unidadesDisp.push(["fardo","Fardos"]);
    unidadesDisp.push(["unidad","Unidades"]);
  }
  const unidadOk = unidadesDisp.some(u=>u[0]===unidad) ? unidad : "monto";

  const vals=Array(12).fill(0);
  if(linea==="Todas"){
    const dataAnio=VENTAS_PROVEEDOR[anio]||{};
    Object.keys(dataAnio).forEach(pid=>{
      if(prov==="Todos"||prov===pid) dataAnio[pid].forEach((v,i)=>vals[i]+=v);
    });
  } else {
    const arr=(VENTAS_LINEA[anio]||{})[linea]||Array(12).fill(0);
    arr.forEach((usd,i)=>{
      if(unidadOk==="monto") vals[i]=usd;
      else if(unidadOk==="qq") vals[i]=usd/(cfg.precio||40);
      else if(unidadOk==="caja") vals[i]=usd/(cfg.precioCaja||20);
      else if(unidadOk==="fardo") vals[i]=usd/(cfg.precioCaja||20)*(cfg.uxCaja||1)/(cfg.uxFardo||1);
      else if(unidadOk==="unidad") vals[i]=usd/(cfg.precioCaja||20)*(cfg.uxCaja||1);
    });
  }
  const totalAnio=vals.reduce((a,b)=>a+b,0);
  const uLbl={monto:null, qq:"qq", caja:"cajas", fardo:"fardos", unidad:"u"};
  const totalTxt=unidadOk==="monto"?money(totalAnio):Math.round(totalAnio)+" "+uLbl[unidadOk];
  const colorBarra=unidadOk==="monto"?"var(--field-700)":unidadOk==="qq"?"#3A6EA5":unidadOk==="caja"?"#7A5BA8":unidadOk==="fardo"?"#3F7C8C":"#C77F00";

  return (
    <div style={{marginBottom:18}}>
      
      <button className="ventas-cab" onClick={()=>setAbierto(v=>!v)}>
        <span className="ventas-cab-ic">üìä</span>
        <div style={{flex:1,textAlign:"left"}}>
          <div className="ventas-cab-t">Ventas mes a mes</div>
          <div className="ventas-cab-s">{anio} ¬∑ {linea==="Todas"?"todas las l√≠neas":linea} ¬∑ {totalTxt}</div>
        </div>
        <span className="ventas-cab-fl">{abierto?"‚ñ≤":"‚ñº"}</span>
      </button>

      {abierto && (<>
        
        <div className="cm-filtros" style={{margin:"10px 0 8px"}}>
          <FiltroBuscador items={anios} value={anio}
            onPick={v=>setAnio(v==="__"?anios[0]:Number(v))}
            todos="__" etiquetaTodos="A√±o‚Ä¶"/>
          <FiltroBuscador items={lineas} value={linea}
            onPick={v=>{setLinea(v); setUnidad("monto");}}
            todos="Todas" etiquetaTodos="Todas las l√≠neas"/>
        </div>

        {linea==="Todas" && (
          <div className="cm-filtros" style={{marginBottom:8}}>
            <FiltroBuscador estilo={{gridColumn:"1 / -1"}}
              items={PROVEEDORES.map(p=>p.id)} value={prov} onPick={setProv}
              todos="Todos" etiquetaTodos="Todos los proveedores"
              render={id=>{const p=PROVEEDORES.find(x=>x.id===id);return p?p.nombre:id;}}/>
          </div>
        )}

        <div className="cm-unidad" style={{marginBottom:8}}>
          {unidadesDisp.map(([k,lbl])=>(
            <button key={k} className={unidadOk===k?"on":""} onClick={()=>setUnidad(k)}>{lbl}</button>
          ))}
        </div>

        <BarrasComision valores={vals} color={colorBarra} unidad={unidadOk==="monto"?undefined:"otra"} unidadLbl={uLbl[unidadOk]}/>
      </>)}
    </div>
  );
}

/* b351 ¬∑ AU HONESTO para Mi D√≠a: con sesi√≥n, el c√≥digo sale de au_codigo() y el

const auDemo=()=>"AU-DEMO-"+Math.floor(1000+Math.random()*9000);

async function auReal(tabla, operacion, regId, valor){
  try{

/* ‚ïê‚ïê‚ïê‚ïê‚ïê b356 ¬∑ AVISOS AL TEL√âFONO (push real, nivel 3) ‚ïê‚ïê‚ïê‚ïê‚ïê
   El tel√©fono se suscribe al canal (llave p√∫blica VAPID) y guarda su direcci√≥n
   en la base con la cuenta. El servidor (funci√≥n empujar-avisos + reloj cada
   5 min) empuja los fallos urgentes aunque la app est√© cerrada. */
const VAPID_PUBLICA = "BH6rClWELQLw7218YApJHAanTLkyL6NZ230pYsTnkrbv8EEBsVg-3IjoYm_8c0LzyfmMuSvqOI6AGWSaFPp6y7Y";
function b64aUint8(b64){
  const p = "=".repeat((4 - b64.length % 4) % 4);
  const s = (b64 + p).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(s);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function TarjetaAvisosTelefono({toast}){
  const [estado,setEstado]=useState("cargando");   /* cargando | apagado | activo | no-soporta */
  const [correo,setCorreo]=useState(null);
  const [ocupado,setOcupado]=useState(false);
  React.useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        if(!("serviceWorker" in navigator) || !("PushManager" in window) || location.protocol!=="https:"){
          if(vivo) setEstado("no-soporta"); return;
        }
        if(window.SB){
          const { data } = await window.SB.auth.getSession();
          if(vivo && data && data.session) setCorreo(data.session.user.email);
        }
        const reg = await navigator.serviceWorker.ready;
        const sus = await reg.pushManager.getSubscription();
        if(vivo) setEstado(sus ? "activo" : "apagado");
      }catch(e){ if(vivo) setEstado("no-soporta"); }
    })();
    return ()=>{ vivo=false; };
  },[]);
  const activar=async()=>{
    if(ocupado) return;
    if(!correo){ toast("Entra con tu cuenta (portal) para activar los avisos."); return; }
    setOcupado(true);
    try{
      const permiso = await Notification.requestPermission();
      if(permiso!=="granted"){ toast("Sin permiso de avisos: act√≠valo en los ajustes del tel√©fono."); setOcupado(false); return; }
      const reg = await navigator.serviceWorker.ready;
      let sus = await reg.pushManager.getSubscription();
      if(!sus) sus = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64aUint8(VAPID_PUBLICA) });
      const j = sus.toJSON();
      /* b357 ¬∑ qui√©n es: el servidor dirige los avisos por rol y por persona */
      let quien = {};
      try{
        const { data:s2 } = await window.SB.auth.getSession();
        const { data:u } = await window.SB.from("usuarios").select("usr_id,rol").eq("auth_uid", s2.session.user.id).maybeSingle();
        if(u) quien = { rol:u.rol, usr_id:u.usr_id };
      }catch(e){}
      const { error } = await window.SB.from("push_suscripciones").upsert(
        { sus_id:"PS-"+new Date().getTime(), usuario:correo, endpoint:j.endpoint,
          p256dh:j.keys.p256dh, auth:j.keys.auth, activo:true, ...quien },
        { onConflict:"endpoint" });
      if(error){ toast("No se pudo registrar: "+(error.message||"error")); setOcupado(false); return; }
      await auReal("push_suscripciones","ALTA",correo,{nota:"avisos activados en un tel√©fono"});
      setEstado("activo");
      toast("Avisos activados en este tel√©fono ‚úì");
    }catch(e){ toast("No se pudo activar: "+(e.message||"error")); }
    setOcupado(false);
  };
  const apagar=async()=>{
    if(ocupado) return;
    setOcupado(true);
    try{
      const reg = await navigator.serviceWorker.ready;
      const sus = await reg.pushManager.getSubscription();
      if(sus){
        const ep = sus.endpoint;
        await sus.unsubscribe();
        try{ await window.SB.from("push_suscripciones").update({activo:false}).eq("endpoint", ep); }catch(e){}
      }
      setEstado("apagado");
      toast("Avisos apagados en este tel√©fono");
    }catch(e){ toast("No se pudo apagar."); }
    setOcupado(false);
  };
  const probar=async()=>{
    if(ocupado) return;
    setOcupado(true);
    try{
      const { data, error } = await window.SB.functions.invoke("empujar-avisos", { body:{ modo:"prueba" } });
      if(error){ toast("No se pudo probar: "+(error.message||"error")); }
      else if(data && data.enviados>0){ toast("Aviso de prueba enviado ‚úì Mira la bandeja del tel√©fono."); }
      else { toast((data&&data.motivo) || "No lleg√≥ a ning√∫n tel√©fono."); }
    }catch(e){ toast("No se pudo probar el aviso."); }
    setOcupado(false);
  };
  return (
    <div className="fcard" style={{marginBottom:14}}>
      <div className="aj-row" style={{alignItems:"flex-start",padding:"4px 0"}}>
        <div style={{flex:1,minWidth:0,paddingRight:10}}>
          <div className="aj-k">üì≥ Avisos en este tel√©fono</div>
          <div className="aj-s">
            {estado==="cargando" ? "Comprobando‚Ä¶"
             : estado==="no-soporta" ? "Disponible en la app instalada (HTTPS)"
             : estado==="activo" ? "Suena con la app cerrada: fallos urgentes, pedidos nuevos, solicitudes y cobros que vencen hoy"
             : "Act√≠valos y el tel√©fono avisar√° aunque la app est√© cerrada"}</div>
        </div>
        {(estado==="activo"||estado==="apagado") && (
          <button className={"aj-switch"+(estado==="activo"?" on":"")} disabled={ocupado}
            onClick={()=>{ estado==="activo" ? apagar() : activar(); }}><span className="aj-knob"></span></button>
        )}
      </div>
      {estado==="activo" && (
        <button className="ghost" style={{width:"100%",marginTop:8}} disabled={ocupado}
          onClick={probar}>üîî Probar aviso ahora</button>
      )}
    </div>
  );
}

/* ‚ïê‚ïê‚ïê‚ïê‚ïê CHAT DEL EQUIPO ¬∑ pantalla para las apps del celular ‚ïê‚ïê‚ïê‚ïê‚ïê
   Conversaciones reales entre las personas del padr√≥n (misma tabla que el
   sistema web, chat_mensajes). Llegan en tiempo real, con fotos y audios en
   dep√≥sito privado. Sin sesi√≥n, la pantalla lo dice con honestidad.
   Estilos en l√≠nea a prop√≥sito: as√≠ se ve igual en las 5 apps. */
function ChatEquipo({ usuario, toast }){
  const [miUsr,setMiUsr]=useState(null);
  const [contactos,setContactos]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [sel,setSel]=useState(null);
  const [txt,setTxt]=useState("");
  const [estado,setEstado]=useState("cargando");   /* cargando | vivo | sin-sesion */
  const [grabando,setGrabando]=useState(false);
  const [enviando,setEnviando]=useState(false);
  const recRef=React.useRef(null), iniRef=React.useRef(0), hiloRef=React.useRef(null);
  const ICONO={ freelance:"üåæ", admin:"üõ°Ô∏è", comisionista:"üßë‚Äçüíº", socio:"ü§ù",
    proveedor:"üè≠", transportista:"üöõ", logistica:"üó∫Ô∏è", financiero:"üßÆ" };
  const ROL={ freelance:"Freelance", admin:"Administraci√≥n", comisionista:"Comisionista",
    socio:"Socio comercial", proveedor:"Proveedor", transportista:"Transportista",
    logistica:"Log√≠stica", financiero:"Contadora" };
  const traducir=(m,yo)=>({ id:m.msg_id, con: m.de_usr===yo ? m.para_usr : m.de_usr,
    mio: m.de_usr===yo, aviso: m.tipo==="aviso", tipo:m.tipo, texto:m.texto||"",
    adjunto:m.adjunto||null, hora:String(m.creado||"").slice(11,16),
    fecha:String(m.creado||"").slice(0,10), leido:!!m.leido });

  React.useEffect(()=>{
    let vivo=true, canal=null;
    (async()=>{
      try{
        if(!window.SB){ if(vivo) setEstado("sin-sesion"); return; }
        const { data:s } = await window.SB.auth.getSession();
        if(!vivo) return;
        if(!s || !s.session){ setEstado("sin-sesion"); return; }
        const { data:yo } = await window.SB.from("usuarios").select("usr_id").eq("auth_uid", s.session.user.id).maybeSingle();
        if(!vivo) return;
        if(!yo){ setEstado("sin-sesion"); return; }
        setMiUsr(yo.usr_id);
        const [{ data:us }, { data:ms }] = await Promise.all([
          window.SB.from("usuarios").select("usr_id,nombre,rol,activo").neq("usr_id", yo.usr_id),
          window.SB.from("chat_mensajes").select("*").order("creado").limit(400),
        ]);
        if(!vivo) return;
        setContactos((us||[]).filter(u=>u.activo!==false).map(u=>({
          id:u.usr_id, nombre:u.nombre, rol:ROL[u.rol]||u.rol, ico:ICONO[u.rol]||"üë§" })));
        setMsgs((ms||[]).map(m=>traducir(m, yo.usr_id)));
        setEstado("vivo");
        canal = window.SB.channel("chat-app")
          .on("postgres_changes", { event:"INSERT", schema:"public", table:"chat_mensajes" },
            (ev)=>{ const m=traducir(ev.new, yo.usr_id);
              setMsgs(prev => prev.some(x=>x.id===m.id) ? prev : [...prev, m]); })
          .subscribe();
      }catch(e){ if(vivo) setEstado("sin-sesion"); }
    })();
    return ()=>{ vivo=false; try{ if(canal) window.SB.removeChannel(canal); }catch(e){} };
  },[]);
  React.useEffect(()=>{ if(hiloRef.current) hiloRef.current.scrollTop=hiloRef.current.scrollHeight; },[msgs,sel]);
  /* el bot√≥n atr√°s cierra la conversaci√≥n ‚Äî solo en las apps que lo tienen */
  const usarRetro = (typeof useRetroceso === "function") ? useRetroceso : function(){};
  usarRetro(()=>{ if(sel){ setSel(null); return true; } return false; });

  const noLeidos=(cid)=>msgs.filter(m=>m.con===cid && !m.mio && !m.leido).length;
  const ultimo=(cid)=>msgs.filter(m=>m.con===cid).slice(-1)[0];
  const abrir=async(cid)=>{
    setSel(cid);
    setMsgs(prev=>prev.map(m=>m.con===cid && !m.mio ? {...m, leido:true} : m));
    try{ await window.SB.from("chat_mensajes").update({leido:true})
      .eq("de_usr", cid).eq("para_usr", miUsr).eq("leido", false); }catch(e){}
  };
  const mandar=async(tipo, extra)=>{
    if(enviando) return false;
    setEnviando(true);
    const fila={ msg_id:"CH-"+new Date().getTime()+"-"+Math.floor(Math.random()*1000),
      org_id:await orgActivaActual(), de_usr:miUsr, para_usr:sel, tipo,
      texto:(extra&&extra.texto)||null, adjunto:(extra&&extra.adjunto)||null, es_demo:false };
    const { error } = await window.SB.from("chat_mensajes").insert(fila);
    setEnviando(false);
    if(error){ toast && toast("No se pudo enviar: "+(error.message||"error")); return false; }
    setMsgs(prev => prev.some(x=>x.id===fila.msg_id) ? prev : [...prev,
      { id:fila.msg_id, con:sel, mio:true, aviso:false, tipo, texto:fila.texto||"",
        adjunto:fila.adjunto, hora:new Date().toTimeString().slice(0,5),
        fecha:hoyEC(), leido:false }]);
    return true;
  };
  const enviarTexto=async()=>{
    const t=txt.trim(); if(!t) return;
    setTxt("");
    await mandar("texto", { texto:t });
  };
  const enviarFoto=async(f)=>{
    if(!f) return;
    if(f.size > 8*1024*1024){ toast && toast("La foto supera 8 MB."); return; }
    try{
      const ext=((f.name.match(/\.[^.]+$/)||[".jpg"])[0]).toLowerCase();
      const ruta=miUsr+"/"+new Date().getTime()+ext;

/* Los adjuntos viven en un dep√≥sito privado: enlace firmado por 1 hora. */
function AdjuntoChatApp({ ruta, tipo, dur, mio }){
  const [url,setUrl]=useState(null);
  React.useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        const { data } = await window.SB.storage.from("chat-adjuntos").createSignedUrl(ruta, 3600);
        if(vivo && data && data.signedUrl) setUrl(data.signedUrl);
      }catch(e){}
    })();
    return ()=>{ vivo=false; };
  },[ruta]);
  if(tipo==="audio") return url
    ? <audio controls src={url} style={{width:200,height:36,marginBottom:4}} />
    : <div style={{fontSize:12.5,padding:"3px 0"}}>üé§ Audio{dur?" ¬∑ "+dur:""} ¬∑ abriendo‚Ä¶</div>;
  return url
    ? <img src={url} alt="foto" style={{maxWidth:190,width:"100%",borderRadius:9,display:"block",marginBottom:5}} />
    : <div style={{width:170,height:100,borderRadius:9,background:mio?"rgba(255,255,255,.15)":"#EFF2EF",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,marginBottom:5}}>üì∑</div>;
}

/* Buscador predictivo compacto para FILTROS (regla sellada: nada de select nativo).
   Mismo alto que el select que reemplaza, para no romper las cuadr√≠culas de filtros.
   Muestra el valor elegido dentro de la propia caja; se limpia con √ó. */
/* Bot√≥n flotante de crear (+). Siempre visible, arrastrable en vertical:
   se pega al borde izquierdo o derecho y recuerda d√≥nde lo dej√≥ el usuario. */
function BotonCrear({onClick, titulo}){
  const LADO_INI="der", ALTO_INI=0.72;   // 72% de la pantalla: sobre la barra de navegaci√≥n
  const leer=()=>{
    try{
      const g=JSON.parse(localStorage.getItem("fabPos")||"null");
      if(g && (g.lado==="izq"||g.lado==="der") && typeof g.y==="number") return g;
    }catch(e){}
    return {lado:LADO_INI, y:ALTO_INI};
  };
  const [pos,setPos]=useState(leer);
  const [moviendo,setMoviendo]=useState(false);
  const ref=React.useRef(null);
  const drag=React.useRef({activo:false, movido:false, x:0, y:0});

  const guardar=(p)=>{ setPos(p); try{ localStorage.setItem("fabPos",JSON.stringify(p)); }catch(e){} };
  /* mide la franja de la app (el contenedor del bot√≥n) para decidir izquierda/derecha */
  const el_zona=(btn)=>{
    const z=btn&&btn.parentElement;
    return z ? z.getBoundingClientRect() : null;
  };

  const inicio=(e)=>{
    const t=e.touches?e.touches[0]:e;
    drag.current={activo:true, movido:false, x:t.clientX, y:t.clientY};
    setMoviendo(true);
  };
  const mover=(e)=>{
    if(!drag.current.activo) return;
    const t=e.touches?e.touches[0]:e;
    const dx=Math.abs(t.clientX-drag.current.x), dy=Math.abs(t.clientY-drag.current.y);
    if(dx>6||dy>6) drag.current.movido=true;
    if(!drag.current.movido) return;
    if(e.cancelable) e.preventDefault();     // evita que la p√°gina se desplace al arrastrar
    const alto=window.innerHeight;
    let y=t.clientY/alto;
    y=Math.min(0.88, Math.max(0.12, y));      // no se pega al techo ni al piso
    /* el lado se decide respecto al ancho real de la app, no de la ventana */
    const zona=el_zona(ref.current);
    const medio = zona ? zona.left + zona.width/2 : window.innerWidth/2;
    const lado = t.clientX < medio ? "izq" : "der";
    setPos({lado, y});
  };
  const fin=()=>{
    if(!drag.current.activo) return;
    const eraMovimiento=drag.current.movido;
    drag.current.activo=false; setMoviendo(false);
    if(eraMovimiento) guardar(pos); else onClick();   // toque simple = crear
  };

  React.useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.addEventListener("touchmove", mover, {passive:false});
    return ()=>el.removeEventListener("touchmove", mover);
  });

  return (
    <div className="fab-zona">
      <button ref={ref} className={"fab"+(moviendo?" mov":"")}
        style={{top:`${pos.y*100}%`, [pos.lado==="izq"?"left":"right"]:"16px"}}
        title={titulo||"Crear"} aria-label={titulo||"Crear"}
        onTouchStart={inicio} onTouchEnd={fin} onTouchCancel={fin}
        onMouseDown={inicio} onMouseMove={mover} onMouseUp={fin}
        onMouseLeave={()=>{drag.current.activo=false;setMoviendo(false);}}>
        <span className="fab-mas">+</span>
      </button>
    </div>
  );
}

function FiltroBuscador({items, value, onPick, todos, etiquetaTodos, render, estilo, obligatorio, cat}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const txt=(it)=>render?render(it):String(it);
  /* norma sellada: lo m√°s elegido va primero (el contador nunca se muestra) */
  const opciones=[{__todos:true}, ...ordUso(cat, items)];
  const filtrados = q.trim()==="" ? opciones
    : opciones.filter(it=>it.__todos ? false
        : norm(q).split(/\s+/).filter(Boolean).every(w=>norm(txt(it)).includes(w)));
  const elegido = value===todos ? "" : txt(value);
  return (
    <div className="fb" style={estilo}>
      <div className={"fb-box"+(elegido&&!open&&!obligatorio?" act":"")}>
        <input value={open?q:elegido}
          placeholder={etiquetaTodos}
          onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>{setQ("");setOpen(true);}}
          onBlur={()=>setTimeout(()=>setOpen(false),160)}/>
        {elegido && !open && !obligatorio && (
          <button className="fb-clr" onMouseDown={e=>{e.preventDefault();onPick(todos);}}>√ó</button>
        )}
        <MicBtn onTexto={t=>{setQ(t);setOpen(true);}}/>
        <span className="fb-cara">‚ñæ</span>
      </div>
      {open && (
        <div className="fb-pop">
          {filtrados.length===0
            ? <div className="fb-none">Sin resultados para ‚Äú{q}‚Äù</div>
            : filtrados.map((it,i)=>(
              <div className="fb-opt" key={i}
                onMouseDown={e=>{e.preventDefault();
                  if(!it.__todos) regUso(cat,it);
                  onPick(it.__todos?todos:it);setOpen(false);setQ("");}}>
                {it.__todos ? <span style={{fontWeight:700,color:"var(--muted)"}}>{etiquetaTodos}</span> : txt(it)}
              </div>))}
        </div>)}
    </div>
  );
}

/* Nombre corto del cliente para mostrarlo (como en el sistema web):
   persona natural ‚Üí primer nombre + primer apellido; empresa ‚Üí nombre de la empresa.
   La raz√≥n social sale de REFERENCIALES ("Factura a:"). */
function refCortoCliente(nombre){
  var refs = (typeof REFERENCIALES!=="undefined" && REFERENCIALES[nombre]) ? REFERENCIALES[nombre] : [];
  var rs = String((refs && refs[0]) || nombre || "").trim();
  if(!rs) return nombre;
  var rsUp = rs.toUpperCase().replace(/\./g,"");
  var esJuridica = /\b(SA|SAS|CA|CIA|C√çA|LTDA|COMPANIA|COMPA√ëIA)\b/.test(rsUp);
  if(esJuridica) return rs;
  var w = rs.split(/\s+/).filter(Boolean);
  if(w.length<=2) return rs;
  return w[0]+" "+w[w.length-2];
}
function SearchSelect({label, hint, items, value, onPick, onClear, disabled, placeholder, render, sortBy, multiPalabra, sinLabel, className, onAbrir, cat, sinLapiz, fijo, fuzzy}){
  const [q,setQ]=useState("");
  const [open,setOpen]=useState(false);
  const [reabrir,setReabrir]=useState(false);   // al tocar la tarjeta: limpiar y desplegar la lista de una
  const inpRef=React.useRef(null);
  /* avisa hacia afuera si la lista est√° abierta (para ocultar lo que quede debajo) */
  React.useEffect(()=>{ if(onAbrir) onAbrir(open); },[open]);
  /* venimos de tocar la tarjeta: abre la lista y pone el cursor, sin pasos extra */
  React.useEffect(()=>{
    if(!reabrir) return;
    setReabrir(false); setOpen(true);
    const t=setTimeout(()=>{ if(inpRef.current) inpRef.current.focus(); },0);
    return ()=>clearTimeout(t);
  },[reabrir]);
  if(value){
    return (<div className="field">{!sinLabel && <label>{label}</label>}
      <div className={"ss"+(className?" "+className:"")}>
        {/* norma: sin bot√≥n "Cambiar"; se toca la tarjeta y vuelve al buscador */}
        <div className={"pick"+(disabled?" dis":"")+(fijo?" fijo":"")} role={(disabled||fijo)?undefined:"button"}
          onClick={(disabled||fijo)?undefined:()=>{onClear();setQ("");setReabrir(true);}}
          style={(disabled||fijo)?undefined:{cursor:"pointer"}}>
          <div style={{flex:1,minWidth:0}}>{render.picked(value)}</div>
          {!disabled && !fijo && !sinLapiz && <span className="chg-ar" aria-hidden="true">‚úé</span>}
        </div></div></div>);
  }
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const coincide=(texto)=>{
    if(multiPalabra){
      const refs=(typeof REFERENCIALES!=="undefined" && REFERENCIALES[texto]) ? REFERENCIALES[texto].join(" ") : "";
      const t=norm(texto+" "+refs);
      return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w));
    }
    return norm(texto).includes(norm(q));
  };
  let filtrados, rankFuzzy=false;
  if(q.trim()===""){
    filtrados = items;
  } else if(fuzzy && typeof window!=="undefined" && window.uFuzzy){
    try{
      const uf=new window.uFuzzy({intraMode:1,intraIns:1,intraSub:1,intraTrn:1,intraDel:1});
      const hay=items.map(it=>{ const tx=render.text(it); const rf=(typeof REFERENCIALES!=="undefined"&&REFERENCIALES[tx])?REFERENCIALES[tx].join(" "):""; return norm(tx+" "+rf); });
      const ndl=norm(q);
      const ix=uf.filter(hay,ndl);
      if(ix&&ix.length){ const nf=uf.info(ix,hay,ndl); const od=uf.sort(nf,hay,ndl); filtrados=od.map(o=>items[nf.idx[o]]); rankFuzzy=true; }
      else { filtrados=[]; }
    }catch(_){ filtrados=items.filter(it=>coincide(render.text(it))); }
  } else {
    filtrados = items.filter(it=>coincide(render.text(it)));
  }
  /* norma sellada: lo m√°s elegido va primero (el contador nunca se muestra) */
  if(!rankFuzzy){
    if(sortBy) filtrados = [...filtrados].sort(sortBy);
    else if(cat) filtrados = ordUso(cat, filtrados);
  }
  return (<div className="field">{!sinLabel && <label>{label}</label>}
    <div className={"ss"+(className?" "+className:"")}>
      <div className={"box"+(disabled?" dis":"")}>
        <span className="mag">‚åï</span>
        <input value={q} disabled={disabled} ref={inpRef}
          placeholder={disabled ? placeholder : (placeholder || (label ? `Buscar ${label.toLowerCase()}‚Ä¶` : "Escribe para buscar‚Ä¶"))}
          onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setTimeout(()=>setOpen(false),150)}/>
        {q && <button className="clr" onMouseDown={e=>{e.preventDefault();setQ("");}}>√ó</button>}
        {!disabled && <MicBtn onTexto={t=>{setQ(t);setOpen(true);}}/>}
      </div>
      {open && !disabled && (
        <div className="pop">
          {filtrados.length===0
            ? <div className="none">Sin resultados para ‚Äú{q}‚Äù</div>
            : filtrados.map((it,i)=>(
              <div className="opt" key={i} onMouseDown={e=>{e.preventDefault();
                regUso(cat,it); onPick(it);setOpen(false);setQ("");}}>
                {render.option(it)}
              </div>))}
        </div>)}
    </div>
    {hint && <div className="hint">{hint}</div>}
  </div>);
}

function decidirSolicitud(sol, decision, opts){
  opts=opts||{};

  if(decision==="aprobada" || decision==="condicionada"){
    sol.codigo=nuevoCodigo();

    sol.tope=opts.tope||null;              /* condicionada: hasta cierto monto */

/* Validaci√≥n del c√≥digo: un solo uso, no vencido, atado a ESE cliente y ESA operaci√≥n */
function validarCodigoAut(sol, codigo, cli, monto){
  if(!sol || !sol.codigo) return {ok:false, msg:"No hay una autorizaci√≥n aprobada para este cliente."};
  if(sol.estado==="usada")  return {ok:false, msg:"Ese c√≥digo ya se us√≥. Solicita una nueva autorizaci√≥n."};
  if(Date.now()>sol.caduca) { sol.estado="vencida"; return {ok:false, msg:"El c√≥digo caduc√≥. Solicita una nueva autorizaci√≥n."}; }
  if(sol.cli!==cli)         return {ok:false, msg:"El c√≥digo no corresponde a este cliente."};
  if(sol.tope && monto>sol.tope) return {ok:false, msg:`Autorizaci√≥n condicionada hasta ${money(sol.tope)}. Este pedido la excede.`};
  if(String(codigo).trim()!==sol.codigo) return {ok:false, msg:"C√≥digo incorrecto. Verifica con el proveedor."};
  sol.estado="usada"; sol.usada=new Date().toISOString();
  return {ok:true, msg:`Pedido autorizado ¬∑ solicitud ${sol.id} ¬∑ auditado ${sol.au}`};
}

/* Detalle del bloqueo: qu√© factura lo origina, cu√°ntos d√≠as vencida, cu√°nto y de qu√© proveedor */
/* Todo se mide en quintales: 1 qq = 100 lb ‚âà 45,4 kg.
   Utilidad del dominio: convierte cualquier presentaci√≥n (kg, lb, saco) a qq.
   Sin consumidor hoy; la usar√°n los m√≥dulos que sumen cantidades mixtas. */
function aQuintales(nombre, cant){
  const n=String(nombre||"").toLowerCase();
  if(/\bqq\b|quintal/.test(n)) return cant;
  const m=/(\d+(?:[.,]\d+)?)\s*kg/.exec(n);
  if(m) return cant * (parseFloat(m[1].replace(",","."))/45.4);
  const l=/(\d+(?:[.,]\d+)?)\s*lb/.exec(n);
  if(l) return cant * (parseFloat(l[1].replace(",","."))/100);
  return cant;
}
function detalleBloqueo(cliente){
  const vencidas=COBROS_INI.filter(c=>c.cli===cliente && /Vencida/i.test(c.vence))
    .map(c=>({...c, dias:Number((/Vencida\s+(\d+)/i.exec(c.vence)||[0,0])[1])}))
    .sort((a,b)=>b.dias-a.dias);
  if(!vencidas.length) return null;
  const f=vencidas[0];
  const pv=PROVEEDORES.find(p=>p.id===f.provId);
  const saldo=saldoRealFactura(f.factura, f.valor);          /* lo que realmente falta (descuenta abonos) */
  const det=(FACTURAS_DETALLE[cliente]||[]).find(x=>x.factura===f.factura);
  let total=f.valor;                                          /* valor original de la factura */
  if(det){
    const sub=det.items.reduce((s,it)=>s+it.cant*it.precio,0);
    total=sub-(det.retencion||0)-(det.descuento||0)-((det.ncs||[]).reduce((s,n)=>s+n.valor,0));
  }
  return {factura:f.factura, dias:f.dias, total:Math.round(total*100)/100, saldo, prov:pv?pv.nombre:"‚Äî",
          provId:f.provId, vence:f.vence, nVenc:vencidas.length, totalVenc:vencidas.reduce((s,x)=>s+saldoRealFactura(x.factura,x.valor),0)};
}

const saldoRealFactura = (fac, saldoBase) => {
  const d = DETALLE_FACTURA[fac];
  if(!d) return saldoBase;
  const ab = (d.abonos||[]).reduce((s,a)=>s+a.monto,0);
  const re = (d.retenciones||[]).reduce((s,r)=>s+r.monto,0);
  const nc = (d.notasCredito||[]).reduce((s,n)=>s+n.monto,0);
  const saldo = (d.total||saldoBase) - ab - re - nc;
  return Math.round((saldo>0?saldo:0)*100)/100;
};
