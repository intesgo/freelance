# ══ Publicación precompilada (comité 1.1 + 6.1) ══
# En cada push a main: compila las 5 apps (JSX → JS plano) y publica en la rama
# gh-pages. Si alguna app no compila, NO se publica (protege producción).
# El fuente NO cambia: se sigue editando main como siempre.
name: Publicar apps precompiladas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compilar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # dos commits: para diferenciar HEAD^..HEAD (qué archivos cambió este push)

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'   # reusa el caché de npm (hay package-lock.json): npm ci baja de ~1-2 min a segundos

      # ══ Chequeo rápido de versión (13 ago) · corre en SEGUNDOS, antes de npm ci y de la batería ══
      # Si tocaste una app o sw.js pero NO subiste VERSION.n / CACHE respecto de lo YA publicado,
      # se detiene AQUÍ (no espera ~6 min de pruebas) y avisa: publicar sin subir esos números deja
      # el cambio invisible (la barra «Actualizar» no sale). Reglas del CLAUDE.md §4.
      # Falla-cerrado solo ante un problema confirmado; ante cualquier duda de infra, deja pasar.
      - name: Chequeo rápido de versión (falla en segundos)
        run: |
          git fetch origin gh-pages --depth=1 || true
          CHANGED="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)" \
          LIVE_VERSION="$(git show FETCH_HEAD:home/version.json 2>/dev/null || true)" \
          LIVE_SW="$(git show FETCH_HEAD:sw.js 2>/dev/null || true)" \
          node scripts/chequeo_version.js

      - name: Instalar lo que piden las pruebas y el compilador
        run: npm ci

      # ══ Las pruebas van ANTES de compilar (26 jul) ══
      # Antes este robot solo compilaba: si compilaba, publicaba, aunque una
      # prueba estuviera fallando. Una app rota podía salir a la calle porque
      # a alguien se le olvidó correr un comando. Ahora si algo falla, se
      # detiene aquí y NO se publica nada.
      # Se usa "rapido": sin los dos arneses que necesitan navegador.
      - name: Pasar las pruebas (falla = no publica)
        run: node pruebas/pruebas.js rapido
        env:
          PRUEBAS_CARRILES: 4   # alinea los carriles a los vCPU del runner (4) y evita sobre-suscripción (antes 6 fijo)

      - name: Compilar las 5 apps (falla = no publica)
        run: node scripts/compilar.js

      - name: Publicar dist/ en la rama gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicación precompilada · fuente $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
