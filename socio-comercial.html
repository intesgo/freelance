<!DOCTYPE html>
<html lang="es">
<head>
<!-- publicación precompilada · el fuente vive en la rama main -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ventas Freelance · Socio Comercial</title>
<script src="./lib/react-18.3.1.min.js"></script>
<script src="./lib/react-dom-18.3.1.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#15392B; --field-700:#1E4D3A; --maize:#F2A900; --maize-deep:#BF7A00;
    --field-soft:#EEF3EF; --field-soft-line:#CFE0D5; --field-soft-txt:#1E4D3A;
    --paper:#F7F5EF; --card:#FFFFFF; --ink:#18211C; --muted:#6F7A6F;
    --line:#E7E1D3; --clay:#B5613C; --ok:#2E7D52;
    --shadow:0 1px 2px rgba(21,57,43,.06),0 8px 24px rgba(21,57,43,.06);
  }
  /* ═══ TEMAS (Ajustes) ═══ Norma sellada: 4 temas. Campo es el de fábrica. */
  [data-tema="sol"]{
    --field:#0B2A1E; --field-700:#123B2A; --maize:#F59E00; --maize-deep:#B36B00;
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0F0C; --muted:#4A554C;
    --line:#D6D2C4; --clay:#A34A28; --ok:#1F6B41;
    --field-soft:#EAF1EC; --field-soft-line:#C3D6C9; --field-soft-txt:#0B2A1E;
    --shadow:0 1px 2px rgba(0,0,0,.10),0 6px 18px rgba(0,0,0,.08);
  }
  [data-tema="noche"]{
    --field:#0E1A14; --field-700:#16261D; --maize:#E9B44C; --maize-deep:#C08F2E;
    --paper:#111A15; --card:#182420; --ink:#E6EDE8; --muted:#93A399;
    --line:#26332C; --clay:#D08160; --ok:#57A773;
    --field-soft:#1B2A23; --field-soft-line:#2C3D34; --field-soft-txt:#DCE8E0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  [data-tema="arena"]{
    --field:#4A3B22; --field-700:#5E4B2C; --maize:#E0A82E; --maize-deep:#B4801C;
    --paper:#FAF4E8; --card:#FFFDF8; --ink:#241C0E; --muted:#6E6250;
    --line:#E4DAC6; --clay:#A85B36; --ok:#2E7D52;
    --field-soft:#F2EADB; --field-soft-line:#DFD2B8; --field-soft-txt:#4A3B22;
    --shadow:0 1px 2px rgba(74,59,34,.07),0 8px 22px rgba(74,59,34,.07);
  }
  /* Grafito · gris neutro, sobrio */
  [data-tema="grafito"]{
    --field:#22262A; --field-700:#2F353A; --maize:#D9A441; --maize-deep:#AD7F2A;
    --paper:#F4F5F6; --card:#FFFFFF; --ink:#1A1E21; --muted:#6C757D;
    --line:#DFE3E6; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#EDEFF1; --field-soft-line:#D3D8DC; --field-soft-txt:#22262A;
    --shadow:0 1px 2px rgba(20,25,30,.07),0 8px 22px rgba(20,25,30,.07);
  }
  /* Brote · verde claro, fresco */
  [data-tema="brote"]{
    --field:#2F6B4F; --field-700:#3D8461; --maize:#F7CB72; --maize-deep:#B87D0C;
    --paper:#F4F8F5; --card:#FFFFFF; --ink:#17251E; --muted:#66786D;
    --line:#DCE8E0; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E9F3ED; --field-soft-line:#C6DED1; --field-soft-txt:#2F6B4F;
    --shadow:0 1px 2px rgba(47,107,79,.06),0 8px 22px rgba(47,107,79,.07);
  }
  /* Río · azul suave, tranquilo */
  [data-tema="rio"]{
    --field:#1F4E6B; --field-700:#2C6688; --maize:#EBB247; --maize-deep:#B2761A;
    --paper:#F3F7FA; --card:#FFFFFF; --ink:#14212A; --muted:#647682;
    --line:#D9E4EC; --clay:#B5613C; --ok:#2E7D52;
    --field-soft:#E8F1F6; --field-soft-line:#C4DAE7; --field-soft-txt:#1F4E6B;
    --shadow:0 1px 2px rgba(31,78,107,.06),0 8px 22px rgba(31,78,107,.07);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* Blindaje anti-desborde: en filas flex, los campos ceden espacio en vez de empujar botones fuera */
  input,select,textarea{min-width:0;max-width:100%}
  button{max-width:100%}
  html,body{height:100%}
  body{background:#0d2018;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .num{font-family:'Space Grotesk',sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:16px}
  /* phone shell */
  /* ===== Ajustes ===== */
  .pest-aj{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .pest-aj::-webkit-scrollbar{display:none}
  .pest-aj button{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:inherit;white-space:nowrap}
  .pest-aj button.on{background:var(--field);border-color:var(--field);color:#EAF0EA}
  .aj-sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:14px 2px 8px}
  .aj-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;
    box-shadow:var(--shadow)}
  .aj-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;min-width:0}
  .aj-fila>span:first-child{font-size:13px;color:var(--muted);flex-shrink:0}
  .aj-fila b{font-size:13px;color:var(--ink);text-align:right;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .aj-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .aj-nota{font-size:11px;color:var(--muted);line-height:1.5;margin:10px 2px 0}
  .aj-pal{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;
    font-family:inherit;text-align:left}
  .aj-pal.on{border-color:var(--field);background:var(--paper)}
  .aj-pal-m{display:flex;border-radius:9px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
  .aj-pal-m span{width:19px;height:34px;display:block}
  .aj-pal-n{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
  .aj-pal-d{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .aj-sw{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;
    flex-shrink:0;border:none;transition:background .2s}
  .aj-sw.on{background:var(--ok)}
  .aj-kn{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .aj-sw.on .aj-kn{transform:translateX(19px)}
  .aj-btn{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--field);font-family:inherit;flex-shrink:0}
  .cl-l{font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 5px 2px}
  .cl-i{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--line);border-radius:11px;
    font-family:inherit;font-size:14.5px;background:var(--card);color:var(--ink)}
  .cl-ojo{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:31px;height:31px;
    border:none;background:transparent;font-size:15px;opacity:.6}
  .cl-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:7px 0 4px}
  .cl-bar i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
  .cl-n{font-size:11px;font-weight:600;line-height:1.4;margin:0 2px}
  .ham{background:rgba(21,57,43,.07);border:1px solid rgba(21,57,43,.12);color:var(--field);
    width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:700}
  .ham:active{background:rgba(21,57,43,.14)}
  .drawer-ov{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    background:rgba(0,0,0,0);visibility:hidden;z-index:60;transition:background .25s}
  .drawer-ov.on{background:rgba(0,0,0,.42);visibility:visible}
  .drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--paper);
    transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;
    box-shadow:2px 0 20px rgba(0,0,0,.2)}
  .drawer.on{transform:translateX(0)}
  .drawer-head{background:var(--field,#15392B);padding:18px 16px 16px;display:flex;
    align-items:flex-start;justify-content:space-between;gap:10px}
  .drawer-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;
    border-radius:8px;font-size:17px;cursor:pointer;flex-shrink:0}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 13px 20px}
  .drawer-it{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:inherit;text-align:left}
  .drawer-it:active{background:var(--paper)}
  .di-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:16px;flex-shrink:0}
  .di-t{font-size:13.5px;font-weight:700;color:var(--ink)}
  .di-s{font-size:11px;color:var(--muted);margin-top:1px}
  .di-a{color:var(--muted);font-size:15px;flex-shrink:0}
  .drawer-salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
    background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:13px;padding:13px;
    font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .shell{max-width:430px;margin:0 auto;height:100dvh;background:var(--paper);
    position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.4)}
  @media(min-width:480px){.shell{min-height:auto;height:100dvh;margin:0 auto;border-radius:0}}
  /* top bar */
  .top{background:var(--field-soft);color:var(--field-soft-txt);padding:14px 20px 16px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .top .who{font-size:14.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .top .name{font-size:16px;font-weight:600;margin-top:2px;color:var(--field)}
  .top-nav{display:flex;align-items:center;gap:8px}
  .topbtn{display:flex;align-items:center;gap:5px;color:var(--field-soft-txt);font-size:14px;font-weight:600;
    background:rgba(30,77,58,.08);border-radius:999px;padding:7px 14px}
  .topbtn:active{background:rgba(30,77,58,.16)}
  .net{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(30,77,58,.06);
    padding:6px 10px;border-radius:999px;color:var(--field-soft-txt);font-weight:600}
  .net:active{background:rgba(30,77,58,.12)}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.on{background:#6FD39B} .dot.off{background:var(--maize)}
  .sync-intro{font-size:15px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .sync-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .sync-ic{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sync-t{font-size:14px;font-weight:600;color:var(--ink)}
  .sync-ok{text-align:center;padding:18px 0}
  .sync-nota{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.5;
    background:var(--paper);border-radius:10px;padding:10px 12px}
  /* alerta de clientes por visitar */
  .alerta-visita{display:flex;align-items:center;gap:12px;width:100%;background:#FBF0D8;
    border:1px solid #E8C98A;border-radius:14px;padding:14px;margin-bottom:14px}
  .alerta-visita:active{background:#F6E8C4}
  .av-ic{font-size:22px}
  .av-t{font-size:14px;font-weight:700;color:var(--field)}
  .av-s{font-size:14.5px;color:#9A7B2E;margin-top:1px}
  .av-arrow{font-size:20px;color:#B79235}
  .visita-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .sem{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .sem.rojo{background:#D9534F;box-shadow:0 0 0 4px rgba(217,83,79,.15)}
  .sem.ambar{background:#E0A33A;box-shadow:0 0 0 4px rgba(224,163,58,.15)}
  .sem-lbl{font-size:14px;font-weight:700;padding:3px 9px;border-radius:999px}
  .sem-lbl.rojo{background:#FBE3E2;color:#B0413D}
  .sem-lbl.ambar{background:#FBF0D8;color:#9A7B2E}
  .visita-leyenda{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:14px;color:var(--muted)}
  .visita-leyenda span{display:flex;align-items:center;gap:8px}
  .visita-leyenda .sem{width:11px;height:11px;box-shadow:none}
  /* solicitudes al proveedor */
  .sol-op{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
  .sol-op:active{background:var(--paper)}
  .sol-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0}
  .sol-elegido{background:var(--paper);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700;
    color:var(--field);margin-bottom:14px}
  .adjuntar{width:100%;background:var(--paper);border:1px dashed var(--line);border-radius:11px;
    padding:13px;font-size:15px;font-weight:600;color:var(--field)}
  .adjuntar:active{background:var(--card)}
  .sol-op.sel{border-color:var(--field);background:#EAF0EA}
  .fact-item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .fact-inp{width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;text-align:right}
  .fact-total{display:flex;justify-content:space-between;align-items:center;background:var(--field-soft);color:var(--field-soft-txt);
    border-radius:12px;padding:13px 15px;margin-top:6px;font-size:14px;font-weight:600}
  .fact-total .num{font-size:19px;font-weight:700}
  .resol-box{background:#E4F1E9;border:1px solid #A9D5BC;border-radius:11px;padding:12px 14px;
    font-size:15px;color:var(--ink);margin-top:10px;line-height:1.5}
  /* scroll body */
  .body{flex:1;overflow-y:auto;padding:18px 18px 96px}
  /* hero commission */
  .hero{background:linear-gradient(155deg,var(--field-soft) 0%,#E4ECE6 100%);
    border-radius:20px;padding:22px;color:var(--field-soft-txt);position:relative;overflow:hidden;border:1px solid var(--field-soft-line)}
  .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
    background:radial-gradient(circle,rgba(242,169,0,.22),transparent 70%)}
  .hero .lbl{font-size:14.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .hero .big{font-size:42px;font-weight:700;margin-top:4px;line-height:1;color:var(--field)}
  .hero .big small{font-size:20px;color:var(--muted);font-weight:500}
  .hero .split{display:flex;gap:14px;margin-top:18px}
  .hero .split div{flex:1;background:rgba(30,77,58,.06);border-radius:12px;padding:11px 13px}
  .hero .split .v{font-size:19px;font-weight:600;margin-top:3px;color:var(--field)}
  .hero .split .k{font-size:14px;color:var(--muted)}
  /* hero ampliado */
  .hero-top{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1}
  .hero-corte{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--muted);margin-top:12px}
  .meta-ring{position:relative;width:118px;height:118px;flex-shrink:0}
  .meta-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mr-pct{font-size:24px;font-weight:700;color:var(--field);line-height:1}
  .mr-lbl{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.2}
  .meta-mensual{display:flex;align-items:center;gap:10px;background:rgba(30,77,58,.06);border-radius:12px;
    padding:10px 14px;margin-top:14px;position:relative;z-index:1}
  .meta-mensual span{font-size:18px}
  .mm-k{font-size:14px;color:var(--muted)}
  .mm-v{font-size:17px;font-weight:700;color:var(--field)}
  .vermas{width:100%;margin-top:14px;background:rgba(30,77,58,.09);border:1px solid rgba(30,77,58,.14);
    border-radius:11px;padding:11px;font-size:15px;font-weight:600;color:var(--field-soft-txt);position:relative;z-index:1}
  .vermas:active{background:rgba(30,77,58,.14)}
  .hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
  .hg-card{background:rgba(30,77,58,.06);border-radius:14px;padding:12px 8px;text-align:center}
  .hg-ic{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-size:19px;margin:0 auto 8px}
  .hg-k{font-size:14px;color:var(--muted);line-height:1.25;min-height:16px}
  .hg-v{font-size:18px;font-weight:700;color:var(--field);margin-top:3px}
  .hg-s{font-size:14px;color:var(--muted);margin-top:2px}
  .proy{display:flex;align-items:center;gap:12px;background:rgba(30,77,58,.06);border-radius:14px;
    padding:16px 14px;min-height:64px;margin-top:14px;width:100%;position:relative;z-index:1}
  .proy-ic{font-size:20px;color:#2E7D52}
  .proy-t{font-size:14px;font-weight:600;color:var(--field-soft-txt)}
  .proy-s{font-size:14px;color:var(--muted);margin-top:1px}
  .proy-v{font-size:20px;font-weight:700;color:#2E7D52}
  .proy-arrow{font-size:20px;color:var(--muted)}
  /* ===== Comisiones (módulo comisionista) ===== */
  .cu-resumen{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .cu-total{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .cu-total-k{font-size:14.5px;color:var(--muted);font-weight:600}
  .cu-total-v{font-size:30px;font-weight:800;color:var(--field);margin-top:3px}
  .cu-split{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .cu-part{display:flex;align-items:center;gap:12px}
  .cu-part-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .cu-part-k{font-size:15px;font-weight:700;color:var(--ink)}
  .cu-part-s{font-size:14px;color:var(--muted);margin-top:1px}
  .cu-part-v{font-size:16px;font-weight:800;color:var(--field)}
  .cu-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .cu-chips::-webkit-scrollbar{display:none}
  .cu-chip{flex-shrink:0;font-size:14.5px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .cu-chip.on{background:var(--field-soft);color:var(--field-soft-txt);border-color:var(--field)}
  .cu-lista{display:flex;flex-direction:column;gap:10px}
  .cu-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .cu-item-top{display:flex;align-items:flex-start;gap:10px}
  .cu-item-cli{font-size:14.5px;font-weight:700;color:var(--ink)}
  .cu-item-prod{font-size:14.5px;color:var(--muted);margin-top:2px}

  /* quick actions */

.ndash{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ncard{background:var(--card);border-radius:20px;padding:14px 14px 12px;cursor:pointer;border:1px solid rgba(231,225,211,.6);

.nk{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.nv{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--field);line-height:1}
.nv.money{font-size:19px}
.nspark{width:100%;height:34px;margin-top:auto}
.nsub{font-size:14px;color:var(--muted)}
.nring-wrap{display:flex;align-items:center;gap:10px;margin-top:auto}
.nring{width:62px;height:62px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}

.nring .hole b{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--field);line-height:1}
.nring .hole span{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase}
.nleg{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.nleg .d{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}
.nbars{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
  .qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;box-shadow:var(--shadow);transition:transform .08s}
  .qa button:active{transform:scale(.97)}
  .qa .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .qa .t{font-size:15px;font-weight:700;line-height:1.25}
  .qa .s{font-size:14px;color:var(--muted);margin-top:auto;line-height:1.3}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cli{font-size:15px;font-weight:600}
  .meta{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .amt{font-size:16px;font-weight:600}
  .amt small{font-size:14.5px;color:var(--muted);font-weight:500}
  /* chips */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
    padding:4px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
  .chip .d{width:6px;height:6px;border-radius:50%}
  .c-sync{background:#FBF0D8;color:var(--maize-deep)} .c-sync .d{background:var(--maize)}
  .c-ok{background:#E4F1E9;color:var(--ok)} .c-ok .d{background:var(--ok)}
  .c-wait{background:#EDEAE0;color:#7A6F50} .c-wait .d{background:#A89A6E}
  .c-live{background:#E9EEE9;color:var(--field)} .c-live .d{background:var(--field-700)}
  .c-bad{background:#F6E3DA;color:var(--clay)} .c-bad .d{background:var(--clay)}
  .pipe{display:flex;gap:4px;margin-top:12px}
  .pipe span{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .pipe span.done{background:var(--field-700)} .pipe span.now{background:var(--maize)}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px 20px;z-index:30}
  /* b364 · la barra se desliza fuera al leer y vuelve sola */
  .nav{transition:transform .22s ease, opacity .18s ease}

  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:14px;color:var(--muted);font-weight:500;padding:6px 0}
  .nav button.act{color:var(--field)}
  .nav-center .nIco{background:var(--maize);color:var(--field);width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:1px}
  .nav-center{color:var(--field);font-weight:700}
  .nav .nIco{font-size:21px;line-height:1;position:relative}
  .nav .badge{position:absolute;top:-6px;left:13px;min-width:17px;height:17px;padding:0 4px;
    background:#D9534F;color:#fff;font-size:14px;font-weight:700;border-radius:999px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
  .nav .badge.ok{background:#2E7D52;left:auto;right:13px}
  .det-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .det-sub{font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 4px}
  /* ===== Comisiones rediseñada ===== */
  .cu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}

  /* aquí el selector tiene 3 opciones (Resumen · Por pedido · Logros) y en un
     celular angosto se salía 25px del ancho: se aprieta un poco y no se corta */
  .cu-toggle button{font-size:13px;font-weight:700;padding:7px 9px;border-radius:999px;
    color:var(--muted);white-space:nowrap;min-width:0}
  .cu-head{gap:8px}
  .cu-toggle button.on{background:var(--field-soft);color:var(--field-soft-txt)}
  .cu-hero{background:linear-gradient(150deg,var(--field-soft),#E4ECE6);border-radius:22px;padding:24px 22px;color:var(--field-soft-txt);border:1px solid var(--field-soft-line);
    position:relative;overflow:hidden}
  .cu-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;

  .cu-hero-sub{font-size:14.5px;color:var(--muted);position:relative}
  .cu-var{display:flex;align-items:center;gap:8px;margin-top:14px;position:relative}
  .cu-var-pill{font-size:15px;font-weight:700;padding:4px 11px;border-radius:999px}

  .cu-var-pill.down{background:rgba(217,83,79,.25);color:#F0A6A3}
  .cu-var-txt{font-size:14.5px;color:var(--muted)}
  .cu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .cu-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .cu-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:9px}
  .cu-v{font-size:20px;font-weight:700;color:var(--field)}
  .cu-k{font-size:14px;color:var(--muted);margin-top:2px}
  .cu-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:6px}
  .cu-block-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:10px}
  .cu-pct{font-size:18px;font-weight:700;color:var(--field)}
  .cu-bar{height:12px;background:var(--paper);border-radius:999px;overflow:hidden}
  .cu-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2E7D52,#A9D977)}
  .cu-bar-fill.gold{background:linear-gradient(90deg,#C77F00,#F2A900,#FFD46B)}
  .cu-block-sub{font-size:14.5px;color:var(--muted);margin-top:8px}
  .cu-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px}
  .cu-line b{font-weight:700;color:var(--field)}
  .cu-hint{font-size:14.5px;color:var(--ok);background:#E4F1E9;border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.4}
  .cu-rank{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FBF0D8,#F6E8C4);
    border:1px solid #E8C98A;border-radius:16px;padding:16px;margin-top:12px}
  .cu-rank-ic{font-size:30px}
  .cu-rank-t{font-size:15px;font-weight:700;color:var(--field)}
  .cu-rank-s{font-size:14.5px;color:#9A7B2E;margin-top:1px}
  /* gamificada */
  .cu-game-hero{background:linear-gradient(150deg,#F3E6C8,var(--field-soft));border-radius:22px;padding:24px 20px;color:var(--field-soft-txt);text-align:center;margin-bottom:12px;border:1px solid var(--field-soft-line)}
  .cu-game-rank{font-size:46px;font-weight:700;line-height:1;color:#FFD46B}
  .cu-game-rank-lbl{font-size:15px;color:var(--muted);margin-top:2px}
  .cu-game-meta{font-size:14.5px;color:var(--muted);margin-top:8px}
  .cu-streak{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:6px}
  .cu-streak-n{font-size:26px;font-weight:700;color:#C77F00}
  .cu-streak-t{font-size:14px;font-weight:700;color:var(--field)}
  .cu-logros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
  .cu-logro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .cu-logro.off{opacity:.45}
  .cu-logro-ic{font-size:26px}
  .cu-logro-t{font-size:14px;color:var(--ink);margin-top:6px;line-height:1.25}
  .cu-reto{background:linear-gradient(135deg,#FBF0D8,#F6E8C4);border:1px solid #E8C98A;border-radius:16px;padding:16px;margin-top:6px}
  .cu-reto-h{font-size:14px;font-weight:700;color:var(--field)}
  .cu-reto-t{font-size:15px;color:#7a5e1e;margin-top:3px}
  .nav .plus{margin-top:-30px}
  .nav .plus .nIco{background:var(--maize);color:var(--field);width:54px;height:54px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:0 6px 18px rgba(242,169,0,.4);font-weight:600}

  /* form */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14.5px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);
    border-radius:12px;background:#fff;color:var(--ink)}

  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}

  /* cliente nuevo */
  .gps-btn{width:100%;text-align:left;padding:13px 14px;border:1px dashed var(--field-700);

  .credito-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
  .chk-row{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;cursor:pointer}

  .req-up{background:var(--field-soft);color:var(--field-soft-txt);font-size:14.5px;font-weight:700;border-radius:8px;padding:7px 13px}

  .mini-link{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--field);text-decoration:underline}
  .filtrar-btn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;;white-space:nowrap;
    padding:0 16px;font-size:15px;font-weight:700;color:var(--field);white-space:nowrap}
  .filtrar-btn:active{background:var(--paper)}
  /* pantalla de bloqueo de acceso */
  .bloqueo-acceso{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 22px;
    background:linear-gradient(160deg,#15392B,#0F2A1C)}
  .ba-card{background:var(--card);border-radius:22px;padding:32px 24px;text-align:center;max-width:340px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .ba-ic{font-size:46px;margin-bottom:10px}
  .ba-card h2{font-size:21px;font-weight:700;color:var(--clay);margin-bottom:8px}
  .ba-sub{font-size:14px;color:var(--ink);margin-bottom:18px;line-height:1.5}
  .ba-motivo{background:#FBE9E4;border:1px solid #E8B9AC;border-radius:13px;padding:13px;text-align:left;margin-bottom:16px}
  .ba-k{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--clay);margin-bottom:3px}
  .ba-v{font-size:14px;color:var(--ink)}
  .ba-contacto{font-size:15px;color:var(--muted);margin-bottom:16px;line-height:1.5}
  .ba-btn{display:block;background:var(--field-soft);color:var(--field-soft-txt);font-size:15px;font-weight:700;
    border-radius:13px;padding:13px;text-decoration:none;margin-bottom:14px}
  .ba-demo{font-size:14px;font-weight:600;color:var(--muted);border:1px dashed var(--line);
    border-radius:10px;padding:8px 12px;width:100%}
  .calc{background:linear-gradient(155deg,var(--field-soft),#E4ECE6);border-radius:16px;
    padding:18px;color:var(--field-soft-txt);margin:20px 0}
  .calc .cr{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
  .calc .cr .k{font-size:15px;color:var(--muted)}
  .calc .cr .v{font-size:15px;font-weight:600}
  .calc .tot{border-top:1px dashed rgba(255,255,255,.2);margin-top:8px;padding-top:12px}
  .calc .tot .v{font-size:28px;font-weight:700;color:var(--maize)}
  .mini-cta{margin-left:auto;background:var(--field-soft);color:var(--field-soft-txt);font-size:15px;font-weight:700;border-radius:9px;padding:12px 18px;min-height:44px}
  .mini-cta:active{background:var(--field-700)}
  /* ficha del cliente */
  .ficha-sec{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:16px 4px 8px}
  .ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
  .fk{font-size:14px;color:var(--muted);font-weight:600}
  .fv{font-size:15px;font-weight:600;margin-top:2px}
  .cupo-bar{height:8px;border-radius:5px;background:var(--paper);margin-top:12px;overflow:hidden}
  .cupo-fill{height:100%;border-radius:5px;transition:width .3s}
  .cupo-desglose{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .cupo-desglose .row{padding:3px 0}
  .dg-v{font-size:15px;font-weight:600}
  /* historial por líneas */
  .linea-blk{margin-bottom:12px}
  .linea-h{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
  .linea-h2{width:100%;display:flex;align-items:center;gap:8px;background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
  .linea-h2:active{background:#EFEDE3}
  .linea-nom{font-size:15px;font-weight:700;color:var(--field)}
  .linea-n{font-size:14px;font-weight:700;background:#E4F1E9;color:var(--ok);border-radius:999px;padding:1px 8px}
  .linea-n.op{background:#FBF0D8;color:var(--maize-deep)}
  .linea-prod{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow)}
  .linea-prod.no{border-style:dashed}
  .lp-ic{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:14px;font-weight:700;background:#E4F1E9;color:var(--ok)}
  .lp-ic.op{background:#FBF0D8;color:var(--maize-deep)}
  .lp-nom{font-size:15px;font-weight:600}
  /* acordeón plegable */
  .acc-h{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);margin-top:16px}
  .acc-h:active{background:var(--paper)}
  .acc-ic{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;background:#E4F1E9;color:var(--ok)}
  .acc-ic.op{background:#FBF0D8;color:var(--maize-deep)}
  .acc-t{font-size:14px;font-weight:700;color:var(--ink)}
  .acc-s{font-size:14px;color:var(--muted);margin-top:1px}
  .acc-fl{font-size:14.5px;color:var(--muted)}
  .acc-body{padding-top:12px}
  .cta{width:100%;background:var(--maize);color:var(--field);font-size:16px;font-weight:700;
    padding:18px;min-height:56px;border-radius:14px;box-shadow:0 4px 14px rgba(242,169,0,.3)}
  .cta:active{background:var(--maize-deep)}
  .cta:disabled{background:var(--line);color:var(--muted);box-shadow:none}
  .cta-guardar{background:var(--field-soft);color:var(--field-soft-txt);margin-top:10px}
  .cta-guardar:active{background:var(--field-700,#1E4D3A)}
  .ghost{width:100%;background:#fff;border:1px solid var(--line);color:var(--field);
    font-size:14px;font-weight:600;padding:13px;border-radius:12px;margin-top:10px}
  .ph{font-size:15px;color:var(--muted);text-align:center;padding:40px 20px;line-height:1.6}
  .h1{font-size:22px;font-weight:700;margin-bottom:4px}
  .sub{font-size:15px;color:var(--muted);margin-bottom:20px;line-height:1.5}
  .photo{border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;
    color:var(--muted);font-size:15px;background:#fff}
  .photo.has{border-color:var(--ok);border-style:solid;color:var(--ok);font-weight:600}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--field-soft);
    color:var(--field-soft-txt);padding:13px 20px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;
    box-shadow:0 8px 30px rgba(21,57,43,.18);max-width:380px;text-align:center;animation:up .3s;border:1px solid var(--field-soft-line)}
  @keyframes up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  .lock{font-size:14px;color:var(--muted);background:#EDEAE0;border-radius:10px;padding:9px 12px;
    margin-top:14px;line-height:1.5;display:flex;gap:8px}
  /* search typeahead */
  .ss{position:relative}
  .ss .box{display:flex;align-items:center;gap:9px;width:100%;padding:13px 14px;border:1px solid var(--line);
    border-radius:12px;background:#fff}
  .ss .box.dis{background:#F0EDE4;color:var(--muted)}
  .ss .box:focus-within{border-color:var(--field-700)}
  .ss .box input{flex:1;border:none;outline:none;padding:0;background:transparent}
  .ss .box .mag{color:var(--muted);font-size:15px}
  .ss .box .clr{color:var(--muted);font-size:18px;padding:0 2px}
  .ss .pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 28px rgba(21,57,43,.14);z-index:20;max-height:230px;overflow-y:auto}
  .ss .opt{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .ss .opt:last-child{border-bottom:none}
  .ss .opt:active{background:var(--paper)}
  .ss .opt .o1{font-size:14px;font-weight:600}
  .ss .opt .o2{font-size:14.5px;color:var(--muted);margin-top:2px}
  .ss .opt .o2 b{color:var(--field);font-weight:600}
  .ss .none{padding:14px;font-size:15px;color:var(--muted);text-align:center}
  .ss .pick{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;
    border:1px solid var(--field-700);border-radius:12px;background:#fff}
  .ss .pick.dis{opacity:.55}
  .ss .pick[role="button"]:active{background:var(--paper)}
  .ss .pick .chg-ar{font-size:15px;color:var(--muted);flex-shrink:0;margin-left:10px}
  .ss .pick.fijo{border:none;background:transparent;box-shadow:none;padding:6px 2px;cursor:default;justify-content:flex-start}
  .ss .pick .p1{font-size:14px;font-weight:600}
  .ss .pick .p2{font-size:14.5px;color:var(--muted);margin-top:1px}
  .ss .pick .chg{font-size:14.5px;font-weight:600;color:var(--field);background:var(--paper);
    padding:6px 11px;border-radius:8px}
  .stepwrap{opacity:1;transition:opacity .2s}
  .stepwrap.off{opacity:.4;pointer-events:none}
  /* selector de tipo de precio */
  .tipogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tipobtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 13px;
    border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}
  .tipobtn:active{background:var(--paper)}
  .tipobtn.on{border-color:var(--field);background:var(--field-soft);color:var(--field-soft-txt)}
  .tipobtn .tcod{font-size:14px;font-weight:700;letter-spacing:.03em;
    font-family:'Space Grotesk',sans-serif;color:var(--maize-deep)}
  .tipobtn.on .tcod{color:var(--maize)}
  .tipobtn .tnom{font-size:15px;font-weight:600}
  /* historial de última compra */
  .histo{display:flex;gap:12px;align-items:center;background:#F0EEE4;border:1px solid var(--line);
    border-radius:13px;padding:12px 14px;margin-bottom:16px}
  .histo .hi-ic{font-size:20px;flex-shrink:0}
  .histo .hi-t{font-size:14.5px;font-weight:600;color:var(--field)}
  .histo .hi-d{font-size:15px;color:var(--ink);margin-top:2px}
  .histo .hi-d b{font-family:'Space Grotesk',sans-serif}
  .histo .hi-nc{font-size:14.5px;color:var(--maize-deep);margin-top:3px}
  .histo .hi-nc b{font-family:'Space Grotesk',sans-serif;color:var(--field)}
  /* timeline de trazabilidad */
  .tl{position:relative;margin-top:6px}
  .tl .item{display:flex;gap:14px;position:relative;padding-bottom:20px}
  .tl .item:last-child{padding-bottom:0}
  .tl .item::before{content:"";position:absolute;left:11px;top:26px;bottom:-2px;width:2px;background:var(--line)}
  .tl .item:last-child::before{display:none}
  .tl .item.ok::before{background:var(--field-700)}
  .tl .node{width:24px;height:24px;border-radius:50%;flex-shrink:0;z-index:1;display:flex;
    align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid var(--line);background:#fff}
  .tl .item.ok .node{background:var(--field-700);border-color:var(--field-700);color:#fff}
  .tl .item.now .node{background:var(--maize);border-color:var(--maize);color:var(--field);
    box-shadow:0 0 0 4px rgba(242,169,0,.18)}
  .tl .c .tt{font-size:14px;font-weight:600}
  .tl .item.wait .c .tt{color:var(--muted);font-weight:500}
  .tl .c .dd{font-size:14.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .tl .c .ff{font-size:14px;font-weight:600;margin-top:3px;font-family:'Space Grotesk',sans-serif}
  .tl .item.ok .c .ff{color:var(--field-700)} .tl .item.now .c .ff{color:var(--maize-deep)}
  .tl .item.wait .c .ff{color:var(--muted)}
  .det-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:var(--shadow);margin-bottom:18px}
  /* líneas de pago (cobro mixto) */
  .pline{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    margin-bottom:10px;box-shadow:var(--shadow)}
  .pline .ph-row{display:flex;justify-content:space-between;align-items:center}
  .pline .mod{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .pline .mod .tag{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:3px 8px;border-radius:6px;background:#EDEAE0;color:var(--field)}
  .pline .del{color:var(--clay);font-size:15px;font-weight:600}
  .pline .det{font-size:14.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .pline .ok-foto{color:var(--ok);font-weight:600}
  .addbar{display:flex;gap:8px;margin:6px 0 4px}
  .addbar button{flex:1;padding:11px 8px;border:1px dashed var(--line);border-radius:12px;background:#fff;
    font-size:14.5px;font-weight:600;color:var(--field)}
  .addbar button:active{background:var(--paper)}
  .totbar{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;
    background:linear-gradient(155deg,var(--field-soft),#E4ECE6);color:var(--field-soft-txt);margin:16px 0;border:1px solid var(--field-soft-line)}
  .totbar .tk{font-size:14.5px;color:var(--muted)}
  .totbar .tv{font-size:22px;font-weight:700}
  .totbar .saldo{font-size:14px;color:var(--muted);margin-top:2px}
  /* modal de línea */
  .ov{position:fixed;inset:0;background:rgba(13,32,24,.5);z-index:60;display:flex;align-items:flex-end;
    justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:20px 18px 28px;
    max-height:88dvh;overflow-y:auto;animation:sheetup .25s}
  @keyframes sheetup{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h3{font-size:18px;font-weight:700;margin-bottom:4px}
  .sheet .sh-sub{font-size:15px;color:var(--muted);margin-bottom:16px}
  /* selector de origen de foto */
  .fotopick{display:flex;gap:10px}
  .fotopick label{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:18px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;
    font-size:15px;font-weight:600;color:var(--field);cursor:pointer}
  .fotopick label:active{background:var(--paper)}
  .fotopick .fi{font-size:24px}
  /* selección y reparto de facturas */
  .fsel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    margin-bottom:10px;box-shadow:var(--shadow)}
  .fsel.on{border-color:var(--field-700);background:#FBFCFB}
  .fsel .top{display:flex;align-items:center;gap:12px}
  .fsel .chk{width:24px;height:24px;border-radius:7px;flex-shrink:0;border:2px solid var(--line);
    background:#fff;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .fsel.on .chk{background:var(--field-700);border-color:var(--field-700)}
  .fsel .fi-nom{font-size:14px;font-weight:600}
  .fsel .fi-sal{font-size:14.5px;color:var(--muted);margin-top:2px}
  .fsel .aplica{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  .fsel .aplica label{font-size:14.5px;color:var(--muted);font-weight:600;flex-shrink:0}
  .fsel .aplica input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:10px;text-align:right}
  .fsel .estado-f{font-size:14px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .fsel .ef-canc{background:#E4F1E9;color:var(--ok)}
  .fsel .ef-abon{background:#FBF0D8;color:var(--maize-deep)}
  .montobox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    box-shadow:var(--shadow);margin-bottom:8px}
  .montobox label{display:block;font-size:14.5px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .montobox input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;
    font-size:22px;font-weight:700;text-align:center}
  .restante{font-size:14.5px;font-weight:600;text-align:center;margin:10px 0 2px}
  .restante.ok{color:var(--ok)} .restante.pend{color:var(--maize-deep)} .restante.over{color:var(--clay)}
  /* wizard */
  .wz-prog{display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .wz-prog .stp{flex:1;display:flex;flex-direction:column;gap:6px}
  .wz-prog .bar{height:5px;border-radius:3px;background:var(--line)}
  .wz-prog .stp.done .bar,.wz-prog .stp.cur .bar{background:var(--field-700)}
  .wz-prog .stp.cur .bar{background:var(--maize)}
  .wz-prog .lbl-s{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .wz-prog .stp.cur .lbl-s{color:var(--field)}
  .wz-prog .stp.done .lbl-s{color:var(--field-700)}
  .wz-nav{display:flex;gap:10px;margin-top:20px}
  .wz-nav .back{flex:0 0 auto;padding:15px 20px;border:1px solid var(--line);border-radius:14px;
    background:#fff;font-size:15px;font-weight:600;color:var(--field)}
  .wz-nav .next{flex:1}
  /* recibo enviado por WhatsApp */
  .recibo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .recibo .rh{text-align:center;padding-bottom:14px;border-bottom:1px dashed var(--line);margin-bottom:14px}
  .recibo .rh .chk-big{width:52px;height:52px;border-radius:50%;background:#E4F1E9;color:var(--ok);
    font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .recibo .rh .rt{font-size:16px;font-weight:700}
  .recibo .rh .rmonto{font-size:30px;font-weight:700;color:var(--field);margin-top:6px}
  .recibo .rrow{display:flex;justify-content:space-between;font-size:15px;padding:5px 0}
  .recibo .rrow .rk{color:var(--muted)}
  .recibo .rsec{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:14px 0 7px}
  .enviados{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .enviado{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
  .enviado .wa{width:34px;height:34px;border-radius:9px;background:#E4F1E9;color:var(--ok);
    font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .enviado .who-r{font-size:15px;font-weight:600}
  .enviado .num-r{font-size:14.5px;color:var(--muted);margin-top:1px}
  .enviado .est-r{margin-left:auto;font-size:14px;font-weight:700;color:var(--ok)}

  /* ── Panel de historial 3 meses (igualado con app Freelance) ── */
  .prodcard{background:#F0EEE4;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:16px}
  .pc-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .pc-img{width:54px;height:54px;border-radius:12px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .pc-nom{font-size:15px;font-weight:700;color:var(--field)}
  .pc-sub{font-size:14.5px;color:var(--muted);margin-top:2px}
  .pc-hist-t{font-size:14.5px;font-weight:700;color:var(--field);margin-bottom:8px}
  .pc-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:15px;font-weight:700;color:var(--field);cursor:pointer;text-align:left}
  .pc-toggle-sub{font-size:14px;font-weight:500;color:var(--muted)}
  .pc-toggle-ar{font-size:14px;color:var(--muted)}
  .pc-hist{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
  .pc-row{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:15px;border-bottom:1px solid var(--line)}
  .pc-row:last-child{border-bottom:none}

/* ═══ b14 · REDISEÑO TOMAR PEDIDO (réplica Comisionista b149) ═══ */
/* chips horizontales genéricos (otras pantallas): fila deslizable */
  .tipochips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tipochips::-webkit-scrollbar{display:none}
.tchip{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:9px 13px;border:1.5px solid var(--line);
    border-radius:11px;background:#fff;white-space:nowrap;cursor:pointer;font-family:inherit}
.tchip:active{background:var(--paper)}
.tchip.on{border-color:var(--field);background:var(--field)}
.tchip .tchip-cod{font-size:11px;font-weight:800;letter-spacing:.03em;font-family:'Space Grotesk',sans-serif;color:var(--maize-deep)}
.tchip.on .tchip-cod{color:var(--maize)}
.tchip .tchip-nom{font-size:12.5px;font-weight:600;color:#2C3A32}
.tchip.on .tchip-nom{color:#fff}
/* tipos de precio: los 5 en UNA fila, código arriba y nombre corto abajo */
  .tipochips.precios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;padding-bottom:2px}
.tipochips.precios .tchip{flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
    min-width:0;padding:7px 2px;white-space:normal;text-align:center}
.tipochips.precios{align-items:stretch}
.tipochips.precios .tchip .tchip-cod{line-height:1}
.tipochips.precios .tchip .tchip-nom{font-size:11px;font-weight:700;line-height:1.15;
    width:100%;white-space:nowrap}
/* tipo no aplicable (sin promociones vigentes): gris y apagado */
  .tipochips.precios .tchip.nodisp{opacity:.42;background:var(--paper);border-style:dashed}
.tipochips.precios .tchip.nodisp .tchip-cod,
  .tipochips.precios .tchip.nodisp .tchip-nom{color:var(--muted)}
/* buscador de cliente destacado en Tomar pedido (igual que en la app del freelance) */

  .cli-titulo{position:sticky;top:-10px;z-index:20;background:var(--paper);

.sol-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0}
/* Tarjetas de armado de pedido: Cantidad y Precio, separadas y con título resaltado */
  .tarjeta-pedido{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 15px;margin-bottom:14px;box-shadow:0 2px 10px rgba(21,57,43,.06)}
.tarjeta-pedido.tp-precio{border-color:var(--maize-deep);

.tarjeta-pedido .field{margin-bottom:0}

.tp-titulo .tp-ic{font-size:17px}
.tarjeta-pedido.tp-precio .tp-titulo{color:var(--maize-deep)}
/* b147 · precio base abreviado a la derecha del titulo: el vendedor ve contra que compara */
  .tp-titulo .tp-base{margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:700;
    color:var(--muted);letter-spacing:0;white-space:nowrap;font-family:'Space Grotesk',sans-serif}
/* Split 2 columnas: foto + referencia | controles (cantidad + precio) */
  .pedido-split{display:grid;grid-template-columns:0.72fr 1fr;gap:11px;align-items:stretch;margin-bottom:14px}
/* b145 · cuando el tipo trae campos extra (P3/P4/P6) la foto se estira al alto de la
     columna derecha: antes quedaba un hueco blanco grande debajo del saco. */
  .pedido-split.split-alto .ps-izq{align-self:stretch}
.pedido-split.split-alto .ps-foto{aspect-ratio:auto;height:100%;min-height:226px}
.ps-izq{display:flex;flex-direction:column;gap:9px;min-width:0}
/* la FOTO manda el alto del bloque (proporción fija) */
  .ps-foto{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 2px 10px rgba(21,57,43,.06);aspect-ratio:0.677/1}
.ps-foto img{width:100%;height:100%;object-fit:contain;border-radius:11px}
/* la derecha ocupa exactamente el alto de la foto: dos tarjetas iguales */
  .ps-controles{display:flex;flex-direction:column;gap:12px;min-width:0;
    aspect-ratio:0.956/1}
/* b141 · P3/P4/P5: los campos extra viven DENTRO de la tarjeta de precio.
     Con extras la columna crece por contenido (sin aspect-ratio fijo) para no desbordar sobre la foto. */
  .ps-controles.tiene-extra{aspect-ratio:auto;min-height:0}
.ps-controles.tiene-extra .tarjeta-pedido{flex:0 0 auto;justify-content:flex-start}
/* b146 · el aviso de precio bajo la base tambien crece la columna:
     con altura fija el texto se salia 21px y se montaba sobre la tarjeta de abajo. */
  .ps-controles.tiene-aviso{aspect-ratio:auto;min-height:0}
.ps-controles.tiene-aviso .tarjeta-pedido{flex:0 0 auto;justify-content:flex-start}
.tp-extra{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}

.ps-controles .tarjeta-pedido{margin-bottom:0;flex:1 1 0;min-height:0;

.ps-controles .tp-titulo .tp-ic{font-size:14px}
.ps-controles .tarjeta-pedido{padding:11px 11px}
/* la barra comisión/base vive bajo la foto y se APILA (columna angosta) */
  .ps-izq .base-barra{flex-direction:column;align-items:stretch;gap:5px;

  .sol-panel{border:1.5px solid var(--maize-deep);background:#FDFBF3;border-radius:16px;

.sol-head{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;

.sol-head .sol-ic{font-size:17px;line-height:1}
.sol-campo{margin-bottom:11px}
.sol-campo>label{display:block;font-size:12px;font-weight:700;color:var(--field);margin-bottom:6px}
.sol-campo input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#fff;
    border-radius:11px;padding:11px 12px;font-size:14.5px;font-family:inherit;color:var(--ink)}
.sol-campo input:focus{border-color:var(--maize-deep);outline:none}
.sol-btn{width:100%;box-sizing:border-box;border:none;border-radius:12px;padding:14px 10px;
    background:var(--field);color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.sol-btn:active{background:var(--field-700)}
.sol-btn:disabled{opacity:.45;cursor:default}
.sol-nota{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:9px;line-height:1.3}
/* los dos botones de acción, lado a lado */
  .cta-fila{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.cta-fila .cta{margin-top:0;padding:15px 8px;font-size:15px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
/* carrito grande y claro: agrega otro producto al pedido */
  .cta-carrito{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.cta-carrito .cta-carro{font-size:27px;line-height:1}
.cta-carrito .cta-mas{font-size:25px;font-weight:800;line-height:1}
.cta-carrito .cta-aut{width:100%;font-size:10.5px;font-weight:700;line-height:1.1}
.cta-guardar:active{background:var(--field-700,#1E4D3A)}
/* ── Buscadores destacados de Tomar pedido: más altos, más aire entre ellos ── */
  .busc-grande{margin-bottom:18px}
.busc-grande .ss .pick{padding:20px 16px;border-radius:15px;border-width:2px;
    box-shadow:0 3px 14px rgba(21,57,43,.09)}
.busc-grande .ss .pick .p1{font-size:17px;font-weight:800;color:var(--field)}
.busc-grande .ss .pick.fijo{border:none;box-shadow:none;padding:6px 2px}
.busc-grande .ss .box{padding:20px 16px;border-radius:15px;border-width:2px;
    box-shadow:0 3px 14px rgba(21,57,43,.07)}
.busc-grande .ss .box input{font-size:16px}
.busc-grande .field{margin-bottom:0}
/* tipos de precio: los 5 en UNA fila, código arriba y nombre corto abajo */
  .tipochips.precios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;padding-bottom:2px}
.tipochips.precios .tchip{flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
    min-width:0;padding:7px 2px;white-space:normal;text-align:center}
.tipochips.precios{align-items:stretch}
.tipochips.precios .tchip .tchip-cod{line-height:1}
.tipochips.precios .tchip .tchip-nom{font-size:11px;font-weight:700;line-height:1.15;
    width:100%;white-space:nowrap}
/* tipo no aplicable (sin promociones vigentes): gris y apagado */
  .tipochips.precios .tchip.nodisp{opacity:.42;background:var(--paper);border-style:dashed}
.tipochips.precios .tchip.nodisp .tchip-cod,
  .tipochips.precios .tchip.nodisp .tchip-nom{color:var(--muted)}
.prod-ficha{display:flex;align-items:center;gap:13px;padding:6px 2px;width:100%}
.pf-img{width:56px;height:56px;border-radius:12px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.pf-info{flex:1;min-width:0}
.pf-nom{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.25}
.pf-pres{font-size:12.5px;color:var(--muted);margin-top:3px}
.pf-ar{font-size:20px;color:var(--muted);flex-shrink:0}
/* cupo en dos columnas: medidor a la izquierda, detalle a la derecha */
  .cupo-cols{display:grid;grid-template-columns:0.92fr 1fr;gap:11px;align-items:center}
.cupo-cols .cupo-col-arco{min-width:0}
.cupo-cols .cupo-barra{margin-bottom:0;margin-top:6px;height:7px}
.cupo-cols .cupo-lines{justify-content:center;gap:3px;border-left:1px solid var(--line);padding-left:11px}
.cupo-cols{grid-template-columns:1fr}

/* ── Cotización: al imprimir (o "guardar como PDF" del celular) sale SOLO la hoja ── */
@media print{
  body *{ visibility:hidden !important; }
  .cot-hoja, .cot-hoja *{ visibility:visible !important; }
  .cot-hoja{ position:absolute !important; left:0 !important; top:0 !important; right:0 !important;
             width:100% !important; max-height:none !important; overflow:visible !important;
             border-radius:0 !important; box-shadow:none !important; }
  .cot-noprint{ display:none !important; }
}
/* ══ EL DEDO PIDE 44 px (26 jul · guía de Android y de iPhone) ══
   Un botón de 30 px se falla en el campo: con el teléfono en movimiento, con
   las manos sucias, con guantes. Se agranda el ÁREA QUE RESPONDE al toque,
   NO el dibujo: en pantalla todo se ve exactamente igual.
   · Los redondos y chicos (menú, cerrar, micrófono, campana) crecen en las dos
     direcciones hasta 44.
   · Los anchos y bajitos (pestañas de arriba, filtrar, ver más) crecen SOLO a
     lo alto: a lo ancho ya sobra, y así no le roban el toque al de al lado. */
.ham, .drawer-x, .micb, .topbtn, .filtrar-btn, .vermas,
.tocable, .net, .drawer-acc, .ba-demo{ position:relative; }
.ham::after, .drawer-x::after, .micb::after, .tocable::after{
  content:""; position:absolute; left:50%; top:50%;
  width:44px; height:44px; transform:translate(-50%,-50%);
}
.topbtn::after, .filtrar-btn::after, .vermas::after,
.net::after, .drawer-acc::after, .ba-demo::after{
  content:""; position:absolute; left:0; right:0; top:50%;
  height:44px; transform:translateY(-50%);
}
/* la campana de avisos no tiene clase: se la reconoce por su etiqueta */
button[aria-label="Notificaciones"]{ position:relative; }
button[aria-label="Notificaciones"]::after{
  content:""; position:absolute; left:50%; top:50%;
  width:46px; height:46px; transform:translate(-50%,-50%);
}

<script>
const {
  useState
} = React;
let ORG_ACTIVA_SOC = {
  uid: null,
  org: null
};
async function orgActivaSocio() {
  const {
    data: s
  } = await window.SB.auth.getSession();
  const uid = s && s.session && s.session.user && s.session.user.id;
  if (!uid) throw new Error("No hay una sesión activa.");
  if (ORG_ACTIVA_SOC.uid === uid && ORG_ACTIVA_SOC.org) return ORG_ACTIVA_SOC.org;
  const {
    data,
    error
  } = await window.SB.rpc("mi_org_activa");
  if (error || !data) throw new Error(error && error.message || "Sin organización activa.");
  ORG_ACTIVA_SOC = {
    uid,
    org: String(data)
  };
  return ORG_ACTIVA_SOC.org;
}

/* ── Pila de retrocesos por módulo ──
   Cada módulo montado deja su función aquí. El botón atrás consulta del último al primero.
   Con pila (y no una sola variable) ningún módulo puede borrar el handler de otro.
   El handler devuelve true si consumió el retroceso, false si no le tocaba. */
const RETROCESOS = [];
function useRetroceso(fn) {
  const ref = React.useRef(fn);
  ref.current = fn;
  React.useEffect(() => {
    const item = {
      run: () => ref.current()
    };
    RETROCESOS.push(item);
    return () => {
      const i = RETROCESOS.indexOf(item);
      if (i >= 0) RETROCESOS.splice(i, 1);
    };
  }, []);
}
function retrocederEnModulo() {
  for (let i = RETROCESOS.length - 1; i >= 0; i--) {
    try {
      if (RETROCESOS[i].run()) return true;
    } catch (e) {}
  }
  return false;
}

   llevas 2». Cuánto se puede regalar de verdad lo sigue diciendo la base, por RPC
   a `gratis_que_concede` (topeRegaloQq), que es la misma cuenta del cerrojo de
   `pedido_items` y de `facturar_pedido`. Dos fuentes para un mismo hecho terminan
   contradiciéndose. */
const PROMO_ESTADOS_VIVOS = ["activa", "aprobada"];
function promosDelCatalogo(promoTbl, hoyISO) {
  const tbl = promoTbl || {};
  /* Escalón de ARRANQUE de cada promoción: el `desde_cant` más bajo. Es el que se
     enseña; los demás escalones los aplica la base al calcular el tope. */
  const arranque = {};
  (tbl.tramos || []).forEach(t => {
    if (t.modalidad && t.modalidad !== "compra_lleva") return;
    const d = Number(t.desde_cant) || 0,
      g = Number(t.gratis_cant) || 0;
    if (!(d > 0) || !(g > 0)) return; // sin números no hay nada que ofrecer
    const ya = arranque[t.promo_id];
    if (!ya || d < ya.minimo) arranque[t.promo_id] = {
      minimo: d,
      gratis: g
    };
  });
  const vivas = [];
  (tbl.promos || []).forEach(p => {
    if (!p || p.modalidad !== "compra_lleva") return;
    if (p.es_demo === true) return;
    if (PROMO_ESTADOS_VIVOS.indexOf(p.estado) < 0) return;
    const d = p.vigente_desde ? String(p.vigente_desde).slice(0, 10) : null;
    const h = p.vigente_hasta ? String(p.vigente_hasta).slice(0, 10) : null;
    if (d && d > hoyISO) return; // todavía no rige
    if (h && h < hoyISO) return; // el ÚLTIMO día sí cuenta, igual que en la base
    const t = arranque[p.promo_id];
    if (!t) return; // cabecera sin escalones: no se ofrece lo que no se puede cumplir
    vivas.push({
      prodId: p.prod_id,
      presCod: p.pres_cod || null,
      provCod: p.prov_cod || null,
      origen: p.origen,
      promo: {
        id: p.promo_id,
        nombre: p.nombre,
        minimo: t.minimo,
        gratis: t.gratis,
        detalle: p.detalle || "compra " + t.minimo + " lleva " + t.gratis,
        base: p.base != null ? Math.round(Number(p.base) * 100) / 100 : null,
        desde: d,
        hasta: h,
        paga: p.origen === "proveedor" ? "proveedor" : "freelance"
      }
    });
  });
  /* Devuelve las promociones de UNA línea del catálogo, ya repartidas: las del
     freelance van a P4 y las del proveedor a P6. */
  return function (prodId, presCod, provCod, equiv, baseContado) {
    const f = [],
      v = [];
    vivas.forEach(x => {
      if (x.prodId !== prodId) return;
      if (x.presCod ? x.presCod !== presCod : Number(equiv) !== 1) return;
      if (x.provCod && provCod && x.provCod !== provCod) return;
      const pm = Object.assign({}, x.promo);
      /* Promoción sin base propia: manda el precio de la oferta. Con base 0 la
         comisión saldría siendo el precio ENTERO de la línea. */
      if (pm.base == null) pm.base = baseContado;
      (x.origen === "proveedor" ? v : f).push(pm);
    });
    return {
      freelance: f,
      proveedor: v
    };
  };
}

/* ── FA-0011 · el PEDIDO sale de las OFERTAS, ya no de `precios` ──
   El sistema web dejó de escribir en `precios`: hoy un producto nuevo nace con sus
   ofertas en `ofertas_piladora` y CERO filas en `precios`. Leyendo `precios`, el
   vendedor veía el producto en el catálogo pero NO lo podía PEDIR. Medido contra
   producción el 05/08/2026: 59 productos activos · 58 con fila en `precios` · 59
   con oferta vigente. El que faltaba era P-00197 «Arroz Crecedor», sin marca,
   2 presentaciones y 2 ofertas vivas de Piladora San Agustín.

   OJO CON EL PRECIO — aquí NO es el mismo que en la ficha de Productos:
   la línea del pedido se cobra por la PRESENTACIÓN, y `precio_contado` de la
   oferta YA viene por presentación ($37,00 el quintal, $9,25 la arroba). Entra
   DIRECTO: ni se multiplica ni se divide por equiv_qq. Antes se multiplicaba
   porque `precios.base_contado` venía por quintal. Confundirlo saca el pedido con
   importes falsos. El equiv_qq sigue viajando en `equiv` porque al guardar todo se
   convierte a quintales (cantidad_qq = cant × equiv · precio_usd = precio ÷ equiv).

   La oferta define QUÉ vende cada piladora y a qué precio: en el pedido la piladora
   se elige primero, así que cada una muestra SU precio. Sin producto activo o sin
   oferta vigente, la oferta no se ofrece. */
function construirCatalogoPedido(provs, ofertas, prods, presenTbl, promoTbl) {
  /* `presenTbl` no se usa aquí (esta app no trae foto por presentación); se recibe
     para que las tres apps se llamen EXACTAMENTE igual y ningún arnés ni ninguna
     pantalla tenga que acordarse de en cuál va el argumento en otro puesto. */
  const r2 = n => Math.round(n * 100) / 100;
  const nomDe = {},
    lineaDe = {},
    fotoDe = {};
  /* Un producto dado de baja no se puede pedir aunque su oferta siga viva: la
     consulta ya filtra por estado, pero la regla vive AQUÍ para que no dependa
     de que quien llame se acuerde de filtrar. */
  (prods || []).forEach(p => {
    if (p.estado && p.estado !== "activo") return;
    nomDe[p.prod_id] = p.nombre || p.marca || p.prod_id;
    lineaDe[p.prod_id] = p.linea || "Otros";
    fotoDe[p.prod_id] = p.foto || null;
  });
  /* La fecha del TELÉFONO, no la de Greenwich: con toISOString(), en Ecuador
     (UTC-5) desde las 19h ya sería "mañana" y una oferta entraría a regir cinco
     horas antes de tiempo. */
  const _h = new Date();
  const hoyISO = _h.getFullYear() + "-" + String(_h.getMonth() + 1).padStart(2, "0") + "-" + String(_h.getDate()).padStart(2, "0");
  /* PROMO-04 · las promociones vivas, listas para colgarlas de cada línea */
  const promosDe = promosDelCatalogo(promoTbl, hoyISO);
  /* Una sola línea por piladora + producto + presentación: si la base trajera dos
     ofertas vivas para la misma, manda la MÁS BARATA (nunca se ofrece de más). */
  const porClave = {};
  (ofertas || []).forEach(o => {
    if (o.activo === false) return;
    if (o.vigente_desde && String(o.vigente_desde).slice(0, 10) > hoyISO) return;
    if (o.vigente_hasta && String(o.vigente_hasta).slice(0, 10) <= hoyISO) return;
    const nom = nomDe[o.prod_id];
    if (!nom) return; // producto de baja o inexistente
    const eq = Number(o.equiv_qq) || 0;
    if (!(eq > 0)) return; // sin equivalencia no se puede pasar a quintales
    const pc = Number(o.precio_contado) || 0;
    if (!(pc > 0)) return; // sin precio no se inventa uno
    const pk = Number(o.precio_credito) || pc;
    const clave = o.prod_id + "-" + o.pres_cod + "|" + (o.prov_cod || "");
    const ya = porClave[clave];
    if (ya && ya.baseContado <= r2(pc)) return;
    const prom = promosDe(o.prod_id, o.pres_cod, o.prov_cod, eq, r2(pc));
    porClave[clave] = {
      id: o.prod_id + "-" + o.pres_cod,
      prodId: o.prod_id,
      presCod: o.pres_cod,
      equiv: eq,
      provId: o.prov_cod,
      linea: lineaDe[o.prod_id],
      marca: nom,
      nombre: nom + " · " + o.presentacion,
      unidad: o.presentacion,
      foto: fotoDe[o.prod_id] || null,
      diasCredito: 30,
      baseContado: r2(pc),
      baseCredito: r2(pk),
      costo: o.costo != null ? r2(Number(o.costo)) : null,
      promosFreelance: prom.freelance,
      promosProveedor: prom.proveedor
    };
  });
  const pres = Object.keys(porClave).map(k => porClave[k]);
  return {
    provs: (provs || []).map(p => ({
      id: p.prov_cod,
      nombre: p.nombre
    })),
    pres
  };
}

/* nombre del cliente → su código real. Lo llena el módulo Pedido al cargar. */
const CLI_ID_DE = {};
/* MARCA_EXCLUSIVA_CLIENTE · prod_id -> Set(cli_id). Si una marca tiene clientes aquí,
   SOLO se puede pedir para esos clientes. Vacío = marca normal, visible para todos. */
const EXCLUSIVA_DE = {};
const marcaVisibleParaCli = (prodId, cliId) => {
  const duenos = EXCLUSIVA_DE[prodId];
  if (!duenos || !duenos.size) return true; /* sin dueños: de todos */
  return !!cliId && duenos.has(cliId); /* con dueños: solo ellos */
};
/* PED_CUPO_VIVO_PARIDAD · ficha de cupo REAL del armador, por nombre de cliente:
   cupo = clientes.cupo · debe = suma de cartera pendiente (no demo). En modo demo manda FICHA_CLIENTE. */
let FICHA_VIVA_PED = {};
/* ═══ PROMO-03 · EL TOPE DEL REGALO LO DICE LA BASE, NO LA APP ═══════════════
   Decisión del Product Owner (06/08/2026): si el vendedor pone más regalo del
   que concede la promoción, el pedido NO se guarda y se le muestra el número
   exacto que sí concede. Es mercadería regalada: mejor frenar antes que
   reclamar después.

   El número NO se calcula aquí. Se le PREGUNTA a la base, a la función
   `gratis_que_concede`, que es la misma que usa el cerrojo de `pedido_items`
   y la misma que usa `facturar_pedido` al confirmar el despacho. Si la app
   tuviera su propia fórmula, el día que una de las dos se corrija sin la otra
   saldría grano regalado que nadie autorizó: dos fuentes para un mismo hecho
   siempre terminan contradiciéndose.

   Todo viaja EN QUINTALES, que es como lo guarda `pedido_items`: la cantidad
   y el regalo se multiplican por el `equiv` de la OFERTA, nunca por lo que
   parezca decir el nombre de la presentación. Una arroba son 0,25 qq y «10
   libras» son 0,1 qq: adivinarlo por el texto es regalar diez veces más grano
   del que la piladora despacha (el mismo golpe de `descomponerGratis`).

   Devuelve: número = quintales que concede · null = no hay promoción vigente
   · undefined = no se pudo preguntar (sin señal), y entonces manda el cerrojo
   de la base, que igual no deja pasar la línea. */
async function topeRegaloQq({
  prodId,
  presCod,
  provId,
  cantidadQq
}) {
  if (!window.SB || !window.SB.rpc) return undefined;
  try {
    const {
      data,
      error
    } = await window.SB.rpc("gratis_que_concede", {
      p_prod_id: prodId || null,
      p_pres_cod: presCod || null,
      p_prov_cod: provId || null,
      p_cantidad_qq: Number(cantidadQq) || 0,
      p_es_demo: false
    });
    if (error) return undefined;
    return data === null || data === undefined ? null : Number(data);
  } catch (e) {
    return undefined;
  }
}

/* Revisa el pedido línea por línea. Devuelve null si todo está en orden, o el
   aviso —en criollo, para leerlo en el celular— de la PRIMERA línea que se
   pasa. Mientras haya aviso, el pedido no se guarda ni en el teléfono.

   P3 queda fuera a propósito: ese regalo lo arma el vendedor y sale de SU
   comisión, no de ninguna promoción. Bloquearlo contra una promoción que no
   existe sería matar una función que hoy trabaja. */
async function revisarRegaloDePromo(items, provId) {
  const r2 = x => Math.round(x * 100) / 100;
  for (const it of items || []) {
    if (!it || !it.prod) continue;
    if (it.tipo === "P3") continue;
    if (!it.prod.prodId) continue; /* producto de demostración: no llega a la base */
    const eq = Number(it.prod.equiv) > 0 ? Number(it.prod.equiv) : 1;
    const regaloQq = r2((Number(it.gratis) || 0) * eq);
    if (!(regaloQq > 0)) continue;
    const cantQq = r2((Number(it.cant) || 0) * eq);
    const tope = await topeRegaloQq({
      prodId: it.prod.prodId,
      presCod: it.prod.presCod,
      provId: provId,
      cantidadQq: cantQq
    });
    if (tope === undefined) continue;
    const nom = it.prodNombre || it.prod.nombre || "ese producto";
    if (tope === null) return "🚫 No se puede regalar en " + nom + "\n\n" + "Ese producto no tiene promoción vigente ahora mismo.\n\n" + "Quita el regalo, o usa «Promo vendedor», que sale de tu comisión.";
    if (regaloQq > tope + 0.005) return "🚫 Te pasaste con el regalo en " + nom + "\n\n" + "Pusiste " + r2(regaloQq) + " qq de regalo y por " + r2(cantQq) + " qq la promoción concede " + r2(tope) + " qq.\n\n" + "Baja el regalo a " + r2(tope) + " qq o sube la cantidad, y vuelve a guardar.";
  }
  return null;
}
async function guardarPedidoEnBase({
  cli,
  prov,
  carrito,
  ubic,
  retiro,
  asumeFlete,
  asumeEstibada,
  fechaEntrega,
  notaChofer
}) {
  /* FE01_QUITA_COBRO: ya no recibe el cobro de flete/estibada */
  try {
    if (!window.SB || !window.SB.auth) return {
      ok: false,
      motivo: "sin_conexion"
    };
    const {
      data: s
    } = await window.SB.auth.getSession();
    if (!s || !s.session) return {
      ok: false,
      motivo: "sin_sesion"
    };
    const cliId = CLI_ID_DE[cli && cli.nombre || cli];
    if (!cliId) return {
      ok: false,
      motivo: "cliente_demo"
    };
    const items = (carrito || []).filter(it => it && it.prod);
    if (!items.length || items.some(it => !it.prod.prodId || !it.prod.equiv)) return {
      ok: false,
      motivo: "producto_demo"
    };
    /* PROMO-03 · antes de tocar la base: el regalo no puede pasar de lo que
       concede la promoción. Si se pasa, no nace ni la cabecera del pedido. */
    const avisoRegalo = await revisarRegaloDePromo(items, prov && prov.id || null);
    if (avisoRegalo) return {
      ok: false,
      motivo: avisoRegalo,
      regalo: true
    };
    const condicion = items.some(it => it.credito) ? "credito" : "contado";
    const opId = "SOC-PED-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    const payload = {
      cliente_id: cliId,
      proveedor_id: prov && prov.id || null,
      condicion,
      origen_canal: "socio",
      /* PED_ORIGEN_CANAL */
      ubicacion_id: retiro ? null : ubic && ubic.ubic_id || null,
      retiro_bodega: !!retiro,
      asume_flete: retiro ? null : asumeFlete || "freelance",
      asume_estibada: retiro ? null : asumeEstibada || "freelance",
      /* FE01_QUITA_COBRO: el cobro de flete/estibada ya va en los precios base; se mandan fijo en 0 (columnas se conservan) */
      flete_cobro_qq: 0,
      estibada_cobro_qq: 0,
      fecha_entrega: fechaEntrega || null,
      nota_chofer: notaChofer && notaChofer.trim() || null,
      items: items.map(it => ({
        prod_id: it.prod.prodId,
        pres_cod: it.prod.presCod,
        cantidad_presentacion: Number(it.cant),
        gratis_presentacion: Number(it.gratis) || 0,
        precio_presentacion: Number(it.precio),
        tipo_precio: it.tipo,
        condicion: it.credito ? "credito" : "contado",
        promo_id: it.promoId || null,
        comision_propuesta: it.tipo === "P5" ? Number(it.comisionTotal) || 0 : null
      }))
    };
    const {
      data,
      error
    } = await window.SB.rpc("registrar_pedido_atomico", {
      p_payload: payload,
      p_op_id: opId
    });
    /* P0C_VENCIDAS · rechazo DURO por facturas vencidas = regla de negocio, no conexión:
       el pedido NO nació y NO sirve reintentar/encolar. */
    if (error) {
      const msg = error.message || "error_pedido";
      return {
        ok: false,
        motivo: msg,
        reglaNegocio: /vencid/i.test(msg)
      };
    }
    const r = data && data[0] || data || {};
    return {
      ok: true,
      pedId: r.ped_id || opId,
      repetido: !!r.repetido
    };
  } catch (e) {
    return {
      ok: false,
      motivo: "error"
    };
  }
}

/* ═══ EL TOTAL EN QUINTALES DEL PEDIDO EN CURSO ═══════════════════════════
   Sale de la EQUIVALENCIA REAL de la oferta (`equiv`), que es la misma con la
   que se graba la línea (cantidad_qq = cant × equiv). Antes la pantalla la
   ADIVINABA del texto de la unidad: «Arroba» no decía «quintal» ni traía «kg»,
   así que valía 1 qq en vez de 0,25 y la tarjeta «Cantidad» del resumen decía
   CUATRO VECES más de lo que se guardaba. Dos fuentes para el mismo hecho
   terminan contradiciéndose; aquí hay una sola, y es la que viaja a la base.
   En la demostración no hay oferta ni equivalencia: solo ahí se cae a qqDeTam,
   el conversor que el resto de la app ya usa.
   ═══════════════════════════════════════════════════════════════════════════ */
function totalQuintalesDeCarrito(carrito) {
  const qq = (carrito || []).reduce((s, it) => {
    if (!it) return s;
    const eq = it.prod ? Number(it.prod.equiv) : 0;
    return s + (eq > 0 ? eq : qqDeTam(it.unidad)) * (Number(it.cant) || 0);
  }, 0);
  return Math.round(qq * 100) / 100;
}

/* ═══ b14 · MOTOR DE PROMOCIONES (reglas selladas, réplica Comisionista b149) ═══ */
/* PROMO-04 · la fecha del TELÉFONO, no la de Greenwich. Con toISOString(), en
   Ecuador (UTC-5) desde las 19h ya sería mañana: una promoción que muere hoy
   desaparecería del selector cinco horas antes de tiempo, aunque la base la
   siguiera concediendo. Es el mismo colador que usa el catálogo. */
const HOY_PROMO = (() => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
})();
const promoVigente = pm => pm.activa !== false && (!pm.desde || pm.desde <= HOY_PROMO) && (!pm.hasta || pm.hasta >= HOY_PROMO);
const promosVigentes = lista => (lista || []).filter(promoVigente);
const gratisDePromo = (pm, cant) => !pm || !pm.minimo || !pm.gratis || !(cant > 0) ? 0 : Math.round(cant / pm.minimo * pm.gratis * 100) / 100;
const qqDeTam = t => {
  if (!t) return 1;
  if (/quintal/i.test(t)) return 1;
  if (/arroba/i.test(t)) return 0.25;
  let m = t.match(/([\d.]+)\s*kg/i);
  if (m) return (parseFloat(m[1]) || 0) / 45.4;
  m = t.match(/([\d.]+)\s*lb/i);
  if (m) return (parseFloat(m[1]) || 0) / 100;
  return 1;

// Consumo diario estimado por cliente|presentación, derivado del promedio de compras.
// Cruza con el stock registrado en territorio para estimar cuántos días le quedan antes de pedir.
const CONSUMO_DIARIO = {
  "Comercial Mendoza|AG-QQ": 5,
  "Comercial Mendoza|AZ-50": 2,
  "Distribuidora Ríos|AG-QQ": 8,
  "Distribuidora Ríos|HY-QQ": 6,
  "Bodega El Agricultor|MA-QQ": 2,
  "Tienda La Esquina|AE-QQ": 1
};

// Clientes próximos a pedir: por cada cliente toma el producto más urgente (menos días de stock).
// rojo = quedan ≤5 días (visitar ya); ámbar = ≤10 días (se acerca). Más de 10 no aparece.
function clientesPorVisitar() {
  const porCli = {};
  Object.keys(STOCK_ANTERIOR).forEach(k => {
    const cons = CONSUMO_DIARIO[k];
    if (!cons) return;
    const [cli] = k.split("|");
    const dias = Math.round(STOCK_ANTERIOR[k].cant / cons);
    if (!porCli[cli] || dias < porCli[cli].dias) porCli[cli] = {
      cli,
      dias
    };
  });
  return Object.values(porCli).filter(x => x.dias <= 10).map(x => ({
    ...x,
    nivel: x.dias <= 5 ? "rojo" : "ambar"
  })).sort((a, b) => a.dias - b.dias);
}

// Código de desbloqueo que entrega el proveedor (en producción es de un solo uso y temporal)
const CODIGO_DESBLOQUEO = "4827";

// evalúa el bloqueo de un cliente; devuelve lista de motivos (vacía = sin bloqueo)
function motivosBloqueo(nombreCliente) {
  const f = FICHA_CLIENTE[nombreCliente];
  const r = RIESGO_CLIENTE[nombreCliente] || {
    vencidas: 0,
    protestados: 0
  };
  if (!f) return [];
  const usado = (f.facturasPend || 0) + (f.chequesPosf || 0);
  const motivos = [];
  if (usado > f.cupo) motivos.push(`Cupo excedido: usa ${money(usado)} de ${money(f.cupo)}`);
  if ((f.nFacturas || 0) > MAX_FACTURAS) motivos.push(`Demasiadas facturas pendientes: ${f.nFacturas} (máx. ${MAX_FACTURAS})`);
  if (r.vencidas > 0) motivos.push(`${r.vencidas} factura(s) vencida(s)`);
  if (r.protestados > 0) motivos.push(`${r.protestados} cheque(s) protestado(s)`);
  return motivos;
}

      cliente: t.cli || null,
      fecha: t.fecha,

      tipo: t.tipo || "Otro",
      objetivo: t.nota || t.objetivo || null,
      ubic: t.ubic || null,
      dur: Number(t.dur) || 30,
      recordatorio: Number(t.recordatorio) || 15,
      estado: t.hecho ? "completada" : "pendiente"
    };
    const {
      error
    } = await window.SB.from("agenda_actividades").upsert(fila, {
