function Decisiones({ctx, datos}){
  const [facturar,setFacturar]=useState(FACTURAR_INI);
  const [pagos,setPagos]=useState(PAGOS_CONF_INI);
  const [solics,setSolics]=useState(SOLIC_PROV_INI);
  const [cheques,setCheques]=useState(CHEQ_AUT_INI);
  const [numFac,setNumFac]=useState({});          // id → número de factura digitado
  const [salio,setSalio]=useState({});            // "ped|item" → quintales que salieron
  const [regalo,setRegalo]=useState({});          // "ped|item" → quintales de REGALO que salieron
  const [topes,setTopes]=useState({});            // "ped|item" → tope de regalo que dijo la base
  const [facturando,setFacturando]=useState("");  // id del pedido que se está guardando
  const [nc,setNC]=useState(null);                // {pedido, linea} al que se le hace la NC
  const [ncQq,setNcQq]=useState(""); const [ncVal,setNcVal]=useState("");
  const [ncMot,setNcMot]=useState(""); const [ncOri,setNcOri]=useState("");
  const [ncNum,setNcNum]=useState(""); const [ncGuardando,setNcGuardando]=useState(false);
  const [cambio,setCambio]=useState(null);       // {p,l,clave}
  const [cambioPrev,setCambioPrev]=useState(null);
  const [cambioGuardando,setCambioGuardando]=useState(false);
  const [ajInt,setAjInt]=useState(null);         // {p,l}
  const [ajQq,setAjQq]=useState(""); const [ajMot,setAjMot]=useState(""); const [ajOri,setAjOri]=useState("");
  const [ajGuardando,setAjGuardando]=useState(false);
  const [rechazo,setRechazo]=useState(null);      // {id, motivo}
  const [respondiendo,setRespondiendo]=useState(null);  // id de la devolución que se está guardando
  const [anulando,setAnulando]=useState(null);   // {id, factura, cliente, monto, motivo}
  const [anuGuardando,setAnuGuardando]=useState(false);
  const [aviso,setAviso]=useState("");
  /* lo que el sistema tenga guardado manda sobre la demostración */
  React.useEffect(()=>{
    if(!datos) return;
    if(datos.facturar && datos.facturar.length) setFacturar(datos.facturar);
    if(datos.solics && datos.solics.length) setSolics(datos.solics);
  },[datos]);
  const toca=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3400); if(ctx&&ctx.accion) ctx.accion(()=>{}); };

  const card={background:"#fff",border:"1px solid var(--linea)",borderRadius:14,padding:"14px 15px",marginBottom:10};
  const secH={fontFamily:"Space Grotesk",fontWeight:700,fontSize:13,letterSpacing:".04em",textTransform:"uppercase",color:"var(--ok)",margin:"18px 2px 8px"};
  const btnOk={width:"100%",padding:"12px",border:"none",borderRadius:11,background:"var(--ok)",color:"#fff",fontWeight:700,fontSize:13.5,fontFamily:"inherit",marginTop:10};
  const btn2={flex:1,padding:"11px",border:"1px solid var(--linea)",borderRadius:11,background:"#fff",fontWeight:700,fontSize:13,fontFamily:"inherit"};
  const chip=(bg,c,t)=><span style={{fontSize:10.5,fontWeight:700,padding:"3px 9px",borderRadius:20,background:bg,color:c,whiteSpace:"nowrap"}}>{t}</span>;

  /* Cuántos quintales salieron de esa línea: lo que la piladora escribió, y
     mientras no escriba nada, lo pedido. Es lo normal que salga completo. */
  const qqSalio=(p,l)=>{
    const v = salio[p.id+"|"+l.itemId];
    return v===undefined || v==="" ? l.pedido : (parseFloat(v)||0);
  };
  const totalSalio=(p)=> (p.lineas||[]).reduce((s,l)=>s+qqSalio(p,l),0);
  const totalPedido=(p)=> (p.lineas||[]).reduce((s,l)=>s+l.pedido,0);
  const sobrePedido=(p)=> (p.lineas||[]).some(l=>qqSalio(p,l) > l.pedido + 0.001);

  /* ── EL REGALO DE CADA LÍNEA ──────────────────────────────────────────
     Cuánto regalo salió: lo que la piladora escribió; mientras no escriba
     nada, el tope que dijo la base (lo normal es que salga completo), y si
     la base aún no contesta, lo prometido en el pedido. */
  const qqRegalo=(p,l)=>{
    const v = regalo[p.id+"|"+l.itemId];
    if(v!==undefined && v!=="") return parseFloat(v)||0;
    const t = topes[p.id+"|"+l.itemId];
    return t!==undefined ? t : (Number(l.gratis)||0);
  };
  /* ¿Alguna línea con MÁS regalo del que la base dijo que puede salir?
     Solo se frena con tope CONOCIDO: sin señal no se bloquea a ciegas,
     manda el cerrojo de la base. */
  const sobreRegalo=(p)=> (p.lineas||[]).some(l=>{
    if(!(Number(l.gratis)>0)) return false;
    const t = topes[p.id+"|"+l.itemId];
    return t!==undefined && qqRegalo(p,l) > t + 0.005;
  });
  /* El tope se pregunta a la base cada vez que cambia lo que está saliendo:
     en despacho corto el regalo baja en proporción, y la piladora tiene que
     verlo ANTES de mandar, no llevarse el rechazo de sorpresa. */
  React.useEffect(()=>{
    if(!datos) return;
    const t=setTimeout(async()=>{
      for(const p of facturar){
        if(p.estado!=="pendiente") continue;
        for(const l of (p.lineas||[])){
          if(!(Number(l.gratis)>0) || !l.prodId) continue;
          const tope = await topeRegaloAlDespachar({ prodId:l.prodId, provCod:p.provCod,
            cantidadQq:l.pedido, despachadoQq:qqSalio(p,l), gratisQq:l.gratis, esDemo:l.demo });
          if(tope!==undefined) setTopes(x=>({...x,[p.id+"|"+l.itemId]:tope}));
        }
      }
    },350);
    return ()=>clearTimeout(t);
  },[datos,facturar,salio]);

  const hacerFactura=async (p)=>{
    const num=(numFac[p.id]||"").trim();
    if(!num){ toca("Digita el número de factura para "+p.id+"."); return; }
    if(sobrePedido(p)){ toca("No puedes despachar más de lo que te pidieron."); return; }
    if(sobreRegalo(p)){ toca("Hay un regalo con más quintales de los que pueden salir. Bájalo al tope que se muestra."); return; }
    if(totalSalio(p)<=0){ toca("Si no salió ni un quintal, eso no es una factura."); return; }
    /* el regalo viaja confirmado en TODAS las líneas que lo prometen:
       la pantalla siempre trae un número puesto (el tope, o lo prometido),
       así que de aquí no sale nunca un regalo «sin pronunciarse» */
    const lineas=(p.lineas||[]).map(l=>{
      const fila={ itemId:l.itemId, despachado:qqSalio(p,l) };
      if(Number(l.gratis)>0) fila.gratisDesp=qqRegalo(p,l);
      return fila;
    });
    if(datos){
      setFacturando(p.id);
      const r = await guardarFactura(p.id, num, lineas);
      setFacturando("");
      if(!r.ok){ toca(r.motivo); return; }
      setFacturar(fs=>fs.map(x=>x.id===p.id?{...x,estado:"facturado",factura:num,
        lineas:(x.lineas||[]).map(l=>({...l, despachado:qqSalio(p,l),
          gratisDespachado: Number(l.gratis)>0 ? qqRegalo(p,l) : l.gratisDespachado}))}:x));
      toca(r.aviso);
      return;
    }
    /* sin sesión: la demostración de siempre */
    setFacturar(fs=>fs.map(x=>x.id===p.id?{...x,estado:"facturado",factura:num}:x));
    toca("Facturado ✓ Nace la comisión de Daniel y el pedido entra a Logística.");
  };
  const abrirNC=(p,l)=>{ setNC({p,l}); setNcQq(""); setNcVal(""); setNcMot(""); setNcOri(""); setNcNum(""); };
  const guardarNotaCredito=async ()=>{
    if(!nc) return;
    if(!ncOri){ toca("Falta decir de quién nació la nota de crédito."); return; }
    if(!(parseFloat(ncQq)>0)){ toca("¿Cuántos quintales devolvieron?"); return; }
    if(!(parseFloat(ncVal)>=0)){ toca("Falta el valor de la nota de crédito."); return; }
    if(!ncMot.trim()){ toca("El motivo es obligatorio: alguien lo va a leer dentro de seis meses."); return; }
    setNcGuardando(true);
    const r = await guardarNC({ itemId:nc.l.itemId, qq:ncQq, valor:ncVal,
      motivo:ncMot, origen:ncOri, numero:ncNum });
    setNcGuardando(false);
    if(!r.ok){ toca(r.motivo); return; }
    setNC(null); toca(r.aviso);
  };
  const abrirCambio=(p,l)=>{
    setCambio({p,l,clave:""});setCambioPrev(null);
  };
  const calcularCambio=async()=>{
    if(!cambio||!cambio.clave){ toca("Elige el nuevo producto y presentación."); return; }
    const a=(cambio.p.alternativas||[]).find(x=>x.prodId+"|"+x.presCod===cambio.clave);
    if(!a) return;
    setCambioGuardando(true);
    const r=await previsualizarCambioLinea({itemId:cambio.l.itemId,prodId:a.prodId,presCod:a.presCod,promoId:null});
    setCambioGuardando(false);
    if(!r.ok){setCambioPrev(null);toca(r.motivo);return;}
    setCambioPrev({...r,alternativa:a});
  };
  const confirmarCambio=async()=>{
    if(!cambioPrev||!cambio) return;
    setCambioGuardando(true);
    const a=cambioPrev.alternativa;
    const r=await guardarCambioLinea({itemId:cambio.l.itemId,prodId:a.prodId,presCod:a.presCod,promoId:null,
      opId:"AJL-"+cambio.l.itemId+"-"+Date.now().toString(36).toUpperCase()});
    setCambioGuardando(false);
    if(!r.ok){toca(r.motivo);return;}
    setFacturar(fs=>fs.map(x=>{
      if(x.id!==cambio.p.id) return x;
      const lineas=(x.lineas||[]).map(l=>l.itemId===cambio.l.itemId?{...l,nombre:r.descripcion,
        prodId:r.prod_id,presCod:r.pres_cod,precio:Number(r.precio_qq)||0,comision:Number(r.comision_total)||0}:l);
      return {...x,lineas,monto:lineas.reduce((s,l)=>s+(Number(l.pedido)||0)*(Number(l.precio)||0),0)};
    }));
    setCambio(null);setCambioPrev(null);toca(r.aviso||"Producto y presentación actualizados.");
  };
  const abrirAjusteInterno=(p,l)=>{setAjInt({p,l});setAjQq("");setAjMot("");setAjOri("");};
  const confirmarAjusteInterno=async()=>{
    if(!ajInt) return;
    if(!ajOri){toca("Falta indicar quién asume el ajuste.");return;}
    if(!(Number(ajQq)>0)){toca("Escribe una cantidad mayor que cero.");return;}
    if(ajMot.trim().length<5){toca("El motivo debe explicar qué se corrigió.");return;}
    setAjGuardando(true);
    const r=await guardarAjusteInterno({itemId:ajInt.l.itemId,qq:ajQq,motivo:ajMot.trim(),origen:ajOri,
      opId:"AJI-"+ajInt.l.itemId+"-"+Date.now().toString(36).toUpperCase()});
    setAjGuardando(false);
    if(!r.ok){toca(r.motivo);return;}
    setAjInt(null);toca(r.aviso||"Ajuste interno registrado.");
  };

  const confirmarPago=(p)=>{
    setPagos(ps=>ps.map(x=>x.id===p.id?{...x,estado:"confirmado"}:x));
    toca("Pago confirmado ✓ La comisión "+p.comId+" ("+money(p.comision)+") queda LIBERADA para Daniel.");
  };
  const aprobarSol=async(s)=>{
    /* Una DEVOLUCIÓN no es una solicitud cualquiera: aceptarla habilita borrar
       una deuda y una comisión. Va por su propia puerta, y si la base la
       rechaza NO se pinta como aceptada. Antes, cualquier respuesta se pintaba
       primero y se guardaba después: la pantalla decía "aprobada" aunque la
       base hubiera dicho que no. */
    if(s.tipoRaw==="devolucion"){
      if(!datos){ toca("Estás viendo datos de demostración: entra con tu cuenta para aceptar una devolución de verdad."); return; }
      setRespondiendo(s.id);
      const r=await resolverDevolucion(s.id,true,"");
      setRespondiendo(null);
      if(!r.ok){ toca("No se aceptó: "+r.motivo); return; }
      setSolics(ss=>ss.map(x=>x.id===s.id?{...x,estado:"aprobada",motivoResp:"Aceptada"}:x));
      toca("Devolución aceptada ✓ Ahora anula la factura para que se borre la deuda del cliente.");
      return;
    }
    /* P0C_EXCEPCION_CREDITO · esperar el resultado REAL antes de pintar. Ahora importa de
       verdad: al aprobar una excepcion_credito la base MUEVE el pedido (→ enviado_proveedor,
       o → ingresado). Si el RPC falla, no se pinta "aprobada". En demo se pinta optimista. */
    if(!datos){
      setSolics(ss=>ss.map(x=>x.id===s.id?{...x,estado:"aprobada",motivoResp:"Aprobada"}:x));
      toca("Estás viendo datos de demostración: entra con tu cuenta para aprobar de verdad.");
      return;
    }
    setRespondiendo(s.id);
    const ok=await responderSolicitud(s.id,"aprobada","Aprobada");
    setRespondiendo(null);
    if(!ok){ toca("No se pudo aprobar la solicitud: revisa la conexión e inténtalo de nuevo."); return; }
    setSolics(ss=>ss.map(x=>x.id===s.id?{...x,estado:"aprobada",motivoResp:"Aprobada"}:x));
    toca(s.tipoRaw==="excepcion_credito" ? "Crédito autorizado ✓ El pedido avanza solo." : "Solicitud aprobada · Daniel lo ve en su sistema.");
  };
  const confirmarRechazo=async()=>{
    if(!rechazo.motivo.trim()){ toca("El motivo es obligatorio: Daniel lo leerá tal cual."); return; }
    const s=solics.find(x=>x.id===rechazo.id);
    if(s && s.tipoRaw==="devolucion"){
      if(!datos){ toca("Datos de demostración: entra con tu cuenta para rechazar de verdad."); return; }
      setRespondiendo(rechazo.id);
      const r=await resolverDevolucion(rechazo.id,false,rechazo.motivo.trim());
      setRespondiendo(null);
      if(!r.ok){ toca("No se rechazó: "+r.motivo); return; }
      setSolics(ss=>ss.map(x=>x.id===rechazo.id?{...x,estado:"rechazada",motivoResp:rechazo.motivo.trim()}:x));
      setRechazo(null);
      toca("Devolución rechazada · la factura sigue vigente y el vendedor ve tu motivo.");
      return;
    }
    /* P0C_EXCEPCION_CREDITO · igual que aprobar: esperar el resultado real antes de pintar. */
    if(!datos){
      setSolics(ss=>ss.map(x=>x.id===rechazo.id?{...x,estado:"rechazada",motivoResp:rechazo.motivo.trim()}:x));
      setRechazo(null); toca("Datos de demostración: entra con tu cuenta para rechazar de verdad.");
      return;
    }
    setRespondiendo(rechazo.id);
    const ok=await responderSolicitud(rechazo.id,"rechazada",rechazo.motivo.trim());
    setRespondiendo(null);
    if(!ok){ toca("No se pudo rechazar la solicitud: revisa la conexión e inténtalo de nuevo."); return; }
    setSolics(ss=>ss.map(x=>x.id===rechazo.id?{...x,estado:"rechazada",motivoResp:rechazo.motivo.trim()}:x));
    setRechazo(null); toca("Rechazada con motivo · queda en el historial.");
  };

  /* Anular la factura · el último paso de la cadena */
  const confirmarAnulacion=async()=>{
    if(!anulando) return;
    if(anulando.motivo.trim().length < 5){ toca("Escribe el motivo de la anulación."); return; }
    setAnuGuardando(true);
    const r=await anularFacturaEnBase(anulando.id, anulando.motivo.trim());
    setAnuGuardando(false);
    if(!r.ok){
      alert("⚠ LA FACTURA NO SE ANULÓ\n\n"+r.motivo+
            "\n\nNada cambió: la deuda del cliente y la comisión del vendedor siguen como estaban.");
      return;
    }
    setFacturar(fs=>fs.map(x=>x.id===anulando.id?{...x,estado:"anulado"}:x));
    setAnulando(null);
    toca("Factura anulada ✓ Se borró la deuda del cliente y la comisión de esa venta.");
  };
  const autorizarCheque=(c,ok)=>{
    setCheques(cs=>cs.map(x=>x.id===c.id?{...x,estado:ok?"autorizado":"denegado"}:x));
    toca(ok?"Depósito autorizado ✓ Daniel puede depositar el cheque (culmina su custodia).":"Depósito denegado · avisa a Daniel el nuevo acuerdo.");
  };

  /* ¿este pedido tiene una devolución YA ACEPTADA? De eso depende que se
     pueda anular su factura. */
  const devolAceptada=(pedId)=> solics.some(s=>
    s.tipoRaw==="devolucion" && s.pedId===pedId && s.estado==="aprobada");
  const devolPend = solics.filter(s=>s.tipoRaw==="devolucion" && s.estado==="pendiente");

  const pendF=facturar.filter(x=>x.estado==="pendiente");
  const pendP=pagos.filter(x=>x.estado==="pendiente");
  const pendS=solics.filter(x=>x.estado==="pendiente");
  const pendC=cheques.filter(x=>x.estado==="pendiente");

  return (
    <div style={{padding:"14px 16px 90px"}}>
      <div style={{fontSize:12.5,color:"var(--tinta-suave, #6B6455)",background:"var(--maiz-suave)",border:"1px solid #EAD9A8",borderRadius:12,padding:"11px 13px",fontWeight:600}}>
        🔑 Dos actos tuyos mueven la plata del canal: <b>facturar</b> hace nacer la comisión de Daniel, y <b>confirmar el pago efectivo</b> es la única vía que la libera.
      </div>

      {/* ══ 1 · PEDIDOS POR FACTURAR ══ */}
      <div style={secH}>🧾 Pedidos por facturar {pendF.length>0 && "· "+pendF.length} <SelloVivo vivo={!!datos}/></div>
      {facturar.map(p=>(
        <div key={p.id} style={card}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{nombreClientePedido({cli:p.cliente, razon:p.razon, tipoCli:p.tipoCli})} <span className="num" style={{fontWeight:600,fontSize:11.5,color:"#6B6455"}}>· {p.id}</span></div>{/* NOMBRE_CLIENTE_INTEGRIDAD_3 */}
              <div style={{fontSize:12.5,color:"#6B6455",marginTop:2}}>{p.detalle}</div>
              <div className="num" style={{fontSize:12,color:"#6B6455",marginTop:2}}>{p.fecha}</div>{/* PED_FILA_SOLO_QQ · la fila muestra solo fecha (los quintales van en p.detalle); el monto sigue en el detalle/factura */}
            </div>
            {p.estado==="facturado" ? chip("var(--ok-suave)","var(--ok)","Facturada · "+p.factura)
              : p.estado==="anulado" ? chip("#F8E3DC","#C0392B","Anulada · "+(p.factura||""))
              : chip("var(--maiz-suave)","#8A6A00","Por facturar")}
          </div>
          {/* ── Ya facturado y salió corto: queda a la vista, no se esconde ── */}
          {p.estado==="facturado" && (p.lineas||[]).some(l=>l.despachado!=null && l.despachado < l.pedido) && (
            <div style={{marginTop:8,fontSize:12,color:"#8A4B2A",fontWeight:600}}>
              Salió corto: {totalSalio(p)} de {totalPedido(p)} qq
            </div>
          )}
          {/* ── Ya facturado y había regalo: queda a la vista qué se dijo ── */}
          {p.estado==="facturado" && (p.lineas||[]).some(l=>Number(l.gratis)>0) && (
            (p.lineas||[]).some(l=>Number(l.gratis)>0 && l.gratisDespachado==null)
              ? <div style={{marginTop:6,fontSize:12,color:"#C2603A",fontWeight:700}}>
                  ⚠ Regalo sin confirmar: nadie dijo si salió de bodega. Hay un aviso urgente abierto.
                </div>
              : <div style={{marginTop:6,fontSize:12,color:"#6B6455",fontWeight:600}}>
                  🎁 Regalo entregado: {Math.round((p.lineas||[]).reduce((s,l)=>s+(Number(l.gratisDespachado)||0),0)*100)/100} qq · a valor cero
                </div>
          )}

          {/* ── Ya facturado: si hubo devolución, va nota de crédito ── */}
          {p.estado==="facturado" && (p.lineas||[]).length>0 && datos && (
            <div style={{marginTop:10,borderTop:"1px solid var(--linea)",paddingTop:10}}>
              <div style={{fontSize:11.5,fontWeight:700,color:"#6B6455",marginBottom:6}}>
                Correcciones posteriores: separa lo fiscal de lo interno</div>
              {(p.lineas||[]).map(l=>(
                <div key={l.itemId} style={{padding:"9px 10px",marginBottom:7,borderRadius:10,border:"1px solid var(--linea)",background:"#fff"}}>
                  <div style={{fontSize:12.5,fontWeight:650,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:7}}>{l.nombre}</div>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>abrirNC(p,l)} style={{...btn2,minHeight:42,padding:"8px 7px",fontSize:11.5,color:"#8A6A00"}}>🧾 NC del SRI</button>
                    <button onClick={()=>abrirAjusteInterno(p,l)} style={{...btn2,minHeight:42,padding:"8px 7px",fontSize:11.5,color:"var(--ok)"}}>⚙ Ajuste interno</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── ÚLTIMO PASO DE LA CADENA · anular la factura ──
               Solo aparece si el vendedor pidió la devolución Y esta piladora
               ya la aceptó. Sin ese permiso el botón no existe: la base lo
               rechazaría igual, pero enseñar un botón que siempre falla es
               peor que no enseñarlo. */}
          {p.estado==="facturado" && devolAceptada(p.id) && datos && (
            <div style={{marginTop:10,borderTop:"1px solid var(--linea)",paddingTop:10}}>
              <div style={{fontSize:12,color:"#8A4B2A",fontWeight:700,marginBottom:6}}>
                ↩ Devolución aceptada · falta anular la factura</div>
              <div style={{fontSize:11.5,color:"#6B6455",marginBottom:8,lineHeight:1.5}}>
                Al anular se borra la deuda de {money(p.monto)} del cliente y se
                deja sin efecto la comisión del vendedor por esta venta.
                Mientras no lo hagas, el cliente sigue debiendo.</div>
              <button style={{...btn2,background:"#C0392B",color:"#fff",border:"none",width:"100%"}}
                onClick={()=>setAnulando({id:p.id,factura:p.factura,cliente:p.cliente,razon:p.razon,tipoCli:p.tipoCli,monto:p.monto,motivo:""})}>
                Anular factura {p.factura||""}</button>
            </div>
          )}
          {p.estado==="anulado" && (
            <div style={{marginTop:10,borderTop:"1px solid var(--linea)",paddingTop:10,
              fontSize:12.5,color:"#C0392B",fontWeight:700}}>
              ✕ Factura anulada · la deuda salió de cartera</div>
          )}

          {p.estado==="pendiente" && (<>
            {/* ── CUÁNTO SALIÓ DE CADA PRODUCTO ──────────────────────────
                Viene puesto lo pedido, que es lo normal. Solo se toca cuando
                algo salió corto, y ahí mismo se ve lo que eso significa. */}
            {(p.lineas||[]).length>0 && (
              <div style={{marginTop:10,borderTop:"1px solid var(--linea)",paddingTop:10}}>
                <div style={{fontSize:11.5,fontWeight:700,color:"#6B6455",marginBottom:6}}>
                  ¿Cuántos quintales salieron de cada uno?</div>
                {(p.lineas||[]).map(l=>{
                  const v=qqSalio(p,l), corto=v < l.pedido - 0.001, exceso=v > l.pedido + 0.001;
                  const conRegalo=Number(l.gratis)>0;
                  const tope=topes[p.id+"|"+l.itemId];
                  const g=qqRegalo(p,l);
                  const gExceso=conRegalo && tope!==undefined && g > tope + 0.005;
                  const r1=x=>Math.round(x*100)/100;
                  return (
                    <React.Fragment key={l.itemId}>
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
                      <span style={{flex:1,minWidth:0,fontSize:12.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {l.nombre}
                        <span className="num" style={{display:"block",fontSize:11,color:"#6B6455"}}>
                          pidió {l.pedido} qq</span>
                      </span>
                      <input className="num" type="number" inputMode="decimal" step="0.01" min="0" max={l.pedido}
                        value={salio[p.id+"|"+l.itemId] !== undefined ? salio[p.id+"|"+l.itemId] : String(l.pedido)}
                        onChange={e=>setSalio(x=>({...x,[p.id+"|"+l.itemId]:e.target.value}))}
                        style={{width:96,minHeight:48,boxSizing:"border-box",padding:"10px",textAlign:"right",
                          border:"1px solid "+(exceso?"#C2603A":corto?"#B8860B":"var(--linea)"),
                          borderRadius:10,fontSize:14,fontFamily:"inherit",outline:"none",
                          background: exceso?"#FDF3F0":corto?"#FCF9EF":"#fff"}}/>
                    </div>
                    {datos && (p.alternativas||[]).length>0 && (
                      <button onClick={()=>abrirCambio(p,l)}
                        style={{border:"none",background:"transparent",color:"var(--ok)",fontSize:11.5,
                          fontWeight:750,fontFamily:"inherit",padding:"2px 0 7px",cursor:"pointer"}}>
                        ↻ Cambiar producto o presentación antes de facturar
                      </button>
                    )}
                    {/* ── EL REGALO DE LA PROMOCIÓN, JUNTO A LO VENDIDO ──
                         Sale de tu bodega igual que lo vendido, pero se factura
                         a valor cero y el costo lo absorbe quien dice el tipo
                         de la línea. Viene puesto lo que puede salir; se toca
                         solo si salió distinto. Poner 0 también vale: es dejar
                         dicho que NO salió regalo. */}
                    {conRegalo && (
                      <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 0 6px",
                        marginLeft:10,borderLeft:"3px solid "+(gExceso?"#C2603A":"#D8CFA8"),paddingLeft:10}}>
                        <span style={{flex:1,minWidth:0,fontSize:12}}>
                          🎁 Regalo — {quienAsumeRegalo(l.tipo)}
                          <span className="num" style={{display:"block",fontSize:11,color:"#6B6455"}}>
                            prometidos {r1(l.gratis)} qq{tope!==undefined?" · pueden salir hasta "+r1(tope)+" qq":""}
                            {" · a valor cero en la factura"}</span>
                        </span>
                        <input className="num" type="number" inputMode="decimal" step="0.01" min="0"
                          value={regalo[p.id+"|"+l.itemId] !== undefined ? regalo[p.id+"|"+l.itemId] : String(g)}
                          onChange={e=>setRegalo(x=>({...x,[p.id+"|"+l.itemId]:e.target.value}))}
                          style={{width:96,minHeight:48,boxSizing:"border-box",padding:"10px",textAlign:"right",
                            border:"1px solid "+(gExceso?"#C2603A":"var(--linea)"),
                            borderRadius:10,fontSize:14,fontFamily:"inherit",outline:"none",
                            background: gExceso?"#FDF3F0":"#fff"}}/>
                      </div>
                    )}
                    {gExceso && (
                      <div style={{fontSize:12,color:"#C2603A",fontWeight:700,margin:"0 0 6px",paddingLeft:10}}>
                        {corto
                          ? "Como salieron "+r1(v)+" de "+r1(l.pedido)+" qq, el regalo baja a "+r1(tope)+" qq: no puedes despachar "+r1(g)+" qq de regalo."
                          : "La promoción concede hasta "+r1(tope)+" qq de regalo: no puedes despachar "+r1(g)+" qq."}
                      </div>
                    )}
                    {conRegalo && !gExceso && g===0 && (
                      <div style={{fontSize:11.5,color:"#6B6455",margin:"0 0 6px",paddingLeft:10}}>
                        Queda dicho que NO salió regalo de esta línea.
                      </div>
                    )}
                    </React.Fragment>
                  );
                })}
                {sobrePedido(p) ? (
                  <div style={{fontSize:12,color:"#C2603A",fontWeight:700,marginTop:6}}>
                    No puedes despachar más de lo que te pidieron.</div>
                ) : totalSalio(p) < totalPedido(p) - 0.001 ? (
                  <div style={{fontSize:12,color:"#8A4B2A",marginTop:6,lineHeight:1.45}}>
                    Sale corto: <b>{totalSalio(p)} de {totalPedido(p)} qq</b>. La factura debe ir por lo
                    que sale, y el sistema reajusta solo la comisión del vendedor. Lo que faltó no
                    queda pendiente: si lo quieren, se toma un pedido nuevo.
                  </div>
                ) : null}
              </div>
            )}
            <input value={numFac[p.id]||""} onChange={e=>setNumFac(n=>({...n,[p.id]:e.target.value}))}
              placeholder="N° de factura · ej: 001-001-0004777" inputMode="numeric"
              style={{width:"100%",boxSizing:"border-box",padding:"11px 12px",border:"1px solid var(--linea)",borderRadius:10,fontSize:13.5,fontFamily:"inherit",marginTop:10,outline:"none"}}/>
            <button style={{...btnOk, opacity: (facturando===p.id || sobrePedido(p) || sobreRegalo(p)) ? .5 : 1}}
              disabled={facturando===p.id || sobrePedido(p) || sobreRegalo(p)}
              onClick={()=>hacerFactura(p)}>
              {facturando===p.id ? "Guardando…" : "Facturar ✓ · nace la comisión y entra a Logística"}</button>
          </>)}
        </div>
      ))}

      {/* ══ AJU-001-R2 · CAMBIO PREVIO A LA FACTURA ══ */}
      {cambio && (
        <div onClick={()=>!cambioGuardando&&setCambio(null)}
          style={{position:"fixed",inset:0,background:"rgba(13,32,24,.5)",zIndex:72,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--papel,#FAF7F0)",width:"100%",maxWidth:480,
            borderRadius:"20px 20px 0 0",padding:"20px 18px 28px",maxHeight:"92vh",overflowY:"auto"}}>
            <div style={{fontWeight:800,fontSize:17}}>Cambiar producto o presentación</div>
            <div style={{fontSize:12.5,color:"#6B6455",margin:"3px 0 14px",lineHeight:1.45}}>
              {cambio.l.nombre} · {nombreClientePedido({cli:cambio.p.cliente, razon:cambio.p.razon, tipoCli:cambio.p.tipoCli})}<br/>{/* NOMBRE_CLIENTE_INTEGRIDAD_3 */}
              Solo antes de facturar. El servidor recalcula precio y comisión; no se digitan.</div>
            <label style={{display:"block",fontSize:12,fontWeight:700,color:"#6B6455"}}>Nueva opción
              <select value={cambio.clave} onChange={e=>{setCambio(x=>({...x,clave:e.target.value}));setCambioPrev(null);}}
                style={{width:"100%",boxSizing:"border-box",minHeight:50,padding:"10px 12px",marginTop:5,
                  border:"1px solid var(--linea)",borderRadius:10,fontSize:13.5,fontFamily:"inherit",background:"#fff"}}>
                <option value="">Elige producto y presentación…</option>
                {(cambio.p.alternativas||[]).map((a,i)=><option key={a.ofertaId||i} value={a.prodId+"|"+a.presCod}>
                  {a.nombre} · {a.presentacion}</option>)}
              </select>
            </label>
            <button onClick={calcularCambio} disabled={cambioGuardando||!cambio.clave}
              style={{...btn2,width:"100%",marginTop:10,opacity:(cambioGuardando||!cambio.clave)?.5:1}}>
              {cambioGuardando?"Calculando…":"Ver nuevo precio y comisión"}</button>
            {cambioPrev && (
              <div style={{marginTop:12,padding:"13px",border:"2px solid var(--ok)",borderRadius:12,background:"#EAF3EC"}}>
                <div style={{fontWeight:750,fontSize:13.5}}>{cambioPrev.descripcion}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                  <div><div style={{fontSize:10.5,color:"#6B6455"}}>NUEVO PRECIO</div><b className="num">{money(cambioPrev.precio_qq)} / qq</b></div>
                  <div><div style={{fontSize:10.5,color:"#6B6455"}}>NUEVA COMISIÓN</div><b className="num">{money(cambioPrev.comision_total)}</b></div>
                </div>
                <div style={{fontSize:11,color:"#6B6455",marginTop:8}}>Fuente: {cambioPrev.fuente_comision}</div>
              </div>
            )}
            <button onClick={confirmarCambio} disabled={!cambioPrev||cambioGuardando}
              style={{...btnOk,opacity:(!cambioPrev||cambioGuardando)?.5:1}}>
              {cambioGuardando?"Guardando…":"Confirmar el cambio"}</button>
            <button onClick={()=>setCambio(null)} disabled={cambioGuardando}
              style={{...btn2,width:"100%",marginTop:8}}>Cancelar</button>
          </div>
        </div>
      )}

      {/* ══ AJU-001-R2 · AJUSTE INTERNO POST-FACTURA ══ */}
      {ajInt && (
        <div onClick={()=>!ajGuardando&&setAjInt(null)}

/* ══ BOTÓN ATRÁS INTELIGENTE (modelo de freelance-completo) ══
   Un solo botón "Atrás" que conoce la jerarquía: primero cierra la ventana abierta,
   luego retrocede DENTRO del módulo (sub-pantalla → ficha → entrada), y solo al final
   sale al módulo anterior. Así no hacen falta botones "‹ Volver" repartidos por dentro.
   Se usan PILAS y no una sola variable: con varios módulos montados, ninguno puede
   borrar el manejador de otro. */
const MODALES_P = [];
function useModalP(abierto, cerrar){
  React.useEffect(()=>{
    if(!abierto) return;
    const item = {cerrar};
    MODALES_P.push(item);
    return ()=>{ const i=MODALES_P.indexOf(item); if(i>=0) MODALES_P.splice(i,1); };
  },[abierto,cerrar]);
}
function cerrarUltimoModalP(){
  if(MODALES_P.length===0) return false;
  const m = MODALES_P[MODALES_P.length-1];
  try{ m.cerrar(); }catch(e){}
  return true;
}
const RETROCESOS_P = [];
function useRetrocesoP(fn){
  const ref = React.useRef(fn);
  ref.current = fn;
  React.useEffect(()=>{
    const item = { run:()=>ref.current() };
    RETROCESOS_P.push(item);
    return ()=>{ const i=RETROCESOS_P.indexOf(item); if(i>=0) RETROCESOS_P.splice(i,1); };
  },[]);
}
/* Devuelve true si algún módulo consumió el retroceso. */
function retrocederEnModuloP(){
  for(let i=RETROCESOS_P.length-1;i>=0;i--){
    try{ if(RETROCESOS_P[i].run()) return true; }catch(e){}
  }
  return false;
}

/* ══ NORMA DEL MENÚ LATERAL (transversal a las 5 apps) ══
   Hasta 5 módulos: lista plana. Desde 6: ACORDEÓN por grupos, igual que
   freelance-completo — un solo grupo abierto a la vez; tocar el abierto lo cierra.
   Si un grupo cerrado tiene pendientes, el contador se ve en su encabezado para
   que nada quede escondido. */
const MENU_AGRUPA_DESDE = 6;

/* ── Abrir el menu lateral deslizando desde el borde izquierdo ── */
/* ══ LISTAS DESPLEGABLES ORDENADAS POR USO (norma sellada, transversal) ══
   Toda lista con repeticion real ordena sus opciones por cuantas veces se eligieron,
   de MAYOR a MENOR. El contador se guarda pero NUNCA se muestra en pantalla.
   Desempate alfabetico. En Fase 4 los contadores viajan a Supabase POR USUARIO. */
const USOS_KEY_P = "usos_proveedor";
/* Semilla: numeros BAJOS a proposito, solo para conservar el orden que la lista
   ya tenia pensado. Apenas el proveedor use la app de verdad, su uso los supera
   y manda el, no esta suposicion. Es piso, no techo: lo guardado va encima. */
const USOS_SEMILLA = {
  motivos_anular:{
    "Error en el valor o el precio":6, "Error en el cliente o el RUC":5,
    "Error en los productos o cantidades":4, "Devolucion total de la mercaderia":3,
    "Pedido no despachado":2, "Duplicada por error":1 },
  motivos_anular_ret:{
    "Error en los porcentajes":5, "Error en el número o autorización":4,
    "Retención duplicada":3, "Factura de sustento anulada":2,
    "Datos del cliente incorrectos":1 },
  motivos_anular_guia:{
    "Error en el destinatario o dirección":5, "Error en productos o cantidades":4,
    "Guía duplicada":3, "Despacho cancelado":2, "Error en transportista o placa":1 },
};
/* categorias donde el orden propio manda: nunca se reordenan por uso */
const USO_FIJO = ["meses","estados","antiguedad","fechas","etapas"];
/* opciones que siempre van al final, sin importar cuanto se usen */
const USO_ULTIMO = ["Otro","Otros","Ninguno","No aplica"];
const USOS = {};
function regUso(cat, opcion){
  if(!cat || !opcion) return;
  if(!USOS[cat]) USOS[cat] = {};
  USOS[cat][opcion] = (USOS[cat][opcion] || 0) + 1;
  try{ localStorage.setItem(USOS_KEY_P, JSON.stringify(USOS)); }catch(e){}
}
function ordUso(cat, lista){
  if(!cat || USO_FIJO.includes(cat) || !Array.isArray(lista)) return lista;
  const c = USOS[cat] || {};
  return [...lista].sort((a,b)=>{
    const fa = USO_ULTIMO.includes(a)?1:0, fb = USO_ULTIMO.includes(b)?1:0;
    if(fa!==fb) return fa-fb;                      /* "Otro" siempre al fondo */
    const d = (c[b]||0) - (c[a]||0);
    return d !== 0 ? d : String(a).localeCompare(String(b), "es");
  });
}
/* Monta la semilla primero y le pone encima lo guardado, categoria por categoria.
   Mezcla en vez de reemplazar: asi una opcion agregada despues no se pierde ni
   sale de ultima, y lo que el proveedor ya uso nunca se borra. */
(function cargarUsos(){
  for(const cat in USOS_SEMILLA) USOS[cat] = Object.assign({}, USOS_SEMILLA[cat]);
  try{
    const g = JSON.parse(localStorage.getItem(USOS_KEY_P) || "null");
    if(!g || typeof g!=="object") return;
    for(const cat in g){
      if(!g[cat] || typeof g[cat]!=="object") continue;
      USOS[cat] = Object.assign(USOS[cat]||{}, g[cat]);
    }
  }catch(e){}
})();

function useGestoDrawer(abrir, activo){
  React.useEffect(()=>{
    if(!activo) return;
    const BORDE=20, MINIMO=60;
    let x0=0, y0=0, valido=false;
    const inicio=(e)=>{
      const t=e.touches&&e.touches[0]; if(!t) return;
      const caja=document.querySelector(".phone");
      const izq=caja ? caja.getBoundingClientRect().left : 0;
      valido = (t.clientX - izq) <= BORDE;
      x0=t.clientX; y0=t.clientY;
    };
    const mover=(e)=>{
      if(!valido) return;
      const t=e.touches&&e.touches[0]; if(!t) return;
      const dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
      if(dx>MINIMO && dx>dy*2){ valido=false; abrir(); }
      if(dy>28) valido=false;
    };
    const fin=()=>{ valido=false; };
    document.addEventListener("touchstart", inicio, {passive:true});
    document.addEventListener("touchmove", mover, {passive:true});
    document.addEventListener("touchend", fin, {passive:true});
    document.addEventListener("touchcancel", fin, {passive:true});
    return ()=>{
      document.removeEventListener("touchstart", inicio);
      document.removeEventListener("touchmove", mover);
      document.removeEventListener("touchend", fin);
      document.removeEventListener("touchcancel", fin);
    };
  },[abrir,activo]);
}

   Motor de reglas: los datos ya están en la app, solo se buscan y devuelven.
   Molde de freelance-completo/Comisionista, con catálogo propio del PROVEEDOR
   (conciliación, retenciones, créditos, decisiones, catálogo, cuentas).
   El proveedor SÍ ve precio base y stock de SU mercadería (es su producto). */

function MicBtnAsist({onTexto, toast}){
  const [rec,setRec]=useState(false);
  const refRec=React.useRef(null);
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Reconocedor) return null;
  const dictar=()=>{
    if(rec){ try{ refRec.current && refRec.current.stop(); }catch(e){} setRec(false); return; }
    const r=new Reconocedor();
    r.lang="es-EC"; r.interimResults=false; r.maxAlternatives=1;
    r.onresult=ev=>{ const t=ev.results[0][0].transcript.trim(); if(t) onTexto(t); };
    r.onerror=ev=>{ setRec(false); if(ev.error==="not-allowed" && toast) toast("Permite el micrófono en el navegador para dictar"); };
    r.onend=()=>setRec(false);
    refRec.current=r; setRec(true);
    try{ r.start(); }catch(e){ setRec(false); }
  };
  return (
    <button type="button" className={"micb"+(rec?" rec":"")} onClick={dictar} aria-label="Buscar por voz">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
        stroke={rec?"#C2603A":"var(--texto-2)"} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0013 0"/><path d="M12 17.5V21M9 21h6"/>
      </svg>
    </button>
  );
}

function hablarTexto(txt){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "es-EC"; u.rate = 1; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

  if(!f) return null;
  let mejor = null, mejorLargo = 0;
  PREGUNTAS_ASIST.forEach(p=>{
    (CLAVES_ASIST[p.id]||[]).forEach(clave=>{
      const c = normAsist(clave);
      if(f.includes(c) && c.length > mejorLargo){ mejor = p; mejorLargo = c.length; }
    });
  });
  if(!mejor) return null;
  const GENERICAS = ["comercial","distribuidora","tienda","almacen","almacenes","bodega","abarrotes","despensa","comisariato","mayorista","minimercado","panaderia","kiosco","arroz","super","mini","market","el","la","los","las","de","del","y","don","doña","sr","sra"];
  const calzaNombre = (nombre)=>{
    const n = normAsist(nombre);
    if(f.includes(n)) return true;
    const parts = n.split(/\s+/).filter(w => w.length>=3 && !GENERICAS.includes(w));
    return parts.some(w => f.includes(w));
  };
  let dato = null;
  if(mejor.pide === "cliente"){
    const nombres = [...new Set([].concat(
      COBROS_REPORTADOS.map(x=>x.cli), RETENCIONES_INI.map(x=>x.cli), CRED_INI.map(x=>x.cliente)
    ).filter(Boolean))];
    dato = nombres.find(calzaNombre) || null;
  } else if(mejor.pide === "producto"){
    const p = CAT_INI.find(x=>calzaNombre(x.nombre));
    dato = p ? p.nombre : null;
  }
  return { pregunta: mejor, dato };
}

/* ══ MOTOR DE VOZ GLOBAL ══ */
const MotorVoz = {
  rec: null, intentos: 0, watchdog: null, topeGlobal: null, activo: false, cb: {},
  soportado(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  config(cb){ this.cb = cb || {}; },
  _estado(v){ this.activo = v; if(this.cb.onEstado) this.cb.onEstado(v); },
  _limpiarTimers(){
    if(this.watchdog){ clearTimeout(this.watchdog); this.watchdog = null; }
    if(this.topeGlobal){ clearTimeout(this.topeGlobal); this.topeGlobal = null; }
  },
  apagar(){
    this._limpiarTimers();
    if(this.rec){
      try{ this.rec.onresult=null; this.rec.onerror=null; this.rec.onend=null; this.rec.abort(); }catch(e){}
      this.rec = null;
    }
    this._estado(false);
  },
  iniciar(){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec){ if(this.cb.toast) this.cb.toast("Tu navegador no permite dictado por voz"); return; }
    if(this.rec){ try{ this.rec.onresult=null; this.rec.onerror=null; this.rec.onend=null; this.rec.abort(); }catch(e){} this.rec=null; }
    if(this.watchdog){ clearTimeout(this.watchdog); this.watchdog=null; }
    if(!this.topeGlobal){ this.topeGlobal = setTimeout(()=>{ this.apagar(); }, 22000); }
    const r = new Rec();
    r.lang="es-EC"; r.interimResults=false; r.maxAlternatives=1;
    let resuelto = false;
    this.watchdog = setTimeout(()=>{ if(!resuelto) this.apagar(); }, 8000);
    r.onresult = (ev)=>{
      resuelto = true;
      if(this.watchdog){ clearTimeout(this.watchdog); this.watchdog=null; }
      const frase = ev.results[0][0].transcript.trim();
      const res = interpretarAsist(frase);
      if(!res){
        this.intentos += 1;
        if(this.intentos < 3){
          hablarTexto("No te entendí, por favor repite");
          setTimeout(()=>{ this.iniciar(); }, 1700);
        } else {
          hablarTexto("No te entendí. Toca el botón para ver las preguntas.");
          this.apagar();
        }
        return;
      }
      const p = res.pregunta;
      if(p.pide && !res.dato){
        this.intentos += 1;
        const que = p.pide==="cliente"?"¿De qué cliente?":p.pide==="producto"?"¿De qué producto?":"¿De qué dato?";
        if(this.intentos < 3){
          hablarTexto(que);
          setTimeout(()=>{ this.iniciar(); }, 1700);
        } else {
          hablarTexto("No capté el nombre. Toca el botón para escribirlo.");
          if(this.cb.onPedirDato) this.cb.onPedirDato(p);
          this.apagar();
        }
        return;
      }
      const texto = p.responder(res.dato || null);
      hablarTexto(texto);
      if(p.ir && this.cb.onIr) this.cb.onIr(p.ir, null);
      this.apagar();
    };
    r.onerror = (ev)=>{
      resuelto = true;
      if(ev.error==="not-allowed" && this.cb.toast) this.cb.toast("Permite el micrófono para hablar");
      this.apagar();
    };
    r.onend = ()=>{ if(!resuelto && this.intentos === 0){ this.apagar(); } };
    this.rec = r;
    this._estado(true);
    try{ r.start(); }catch(e){ this.apagar(); }
  },
  alternar(){
    if(this.activo){ this.apagar(); return; }
    this.intentos = 0;
    if(this.topeGlobal){ clearTimeout(this.topeGlobal); this.topeGlobal=null; }
    this.iniciar();
  }
};

/* ── Burbuja flotante movible ── */
function BurbujaAsistente({ onEscuchar, escuchando }){
  const [pos, setPos] = useState({ x: (window.innerWidth||400) - 74, y: (window.innerHeight||700) - 150 });
  const ref = React.useRef({ arrastrando:false, movio:false, ini:null });
  const iniciar = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const s = ref.current;
    s.arrastrando = true; s.movio = false;
    s.ini = { x: t.clientX, y: t.clientY, px: pos.x, py: pos.y };
  };
  const mover = (e) => {
    const s = ref.current;
    if(!s.arrastrando || !s.ini) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - s.ini.x, dy = t.clientY - s.ini.y;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6){ s.movio = true; }
    if(s.movio){
      const nx = Math.max(6, Math.min((window.innerWidth||400)-62, s.ini.px + dx));
      const ny = Math.max(60, Math.min((window.innerHeight||700)-120, s.ini.py + dy));
      setPos({ x:nx, y:ny });
    }
  };
  const soltar = (e) => {
    const s = ref.current;
    if(e && e.type === "touchend" && e.cancelable){ try{ e.preventDefault(); }catch(_){} }
    if(s.arrastrando){
      if(!s.movio){
        const ahora = Date.now();
        if(!s.ultimoTap || ahora - s.ultimoTap > 400){ s.ultimoTap = ahora; onEscuchar(); }
      } else {
        const ancho = window.innerWidth||400;
        setPos(p=>({ ...p, x: p.x < ancho/2 ? 6 : ancho-62 }));
      }
    }
    s.arrastrando = false; s.movio = false; s.ini = null;
  };
  return (
    <button
      onMouseDown={iniciar} onMouseMove={mover} onMouseUp={soltar} onMouseLeave={soltar}
      onTouchStart={iniciar} onTouchMove={mover} onTouchEnd={soltar}
      aria-label="Asistente de voz"
      style={{position:"fixed", left:pos.x, top:pos.y, zIndex:95, width:56, height:56, borderRadius:"50%",
        border:"none", background: escuchando ? "#B5613C" : "var(--maiz, #F2A900)", color:"#fff", fontSize:24, cursor:"grab",
        boxShadow: escuchando ? "0 0 0 6px rgba(181,97,60,.25), 0 6px 20px rgba(0,0,0,.28)" : "0 6px 20px rgba(0,0,0,.28)",
        display:"flex", alignItems:"center", justifyContent:"center",
        touchAction:"none", userSelect:"none",
        animation: escuchando ? "burbujaLatido 1s ease-in-out infinite" : "none"}}>
      {escuchando ? "●" : "🎙️"}
    </button>
  );
}

const ETIQUETA_IR = { conciliacion:"Conciliación", retenciones:"Retenciones", notas:"Notas", creditos:"Créditos", decidir:"Decidir", prop:"Propuestas", precios:"Precios", catalogo:"Catálogo", bancos:"Mis cuentas", guias:"Guías" };

function AsistenteVoz({ abierto, panelVisible=true, modoLista=false, onCerrar, onFinVoz, onNecesitaPanel, toast, onIr, escuchaInicial }){
  const [preg, setPreg] = useState(null);
  const [dato, setDato] = useState("");
  const [resp, setResp] = useState("");
  const [escuchando, setEscuchando] = useState(false);
  const [noEntendi, setNoEntendi] = useState("");
  const [mostrarTodas, setMostrarTodas] = useState(false);
  const refRec = React.useRef(null);
  const refIntentos = React.useRef(0);
  const refWatchdog = React.useRef(null);
  const refReintProg = React.useRef(false);
  const refTopeGlobal = React.useRef(null);

  const escucharNatural = React.useCallback(()=>{
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec){
      if(toast) toast("Tu navegador no permite dictado por voz");
      if(!panelVisible && onFinVoz) onFinVoz();
      return;
    }
    try{ if(refRec.current){ refRec.current.onend=null; refRec.current.onerror=null; refRec.current.onresult=null; refRec.current.abort(); } }catch(e){}
    const r = new Rec();
    r.lang="es-EC"; r.interimResults=false; r.maxAlternatives=1;
    let resuelto = false;
    const marcar = ()=>{ resuelto = true; };
    const apagarVoz = ()=>{
      if(refWatchdog.current){ clearTimeout(refWatchdog.current); refWatchdog.current=null; }
      if(refTopeGlobal.current){ clearTimeout(refTopeGlobal.current); refTopeGlobal.current=null; }
      try{ if(refRec.current){ refRec.current.onend=null; refRec.current.abort(); } }catch(e){}
      setEscuchando(false);
      if(!panelVisible && onFinVoz) onFinVoz();
    };
    refReintProg.current = false;
    if(!refTopeGlobal.current){ refTopeGlobal.current = setTimeout(()=>{ apagarVoz(); }, 22000); }
    if(refWatchdog.current){ clearTimeout(refWatchdog.current); }
    refWatchdog.current = setTimeout(()=>{ if(!resuelto && !refReintProg.current){ apagarVoz(); } }, 8000);
    setNoEntendi(""); setEscuchando(true);
    r.onresult = ev=>{
      const frase = ev.results[0][0].transcript.trim();
      const res = interpretarAsist(frase);
      if(!res){
        marcar();
        setNoEntendi("No entendí \""+frase+"\". Toca una pregunta o inténtalo de nuevo.");
        if(!panelVisible){
          refIntentos.current += 1;
          if(refIntentos.current < 3){
            refReintProg.current = true;
            hablarTexto("No te entendí, por favor repite");
            setTimeout(()=>{ if(reintentarVoz.current) reintentarVoz.current(); }, 1700);
          } else {
            hablarTexto("No te entendí. Toca el botón para ver las preguntas.");
            apagarVoz();
          }
        }
        return;
      }
      const p = res.pregunta;
      setPreg(p);
      if(p.pide && !res.dato){
        marcar();
        setDato(""); setResp("");
        setNoEntendi("Entendí que preguntas sobre "+p.label.toLowerCase()+", pero no capté el nombre. Escríbelo o dícelo abajo.");
        if(!panelVisible){
          refIntentos.current += 1;
          const que = p.pide==="cliente"?"¿De qué cliente?":p.pide==="producto"?"¿De qué producto?":"¿De qué dato?";
          if(refIntentos.current < 3){
            refReintProg.current = true;
            hablarTexto(que);
            setTimeout(()=>{ if(reintentarVoz.current) reintentarVoz.current(); }, 1700);
          } else {
            hablarTexto("No capté el nombre. Toca el botón para escribirlo.");
            apagarVoz();
          }
        }
        return;
      }
      marcar();
      responderYsaltar(p, res.dato || null);
      if(refWatchdog.current){ clearTimeout(refWatchdog.current); refWatchdog.current=null; }
      if(refTopeGlobal.current){ clearTimeout(refTopeGlobal.current); refTopeGlobal.current=null; }
      setEscuchando(false);
      if(!panelVisible && onFinVoz) onFinVoz();
    };
    r.onerror = ev=>{ marcar(); if(ev.error==="not-allowed" && toast) toast("Permite el micrófono para hablar"); apagarVoz(); };
    r.onend = ()=>{ setEscuchando(false); if(!resuelto && !refReintProg.current) apagarVoz(); };
    refRec.current = r;
    try{ r.start(); }catch(e){ apagarVoz(); }
  },[toast, panelVisible, onFinVoz]);
  const reintentarVoz = React.useRef(null);
  reintentarVoz.current = escucharNatural;

  React.useEffect(()=>{
    if(abierto){
      setPreg(null); setDato(""); setResp(""); setNoEntendi("");
      refIntentos.current = 0;
      if(modoLista){ setMostrarTodas(true); } else { setMostrarTodas(false); }
    }
    // eslint-disable-next-line
  },[abierto, escuchaInicial, panelVisible, modoLista]);

  React.useEffect(()=>{
    if(!abierto){
      if(refWatchdog.current){ clearTimeout(refWatchdog.current); refWatchdog.current=null; }
      if(refTopeGlobal.current){ clearTimeout(refTopeGlobal.current); refTopeGlobal.current=null; }
      try{ if(refRec.current){ refRec.current.onend=null; refRec.current.onerror=null; refRec.current.onresult=null; refRec.current.abort(); } }catch(e){}
      refReintProg.current = false;
    }
  },[abierto]);

  if(!abierto) return null;
  if(!panelVisible) return null;

  const responder = (p, valorDato) => {
    const texto = p.responder(valorDato);
    setResp(texto); setNoEntendi("");
    hablarTexto(texto);
  };
  const responderYsaltar = (p, valorDato) => {
    const texto = p.responder(valorDato);
    hablarTexto(texto);
    if(p.ir && onIr){ onIr(p.ir, null); return true; }
    responder(p, valorDato);
    return false;
  };
  const elegir = (p) => {
    setPreg(p); setDato(""); setResp(""); setNoEntendi("");
    if(!p.pide) responder(p, null);
  };
  const confirmarDato = () => {
    if(!preg || !dato.trim()) return;
    responder(preg, dato.trim());
  };

  const sugerencias = preg && preg.pide === "cliente"
    ? [...new Set([].concat(COBROS_REPORTADOS.map(x=>x.cli), RETENCIONES_INI.map(x=>x.cli), CRED_INI.map(x=>x.cliente)).filter(Boolean))]
    : preg && preg.pide === "producto"
      ? [...new Set(CAT_INI.map(p=>p.nombre))]
      : [];
  const filtradas = dato.trim()
    ? sugerencias.filter(s => normAsist(s).includes(normAsist(dato))).slice(0,5)
    : [];

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,25,20,.5)",zIndex:120,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={onCerrar}>
      <div style={{width:"100%",maxWidth:520,margin:0,background:"var(--papel-2)",borderRadius:"18px 18px 0 0",padding:"18px 18px 26px",maxHeight:"85vh",overflowY:"auto",boxShadow:"0 -8px 30px rgba(0,0,0,.2)",fontFamily:"inherit"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontWeight:800,fontSize:16,color:"var(--texto)"}}>🎙️ Preguntar al sistema</div>
          <button className="micb" onClick={onCerrar} aria-label="Cerrar" style={{fontSize:18,color:"var(--texto-2)"}}>✕</button>
        </div>

        <button onClick={escucharNatural} disabled={escuchando}
          style={{width:"100%",padding:"16px",borderRadius:12,border:"none",marginBottom:12,cursor:"pointer",fontFamily:"inherit",
            background: escuchando?"#B5613C":"var(--tinta-2, #15392B)",color:"#fff",
            fontSize:15.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
          <span style={{fontSize:22}}>{escuchando?"●":"🎤"}</span>
          {escuchando ? "Escuchando… habla ahora" : "Habla: dime tu pregunta"}
        </button>
        {noEntendi && (
          <div style={{background:"var(--maiz-suave, #FBE9C0)",borderRadius:10,padding:"10px 13px",marginBottom:12,fontSize:12.5,color:"var(--texto)",lineHeight:1.45}}>
            {noEntendi}
          </div>
        )}

        {!mostrarTodas && !resp && !(preg&&preg.pide) && (
          <div style={{textAlign:"center",marginBottom:8}}>
            <button onClick={()=>setMostrarTodas(true)}
              style={{background:"none",border:"none",color:"var(--tinta-2, #15392B)",fontSize:12.5,fontWeight:700,cursor:"pointer",textDecoration:"underline",fontFamily:"inherit"}}>
              Ver todas las preguntas
            </button>
          </div>
        )}

        {mostrarTodas && (
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:12.5,fontWeight:800,color:"var(--texto)"}}>Todas las preguntas</div>
            <button onClick={()=>setMostrarTodas(false)}
              style={{background:"none",border:"none",color:"var(--texto-2)",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>‹ Ocultar</button>
          </div>
          {[...new Set(PREGUNTAS_ASIST.map(p=>p.cat))].map(cat=>(
            <div key={cat} style={{marginBottom:10}}>
              <div style={{fontSize:11.5,fontWeight:800,color:"var(--texto-2)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:6}}>{cat}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                {PREGUNTAS_ASIST.filter(p=>p.cat===cat).map(p=>(
                  <button key={p.id} onClick={()=>{ elegir(p); if(p.pide) setMostrarTodas(false); }}
                    style={{padding:"8px 12px",borderRadius:999,border:"1px solid "+(preg&&preg.id===p.id?"var(--maiz)":"var(--linea)"),
                      background:preg&&preg.id===p.id?"var(--maiz-suave, #FBE9C0)":"var(--papel-2)",fontSize:12,fontWeight:700,cursor:"pointer",color:"var(--texto)",fontFamily:"inherit"}}>
                    {p.ic} {p.label}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
        )}

        {preg && preg.pide && (
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input value={dato} onChange={e=>setDato(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&confirmarDato()}
                placeholder={preg.pide==="cliente"?"Nombre del cliente…":"Nombre del producto…"}
                style={{flex:1,minWidth:0,padding:"11px 13px",borderRadius:10,border:"1px solid var(--linea)",fontSize:14,background:"var(--papel-2)",color:"var(--texto)",fontFamily:"inherit"}} />
              <MicBtnAsist onTexto={t=>{ setDato(t); }} toast={toast} />
              <button onClick={confirmarDato}
                style={{padding:"11px 15px",borderRadius:10,border:"none",background:"var(--maiz)",color:"var(--tinta, #0E2A20)",fontSize:13.5,fontWeight:700,cursor:"pointer",flexShrink:0,fontFamily:"inherit"}}>
                Consultar
              </button>
            </div>
            {filtradas.length>0 && (
              <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
                {filtradas.map(s=>(
                  <button key={s} onClick={()=>{ setDato(s); responder(preg, s); }}
                    style={{textAlign:"left",padding:"8px 12px",borderRadius:8,border:"1px solid var(--linea)",background:"var(--papel-2)",fontSize:13,cursor:"pointer",color:"var(--texto)",fontFamily:"inherit"}}>
                    {s}
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

        {resp && (
          <div style={{background:"var(--maiz-suave, #FBE9C0)",padding:"14px 16px",borderRadius:12}}>
            <div style={{fontSize:14.5,fontWeight:600,lineHeight:1.5,color:"var(--texto)"}}>{resp}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:10}}>
              {preg && preg.ir && onIr && (
                <button onClick={()=>onIr(preg.ir, null)}
                  style={{padding:"9px 15px",borderRadius:8,border:"none",background:"var(--tinta-2, #15392B)",color:"#fff",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
                  Ir a {ETIQUETA_IR[preg.ir] || "la pantalla"} ›
                </button>
              )}
              <button onClick={()=>hablarTexto(resp)}
                style={{padding:"9px 12px",borderRadius:8,border:"1px solid var(--linea)",background:"var(--papel-2)",fontSize:12.5,fontWeight:700,cursor:"pointer",color:"var(--texto)",fontFamily:"inherit"}}>
                🔊 Escuchar
              </button>
              <button onClick={()=>{ setPreg(null); setDato(""); setResp(""); setNoEntendi(""); setMostrarTodas(false); }}
                style={{padding:"9px 12px",borderRadius:8,border:"1px solid var(--linea)",background:"var(--papel-2)",fontSize:12.5,fontWeight:700,cursor:"pointer",color:"var(--texto)",fontFamily:"inherit"}}>
                Preguntar otra
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* Exportar a CSV: abre en Excel con acentos correctos y separador ";" */
const exportarCsv = (nombre, cabeceras, filas, titulo) => {
  const esc = v => { const t=String(v==null?"":v); return /[";\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const fila = a => a.map(esc).join(";");
  const hoy = new Date().toISOString().slice(0,10);
  const cuerpo = [ fila([titulo||nombre.toUpperCase(), "Generado: "+hoy]), "",
                   fila(cabeceras), ...filas.map(fila) ].join("\n")+"\n";
  const blob = new Blob(["\ufeff"+cuerpo], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre+"-"+hoy+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
};

/* ── LA BARRA DE ABAJO SE ESCONDE AL LEER (b364 · recomendación acogida por Richard) ──
   Al deslizar hacia ABAJO (estás leyendo) la barra se va y ganas pantalla.
   Al deslizar hacia ARRIBA, al TOCAR la pantalla, al llegar al tope o cuando entra
   un aviso nuevo, vuelve al instante. Nunca se pierde el acceso a los cinco módulos.
   Escucha el scroll en fase de captura para que funcione tanto si desplaza la página
   como si desplaza una tarjeta o lista interna. */
function useBarraAlLeer(){
  const [visible,setVisible]=React.useState(true);
  const ref=React.useRef({el:null,y:0,t:0});
  React.useEffect(()=>{
    const alRodar=(e)=>{
      const el=e.target;
      const raiz=(el===document||el===document.documentElement||el===document.body||el===window);
      const y=raiz ? (window.scrollY||document.documentElement.scrollTop||0) : (el.scrollTop||0);
      ref.current.t=Date.now();
      if(ref.current.el!==el){ ref.current.el=el; ref.current.y=y; return; }
      const d=y-ref.current.y;
      if(Math.abs(d)<8) return;                 /* temblores de dedo no cuentan */
      ref.current.y=y;
      if(y<=48){ setVisible(true); return; }    /* arriba del todo: siempre visible */
      setVisible(d<0);                          /* bajando esconde · subiendo muestra */
    };
    /* un toque suelto (no el final de un desplazamiento) siempre trae la barra de vuelta */
    const alTocar=()=>{ if(Date.now()-ref.current.t>250) setVisible(true); };
    document.addEventListener("scroll",alRodar,true);
    document.addEventListener("touchend",alTocar,true);
    document.addEventListener("click",alTocar,true);
    return ()=>{
      document.removeEventListener("scroll",alRodar,true);
      document.removeEventListener("touchend",alTocar,true);
      document.removeEventListener("click",alTocar,true);
    };
  },[]);
  return [visible,setVisible];
}

          onTouchStart={e=>{ const t=e.touches[0]; e.currentTarget.dataset.x0=t.clientX; e.currentTarget.dataset.y0=t.clientY; }}
          onTouchMove={e=>{
            const t=e.touches[0], d=e.currentTarget.dataset;
            if(d.x0===undefined) return;
            const dx=t.clientX-Number(d.x0), dy=Math.abs(t.clientY-Number(d.y0));
            if(dx < -60 && Math.abs(dx) > dy*2){ d.x0=undefined; setMenuAbierto(false); }
          }}>
          <div className="drawer-head">
            <div style={{minWidth:0}}>
              <div style={{fontSize:11.5,color:"var(--maiz)",fontWeight:600}}>Proveedor · {PROVEEDOR.linea}</div>

                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{PROVEEDOR.nombre}</div>
            </div>

            {/* Norma: hasta 5 módulos, lista plana. Desde 6, acordeón por grupos
                (mismo patrón de freelance-completo): un solo grupo abierto a la vez. */}
            {(()=>{
              /* b50 · mismo criterio que la app del freelance: cada cosa en su grupo */
              const GRUPOS = [
                ["docs","📄 Documentos", [
                  ["carga","📄","#E8F0F7","Cargar factura","Sube el XML del SRI",0],
                  ["notas","↩","#F7EFE6","Notas de crédito","Devoluciones y descuentos",notasPend],
                  ["retenciones","🧾","#EDEAE0","Retenciones","Bajan la deuda del cliente",retenPend],

                ]],
                ["dinero","💰 Dinero", [
                  ["conciliacion","✓","#E5F0EA","Conciliación","Aprobar libera la comisión",cobrosPend],
                  ["bancos","🏦","#E9EEE9","Mis cuentas","Dónde te pueden depositar",cuentasAct===0?"!":0],
                ]],
                ["linea","🌾 Mi línea", [
                  ["prop","✎","#F3ECF9","Propuestas","Esperan a tu freelance",pendientes],
                  ["catalogo","▤","#EFEAF7","Catálogo","Productos de tu línea",0],
                  ["reportes","◔","#E8F0F7","Reportes","Cómo va tu línea",0],
                ]],
                ["cuenta","⚙️ Mi cuenta", [
                  ["cuenta","📒","#EEF1F5","Acuerdos","Tu cuenta con el freelance",0],
                  ["ajustes","⚙️","#EDEAE0","Ajustes","Colores, avisos y clave",0],
                ]],
              ];
              const item = ([k,ic,bg,t,sub,b])=>(
                <button key={k} className="drawer-it" onClick={()=>{setMenuAbierto(false);irTab(k);}}>
                  <span className="di-ic" style={{background:bg}}>{ic}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="di-t">{t}</div>
                    <div className="di-s" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sub}</div>
                  </div>
                  {b ? <span className="di-b" style={b==="!"?{background:"#B5432E",color:"#fff"}:null}>{b}</span> : null}
                  <span className="di-a">›</span>
                </button>
              );
              const vivos = GRUPOS.filter(g=>g[2].length>0);
              const todos = vivos.reduce((a,g)=>a.concat(g[2]),[]);
              if(todos.length < MENU_AGRUPA_DESDE) return todos.map(item);
              return vivos.map(([clave,titulo,lista])=>{
                /* pendientes del grupo: se ven aunque esté cerrado */
                const n = lista.reduce((a,x)=>a + (typeof x[5]==="number" ? x[5] : 0), 0);
                const alerta = lista.some(x=>x[5]==="!");
                const abierto = secMenu===clave;
                return (
                  <div key={clave}>
                    <button className={"drawer-acc"+(abierto?" on":"")}
                      onClick={()=>setSecMenu(abierto?"":clave)}>
                      <span>{titulo}</span>
                      {(n>0 || alerta) && !abierto && (
                        <span className="drawer-acc-n"
                          style={alerta?{background:"#B5432E",color:"#fff"}:null}>{alerta?"!":n}</span>
                      )}
                      <span className="drawer-acc-fl">{abierto?"▾":"▸"}</span>
                    </button>
                    {abierto && lista.map(item)}
                  </div>
                );
              });
            })()}

            <button className="drawer-salir" onClick={()=>{setMenuAbierto(false);setConfirmarSalir(true);}}>
              Cerrar sesión
            </button>
            <div style={{textAlign:"center",fontSize:10.5,color:"var(--texto-3)",padding:"12px 0 2px",opacity:.8}}>

            <div className="sub" style={{marginBottom:16}}>Saldrás de la app y volverás a la pantalla de ingreso.</div>
            <button className="btn btn-maiz"
              onClick={()=>{ setConfirmarSalir(false); salirDeVerdad(); }}>Sí, cerrar sesión</button>
            <div style={{height:10}} />

          </div>

      {MotorVoz.soportado() && (
        <BurbujaAsistente
          escuchando={asistEscuchando}
          onEscuchar={()=>{ setAsistVozBurbuja(true); MotorVoz.alternar(); }} />
      )}
      <AsistenteVoz
        abierto={asistAbierto || asistVozBurbuja}
        panelVisible={asistAbierto}
        onCerrar={()=>{ setAsistAbierto(false); setAsistVozBurbuja(false); MotorVoz.apagar(); }}
        onFinVoz={()=>{ setAsistVozBurbuja(false); }}

        onIr={irDesdeAsist} />
      {tab!=="mensajes" && <nav className={"nav"+(barraVisible?"":" baja")}>
        <NavBtn on={tab==="inicio"}   ico="◧" lab="Inicio"     onClick={()=>irInicio()} />
        <NavBtn on={tab==="decidir"}  ico="⚡" lab="Decidir"    badge={decidirPend} onClick={()=>irTab("decidir")} />
        <NavBtn on={tab==="creditos"} ico="✓" lab="Créditos"   badge={credPend} onClick={()=>irTab("creditos")} />
        <NavBtn on={tab==="precios"}  ico="$" lab="Precios"    badge={preciosPend} onClick={()=>irTab("precios")} />
        <NavBtn on={tab==="mensajes"} ico="💬" lab="Mensajes"  badge={sinLeerChat} onClick={()=>irTab("mensajes")} />
      </nav>}
    </div>
  );
}

/* ====== PRECIOS · el proveedor ajusta, el freelance aprueba ====== */
function Precios({ctx,irTab,vivo}){
  const {cat,setCat,accion}=ctx;
  const [edit,setEdit]=useState(null);
  const [abierto,setAbierto]=useState(null);   // producto con hoja de presentaciones abierta
  const [q,setQ]=useState("");
  const [verTodo,setVerTodo]=useState(false);   // historial completo

  const norm=(t)=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  // Solo productos ya aceptados tienen precio base que usa el comisionista
  const vendibles = cat.filter(p=>p.estado==="aceptado")
    .filter(p=> q.trim()==="" || norm(p.nombre+" "+p.pres).includes(norm(q)));
  const pendientes = vendibles.filter(p=>p.propuesto!=null);
  // Una tarjeta por producto: las presentaciones viven en la hoja
  const grupos = agruparProd(vendibles);
  // la hoja abierta se recalcula del catálogo vivo para reflejar lo recién propuesto
  const grupoAbierto = abierto ? agruparProd(cat.filter(p=>p.estado==="aceptado" && p.prodId===abierto))[0] : null;

  /* Proponer un costo nuevo mueve plata: queda auditado con su motivo.
     El costo no cambia hasta que el freelance apruebe; mientras tanto es una propuesta. */
  const proponer=(id,valor,motivo)=> accion(()=>{
    const p = cat.find(x=>x.id===id);
    const au = "AU-260720-"+Math.floor(1000+Math.random()*9000);
    HIST_PRECIOS.unshift({ prodId:p.prodId, nombre:p.nombre, de:p.base, a:valor,
      desde:"2026-07-20", hasta:null, quien:PROVEEDOR.nombre,
      motivo:motivo||"Sin motivo", au, estado:"propuesto" });
    setCat(prev=>prev.map(x=>x.id===id?{...x,propuesto:valor,auProp:au,motivoProp:motivo}:x));
  });
  /* ══ b61 · CON SESIÓN, EL CAMBIO ES DE VERDAD ══
     Regla de Richard: el costo que pone la piladora ENTRA SOLO, con la fecha
     que ella diga, y a él le llega el aviso. No espera aprobación — el flujo de
     "propuesta" de abajo es el de la demostración y aquí no aplica.
     Todo el encadenado (cerrar el vigente, abrir el nuevo) lo hace la base en
     una sola operación: si se corta a mitad, no queda un producto sin costo. */
  const [guardando,setGuardando]=useState(false);
  const [avisoCambio,setAvisoCambio]=useState(null);
  const cambiarEnBase = async (p, costo, contado, desde)=>{
    setGuardando(true); setAvisoCambio(null);
    try{
      const { data, error } = await window.SB.rpc("cambiar_costo", {
        p_prod:p.prodId, p_pres:p.presCod, p_costo:costo,
        p_costo_contado: (contado===null || contado==="") ? null : Number(contado),
        p_desde: desde, p_prov: null,
      });
      setGuardando(false);
      if(error){ setAvisoCambio({ mal:true, txt: error.message || "No se pudo guardar." }); return false; }
      const r = (data && data[0]) || {};
      setAvisoCambio({ mal:false, txt: (r.aviso || "Guardado") + " · " + FREELANCE.nombre + " ya recibió el aviso." });
      return true;
    }catch(e){
      setGuardando(false);
      setAvisoCambio({ mal:true, txt:"No se pudo conectar. Intenta de nuevo." });
      return false;
    }
  };

  const retirar =(id)=> accion(()=>{
    const p = cat.find(x=>x.id===id);
    const i = HIST_PRECIOS.findIndex(h=>h.au===p.auProp);
    if(i>=0) HIST_PRECIOS.splice(i,1);   /* la propuesta retirada no deja rastro de precio */
    setCat(prev=>prev.map(x=>x.id===id?{...x,propuesto:null,auProp:null,motivoProp:null}:x));
  });

  return (
    <>
      <div className="eyebrow">Precio base de venta</div>
      <h1 className="h1">Precios <SelloVivo vivo={!!vivo}/></h1>
      {/* margen derecho: la campanilla flota en esa esquina y tapaba el texto */}
      <div className="sub" style={{marginTop:4,paddingRight:58}}>Tu costo por producto.</div>

      {avisoCambio &&
        <div className="card card-pad" style={{margin:"16px 0 0",border:"none",
          background: avisoCambio.mal ? "#FBE9E4" : "rgba(28,122,68,.10)"}}>
          <div style={{fontWeight:600,color: avisoCambio.mal ? "#B5613C" : "#1c7a44"}}>
            {avisoCambio.mal ? "No se guardó" : "Costo actualizado ✓"}</div>
          <div className="sub tiny" style={{marginTop:4}}>{avisoCambio.txt}</div>
        </div>}

      {/* el flujo de "esperando aprobación" es de la demostración: con datos de
          verdad el costo entra solo y se avisa (regla de Richard, 26 jul) */}
      {!vivo && pendientes.length>0 &&
        <div className="card card-pad" style={{margin:"16px 0 0",background:"var(--espera-suave)",border:"none"}}>
          <div style={{fontWeight:600,color:"#8A5A12"}}>{pendientes.length} {pendientes.length===1?"ajuste":"ajustes"} en espera</div>
          <div className="sub tiny" style={{marginTop:4}}>{FREELANCE.nombre} debe aprobarlos para que rijan.</div>
        </div>}

      <div className="sec-gap" style={{height:14}} />
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar producto…"
        style={{width:"100%",padding:"12px 14px",borderRadius:10,
          border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit"}}/>

      <div className="sec-gap" style={{height:14}} />
      <div className="list-card">
        {grupos.map(g=>(
          <button key={g.prodId} className="item" style={{width:"100%",textAlign:"left"}} onClick={()=>setAbierto(g.prodId)}>
            <div className="ava ava-m">{g.nombre[0]}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14}}>{g.nombre}</div>
              <div className="tiny muted">
                {g.unica ? g.pres[0].pres : g.pres.length+" presentaciones"}
              </div>
              {g.propuestos>0 &&
                <span className="chip chip-esp tiny" style={{padding:"2px 7px",marginTop:4}}>
                  {g.propuestos===1?"1 propuesto":g.propuestos+" propuestos"} · espera al freelance</span>}
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              {!g.unica && <div className="tiny muted">desde</div>}
              <div className="num" style={{fontWeight:600}}>{f(g.desde)}</div>
            </div>
          </button>
        ))}
      </div>

      {vendibles.length===0 && (
        <div className="card card-pad" style={{textAlign:"center"}}>
          <div className="sub">{q ? `Ningún producto coincide con "${q}".` : "Sin productos aceptados."}</div>
        </div>
      )}

      <div className="sec-gap" style={{height:14}} />
      <button className="card card-pad row between" style={{width:"100%",textAlign:"left"}}
        onClick={()=>setVerTodo(v=>!v)}>
        <div>
          <div style={{fontWeight:600,fontSize:15}}>Historial de precios</div>
          <div className="sub tiny">{HIST_PRECIOS.length} cambio{HIST_PRECIOS.length!==1?"s":""} registrado{HIST_PRECIOS.length!==1?"s":""}</div>
        </div>
        <span style={{color:"var(--texto-3)",fontSize:22}}>{verTodo?"⌃":"›"}</span>
      </button>

      {verTodo && (
        <div className="card card-pad" style={{marginTop:10}}>
          {HIST_PRECIOS.map((h,i)=>{
            const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
            const fc=(d)=>{ if(!d) return "vigente";
              const x=String(d).slice(0,10).split("-");
              return `${parseInt(x[2])} ${M[parseInt(x[1])-1]}`; };
            return (
              <div key={i} style={{padding:"10px 0",borderTop:i?"1px solid var(--linea)":"none"}}>
                <div className="row between">
                  <span style={{fontSize:14,fontWeight:600}}>{h.nombre}</span>
                  <span className="num" style={{fontSize:13.5,fontWeight:600,
                    color:h.a>h.de?"var(--alerta)":"var(--ok)"}}>{f(h.de)} → {f(h.a)}</span>
                </div>
                <div className="row between" style={{marginTop:3}}>
                  <span className="sub tiny">{h.motivo}</span>
                  <span className="sub tiny num">{fc(h.desde)} → {h.hasta?fc(h.hasta):"vigente"}</span>
                </div>
                <div className="sub tiny num" style={{marginTop:2}}>{h.au}</div>
              </div>
            );
          })}
        </div>
      )}

      {/* el texto explicativo del pie vive ahora en la campanilla (norma sellada) */}
      <div style={{height:88}} />

      {grupoAbierto && <PresentacionesSheet g={grupoAbierto} onClose={()=>setAbierto(null)}
        onElegir={(p)=>{ setAbierto(null); setEdit(p); }} />}

      {edit && <PrecioSheet p={edit} onClose={()=>setEdit(null)} vivo={!!vivo} guardando={guardando}
        onCambiar={async (costo,contado,desde)=>{
          const ok = await cambiarEnBase(edit, costo, contado, desde);
          if(ok){ setEdit(null); setAbierto(null); }   /* la lista se refresca al volver a entrar */
        }}
        onProponer={(v,m)=>{proponer(edit.id,v,m);setEdit(null);}}
        onRetirar={()=>{retirar(edit.id);setEdit(null);}} />}
    </>
  );
}

/* Hoja de presentaciones: el detalle de UN producto. Cada fila lleva su costo,
   su propuesta en curso si la hay, y al tocarla se abre la edición del precio. */

    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={ev=>ev.stopPropagation()}>

        <span className="chip chip-maiz">{PROVEEDOR.linea}</span>
        <div className="h2" style={{margin:"12px 0 4px"}}>{g.nombre}</div>
        <div className="sub">Toca una presentación para ajustar su costo.</div>

        <div className="sec-gap" style={{height:14}} />
        <div className="list-card">
          {g.pres.map(p=>{
            const pend = p.propuesto!=null;
            const sube = pend && p.propuesto>p.base;
            return (
              <button key={p.id} className="item" style={{width:"100%",textAlign:"left"}}
                onClick={()=>onElegir(p)}>
                <div style={{flex:1,minWidth:0}}>

                </div>
