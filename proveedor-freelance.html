function PrecioSheet({p,onClose,onProponer,onRetirar,vivo,guardando,onCambiar}){
  const pend=p.propuesto!=null;
  const [val,setVal]=useState(pend? String(p.propuesto): String(p.base));
  const [motivo,setMotivo]=useState("");
  const [verHist,setVerHist]=useState(false);
  /* b61 · modo real: costo de crédito, costo de contado y desde cuándo rige */
  const hoyISO = new Date().toISOString().slice(0,10);
  const [contado,setContado]=useState(p.contado==null?"":String(p.contado));
  const [cuando,setCuando]=useState("hoy");          // hoy | fecha
  const [fecha,setFecha]=useState(hoyISO);
  /* qué costos ha tenido este producto: el vigente no tiene fecha de fin */
  const hist = HIST_PRECIOS.filter(h=>h.prodId===p.prodId);
  const fCorta=(d)=>{
    if(!d) return "hoy";
    const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const x=String(d).slice(0,10).split("-");
    return `${parseInt(x[2])} ${M[parseInt(x[1])-1]}`;
  };
  const n=+val;
  const valido = val && n>0 && n!==p.base;
  const dif = valido ? ((n-p.base)/p.base*100) : 0;

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={ev=>ev.stopPropagation()}>
        <div className="grip" />
        <span className="chip chip-maiz">{PROVEEDOR.linea}</span>
        <div className="h2" style={{margin:"12px 0 4px"}}>{p.nombre}</div>
        <div className="sub">{p.pres}</div>

        <div className="card card-pad" style={{margin:"16px 0"}}>
          <Dato k="Precio base vigente" v={f(p.base)} />
          {pend && <Dato k="Propuesto (en espera)" v={f(p.propuesto)} alerta={p.propuesto>p.base} />}
        </div>

        {hist.length>0 && (<>
          <button className="btn btn-ghost" style={{width:"100%",marginBottom:14}}
            onClick={()=>setVerHist(v=>!v)}>
            {verHist?"Ocultar":"Ver"} historial de este precio ({hist.length})</button>
          {verHist && (
            <div className="card card-pad" style={{marginBottom:14}}>
              {hist.map((h,i)=>(
                <div key={i} style={{padding:"9px 0",
                  borderTop:i?"1px solid var(--linea)":"none"}}>
                  <div className="row between">
                    <span className="num" style={{fontSize:13.5,fontWeight:600,
                      color:h.a>h.de?"var(--alerta)":"var(--ok)"}}>
                      {f(h.de)} → {f(h.a)}</span>
                    <span className="sub tiny num">
                      {fCorta(h.desde)} → {h.hasta?fCorta(h.hasta):"vigente"}</span>
                  </div>
                  <div className="sub tiny" style={{marginTop:2}}>{h.motivo}</div>
                  <div className="sub tiny num" style={{marginTop:2}}>{h.au}</div>
                </div>
              ))}
            </div>
          )}
        </>)}

        {vivo ? (<>
          {/* ══ MODO REAL ══ El costo entra solo, con su fecha. No hay aprobación. */}
          <div className="field">
            <label>Costo a crédito (lo de siempre)</label>
            <input type="number" inputMode="decimal" value={val} onChange={e=>setVal(e.target.value)} placeholder={String(p.base)} />
          </div>
          <div className="field">
            <label>Costo si le pagan de contado</label>
            <input type="number" inputMode="decimal" value={contado} onChange={e=>setContado(e.target.value)}
              placeholder={p.contado==null ? "sin descuento" : String(p.contado)} />
            <div className="sub tiny" style={{marginTop:4}}>
              Déjalo vacío si no das precio distinto por pago de contado.</div>
          </div>

          <div className="sub tiny" style={{margin:"14px 0 8px",fontWeight:700}}>¿Desde cuándo rige?</div>
          <div className="row" style={{gap:10}}>
            <button className={"btn "+(cuando==="hoy"?"btn-maiz":"btn-ghost")} style={{flex:1}}
              onClick={()=>setCuando("hoy")}>Desde hoy</button>
            <button className={"btn "+(cuando==="fecha"?"btn-maiz":"btn-ghost")} style={{flex:1}}
              onClick={()=>setCuando("fecha")}>Desde una fecha</button>
          </div>
          {cuando==="fecha" && (
            <div className="field" style={{marginTop:10}}>
              <label>Rige a partir del</label>
              <input type="date" value={fecha} min={hoyISO} onChange={e=>setFecha(e.target.value)} />
              <div className="sub tiny" style={{marginTop:4}}>
                No se puede poner una fecha pasada: los pedidos de esos días ya se liquidaron
                con el costo de entonces.</div>
            </div>
          )}

          {valido &&
            <div className="tiny num" style={{fontWeight:600,margin:"12px 2px 0",color:dif>0?"var(--alerta)":"var(--ok)"}}>
              {dif>0?"Sube":"Baja"} {Math.abs(dif).toFixed(1)}% · {f(Math.abs(n-p.base))} {dif>0?"más caro":"más barato"}
            </div>}

          <div className="card card-pad" style={{margin:"14px 0",background:"rgba(28,122,68,.08)",border:"none"}}>
            <div className="sub tiny">
              El costo <b>entra solo</b> en la fecha que elijas. {FREELANCE.nombre} recibe el aviso;
              su precio de venta al cliente <b>no cambia</b> — él decide si lo traslada.
            </div>
          </div>

          <div className="row" style={{gap:10,marginTop:4}}>
            <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button className="btn btn-maiz" disabled={!valido || guardando}
              onClick={()=>onCambiar(n, contado, cuando==="hoy" ? hoyISO : fecha)}>
              {guardando ? "Guardando…" : "Guardar costo"}</button>
          </div>
        </>) : pend
          ? <>
              <div className="card card-pad" style={{background:"var(--espera-suave)",border:"none",marginBottom:14}}>
                <div style={{fontWeight:600,color:"#8A5A12"}}>Esperando aprobación de {FREELANCE.nombre}</div>
                <div className="sub tiny" style={{marginTop:4}}>El precio vigente sigue rigiendo hasta que lo apruebe. Puedes retirar el ajuste.</div>
              </div>
              <button className="btn btn-ghost" onClick={onRetirar}>Retirar ajuste propuesto</button>
            </>
          : <>
              <div className="field">
                <label>Nuevo precio base</label>
                <input type="number" value={val} onChange={e=>setVal(e.target.value)} placeholder={String(p.base)} />
              </div>
              {valido &&
                <div className="tiny num" style={{fontWeight:600,margin:"8px 2px 0",color:dif>0?"var(--alerta)":"var(--ok)"}}>
                  {dif>0?"Sube":"Baja"} {Math.abs(dif).toFixed(1)}% · {f(Math.abs(n-p.base))} {dif>0?"más caro":"más barato"}
                </div>}
              {valido && (<>
                <div className="sub tiny" style={{margin:"16px 0 8px"}}>¿Por qué cambia?</div>
                {MOTIVOS_PRECIO.map(m=>(
                  <button key={m} className="btn btn-ghost"
                    style={{width:"100%",marginBottom:8,textAlign:"left",
                      fontWeight:motivo===m?700:500,
                      borderColor:motivo===m?"var(--maiz)":undefined}}
                    onClick={()=>setMotivo(m)}>{motivo===m?"✓ ":""}{m}</button>
                ))}
              </>)}
              <div className="row" style={{gap:10,marginTop:16}}>
                <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
                <button className="btn btn-maiz" disabled={!valido || !motivo}
                  onClick={()=>onProponer(n, motivo)}>Enviar al freelance</button>
              </div>
            </>}
      </div>
    </div>
  );
}

/* ====== PROPUESTAS ====== */
function Propuestas({ctx}){
  const {prop,setProp,accion}=ctx;
  const [filtro,setFiltro]=useState("activas");
  const [nueva,setNueva]=useState(false);
  const [ver,setVer]=useState(null);
  /* Atrás: cierra el alta antes de salir del módulo. */
  useRetrocesoP(()=>{ if(nueva){ setNueva(false); return true; } return false; });

  const pend=prop.filter(p=>p.estado==="pendiente");
  const hist=prop.filter(p=>p.estado!=="pendiente");
  const lista=filtro==="activas"?pend:hist;
  /* Cuánto lleva esperando cada propuesta: si pasa una semana, conviene insistir. */
  const diasEspera=(f)=>{
    if(!f || f==="Ahora") return 0;
    const m=/Hace (\d+)/.exec(f);
    if(m) return parseInt(m[1]);
    if(/Hoy/i.test(f)) return 0;
    if(/Ayer/i.test(f)) return 1;
    return null;
  };
  const viejas = pend.filter(p=>{ const d=diasEspera(p.fecha); return d!==null && d>=7; });

  const enviar=(p)=> accion(()=>{ setProp(prev=>[{...p,id:"PR-"+(209+prev.length),fecha:"Ahora",estado:"pendiente"},...prev]); setNueva(false); });
  const retirar=(id)=> accion(()=> setProp(prev=>prev.filter(p=>p.id!==id)));

  return (
    <>
      <div className="eyebrow">Negociación con tu freelance</div>
      <h1 className="h1">Propuestas</h1>
      <div className="sub" style={{marginTop:4}}>Lo que propones a tu freelance.</div>

      <div className="seg" style={{margin:"16px 0 14px"}}>
        <button className={filtro==="activas"?"on":""} onClick={()=>setFiltro("activas")}>Activas · {pend.length}</button>
        <button className={filtro==="historial"?"on":""} onClick={()=>setFiltro("historial")}>Historial · {hist.length}</button>
      </div>

      {viejas.length>0 && filtro==="activas" && (
        <div className="card card-pad" style={{marginBottom:14,borderColor:"var(--maiz)"}}>
          <div style={{fontWeight:600,fontSize:14}}>
            {viejas.length} propuesta{viejas.length!==1?"s":""} lleva{viejas.length===1?"":"n"} más de una semana</div>
          <div className="sub tiny" style={{marginTop:4}}>
            Conviene que hables con {FREELANCE.nombre} para destrabarlas.</div>
        </div>
      )}

      {lista.length===0
        ? <div className="empty"><div className="ico">✎</div><div style={{marginTop:8,fontWeight:600}}>Sin propuestas {filtro==="activas"?"activas":"en historial"}</div><div className="tiny" style={{marginTop:4}}>Crea una nueva con el botón +</div></div>
        : <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {lista.map(p=> <PropCard key={p.id} p={p} onClick={()=>setVer(p)} />)}
          </div>}

      <button className="fab" onClick={()=>setNueva(true)}>＋ Nueva propuesta</button>
      {nueva && <NuevaProp onClose={()=>setNueva(false)} onEnviar={enviar} />}
      {ver && <VerProp p={ver} onClose={()=>setVer(null)} onRetirar={(id)=>{retirar(id);setVer(null);}} />}
    </>
  );
}

            {p.motivoFreelance && <div className="sub tiny" style={{marginTop:4}}>“{p.motivoFreelance}”</div>}

        {p.estado==="pendiente"

function NuevaProp({onClose,onEnviar}){
  const [tipo,setTipo]=useState("promo");
  const [titulo,setTitulo]=useState("");
  const [detalle,setDetalle]=useState("");
  const [base,setBase]=useState("");
  const [nuevo,setNuevo]=useState("");
  const [unidad,setUnidad]=useState("");
  const [promoTxt,setPromoTxt]=useState("");
  const [cupoActual,setCupoActual]=useState("");
  const [cupoNuevo,setCupoNuevo]=useState("");

  const valido = titulo.trim() && detalle.trim() && (
    tipo==="precio"? base&&nuevo&&unidad :
    tipo==="promo"? base&&unidad&&promoTxt :
    cupoActual&&cupoNuevo);

  const armar=()=>{
    const com={tipo,titulo:titulo.trim(),detalle:detalle.trim()};
    if(tipo==="precio") return {...com,base:+base,nuevo:+nuevo,unidad};
    if(tipo==="promo")  return {...com,base:+base,unidad,promo:promoTxt};
    return {...com,cupoActual:+cupoActual,cupoNuevo:+cupoNuevo};
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={ev=>ev.stopPropagation()}>
        <div className="grip" />
        <div className="h2">Nueva propuesta</div>
        <div className="sub" style={{marginTop:4}}>Se enviará a {FREELANCE.nombre} para su aprobación.</div>

        <div className="field"><label>Tipo</label></div>
        <div className="seg">
          {Object.entries(TIPO).filter(([k])=>k!=="producto"&&k!=="precio").map(([k,v])=>(
            <button key={k} className={tipo===k?"on":""} onClick={()=>setTipo(k)}>{v.ico} {v.lbl}</button>
          ))}
        </div>

        <div className="field"><label>Título</label>
          <input value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Ej: Nuevo precio · Arroz Conejo" />
        </div>
        <div className="field"><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}><label>Detalle para el freelance</label><MicBtnAsist onTexto={t=>setDetalle(d=> d ? d+" "+t : t)} /></div>
          <textarea value={detalle} onChange={e=>setDetalle(e.target.value)} placeholder="Explica el motivo y el beneficio para su equipo…" />
        </div>

        {tipo==="precio" && <>
          <div className="field"><label>Precio base actual</label><input type="number" value={base} onChange={e=>setBase(e.target.value)} placeholder="1450" /></div>
          <div className="field"><label>Precio propuesto</label><input type="number" value={nuevo} onChange={e=>setNuevo(e.target.value)} placeholder="1380" /></div>
          <div className="field"><label>Unidad</label><input value={unidad} onChange={e=>setUnidad(e.target.value)} placeholder="$/quintal" /></div>
        </>}
        {tipo==="promo" && <>
          <div className="field"><label>Precio base</label><input type="number" value={base} onChange={e=>setBase(e.target.value)} placeholder="24000" /></div>
          <div className="field"><label>Unidad</label><input value={unidad} onChange={e=>setUnidad(e.target.value)} placeholder="quintal" /></div>
          <div className="field"><label>Promoción</label><input value={promoTxt} onChange={e=>setPromoTxt(e.target.value)} placeholder="Compra 10, lleva 12" /></div>
        </>}
        {tipo==="condicion" && <>
          <div className="field"><label>Cupo actual</label><input type="number" value={cupoActual} onChange={e=>setCupoActual(e.target.value)} placeholder="4000000" /></div>
          <div className="field"><label>Cupo propuesto</label><input type="number" value={cupoNuevo} onChange={e=>setCupoNuevo(e.target.value)} placeholder="5500000" /></div>
        </>}

        <div className="row" style={{gap:10,marginTop:18}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-maiz" disabled={!valido} onClick={()=>onEnviar(armar())}>Enviar al freelance</button>
        </div>
      </div>
    </div>
  );
}

function Dato({k,v,alerta}){
  return (
    <div className="row between" style={{padding:"7px 0",borderBottom:"1px solid var(--linea)"}}>
      <span className="tiny muted">{k}</span>
      <span className="num" style={{fontWeight:600,fontSize:14,color:alerta?"var(--alerta)":"var(--texto)",textAlign:"right",maxWidth:"62%"}}>{v}</span>
    </div>
  );
}

/* ====== CATÁLOGO ====== */
function Catalogo({ctx,irTab}){
  const {cat,setCat,setProp,accion}=ctx;
  const [edit,setEdit]=useState(null);
  const [nuevo,setNuevo]=useState(false);

  const [fEst,setFEst]=useState("todos");   // todos | aceptado | ofrecido | rechazado

  // Ofrecer un producto al freelance = crear una propuesta tipo "producto"
  const ofrecer=(p)=> accion(()=>{
    setProp(prev=>[{
      id:"PR-"+(209+prev.length), tipo:"producto", estado:"pendiente", fecha:"Ahora",
      titulo:"Producto nuevo · "+p.nombre,
      detalle:"Propongo sumar "+p.nombre+" ("+p.pres+") al catálogo de tu equipo.",
      base:p.base, nuevo:p.sugerido, unidad:p.pres, refProducto:p.id,
    },...prev]);
  });

  // Crear producto nuevo: entra al catálogo como "ofrecido" y se propone al freelance en un paso
  const crear=(datos)=> accion(()=>{
    const id="C-"+String(cat.length+1).padStart(2,"0");
    const prod={id, nombre:datos.nombre, pres:datos.pres, base:datos.base, sugerido:datos.sugerido, stock:datos.stock, promo:false, estado:"ofrecido", propuesto:null};
    setCat(prev=>[...prev,prod]);
    setProp(prev=>[{
      id:"PR-"+(209+prev.length), tipo:"producto", estado:"pendiente", fecha:"Ahora",
      titulo:"Producto nuevo · "+prod.nombre,
      detalle:"Propongo sumar "+prod.nombre+" ("+prod.pres+") al catálogo de tu equipo.",
      base:prod.base, nuevo:prod.sugerido, unidad:prod.pres, refProducto:prod.id,
    },...prev]);
    setNuevo(false);
    irTab("prop");
  });

  const orden={aceptado:0,ofrecido:1,rechazado:2};
  const norm=(t)=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const lista=[...cat]
    .filter(p=> fEst==="todos" || p.estado===fEst)
    .filter(p=> q.trim()==="" || norm(p.nombre+" "+p.pres).includes(norm(q)))
    .sort((a,b)=>orden[a.estado]-orden[b.estado]);
  const cuenta=(e)=>cat.filter(p=>p.estado===e).length;

  /* Se agrupa PRIMERO y se filtra por el estado del GRUPO (aceptado manda):
     así la hoja conserva todas las presentaciones del producto, incluidas las
     que están en otro estado. Filtrar las filas antes las escondería. */
  const grupos = agruparProd(
      cat.filter(p=> q.trim()==="" || norm(p.nombre+" "+p.pres).includes(norm(q))))
    .filter(g=> fEst==="todos" || g.estado===fEst)
    .sort((a,b)=>orden[a.estado]-orden[b.estado]);
  const grupoAbierto = abierto ? agruparProd(cat.filter(p=>p.prodId===abierto))[0] : null;

  return (

          return (
            <button key={g.prodId} className="item" style={{width:"100%",textAlign:"left"}} onClick={()=>setAbierto(g.prodId)}>

              <div style={{flex:1,minWidth:0}}>
                <div className="row" style={{gap:6}}>
                  <span style={{fontWeight:600,fontSize:14}}>{g.nombre}</span>

                </div>

                {g.pendEstado>0 &&
                  <div className="tiny muted" style={{marginTop:3}}>
                    {g.pendEstado===1 ? "1 presentación por resolver" : g.pendEstado+" presentaciones por resolver"}</div>}
              </div>

               : "Tu catálogo está vacío."}</div>

      {grupoAbierto && <PresentacionesCatSheet g={grupoAbierto} onClose={()=>setAbierto(null)}

      {edit && <ProdSheet p={edit} onClose={()=>setEdit(null)}

      {nuevo && <NuevoProducto onClose={()=>setNuevo(false)} onCrear={crear} />}
    </>
  );
}

function CargaXML({irTab}){
  const [xml,setXml]=useState(null);        // factura leída
  const [aviso,setAviso]=useState("");
  /* pestaña de grupo; null = elige sola la accionable */
  const [grupo,setGrupo]=useState(null);
  /* ── Pestaña de la pantalla: subir una nueva o ver las ya cargadas ── */
  /* Si se entró desde la banda de dinero en tránsito, abre directo en esa lista. */
  const [vista,setVista]=useState(ABRIR_TRANSITO ? "transito" : "subir");   // subir | cargadas | transito
  useEffect(()=>{ ABRIR_TRANSITO = false; }, []);
  const [ficha,setFicha]=useState(null);      // factura cargada abierta
  const [anular,setAnular]=useState(false);   // flujo de anulación abierto
  const [motAnu,setMotAnu]=useState("");
  const [notaAnu,setNotaAnu]=useState("");
  const [tick,setTick]=useState(0);           // repinta tras escribir en localStorage
  const [traslado,setTraslado]=useState(false); // pantalla de cerrar el cobro en transito
  const [destSel,setDestSel]=useState(null);    // factura destino elegida
  const [saldoAbierto,setSaldoAbierto]=useState(null); // cliente con su detalle de saldo abierto
  /* Atrás: cierra lo más interno primero (detalle → anulación → ficha → factura leída). */
  useRetrocesoP(()=>{
    if(saldoAbierto){ setSaldoAbierto(null); return true; }
    if(anular){ setAnular(false); setMotAnu(""); setNotaAnu(""); return true; }
    if(ficha){ setFicha(null); return true; }
    if(xml){ setXml(null); return true; }
    if(vista!=="subir"){ setVista("subir"); return true; }
    return false;
  });
  const toast=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3600); };

  const nuevoAu=()=>"AU-260720-"+Math.floor(1000+Math.random()*9000);
  const buscarEq=(cod)=> EQUIVALENCIAS.find(e=>e.codProv===cod);

  /* Cada línea del XML cae en uno de tres grupos, SOLO como información:
     el proveedor ya no empareja aquí — eso lo hace Diana en el sistema web. */
  const clasificar=(l)=>{
    const eq = buscarEq(l.codProv);
    if(eq) return {grupo:"calza", prodId:eq.prodId, nombre:eq.nombre};
    /* propuesta por parecido de descripción, con su % de confianza */
    let mejor=null, pct=0;
    CAT_INI.forEach(c=>{
      const p = parecido(l.desc, c.nombre);
      if(p>pct){ pct=p; mejor=c; }
    });
    if(mejor && pct>=50) return {grupo:"propuesto", prodId:mejor.prodId, pct,
                                 nombre:`${mejor.nombre} · ${mejor.pres}`};
    return {grupo:"desconocido"};
  };

  const lineas = xml ? xml.lineas.map(l=>({...l, ...clasificar(l)})) : [];
  const calzan  = lineas.filter(l=>l.grupo==="calza");
  const propues = lineas.filter(l=>l.grupo==="propuesto");
  const desconoc= lineas.filter(l=>l.grupo==="desconocido");
  /* Cuántas líneas quedarán pendientes de emparejar por Diana (propuestas + desconocidas). */
  const pendientes = propues.length + desconoc.length;
  /* Qué pestaña se ve: lo que hay pendiente manda, pero es solo informativo. */
  const cuantos = {calzan:calzan.length, propues:propues.length, desconoc:desconoc.length};
  const auto = desconoc.length ? "desconoc" : propues.length ? "propues" : "calzan";
  const grupoVivo = (grupo && cuantos[grupo]) ? grupo : auto;

  const archivoRef = React.useRef(null);
  /* Foto de la factura física: respaldo visual adjunto (NO reemplaza al XML, que es la verdad legal). */
  const fotoRef = React.useRef(null);
  const [fotoFactura, setFotoFactura] = React.useState(null);
  const elegirFoto=()=>{ if(fotoRef.current) fotoRef.current.click(); };
  const alTomarFoto=(e)=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const lec = new FileReader();
    lec.onerror = ()=> toast("No se pudo leer la foto. Intenta de nuevo.");
    lec.onload = ()=>{ setFotoFactura(String(lec.result||"")); toast("Foto de respaldo adjunta ✓"); };
    lec.readAsDataURL(f);
  };
  /* Lector real: abre el explorador del telefono y lee el XML de verdad.
     Si el archivo no sirve, se avisa y NO se carga nada inventado. */
  const elegirArchivo=()=>{ if(archivoRef.current) archivoRef.current.click(); };
  const alElegirArchivo=(e)=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";                 /* permite volver a elegir el mismo archivo */
    if(!f) return;
    const lector = new FileReader();
    lector.onerror = ()=> toast("No se pudo leer el archivo. Intenta de nuevo.");
    lector.onload = ()=>{
      const r = leerFacturaSRI(String(lector.result||""));
      if(r.error){ toast(r.error); return; }
      /* Anti-duplicado: cargarla dos veces duplicaria venta, cartera y comisión. */
      const previa = facturaRepetida(r);
      if(previa){
        setXml(null);
        toast(`Esta factura ya fue cargada el ${previa.cuando} · ${previa.numero}`);
        return;
      }
      setXml(r);
      toast(`Factura ${r.numero} leída · ${r.lineas.length} línea${r.lineas.length!==1?"s":""} · revísalas antes de cargarla`);
    };
    lector.readAsText(f);
  };
  /* Respaldo para mostrar el flujo sin un XML a mano */
  const verEjemplo=()=>{
    setXml({...XML_EJEMPLO, esEjemplo:true});
    toast("Ejemplo cargado · así se ve una factura leída");
  };

  /* Confirmar una equivalencia: se guarda y ya no vuelve a preguntar. */
  const cargar=()=>{
    /* Segunda barrera: por si quedo abierta en pantalla y se cargo desde otro lado. */
    if(xml.esEjemplo){
      setXml(null);
      toast("Es solo un ejemplo · no se carga al sistema");
      return;
    }
    const previa = facturaRepetida(xml);
    if(previa){
      setXml(null);
      toast(`Esta factura ya fue cargada el ${previa.cuando} · no se carga dos veces`);
      return;
    }
    const au=nuevoAu();
    /* Las líneas sin equivalencia viajan como "pendiente de emparejar":
       Diana las resuelve en el sistema web (equivalencias_producto + ofertas_piladora). */
    const porEmparejar = [...propues, ...desconoc].map(l=>({codProv:l.codProv, desc:l.desc, cant:l.cant, precio:l.precio}));
    registrarFacturaCargada({...xml, au, pendientesEmparejar:porEmparejar});
    toast(pendientes
      ? `Factura ${xml.numero} cargada · ${pendientes} línea${pendientes!==1?"s":""} quedan para el sistema web`
      : `Factura ${xml.numero} cargada · ${lineas.length} líneas · ${au}`);
    setXml(null);
  };

  const Aviso = () => aviso ? (
    <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
      background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
      fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.35)",maxWidth:"88%"}}>{aviso}</div>
  ) : null;


  /* ══ ANULACION ══ */
  const anuladas = facturasAnuladas();
  /* se recalcula en cada repintado (tick) para que al cerrar un traslado baje solo */
  const transito = dineroEnTransito();
  const saldos   = saldosAFavor();      // sobrantes ya trasladados, juntos por cliente
  const estaAnulada = (f)=> anuladas.find(a=>a.clave && f.clave && a.clave===f.clave)
                         || anuladas.find(a=>a.numero && f.numero && a.numero===f.numero) || null;
  /* Demo: cuánto se cobró de esta factura. En Fase 4 sale de la cartera real. */
  const cobradoDe = (f)=> f.cobrado || 0;

  const confirmarAnulacion=()=>{
    const f = ficha; if(!f) return;
    if(!motAnu){ toast("Elige el motivo de la anulación"); return; }
    const cob = cobradoDe(f);
    const v = viaAnulacion(f.fecha, cob>0);
    const au = nuevoAu();
    registrarAnulacion({
      clave:f.clave, numero:f.numero, cliente:f.cliente, clienteRuc:f.clienteRuc, demo:f.demo,
      totalAnterior:f.total, motivo:motAnu, nota:notaAnu.trim(),
      via:v.via, cobros:cob,
      destino:"transito", saldoFavor:cob,
      au
    });
    setAnular(false); setMotAnu(""); setNotaAnu(""); setTick(t=>t+1);
    toast(cob>0
      ? `Factura ${f.numero} anulada · ${money(cob)} queda a favor del cliente · ${au}`
      : `Factura ${f.numero} anulada · ${au}`);
  };

  /* Cierra el traslado: el dinero en transito se aplica a la factura nueva.
     El cobro NUNCA se recrea (duplicaria el ingreso): solo cambia de factura.
     Si la factura nueva vale menos, la diferencia queda a favor del cliente. */
  const confirmarTraslado=()=>{
    const f = ficha; if(!f || !destSel) return;
    const r = trasladarCobro(f.clave, destSel.numero, destSel.total);
    if(!r){ toast("No se encontro el registro de anulacion"); return; }
    setTraslado(false); setDestSel(null); setTick(t=>t+1);
    toast(r.saldoFavor>0
      ? `Trasladado a ${destSel.numero} · ${money(r.saldoFavor)} queda a favor del cliente · ${r.trasladoAu}`
      : `Cobro trasladado a ${destSel.numero} · ${r.trasladoAu}`);
  };

  /* ── FICHA DE UNA FACTURA CARGADA ── */
  if(ficha){
    const f = ficha;
    const anu = estaAnulada(f);
    const cob = cobradoDe(f);
    const v = viaAnulacion(f.fecha, cob>0);
    return (<>
      <div className="eyebrow">Factura cargada</div>
      <h1 className="h1">{f.numero}</h1>
      <div className="sub" style={{marginTop:4}}>{f.cliente} · {f.fecha}</div>

      <div className="sec-gap" style={{height:16}} />
      <div className="hero">
        <div className="lbl">{anu ? "Valor anulado" : "Total facturado"}</div>
        <div className="big num" style={anu?{textDecoration:"line-through",opacity:.65}:null}>
          {money(f.total)}</div>
      </div>

      {anu ? (<>
        <div className="sec-gap" style={{height:12}} />
        <div className="card card-pad" style={{borderColor:"#C62828"}}>
          <div style={{fontWeight:700,fontSize:14,color:"#C62828"}}>Anulada · {anu.motivo}</div>
          {anu.nota && <div className="sub tiny" style={{marginTop:4}}>{anu.nota}</div>}
          <div className="sub tiny" style={{marginTop:6}}>{anu.cuando} · {anu.au}</div>
          <div className="sub tiny" style={{marginTop:6}}>
            Valor anterior: <b className="num">{money(anu.totalAnterior)}</b></div>
        </div>
        {anu.cobros>0 && (
          <>
            <div className="sec-gap" style={{height:12}} />
            <div className="card card-pad" style={{background:"var(--maiz-suave)"}}>
              <div style={{fontWeight:700,fontSize:14}}>
                {anu.destino==="transito" ? "Cobro en tránsito" : `Trasladado a ${anu.destino}`}</div>
              <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
                {anu.destino==="transito"
                  ? `${money(anu.cobros)} ya entraron al banco. El dinero NO se anula: queda a favor de ${f.cliente} y se traslada cuando emitas la factura nueva.`
                  : `${money(anu.cobros)} se aplicaron a la factura ${anu.destino}.`}</div>
              {anu.saldoFavor>0 && anu.destino!=="transito" && (
                <div className="sub tiny" style={{marginTop:6}}>
                  Saldo a favor del cliente: <b className="num">{money(anu.saldoFavor)}</b></div>
              )}
              {anu.trasladoAu && (
                <div className="sub tiny" style={{marginTop:6}}>
                  {anu.trasladoCuando} · {anu.trasladoAu}</div>
              )}
            </div>

            {/* Cerrar el traslado: solo si el dinero sigue en transito. */}
            {anu.destino==="transito" && !traslado && (
              <button className="btn btn-maiz" style={{width:"100%",marginTop:10}}
                onClick={()=>{ setTraslado(true); setDestSel(null); }}>
                Trasladar a una factura nueva</button>
            )}

            {anu.destino==="transito" && traslado && (()=>{
              /* Solo facturas del MISMO cliente, no anuladas y distintas de esta. */
              const opciones = facturasCargadas().filter(x=>
                x.cliente===f.cliente &&
                (x.clave||x.numero)!==(f.clave||f.numero) &&
                !estaAnulada(x));
              return (<>
                <div className="sec-gap" style={{height:12}} />
                <div className="card card-pad" style={{borderColor:"var(--maiz)"}}>
                  <h3>¿A qué factura va el dinero?</h3>
                  <div className="sub tiny" style={{margin:"6px 0 14px",lineHeight:1.5}}>
                    {money(anu.cobros)} de {f.cliente}. Si la factura nueva vale menos,
                    la diferencia queda a favor del cliente.</div>

                  {opciones.length===0 ? (
                    <div className="sub tiny" style={{textAlign:"center",padding:"14px 0"}}>
                      Todavía no hay otra factura cargada de este cliente.
                      Carga la factura nueva y vuelve aquí.</div>
                  ) : opciones.slice(0,20).map((x,i)=>(
                    <button key={x.clave||x.numero||i} className="btn btn-ghost"
                      style={{width:"100%",marginBottom:8,textAlign:"left",
                        fontWeight:destSel && destSel.numero===x.numero?700:500,
                        borderColor:destSel && destSel.numero===x.numero?"var(--maiz)":undefined}}
                      onClick={()=>setDestSel(x)}>
                      <span className="row between" style={{width:"100%"}}>
                        <span style={{minWidth:0,overflow:"hidden",
                          textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.numero}</span>
                        <b className="num" style={{flexShrink:0,marginLeft:10}}>{money(x.total)}</b>
                      </span>
                    </button>
                  ))}

                  {destSel && (
                    <div className="card card-pad" style={{background:"var(--maiz-suave)",
                      border:"none",marginTop:4,marginBottom:12}}>
                      <div className="row between">
                        <span className="sub tiny">Se traslada</span>
                        <b className="num">{money(anu.cobros)}</b></div>
                      <div className="row between" style={{marginTop:4}}>
                        <span className="sub tiny">Factura nueva</span>
                        <b className="num">{money(destSel.total)}</b></div>
                      {anu.cobros>destSel.total && (
                        <div className="row between" style={{marginTop:4}}>
                          <span className="sub tiny">Queda a favor</span>
                          <b className="num">{money(anu.cobros-destSel.total)}</b></div>
                      )}
                    </div>
                  )}

                  <button className="btn btn-maiz" style={{width:"100%"}}
                    disabled={!destSel} onClick={confirmarTraslado}>
                    Confirmar traslado</button>
                  <button className="btn btn-ghost" style={{width:"100%",marginTop:8}}
                    onClick={()=>{ setTraslado(false); setDestSel(null); }}>Cancelar</button>
                </div>
              </>);
            })()}
          </>
        )}
      </>) : anular ? (<>
        <div className="sec-gap" style={{height:12}} />
        <div className="card card-pad" style={{borderColor:"#C62828"}}>
          <div style={{fontWeight:700,fontSize:14,color:"#C62828"}}>{v.t}</div>
          <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>{v.d}</div>
        </div>

        {cob>0 && (<>
          <div className="sec-gap" style={{height:12}} />
          <div className="card card-pad" style={{background:"var(--maiz-suave)"}}>
            <div style={{fontWeight:700,fontSize:14}}>Esta factura tiene {money(cob)} cobrados</div>
            <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
              El dinero ya entró al banco, así que NO se anula ni se vuelve a registrar.
              Queda a favor de {f.cliente} y lo trasladas a la factura nueva cuando la emitas.</div>
          </div>
        </>)}

        <div className="sec-gap" style={{height:12}} />
        <div className="card card-pad">
          <h3>¿Por qué la anulas?</h3>
          <div className="sub tiny" style={{margin:"6px 0 14px"}}>
            Queda auditado con el valor anterior. La anulación no se puede deshacer.</div>
          {ordUso("motivos_anular", MOTIVOS_ANULAR).map(m=>(
            <button key={m} className="btn btn-ghost"
              style={{width:"100%",marginBottom:8,textAlign:"left",
                fontWeight:motAnu===m?700:500,
                borderColor:motAnu===m?"#C62828":undefined}}
              onClick={()=>{ setMotAnu(m); regUso("motivos_anular", m); }}>{m}</button>
          ))}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:4}}><MicBtnAsist onTexto={t=>setNotaAnu(n=> n ? n+" "+t : t)} /></div>
          <textarea className="inp" rows={2} placeholder="Detalle (opcional)"
            value={notaAnu} onChange={e=>setNotaAnu(e.target.value)}
            style={{width:"100%",marginTop:4}} />
        </div>

        <div className="sec-gap" style={{height:16}} />
        <button className="btn" style={{width:"100%",background:"#C62828",color:"#fff"}}
          onClick={confirmarAnulacion}>Anular la factura</button>
        <div className="sec-gap" style={{height:10}} />
        <button className="btn btn-ghost" style={{width:"100%"}}
          onClick={()=>{setAnular(false); setMotAnu(""); setNotaAnu("");}}>Cancelar</button>
      </>) : (<>
        <div className="sec-gap" style={{height:12}} />
        <div className="card card-pad">
          <div className="row between" style={{padding:"5px 0"}}>
            <span className="sub tiny">Cargada el</span>
            <b style={{fontSize:14}}>{f.cuando}</b>
          </div>
          {f.au && (
            <div className="row between" style={{padding:"5px 0"}}>
              <span className="sub tiny">Código</span>
              <b className="num" style={{fontSize:13}}>{f.au}</b>
            </div>
          )}
          {cob>0 && (
            <div className="row between" style={{padding:"5px 0"}}>
              <span className="sub tiny">Cobrado</span>
              <b className="num" style={{fontSize:14}}>{money(cob)}</b>
            </div>
          )}
        </div>

        <div className="sec-gap" style={{height:16}} />
        <button className="btn btn-ghost" style={{width:"100%",borderColor:"#C62828",color:"#C62828"}}
          onClick={()=>setAnular(true)}>Anular esta factura</button>
        <div className="sub tiny" style={{marginTop:10,lineHeight:1.5,textAlign:"center"}}>
          Solo tú puedes anularla: tú la emitiste ante el SRI.</div>
      </>)}
    </>);
  }

  /* ── LISTA / CARGA ── */
  return (<>
    <div className="eyebrow">Tu factura, sin digitar</div>
    <h1 className="h1">Cargar factura</h1>
    <div className="sub" style={{marginTop:4}}>
      Sube el XML del SRI y el sistema lee todo: cliente, productos y valores.</div>

    {!xml && (<>
      <div className="sec-gap" style={{height:14}} />
      <div className="row" style={{gap:8}}>
        <button className={"btn "+(vista==="subir"?"btn-maiz":"btn-ghost")}
          style={{flex:1}} onClick={()=>setVista("subir")}>Subir</button>
        <button className={"btn "+(vista==="cargadas"?"btn-maiz":"btn-ghost")}
          style={{flex:1}} onClick={()=>setVista("cargadas")}>
          Cargadas{facturasCargadas().length?` · ${facturasCargadas().length}`:""}</button>
        {/* Toda la plata del cliente sin factura que la respalde, en un solo lado:
            sin trasladar (urgente) y a favor (parada). Si no hay nada, no estorba. */}
        {(transito.casos>0 || saldos.clientes>0) && (
          <button className={"btn "+(vista==="transito"?"btn-maiz":"btn-ghost")}
            style={{flex:1}} onClick={()=>setVista("transito")}>
            Del cliente · {transito.casos+saldos.clientes}</button>
        )}
      </div>
    </>)}

    {!xml && vista==="transito" && (<>
      {/* ── 1. SIN TRASLADAR: urgente. Mientras esto exista, la cartera miente. ── */}
      {transito.casos>0 && (<>
      <div className="sec-gap" style={{height:14}} />
      <div className="card card-pad" style={{background:"var(--espera-suave)",border:"none"}}>
        <div className="row between">
          <span style={{fontWeight:700,fontSize:14,color:"#8A5A12"}}>Sin trasladar</span>
          <span className="num" style={{fontWeight:700,fontSize:16,color:"#8A5A12"}}>{money(transito.monto)}</span>
        </div>
        <div className="tiny" style={{color:"#8A5A12",opacity:.85,marginTop:4,lineHeight:1.5}}>
          Dinero que el cliente ya pagó y quedó sin factura al anularla. Aplícalo a la factura nueva.</div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="list-card">
        {transito.lista.map((a,i)=>{
          /* Dos listas distintas en el telefono: el caso en transito vive en
             facturasAnuladas() y la factura en facturasCargadas(). Si la factura
             ya no esta cargada no hay nada que abrir: se avisa y la fila no
             promete "aplicar". Se resuelve solo en Fase 4 con Supabase. */
          const fc = facturasCargadas().find(x=>x.clave===a.clave || x.numero===a.numero);
          return (
          <button key={a.clave||i} className="item" style={{width:"100%",textAlign:"left"}}
            onClick={()=>{ if(fc) setFicha(fc);
                           else toast("La factura ya no está cargada en este teléfono. Vuelve a cargarla para aplicar el cobro."); }}>
            <div className="ava ava-m" style={{flexShrink:0,background:"#F3DFB4"}}>⏳</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="row" style={{gap:6,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.cliente||"Sin cliente"}</div>
                {a.demo && <ChipDemo/>}
              </div>
              <div className="tiny muted num">{a.numero}</div>
              <div className="tiny muted">Anulada el {a.cuando} · {a.motivo}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div className="num" style={{fontWeight:700,color:"#8A5A12"}}>{money(a.cobros)}</div>
              {fc ? <div className="tiny muted">aplicar ›</div>
                  : <div className="tiny muted" style={{opacity:.6}}>no disponible</div>}
            </div>
          </button>
          );
        })}
      </div>
      </>)}

      {/* ── 2. A FAVOR: saldo parado, junto por cliente. No es urgente, pero se le debe. ── */}
      {saldos.clientes>0 && (<>
        <div className="sec-gap" style={{height:transito.casos>0?20:14}} />
        <div className="card card-pad" style={{background:"var(--papel-2)",border:"none"}}>
          <div className="row between">
            <span style={{fontWeight:700,fontSize:14}}>A favor del cliente</span>
            <span className="num" style={{fontWeight:700,fontSize:16}}>{money(saldos.monto)}</span>
          </div>
          <div className="tiny muted" style={{marginTop:4,lineHeight:1.5}}>
            Sobró después de trasladar el cobro: la factura nueva valió menos. Es plata
            del cliente que sigue en la casa. Se le devuelve o se le aplica a la próxima.</div>
        </div>

        <div className="sec-gap" style={{height:12}} />
        <div className="list-card">
          {saldos.lista.map((s,i)=>{
            const abierto = saldoAbierto===s.id;
            return (
            <div key={s.id}>
              <button className="item" style={{width:"100%",textAlign:"left"}}
                onClick={()=>setSaldoAbierto(abierto?null:s.id)}>
                <div className="ava ava-m" style={{flexShrink:0,background:"#CDE9DA"}}>💰</div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="row" style={{gap:6,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:14,overflow:"hidden",
                      textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.cliente}</div>
                    {s.demo && <ChipDemo/>}
                  </div>
                  <div className="tiny muted num">{s.ruc || "sin RUC"}</div>
                  <div className="tiny muted">
                    {s.casos.length===1 ? "de 1 factura anulada" : `de ${s.casos.length} facturas anuladas`}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div className="num" style={{fontWeight:700,color:"#2E7D52"}}>{money(s.monto)}</div>
                  <div className="tiny muted">{abierto?"ocultar ⌃":"ver ⌄"}</div>
                </div>
              </button>
              {/* El detalle importa: sin el, el proveedor no sabe de que factura salio la plata. */}
              {abierto && (
                <div style={{padding:"2px 13px 12px 13px"}}>
                  {s.casos.map((c,j)=>(
                    <div key={c.clave||j} className="row between"
                      style={{padding:"7px 0",borderTop:"1px solid var(--linea)",minWidth:0}}>
                      <div style={{minWidth:0,flex:1}}>
                        <div className="tiny num" style={{fontWeight:600,overflow:"hidden",
                          textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.numero}</div>
                        <div className="tiny muted">
                          anulada {c.cuando} · trasladada a {c.destino}</div>
                      </div>
                      <span className="num tiny" style={{fontWeight:700,flexShrink:0,marginLeft:10,
                        color:"#2E7D52"}}>{money(c.saldoFavor)}</span>
                    </div>
                  ))}
                  <div className="tiny muted" style={{marginTop:9,lineHeight:1.5}}>
                    Aplicarlo a una factura futura es trabajo de cartera; hoy solo se ve aquí.</div>
                </div>
              )}
            </div>
            );
          })}
        </div>
      </>)}
    </>)}

    {!xml && vista==="cargadas" && (<>
      <div className="sec-gap" style={{height:14}} />
      {facturasCargadas().length===0 ? (
        <div className="card card-pad" style={{textAlign:"center",padding:"26px 18px"}}>
          <div style={{fontSize:34,marginBottom:8}}>📭</div>
          <div className="sub tiny">Todavía no has cargado ninguna factura.</div>
        </div>
      ) : facturasCargadas().slice(0,30).map((f,i)=>{
        const anu = estaAnulada(f);
        return (
          <div key={f.clave||f.numero||i} className="card card-pad"
            style={{marginBottom:8,cursor:"pointer",
              borderColor:anu?"#C62828":undefined,opacity:anu?.75:1}}
            onClick={()=>setFicha(f)}>
            <div className="row between">
              <div style={{minWidth:0,flex:1}}>
                <div className="row" style={{gap:6,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:15,overflow:"hidden",
                    textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.cliente||"Sin cliente"}</div>
                  {f.demo && <ChipDemo/>}
                </div>
                <div className="sub tiny" style={{marginTop:2}}>{f.numero} · {f.cuando}</div>
              </div>
              <div style={{flexShrink:0,textAlign:"right",marginLeft:10}}>
                <b className="num" style={{fontSize:14,
                  textDecoration:anu?"line-through":"none"}}>{money(f.total)}</b>
                {anu && <div className="sub tiny" style={{color:"#C62828",fontWeight:700}}>Anulada</div>}
              </div>
            </div>
          </div>
        );
      })}
      {facturasCargadas().length>30 && (
        <div className="sub tiny" style={{textAlign:"center",marginTop:6}}>
          Mostrando las 30 más recientes.</div>
      )}
    </>)}

    {!xml && vista==="subir" && (<>
      <div className="sec-gap" style={{height:16}} />
      <div className="card card-pad" style={{textAlign:"center",padding:"28px 18px"}}>
        <div style={{fontSize:40,marginBottom:10}}>📄</div>
        <div style={{fontWeight:600,fontSize:15}}>Sube el XML del SRI</div>
        <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
          Es el archivo que te da tu sistema de facturación al autorizar la factura.</div>
        <div className="sec-gap" style={{height:16}} />
        <input ref={archivoRef} type="file" accept=".xml,text/xml,application/xml"
          style={{display:"none"}} onChange={alElegirArchivo} />
        <button className="btn btn-maiz" style={{width:"100%"}} onClick={elegirArchivo}>
          Elegir archivo</button>
        <button className="btn btn-ghost" style={{width:"100%",marginTop:10}} onClick={verEjemplo}>
          Ver un ejemplo</button>

        <div className="sub tiny" style={{marginTop:14,paddingTop:12,borderTop:"1px solid var(--linea)",lineHeight:1.5}}>
          ¿Tienes la factura impresa? Adjunta una foto como respaldo. El XML sigue siendo obligatorio: la foto no lo reemplaza.</div>
        <input ref={fotoRef} type="file" accept="image/*" capture="environment"
          style={{display:"none"}} onChange={alTomarFoto} />
        <button className="btn btn-ghost" style={{width:"100%",marginTop:10}} onClick={elegirFoto}>
          {fotoFactura ? "📷 Cambiar foto de respaldo" : "📷 Adjuntar foto de la factura"}</button>
        {fotoFactura && (
          <div style={{marginTop:10,position:"relative"}}>
            <img src={fotoFactura} alt="Respaldo de factura" style={{width:"100%",borderRadius:10,border:"1px solid var(--linea)"}} />
            <button className="btn btn-ghost" style={{width:"100%",marginTop:6,fontSize:13}}
              onClick={()=>{ setFotoFactura(null); toast("Foto de respaldo quitada"); }}>
              Quitar foto</button>
          </div>
        )}
      </div>
    </>)}

    {xml && (<>
      <div className="sec-gap" style={{height:16}} />
      <div className="hero">
        <div className="lbl">Factura {xml.numero}</div>
        <div className="big num">{money(xml.total)}</div>
        <div className="split">
          <div><div className="k">Cliente</div><div className="v">{xml.cliente}</div></div>
          <div><div className="k">Fecha</div><div className="v num">{xml.fecha}</div></div>
          <div><div className="k">Líneas</div><div className="v num">{lineas.length}</div></div>
        </div>
      </div>

      {/* Los 3 grupos en PESTAÑAS, no apilados: antes había que desplazarse por todo
          lo que ya estaba bien para llegar a lo que hay que resolver. Abre en el
          grupo accionable si hay algo pendiente. */}
      <div className="sec-gap" style={{height:14}} />
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {[["calzan","Entran solas",calzan.length,"#2E7D52"],
          ["propues","Por emparejar",propues.length,"var(--maiz)"],
          ["desconoc","No reconozco",desconoc.length,"#B5432E"]].map(([k,t,n,col])=>(
          <button key={k} onClick={()=>setGrupo(k)} disabled={n===0}
            style={{background:grupoVivo===k?col:"var(--papel-2)",
              border:`1px solid ${grupoVivo===k?col:"var(--linea)"}`,borderRadius:13,
              padding:"10px 6px",cursor:n?"pointer":"default",fontFamily:"inherit",
              opacity:n?1:.45,minWidth:0,textAlign:"center"}}>
            <div className="num" style={{fontSize:19,fontWeight:700,
              color:grupoVivo===k?"#fff":col}}>{n}</div>
            <div style={{fontSize:9.5,fontWeight:600,lineHeight:1.15,marginTop:2,
              color:grupoVivo===k?"rgba(255,255,255,.9)":"var(--texto-3)",
              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t}</div>
          </button>
        ))}
      </div>

      <div className="sec-gap" style={{height:12}} />

      {/* Entran solas: no piden acción, así que van en lista compacta (una línea) */}
      {grupoVivo==="calzan" && (
        calzan.length===0
          ? <div className="card card-pad" style={{textAlign:"center"}}>
              <div className="sub tiny">Ninguna línea calzó sola.</div></div>
          : <div className="card card-pad" style={{padding:"4px 13px"}}>
              {calzan.map((l,i)=>(
                <div key={i} className="row between" style={{padding:"9px 0",minWidth:0,
                  borderTop:i?"1px solid var(--linea)":"none"}}>
                  <div style={{minWidth:0,flex:1}}>
                    <div style={{fontSize:13.5,fontWeight:600,overflow:"hidden",
                      textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.nombre}</div>
                    <div className="sub tiny num" style={{overflow:"hidden",
                      textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.codProv}</div>
                  </div>
                  <span className="num" style={{fontSize:13,flexShrink:0,marginLeft:10}}>
                    {l.cant} qq · {money(l.cant*l.precio)}</span>
                </div>
              ))}
            </div>
      )}

      {/* Emparejará el sistema web (Diana): informativo, el proveedor NO empareja aquí. */}
      {grupoVivo==="propues" && propues.map((l,i)=>(
        <div key={i} className="card card-pad" style={{marginBottom:8,borderColor:"var(--maiz)"}}>
          <div className="sub tiny num">{l.codProv} · {l.desc}</div>
          <div style={{fontWeight:600,fontSize:15,marginTop:6}}>Se parece a {l.nombre}</div>
          <div className="sub tiny" style={{marginTop:2}}>Coincidencia {l.pct}% · lo confirma el sistema web</div>
          <div className="sub tiny num" style={{marginTop:6}}>{l.cant} qq · {money(l.cant*l.precio)}</div>
        </div>
      ))}

      {/* No reconozco: queda pendiente para que Diana lo empareje en el sistema web. */}
      {grupoVivo==="desconoc" && desconoc.map((l,i)=>(
        <div key={i} className="card card-pad" style={{marginBottom:8,borderColor:"#B5432E"}}>
          <div className="sub tiny num">{l.codProv}</div>
          <div style={{fontWeight:600,fontSize:15,marginTop:2}}>{l.desc}</div>
          <div className="sub tiny" style={{marginTop:4}}>
            {l.cant} qq · {money(l.cant*l.precio)}</div>
          <div className="sub tiny" style={{marginTop:8,color:"#B5432E",fontWeight:600}}>
            Pendiente · el sistema web lo emparejará</div>
        </div>
      ))}

      {pendientes>0 && (
        <div className="card card-pad" style={{marginTop:4,background:"var(--maiz-suave)"}}>
          <div className="sub tiny" style={{lineHeight:1.5}}>
            {pendientes} línea{pendientes!==1?"s":""} quedará{pendientes!==1?"n":""} pendiente{pendientes!==1?"s":""} de emparejar.
            Tú solo subes la factura; el emparejamiento con el catálogo lo hace el sistema web.</div>
        </div>
      )}

      <div className="sec-gap" style={{height:16}} />
      <button className="btn btn-maiz" style={{width:"100%"}} onClick={cargar}>
        {pendientes
          ? `Cargar factura · ${pendientes} para el sistema web`
          : "Cargar la factura"}</button>
      <div className="sec-gap" style={{height:10}} />
      <button className="btn btn-ghost" style={{width:"100%"}}
        onClick={()=>{setXml(null);}}>Cancelar</button>
    </>)}

    <Aviso/>
  </>);
}

function NotasCredito({irTab}){
  const [ncs,setNcs]=useState(NC_INI);
  const [sel,setSel]=useState(null);
  const [nueva,setNueva]=useState(false);
  const [paso,setPaso]=useState(1);        // 1 tipo · 2 factura · 3 detalle · 4 comprobante
  const [tipo,setTipo]=useState("");       // devolucion | descuento
  const [fac,setFac]=useState(null);
  const [motivo,setMotivo]=useState("");
  const [detalle,setDetalle]=useState("");
  const [items,setItems]=useState([]);     // devolución: qué volvió
  const [monto,setMonto]=useState("");     // descuento: cuánto se baja
  const [numero,setNumero]=useState("");
  const [autoriz,setAutoriz]=useState("");
  const [aviso,setAviso]=useState("");
  /* Atrás: retrocede paso a paso dentro del alta; luego cierra el detalle. */
  useRetrocesoP(()=>{
    if(nueva){ if(paso>1){ setPaso(paso-1); return true; } reset(); return true; }
    if(sel){ setSel(null); return true; }
    return false;
  });
  /* Carga por XML: la NC tambien es comprobante electronico del SRI.
     Digitar a mano queda de respaldo. */
  const xmlRef=React.useRef(null);
  const alSubirNC=(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value="";
    if(!f) return;
    const lec=new FileReader();
    lec.onerror=()=>setAviso("No se pudo leer el archivo.");
    lec.onload=()=>{
      const r=leerComprobanteSRI(String(lec.result||""),"notaCredito");
      if(r.error){ setAviso(r.error); return; }
      if(comprobanteRepetido(r)){ setAviso("Esta nota de crédito ya fue registrada."); return; }
      const esDev=/DEVOL/i.test(r.motivo||"");
      setTipo(esDev?"devolucion":"descuento");
      setFac({num:r.docModificado||"", cli:r.cliente, ruc:r.clienteRuc, total:r.total});
      setMotivo(r.motivo||"");
      setMonto(String(r.total||""));
      setNumero(r.numero||"");
      setAutoriz(r.clave||"");
      setItems(esDev ? (r.lineas||[]).map(l=>({prod:l.desc, qq:String(l.cant||"")})) : []);
      setPaso(4);
      setAviso("Nota de crédito leída · revisa antes de guardar");
    };
    lec.readAsText(f);
  };
  const toast=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3600); };

  const r2=(n)=>Math.round(n*100)/100;
  const COMISION_QQ = 0.50;   // lo que gana el vendedor por quintal

  /* El total de la NC: en devolución sale de lo que volvió; en descuento lo escribe el proveedor. */
  const totalNC = tipo==="devolucion"
    ? r2(items.reduce((a,i)=>a + (parseFloat(i.qq)||0) * (parseFloat(i.precio)||0), 0))
    : r2(parseFloat(String(monto).replace(",","."))||0);

  /* La comisión se revierte en proporción a lo que baja la factura. */
  const pctNC = fac && fac.total>0 ? totalNC/fac.total : 0;
  const comisionRev = tipo==="devolucion"
    ? r2(items.reduce((a,i)=>a + (parseFloat(i.qq)||0) * COMISION_QQ, 0))
    : r2(pctNC * (fac ? fac.total/100*0.5 : 0));   // demo: la comisión real llega del backend
  const quedaFactura = fac ? r2(fac.total - totalNC) : 0;

  const sinConfirmar = ncs.filter(n=>!n.confirmada);
  const totalMes = ncs.reduce((a,n)=>a+n.total,0);
  const fCorta=(d)=>{
    if(!d) return "—";
    const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const p=String(d).slice(0,10).split("-");
    return `${parseInt(p[2])} ${M[parseInt(p[1])-1]}`;
  };
  const nuevoAu=()=>"AU-260720-"+Math.floor(1000+Math.random()*9000);
  const reset=()=>{ setNueva(false); setPaso(1); setTipo(""); setFac(null); setMotivo("");
                    setDetalle(""); setItems([]); setMonto(""); setNumero(""); setAutoriz(""); };

  const agregarItem=()=>setItems(p=>[...p,{prod:"",qq:"",precio:""}]);
  const cambiarItem=(i,k,v)=>setItems(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const quitarItem=(i)=>setItems(p=>p.filter((_,j)=>j!==i));

  const guardar=()=>{
    if(!numero.trim()){ toast("Escribe el número de la nota de crédito"); return; }
    const au=nuevoAu();
    const n={ id:"NC-"+String(ncs.length+1).padStart(3,"0"), numero:numero.trim(), tipo,
      factura:fac.num, cli:fac.cli, ruc:fac.ruc, fecha:"2026-07-20",
      motivo, detalle:detalle.trim(),
      items: tipo==="devolucion" ? items.filter(i=>i.prod && i.qq) : [],
      total: totalNC, comisionRevertida: comisionRev,
      autorizacion:autoriz.trim(), confirmada:!!autoriz.trim(), au };
    registrarComprobante({tipo:"notaCredito", clave:autoriz.trim(), numero:n.numero,
      cliente:n.cli, total:n.total, au});
    setNcs(p=>[n,...p]);
    reset();
    toast(`Nota de crédito registrada · la deuda de ${n.cli} baja ${money(n.total)} · ${au}`);
  };

  const confirmarSri=(n)=>{
    const au=nuevoAu();
    setNcs(p=>p.map(x=>x.id===n.id ? {...x, confirmada:true, au} : x));
    setSel(null);
    toast(`Confirmada en el SRI · ${au}`);
  };

  const Aviso = () => aviso ? (
    <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
      background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
      fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.35)",maxWidth:"88%"}}>{aviso}</div>
  ) : null;

  /* ── FICHA DE UNA NOTA DE CRÉDITO ── */
  if(sel){
    const n = ncs.find(x=>x.id===sel) || {};
    const f = FACTURAS_PROV.find(x=>x.num===n.factura) || {};
    const esDev = n.tipo==="devolucion";
    return (<>
      <div className="eyebrow">{esDev ? "Devolución" : "Descuento"}</div>
      <h1 className="h1">{n.cli}</h1>
      <div className="sub" style={{marginTop:4}}>N° {n.numero} · {fCorta(n.fecha)}</div>

      <div className="sec-gap" style={{height:16}} />
      <div className="hero">
        <div className="lbl">Le bajas de su deuda</div>
        <div className="big num">{money(n.total)}</div>
        <div className="split">
          <div><div className="k">Factura</div><div className="v num">{n.factura}</div></div>
          <div><div className="k">Era</div><div className="v num">{money(f.total||0)}</div></div>
          <div><div className="k">Queda en</div>
            <div className="v num" style={{color:"var(--maiz)"}}>{money((f.total||0)-n.total)}</div></div>
        </div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad">
        <div className="sub tiny">Motivo</div>
        <div style={{fontWeight:600,fontSize:15,marginTop:2}}>{n.motivo}</div>
        {n.detalle && <div className="sub tiny" style={{marginTop:6}}>{n.detalle}</div>}
      </div>

      {esDev && n.items && n.items.length>0 && (<>
        <div className="sec-gap" style={{height:12}} />
        <div className="card card-pad">
          <div className="sub tiny" style={{marginBottom:8}}>Producto que volvió</div>
          {n.items.map((it,i)=>(
            <div className="row between" key={i} style={{padding:"5px 0"}}>
              <span style={{fontSize:14}}>{it.prod}</span>
              <span className="num" style={{fontSize:14,fontWeight:600}}>
                {it.qq} qq · {money(it.qq*it.precio)}</span>
            </div>
          ))}
          <div className="sub tiny" style={{marginTop:8,lineHeight:1.5}}>
            Este producto vuelve a tu bodega: descuéntalo del despacho, no del stock vendido.</div>
        </div>
      </>)}

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad" style={{borderColor:"var(--maiz)"}}>
        <div className="row between" style={{padding:"4px 0"}}>
          <span className="sub tiny">Comisión que se revierte</span>
          <b className="num" style={{fontSize:15}}>− {money(n.comisionRevertida||0)}</b>
        </div>
        <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
          Si al vendedor ya se le pagó, se le descuenta del próximo corte. No se le pide devolver.</div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad" style={{borderColor: n.confirmada ? "#2E7D52" : "var(--maiz)"}}>
        <div style={{fontWeight:700,fontSize:14,color: n.confirmada ? "#2E7D52" : "var(--tinta)"}}>
          {n.confirmada ? "✓ Confirmada en el SRI" : "Falta confirmarla en el SRI"}</div>
        {n.confirmada && n.autorizacion
          ? <div className="sub tiny num" style={{marginTop:6,wordBreak:"break-all"}}>
              Autorización {n.autorizacion}</div>
          : <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
              La deuda del cliente ya bajó. Confírmala cuando el SRI la autorice.</div>}
        {n.au && <div className="sub tiny num" style={{marginTop:6}}>{n.au}</div>}
      </div>

      <div className="sec-gap" style={{height:16}} />
      {!n.confirmada && (<>
        <button className="btn btn-maiz" style={{width:"100%"}}
          onClick={()=>confirmarSri(n)}>Ya está confirmada en el SRI</button>
        <div className="sec-gap" style={{height:10}} />
      </>)}
      <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setSel(null)}>Volver</button>
      <Aviso/>
    </>);
  }

  /* ── LISTA ── */
  return (<>
    <div className="eyebrow">Cuando hay que bajarle la deuda</div>
    <h1 className="h1">Notas de crédito</h1>
    <div className="sub" style={{marginTop:4}}>
      Por devolución de producto o por descuento en el precio.</div>

    <div className="sec-gap" style={{height:16}} />
    <div className="hero">
      <div className="lbl">Emitido este mes</div>
      <div className="big num">{money(totalMes)}</div>
      <div className="split">
        <div><div className="k">Notas</div><div className="v num">{ncs.length}</div></div>
        <div><div className="k">Sin confirmar</div>
          <div className="v num" style={{color:sinConfirmar.length?"var(--maiz)":undefined}}>
            {sinConfirmar.length}</div></div>
      </div>
    </div>

    <div className="sec-gap" style={{height:14}} />
    <button className="btn btn-maiz" style={{width:"100%"}} onClick={()=>{reset();setNueva(true);}}>
      + Emitir una nota de crédito</button>

    <div className="sec-gap" />
    {ncs.length===0 && (
      <div className="card card-pad" style={{textAlign:"center"}}>
        <div className="sub">Aún no has emitido notas de crédito.</div>
      </div>
    )}
    {ncs.map(n=>(
      <button key={n.id} className="card card-pad" onClick={()=>setSel(n.id)}
        style={{width:"100%",textAlign:"left",marginBottom:10,
          borderColor:n.confirmada?"var(--linea)":"var(--maiz)"}}>
        <div className="row between">
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontWeight:600,fontSize:15,overflow:"hidden",
              textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.cli}</div>
            <div className="sub tiny">
              {n.tipo==="devolucion" ? "↩ Devolución" : "% Descuento"} · factura {n.factura}</div>
            <div className="sub tiny" style={{overflow:"hidden",
              textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.motivo}</div>
          </div>
          <b className="num" style={{fontSize:16,flexShrink:0,marginLeft:10}}>{money(n.total)}</b>
        </div>
      </button>
    ))}

    {/* alta: cuatro pasos, uno por pantalla */}
    {nueva && (
      <div className="scrim" onClick={reset}>
        <div className="sheet" onClick={e=>e.stopPropagation()}>

          {paso===1 && (<>
            <h3>¿Por qué le bajas la deuda?</h3>
            
            <button className="card card-pad" style={{width:"100%",textAlign:"left",marginBottom:10,
              borderColor:tipo==="devolucion"?"var(--maiz)":"var(--linea)"}}
              onClick={()=>{setTipo("devolucion");setMotivo("");}}>
              <div style={{fontWeight:600,fontSize:15}}>↩ Devolvió producto</div>
              <div className="sub tiny" style={{marginTop:3}}>
                Volvió mercadería a tu bodega</div>
            </button>
            <button className="card card-pad" style={{width:"100%",textAlign:"left",marginBottom:10,
              borderColor:tipo==="descuento"?"var(--maiz)":"var(--linea)"}}
              onClick={()=>{setTipo("descuento");setMotivo("");}}>
              <div style={{fontWeight:600,fontSize:15}}>% Descuento en el precio</div>
              <div className="sub tiny" style={{marginTop:3}}>
                No vuelve nada, solo baja el valor</div>
            </button>
            <button className="btn btn-maiz" style={{width:"100%",marginTop:8}}
              disabled={!tipo} onClick={()=>setPaso(2)}>Continuar</button>
            <div className="sec-gap" style={{height:14}} />
            <input ref={xmlRef} type="file" accept=".xml,text/xml,application/xml"
              style={{display:"none"}} onChange={alSubirNC} />
            <button className="btn btn-ghost" style={{width:"100%"}}
              onClick={()=>xmlRef.current&&xmlRef.current.click()}>
              📄 Subir el XML y evitar digitar</button>
            <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
              onClick={reset}>Cancelar</button>
          </>)}

          {paso===2 && (<>
            <h3>¿De qué factura?</h3>
            <div className="sub tiny" style={{margin:"6px 0 14px"}}>
              La nota de crédito corrige una factura ya emitida.</div>
            {FACTURAS_PROV.map(x=>(
              <button key={x.num} className="card card-pad"
                style={{width:"100%",textAlign:"left",marginBottom:8,
                  borderColor:fac&&fac.num===x.num?"var(--maiz)":"var(--linea)"}}
                onClick={()=>setFac(x)}>
                <div className="row between">
                  <div>
                    <div style={{fontWeight:600,fontSize:14}}>{x.cli}</div>
                    <div className="sub tiny">{x.num} · {fCorta(x.fecha)}</div>
                  </div>
                  <b className="num" style={{fontSize:15}}>{money(x.total)}</b>
                </div>
              </button>
            ))}
            <button className="btn btn-maiz" style={{width:"100%",marginTop:8}}
              disabled={!fac} onClick={()=>{ setPaso(3); if(tipo==="devolucion" && items.length===0) agregarItem(); }}>
              Continuar</button>
            <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
              onClick={()=>setPaso(1)}>Atrás</button>
          </>)}

          {paso===3 && (<>
            <h3>{tipo==="devolucion" ? "¿Qué te devolvió?" : "¿Cuánto le bajas?"}</h3>
            <div className="sub tiny" style={{margin:"6px 0 14px"}}>
              {fac.cli} · factura {fac.num} de {money(fac.total)}</div>

            <div className="sub tiny" style={{marginBottom:8}}>Motivo</div>
            {(tipo==="devolucion"?MOTIVOS_NC_DEV:MOTIVOS_NC_DESC).map(m=>(
              <button key={m} className="btn btn-ghost"
                style={{width:"100%",marginBottom:8,textAlign:"left",
                  fontWeight:motivo===m?700:500,
                  borderColor:motivo===m?"var(--maiz)":undefined}}
                onClick={()=>setMotivo(m)}>{motivo===m?"✓ ":""}{m}</button>
            ))}

            {tipo==="devolucion" ? (<>
              <div className="sub tiny" style={{margin:"14px 0 8px"}}>Producto que volvió</div>
              {items.map((it,i)=>(
                <div key={i} className="card card-pad" style={{marginBottom:8}}>
                  <input value={it.prod} onChange={e=>cambiarItem(i,"prod",e.target.value)}
                    placeholder="Producto · presentación"
                    style={{width:"100%",padding:"10px 12px",borderRadius:9,
                      border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit",marginBottom:8}}/>
                  <div className="row" style={{gap:8}}>
                    <input value={it.qq} inputMode="decimal"
                      onChange={e=>cambiarItem(i,"qq",e.target.value)} placeholder="Quintales"
                      style={{flex:1,padding:"10px 12px",borderRadius:9,
                        border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit"}}/>
                    <input value={it.precio} inputMode="decimal"
                      onChange={e=>cambiarItem(i,"precio",e.target.value)} placeholder="Precio"
                      style={{flex:1,padding:"10px 12px",borderRadius:9,
                        border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit"}}/>
                    {items.length>1 && (
                      <button className="btn btn-ghost" style={{padding:"10px 14px"}}
                        onClick={()=>quitarItem(i)}>×</button>
                    )}
                  </div>
                </div>
              ))}
              <button className="btn btn-ghost" style={{width:"100%",marginBottom:14}}
                onClick={agregarItem}>+ Otro producto</button>
            </>) : (<>
              <div className="sub tiny" style={{margin:"14px 0 6px"}}>Cuánto le bajas</div>
              <input value={monto} inputMode="decimal"
                onChange={e=>setMonto(e.target.value)} placeholder="0.00"
                style={{width:"100%",padding:"12px 14px",borderRadius:10,
                  border:"1px solid var(--linea)",fontSize:18,textAlign:"center",
                  fontFamily:"inherit",marginBottom:14}}/>

function Retenciones({irTab}){
  const [rets,setRets]=useState(RETENCIONES_INI);
  const [sel,setSel]=useState(null);
  const [nueva,setNueva]=useState(false);
  const [paso,setPaso]=useState(1);          // 1 factura · 2 porcentajes · 3 número
  const [fac,setFac]=useState(null);
  const [pRenta,setPRenta]=useState(0);
  const [pIva,setPIva]=useState(0);
  const [numero,setNumero]=useState("");
  const [autoriz,setAutoriz]=useState("");
  const [aviso,setAviso]=useState("");
  const [anulando,setAnulando]=useState(false);
  const [motRet,setMotRet]=useState("");
  const [notaRet,setNotaRet]=useState("");
  const [anuladasRet,setAnuladasRet]=useState(()=>leerAnulados(RET_ANULADAS_KEY).map(a=>a.id));
  /* Atrás: cierra el panel de anulación, retrocede paso a paso en el alta, luego cierra el detalle. */
  useRetrocesoP(()=>{
    if(anulando){ setAnulando(false); setMotRet(""); setNotaRet(""); return true; }
    if(nueva){ if(paso>1){ setPaso(paso-1); return true; } reset(); return true; }
    if(sel){ setSel(null); return true; }
    return false;
  });
  /* La retencion tambien es comprobante del SRI: se puede subir en vez de digitar. */
  const xmlRef=React.useRef(null);
  const alSubirRet=(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value="";
    if(!f) return;
    const lec=new FileReader();
    lec.onerror=()=>setAviso("No se pudo leer el archivo.");
    lec.onload=()=>{
      const r=leerComprobanteSRI(String(lec.result||""),"comprobanteRetencion");
      if(r.error){ setAviso(r.error); return; }
      if(comprobanteRepetido(r)){ setAviso("Esta retención ya fue registrada."); return; }
      const halla=FACTURAS_PROV.find(x=>x.num===r.docSustento);
      if(halla) setFac(halla);
      else if(r.docSustento) setFac({num:r.docSustento, cli:r.cliente, ruc:r.clienteRuc, total:0});
      const renta=(r.items||[]).find(x=>x.codigo==="1");
      const iva  =(r.items||[]).find(x=>x.codigo==="2");
      setPRenta(renta?renta.pct:0);
      setPIva(iva?iva.pct:0);
      setNumero(r.numero||"");
      setAutoriz(r.clave||"");
      setPaso(3);
      setAviso(`Retención leída · ${money(r.total)} retenido`);
    };
    lec.readAsText(f);
  };
  const toast=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3400); };

  const r2=(n)=>Math.round(n*100)/100;
  /* La retención de renta se calcula sobre la base imponible, no sobre el total con IVA.
     Los granos no gravan IVA, así que en esta línea base = total. */
  const baseRenta = fac ? fac.total : 0;
  const mRenta = r2(baseRenta * pRenta/100);
  const mIva   = 0;   // línea sin IVA: no hay retención de IVA que calcular
  const mTotal = r2(mRenta + mIva);
  const quedaPorCobrar = fac ? r2(fac.total - mTotal) : 0;

  const sinConfirmar = rets.filter(r=>!r.confirmada);
  const totalMes = rets.reduce((a,r)=>a+r.total,0);
  const fCorta=(d)=>{
    if(!d) return "—";
    const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const p=String(d).slice(0,10).split("-");
    return `${parseInt(p[2])} ${M[parseInt(p[1])-1]}`;
  };
  const nuevoAu=()=>"AU-260720-"+Math.floor(1000+Math.random()*9000);

  const reset=()=>{ setNueva(false); setPaso(1); setFac(null); setPRenta(0); setPIva(0);
                    setNumero(""); setAutoriz(""); };

  const guardar=()=>{
    if(!numero.trim()){ toast("Escribe el número del comprobante"); return; }
    const au=nuevoAu();
    const r={ id:"RT-"+String(rets.length+1).padStart(3,"0"), numero:numero.trim(),
      factura:fac.num, cli:fac.cli, ruc:fac.ruc, fecha:"2026-07-20",
      pctRenta:pRenta, pctIva:pIva, montoRenta:mRenta, montoIva:mIva, total:mTotal,
      autorizacion:autoriz.trim(), confirmada:!!autoriz.trim(), au };
    registrarComprobante({tipo:"comprobanteRetencion", clave:autoriz.trim(), numero:r.numero,
      cliente:r.cli, total:r.total, au});
    setRets(p=>[r,...p]);
    reset();
    toast(`Retención registrada · la cartera de ${r.cli} baja ${money(r.total)} · ${au}`);
  };

  const confirmarSri=(r)=>{
    const au=nuevoAu();
    setRets(p=>p.map(x=>x.id===r.id ? {...x, confirmada:true, au} : x));
    setSel(null);
    toast(`Confirmada en el SRI · ${au}`);
  };

  const Aviso = () => aviso ? (
    <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
      background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
      fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.35)",maxWidth:"88%"}}>{aviso}</div>
  ) : null;

  /* ── FICHA DE UNA RETENCIÓN ── */
  if(sel){
    const r = rets.find(x=>x.id===sel) || {};
    const f = FACTURAS_PROV.find(x=>x.num===r.factura) || {};
    return (<>
      <div className="eyebrow">Comprobante de retención</div>

      <div className="sub" style={{marginTop:4}}>N° {r.numero} · {fCorta(r.fecha)}</div>

      <div className="sec-gap" style={{height:16}} />
      <div className="hero">
        <div className="lbl">Le retuvieron</div>
        <div className="big num">{money(r.total)}</div>
        <div className="split">
          <div><div className="k">Factura</div><div className="v num">{r.factura}</div></div>
          <div><div className="k">Valor factura</div><div className="v num">{money(f.total||0)}</div></div>
          <div><div className="k">Queda por cobrar</div>
            <div className="v num" style={{color:"var(--maiz)"}}>{money((f.total||0)-r.total)}</div></div>
        </div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad">
        <div className="row between" style={{padding:"5px 0"}}>
          <span className="sub tiny">Retención de renta</span>
          <span className="num" style={{fontSize:14,fontWeight:600}}>
            {r.pctRenta}% · {money(r.montoRenta)}</span>
        </div>
        {r.montoIva>0 && (
          <div className="row between" style={{padding:"5px 0"}}>
            <span className="sub tiny">Retención de IVA</span>
            <span className="num" style={{fontSize:14,fontWeight:600}}>
              {r.pctIva}% · {money(r.montoIva)}</span>
          </div>
        )}
        <div className="row between" style={{padding:"5px 0"}}>
          <span className="sub tiny">RUC del cliente</span>
          <span className="num" style={{fontSize:14}}>{r.ruc}</span>
        </div>
        {r.au && (
          <div className="row between" style={{padding:"5px 0"}}>
            <span className="sub tiny">Auditoría</span>
            <span className="num sub tiny">{r.au}</span>

      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad" style={{borderColor: r.confirmada ? "#2E7D52" : "var(--maiz)"}}>
        <div style={{fontWeight:700,fontSize:14,color: r.confirmada ? "#2E7D52" : "var(--tinta)"}}>
