<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0E2A20" />
<title>FREELANCE · Proveedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="./lib/react-18.3.1.min.js"></script>
<script src="./lib/react-dom-18.3.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --tinta:#0E2A20;
  --tinta-2:#15392B;
  --maiz:#F2A900;
  --maiz-suave:#FBE9C0;
  --papel:#F6F4EF;
  --papel-2:#FFFFFF;
  --linea:#E6E1D6;
  --linea-2:#D6CFBE;
  --texto:#1C2620;
  --texto-2:#5C6660;
  --texto-3:#8C948D;
  --ok:#2E7D5B;
  --ok-suave:#DDF0E6;
  --espera:#C8841B;
  --espera-suave:#FBEFD4;
  --alerta:#B03A2E;
  --alerta-suave:#F6DEDA;
  --azul:#2C5B8A;
  --azul-suave:#DCE7F2;
  --sombra:0 1px 2px rgba(14,42,32,.06), 0 6px 18px rgba(14,42,32,.05);
  --sombra-alta:0 10px 40px rgba(14,42,32,.18);
  --r:18px;
}
/* ═══ TEMAS (Ajustes) ═══ Norma sellada: 4 temas. Campo es el de fábrica.
   Adaptados a las variables propias de esta app (--tinta / --papel / --maiz),
   que NO son las mismas de las apps de campo. */
[data-tema="sol"]{
  --tinta:#08251A; --tinta-2:#0F3325; --maiz:#F59E00; --maiz-suave:#FDECC4;
  --papel:#FFFFFF; --papel-2:#FFFFFF; --linea:#D6D2C4; --linea-2:#C2BCA9;
  --texto:#0A0F0C; --texto-2:#3D4742; --texto-3:#68716B;
  --ok:#1F6B41; --ok-suave:#D6EDE0; --espera:#B0710F; --espera-suave:#FBEDCE;
  --alerta:#9C3124; --alerta-suave:#F7DCD7; --azul:#20507E; --azul-suave:#D6E3F0;
  --sombra:0 1px 2px rgba(0,0,0,.10), 0 6px 18px rgba(0,0,0,.08);
  --sombra-alta:0 10px 40px rgba(0,0,0,.20);
}
[data-tema="noche"]{
  --tinta:#0B1712; --tinta-2:#13241C; --maiz:#E9B44C; --maiz-suave:#3A2F16;
  --papel:#111A15; --papel-2:#182420; --linea:#26332C; --linea-2:#33443A;
  --texto:#E6EDE8; --texto-2:#AEBDB4; --texto-3:#8A9990;
  --ok:#57A773; --ok-suave:#1B3A2A; --espera:#D9A441; --espera-suave:#3A2F16;
  --alerta:#D4674F; --alerta-suave:#3D211B; --azul:#6FA3D0; --azul-suave:#1C2C3B;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --sombra-alta:0 10px 40px rgba(0,0,0,.5);
}
[data-tema="arena"]{
  --tinta:#3F3119; --tinta-2:#544122; --maiz:#E0A82E; --maiz-suave:#F7E6C0;
  --papel:#FAF4E8; --papel-2:#FFFDF8; --linea:#E4DAC6; --linea-2:#D2C4A8;
  --texto:#241C0E; --texto-2:#5C5140; --texto-3:#867A66;
  --ok:#2E7D5B; --ok-suave:#DCEFE4; --espera:#B4801C; --espera-suave:#F7E9CC;
  --alerta:#A34A28; --alerta-suave:#F4DDD2; --azul:#2C5B8A; --azul-suave:#DCE7F2;
  --sombra:0 1px 2px rgba(74,59,34,.07), 0 8px 22px rgba(74,59,34,.07);
  --sombra-alta:0 10px 40px rgba(74,59,34,.20);
}

/* Grafito · gris neutro, sobrio */
[data-tema="grafito"]{
  --tinta:#22262A; --tinta-2:#2F353A; --maiz:#D9A441; --maiz-suave:#F5E6C6;
  --papel:#F4F5F6; --papel-2:#FFFFFF; --linea:#DFE3E6; --linea-2:#C9CFD4;
  --texto:#1A1E21; --texto-2:#4C555C; --texto-3:#6C757D;
  --ok:#2E7D52; --ok-suave:#DCEFE4; --espera:#B4801C; --espera-suave:#F7E9CC;
  --alerta:#B5613C; --alerta-suave:#F4DDD2; --azul:#2C5B8A; --azul-suave:#DCE7F2;
  --sombra:0 1px 2px rgba(20,25,30,.07), 0 8px 22px rgba(20,25,30,.07);
  --sombra-alta:0 10px 40px rgba(20,25,30,.20);
}
/* Brote · verde claro, fresco */
[data-tema="brote"]{
  --tinta:#2F6B4F; --tinta-2:#3D8461; --maiz:#F7CB72; --maiz-suave:#F8E7C2;
  --papel:#F4F8F5; --papel-2:#FFFFFF; --linea:#DCE8E0; --linea-2:#C6DED1;
  --texto:#17251E; --texto-2:#4A5C51; --texto-3:#66786D;
  --ok:#2E7D52; --ok-suave:#DCEFE4; --espera:#B4801C; --espera-suave:#F7E9CC;
  --alerta:#B5613C; --alerta-suave:#F4DDD2; --azul:#2C5B8A; --azul-suave:#DCE7F2;
  --sombra:0 1px 2px rgba(47,107,79,.06), 0 8px 22px rgba(47,107,79,.07);
  --sombra-alta:0 10px 40px rgba(47,107,79,.20);
}
/* Río · azul suave, tranquilo */
[data-tema="rio"]{
  --tinta:#1F4E6B; --tinta-2:#2C6688; --maiz:#EBB247; --maiz-suave:#F7E6C4;
  --papel:#F3F7FA; --papel-2:#FFFFFF; --linea:#D9E4EC; --linea-2:#C4DAE7;
  --texto:#14212A; --texto-2:#485A66; --texto-3:#647682;
  --ok:#2E7D52; --ok-suave:#DCEFE4; --espera:#B4801C; --espera-suave:#F7E9CC;
  --alerta:#B5613C; --alerta-suave:#F4DDD2; --azul:#2C5B8A; --azul-suave:#DCE7F2;
  --sombra:0 1px 2px rgba(31,78,107,.06), 0 8px 22px rgba(31,78,107,.07);
  --sombra-alta:0 10px 40px rgba(31,78,107,.20);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--papel);color:var(--texto);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.num{font-family:'Space Grotesk',monospace;font-feature-settings:"tnum" 1;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
::-webkit-scrollbar{display:none;}

#root{min-height:100vh;}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--papel);position:relative;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,.12);}

.top{background:var(--tinta);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;}
.top .rol{font-size:11px;color:var(--maiz);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.top .nombre{font-weight:600;font-size:15px;margin-top:1px;}
.top .avatar{margin-left:auto;width:40px;height:40px;border-radius:12px;background:var(--maiz);color:var(--tinta);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.top .navbtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1;flex-shrink:0;}
.top .navbtn:active{background:rgba(255,255,255,.2);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== Ajustes ===== */
.pest-aj{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
.pest-aj::-webkit-scrollbar{display:none;}
.pest-aj button{flex-shrink:0;background:var(--papel-2);border:1px solid var(--linea);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--texto-2);font-family:inherit;white-space:nowrap;}
.pest-aj button.on{background:var(--tinta);border-color:var(--tinta);color:#fff;}
.aj-sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texto-3);margin:14px 2px 8px;}
.aj-card{background:var(--papel-2);border:1px solid var(--linea);border-radius:15px;padding:13px 14px;
  box-shadow:var(--sombra);}
.aj-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;min-width:0;}
.aj-fila>span:first-child{font-size:13px;color:var(--texto-2);flex-shrink:0;}
.aj-fila b{font-size:13px;color:var(--texto);text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.aj-sub{font-size:11.5px;color:var(--texto-3);margin-top:2px;}
.aj-nota{font-size:11px;color:var(--texto-3);line-height:1.5;margin:10px 2px 0;}
.aj-pal{width:100%;display:flex;align-items:center;gap:11px;background:var(--papel-2);
  border:1px solid var(--linea);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  font-family:inherit;text-align:left;cursor:pointer;}
.aj-pal.on{border-color:var(--tinta);background:var(--papel);}
.aj-pal-m{display:flex;border-radius:9px;overflow:hidden;flex-shrink:0;border:1px solid var(--linea);}
.aj-pal-m span{width:19px;height:34px;display:block;}
.aj-pal-n{display:block;font-size:13.5px;font-weight:700;color:var(--texto);}
.aj-pal-d{display:block;font-size:11px;color:var(--texto-3);margin-top:1px;}
.aj-sw{width:46px;height:27px;border-radius:99px;background:var(--linea-2);position:relative;
  flex-shrink:0;border:none;transition:background .2s;cursor:pointer;}
.aj-sw.on{background:var(--ok);}
.aj-kn{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.aj-sw.on .aj-kn{transform:translateX(19px);}
.aj-btn{background:var(--papel);border:1px solid var(--linea);border-radius:10px;
  padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--tinta);font-family:inherit;
  flex-shrink:0;cursor:pointer;}
.cl-l{font-size:11.5px;font-weight:600;color:var(--texto-2);margin:10px 0 5px 2px;}
.cl-i{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--linea);border-radius:11px;
  font-family:inherit;font-size:14.5px;background:var(--papel-2);color:var(--texto);}
.cl-ojo{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:31px;height:31px;
  border:none;background:transparent;font-size:15px;opacity:.6;cursor:pointer;}
.cl-bar{height:5px;border-radius:99px;background:var(--linea);overflow:hidden;margin:7px 0 4px;}
.cl-bar i{display:block;height:100%;border-radius:99px;transition:width .25s ease;}
.cl-n{font-size:11px;font-weight:600;line-height:1.4;margin:0 2px;}
.ham{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);color:#fff;
  display:grid;place-items:center;font-size:19px;line-height:1;flex-shrink:0;font-weight:700;cursor:pointer;border:none;}
.ham:active{background:rgba(255,255,255,.2);}
.drawer-ov{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(0,0,0,0);visibility:hidden;z-index:1400;transition:background .25s;}
.drawer-ov.on{background:rgba(0,0,0,.45);visibility:visible;}
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--papel);
  transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;
  box-shadow:2px 0 22px rgba(0,0,0,.22);}
.drawer.on{transform:translateX(0);}
.drawer-head{background:var(--tinta);padding:18px 16px 16px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px;}
.drawer-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;
  border-radius:8px;font-size:17px;cursor:pointer;flex-shrink:0;}
.drawer-body{flex:1;overflow-y:auto;padding:14px 13px 20px;}
.drawer-it{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--linea);
  border-radius:13px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:inherit;text-align:left;}
.drawer-it:active{background:var(--papel);}
.di-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;}
.di-t{font-size:13.5px;font-weight:700;color:var(--texto-1,#1A2620);}
.di-s{font-size:11px;color:var(--texto-3);margin-top:1px;}
.di-a{color:var(--texto-3);font-size:15px;flex-shrink:0;}
.di-b{min-width:20px;height:20px;border-radius:10px;background:var(--maiz);color:var(--tinta);
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;flex-shrink:0;}
/* Acordeon del menu lateral: mismo patron de freelance-completo.
   Un solo grupo abierto a la vez; tocar el abierto lo cierra. */
.drawer-acc{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:12px 14px;
  margin-bottom:8px;font-size:13px;font-weight:700;color:var(--tinta);font-family:inherit;
  cursor:pointer;text-align:left;}
.drawer-acc.on{background:#E9EEE9;border-color:#CFE0D4;}
.drawer-acc-fl{font-size:11px;color:var(--texto-3);flex-shrink:0;}
.drawer-acc-n{min-width:18px;height:18px;border-radius:9px;background:var(--maiz);color:var(--tinta);
  font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;margin-left:auto;
  margin-right:8px;flex-shrink:0;}
.drawer-salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
  background:#FBE9E4;color:#B5613C;border:1px solid #E8C0B0;border-radius:13px;padding:13px;
  font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;}
/* Franja de pendientes del Inicio: 4 fichas fijas, sin scroll */
.pend-fr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pend-f{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;
  min-width:0;text-align:center;}
.pend-f:active{background:var(--papel);}
.pend-f.hay{border-color:var(--maiz);}
.pend-n{font-family:'Space Grotesk';font-weight:700;font-size:19px;line-height:1.1;color:var(--tinta);}
.pend-f.hay .pend-n{color:#B07A0C;}
.pend-l{font-size:9.5px;color:var(--texto-3);font-weight:600;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.alerta-banda{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#FCEBE7;
  border:1px solid #E8B4A6;border-left:4px solid #B5432E;border-radius:13px;padding:11px 13px;
  cursor:pointer;font-family:inherit;}
.scroll{flex:1;overflow-y:auto;padding:18px 16px 110px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-3);}
.h1{font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-.02em;margin:2px 0 0;}
.h2{font-family:'Space Grotesk';font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0;}
.sub{color:var(--texto-2);font-size:13.5px;line-height:1.45;}

.card{background:var(--papel-2);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);}
.card-pad{padding:16px;}
.row{display:flex;align-items:center;gap:12px;}
.between{justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.muted{color:var(--texto-2);}
.tiny{font-size:11.5px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--linea-2);color:var(--texto-2);}
.chip-ok{background:var(--ok-suave);color:#1E5B40;border-color:transparent;}
.chip-esp{background:var(--espera-suave);color:#8A5A12;border-color:transparent;}
.chip-al{background:var(--alerta-suave);color:#8A2A20;border-color:transparent;}
.chip-az{background:var(--azul-suave);color:#234A6E;border-color:transparent;}
.chip-maiz{background:var(--maiz-suave);color:#7A5400;border-color:transparent;}

.hero{background:linear-gradient(155deg,var(--tinta) 0%,var(--tinta-2) 100%);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--sombra-alta);}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,0,.28),transparent 70%);}
.hero .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600;}
.hero .big{font-family:'Space Grotesk';font-weight:700;font-size:38px;letter-spacing:-.02em;margin:4px 0 0;line-height:1;}
.hero .split{display:flex;gap:18px;margin-top:18px;}
.hero .split>div{flex:1;}
.hero .split .v{font-family:'Space Grotesk';font-weight:600;font-size:18px;margin-top:2px;}
.hero .split .k{font-size:11px;color:rgba(255,255,255,.6);}
.hr-line{height:1px;background:rgba(255,255,255,.14);margin:16px 0 0;}

.tile{background:var(--papel-2);border:1px solid var(--linea);border-radius:16px;padding:13px 14px;}
.tile .k{font-size:11.5px;color:var(--texto-2);font-weight:500;}
.tile .v{font-family:'Space Grotesk';font-weight:700;font-size:22px;margin-top:3px;letter-spacing:-.02em;}
.tile .d{font-size:11px;font-weight:600;margin-top:3px;}
.up{color:var(--ok);}.down{color:var(--alerta);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;padding:13px 16px;border-radius:14px;width:100%;transition:transform .06s ease;}
.btn:active{transform:scale(.985);}
.btn-maiz{background:var(--maiz);color:var(--tinta);}
.btn-tinta{background:var(--tinta);color:#fff;}
.btn-ghost{background:transparent;border:1.5px solid var(--linea-2);color:var(--texto);}
.btn-al{background:var(--alerta);color:#fff;}
.btn[disabled]{opacity:.45;}

.item{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--linea);}
.item:last-child{border-bottom:none;}
.ava{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:15px;flex-shrink:0;}
.ava-m{background:var(--maiz-suave);color:#7A5400;}
.bar{height:7px;border-radius:99px;background:var(--linea);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;}

.nav{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--linea);display:flex;z-index:40;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}

/* b364 · la barra se desliza fuera al leer y vuelve sola */

.nav{transition:transform .22s ease, opacity .18s ease}

.nav.baja{transform:translateY(120%);opacity:0;pointer-events:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--texto-3);position:relative;}
.nav button.on{color:var(--tinta);}
.nav .ico{font-size:21px;line-height:1;}
.nav .lab{font-size:10.5px;font-weight:600;}
.nav .badge{position:absolute;top:0;right:50%;transform:translateX(16px);background:var(--maiz);color:var(--tinta);font-family:'Space Grotesk';font-weight:700;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px;}

.scrim{position:fixed;inset:0;background:rgba(14,42,32,.5);z-index:50;display:flex;align-items:flex-end;max-width:430px;margin:0 auto;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}

/* ══ CLAVE (demo) ══ Solo hash, nunca texto plano. Anti-repetición de las últimas 3. */
const CLAVE_KEY_P = "freelance_clave_proveedor_v1";
function hashClaveP(txt){
  let h=2166136261; const t=String(txt||"");
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h,16777619); }
  return (h>>>0).toString(16).padStart(8,"0");
}
function historialClavesP(){
  try{ return JSON.parse(localStorage.getItem(CLAVE_KEY_P)||"[]"); }catch(e){ return []; }
}
function guardarClaveP(hash){
  const l=historialClavesP(); l.unshift(hash);
  try{ localStorage.setItem(CLAVE_KEY_P, JSON.stringify(l.slice(0,3))); }catch(e){}
}
function claveRepetidaP(txt){ return historialClavesP().indexOf(hashClaveP(txt))>=0; }
function fuerzaClaveP(txt){
  const t=String(txt||"");
  const largo=t.length>=8, letra=/[a-zA-Z]/.test(t), num=/[0-9]/.test(t);
  const extra=t.length>=12 && /[^a-zA-Z0-9]/.test(t);
  const falta=[];
  if(!largo) falta.push("8 caracteres");
  if(!letra) falta.push("una letra");
  if(!num)   falta.push("un número");
  const valida=largo&&letra&&num;
  let nivel=0; if(valida) nivel = extra?3:(t.length>=10?2:1);
  return { valida, nivel, falta,
    texto:["Muy débil","Aceptable","Buena","Fuerte"][nivel],
    color:["#B03A2E","#C8841B","#3F8F63","#2E7D5B"][nivel] };
}

/* ══ BIOMETRÍA REAL (WebAuthn) ══
   Antes esta app tenia una huella SIMULADA: esperaba 1.4s y decia "ok" sin verificar
   nada, y ademas solo aparecia DESPUES de escribir usuario y clave (no ahorraba el
   login, lo alargaba). Se reemplaza por WebAuthn de verdad, el mismo que ya usan
   Comisionista, socio-comercial y transportista: la credencial la custodia el
   telefono y permite entrar SIN escribir nada.
   Solo funciona en HTTPS (la app publicada); abriendo el archivo local no aparece. */
const HUELLA_KEY_P = "freelance_huella_proveedor_v1";
const puedeHuellaRealP = () => location.protocol === "https:" && !!window.PublicKeyCredential;
function huellaGuardadaP(){
  try { return JSON.parse(localStorage.getItem(HUELLA_KEY_P) || "null"); } catch(e){ return null; }
}
function guardarHuellaP(d){
  try { localStorage.setItem(HUELLA_KEY_P, JSON.stringify(d)); } catch(e){}
}
function borrarHuellaP(){ try { localStorage.removeItem(HUELLA_KEY_P); } catch(e){} }
function b64hP(buf){ return btoa(String.fromCharCode.apply(null, Array.from(new Uint8Array(buf)))); }
function deB64hP(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function retoAleatorioP(){ const a = new Uint8Array(32); crypto.getRandomValues(a); return a; }
async function crearHuellaP(usuario, nombre){
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: retoAleatorioP(),
      rp: { name: "FREELANCE", id: location.hostname },
      user: { id: new TextEncoder().encode(usuario), name: usuario, displayName: nombre || usuario },
      pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
      timeout: 60000, attestation: "none",
    }});
    return cred ? b64hP(cred.rawId) : null;
  } catch(e){ return null; }
}
async function verificarHuellaP(credId){
  try {
    const res = await navigator.credentials.get({ publicKey: {
      challenge: retoAleatorioP(),
      allowCredentials: [{ id: deB64hP(credId), type: "public-key", transports: ["internal"] }],
      userVerification: "required", timeout: 60000, rpId: location.hostname,
    }});
    return !!res;
  } catch(e){ return false; }
}

/* ═══════════════════════════════════════════════════════════════════════
   UNA SOLA SESIÓN POR CUENTA · un dispositivo a la vez (salvo el dueño)
   Decisión: «gana el último» — quien entra de nuevo cierra la sesión anterior.
   No aplica al freelance/admin (puede usar varios equipos): para él la base
   devuelve NULL y aquí no se activa ningún control.

   Cómo funciona, sin misterio:
   · Al entrar, se le pide a la base un «reclamar_sesion»: devuelve un id nuevo
     (o NULL si es el dueño). Ese id se guarda en el teléfono y en la base.
   · Si otro teléfono entra con la misma cuenta, la base cambia ese id. Esta app
     se entera (por Realtime o al reabrir/volver) y, como ya no coincide, cierra
     la sesión con un aviso claro.
   DEFENSIVO: si la base todavía no tiene la función/columna, `reclamar_sesion`
   no devuelve id, no se guarda nada y la app entra igual que siempre. Nunca
   deja a nadie afuera por esto. ═══════════════════════════════════════════ */
var SES_KEY_UNICA = "sesion_id_prov";
var SES_WATCH_UNICA = null, SES_VIS_UNICA = false;
function cerrarPorOtroDispositivo(){
  try{ localStorage.removeItem(SES_KEY_UNICA); }catch(e){}
  try{ if(SES_WATCH_UNICA && window.SB){ window.SB.removeChannel(SES_WATCH_UNICA); } }catch(e){}
  SES_WATCH_UNICA = null;
  try{ alert("Tu cuenta se abrió en otro dispositivo. Esta sesión se cerró."); }catch(e){}
  try{ if(window.SB && window.SB.auth){ window.SB.auth.signOut().then(()=>location.reload()).catch(()=>location.reload()); return; } }catch(e){}
  try{ location.reload(); }catch(e){}
}
async function chequearSesionUnica(){
  var local=null; try{ local=localStorage.getItem(SES_KEY_UNICA); }catch(e){}
  if(!local) return;
  try{
    const { data:s } = await window.SB.auth.getSession();
    const uid = s && s.session && s.session.user && s.session.user.id;
    if(!uid) return;
    const { data:f, error } = await window.SB.from("usuarios").select("sesion_id").eq("auth_uid", uid).maybeSingle();
    if(error) return;
    if(f && f.sesion_id && f.sesion_id !== local) cerrarPorOtroDispositivo();
  }catch(e){}
}
async function iniciarSesionUnica(){
  try{
    const { data, error } = await window.SB.rpc("reclamar_sesion");
    if(error || !data){ try{ localStorage.removeItem(SES_KEY_UNICA); }catch(e){} return; }
    try{ localStorage.setItem(SES_KEY_UNICA, data); }catch(e){}
    try{
      const { data:s } = await window.SB.auth.getSession();
      const uid = s && s.session && s.session.user && s.session.user.id;
      if(uid && !SES_WATCH_UNICA){
        SES_WATCH_UNICA = window.SB.channel("sesion_unica_"+uid)
          .on("postgres_changes", { event:"UPDATE", schema:"public", table:"usuarios", filter:"auth_uid=eq."+uid },
            (p)=>{ const nu = p && p.new && p.new.sesion_id; var loc=null; try{ loc=localStorage.getItem(SES_KEY_UNICA); }catch(e){}
                   if(loc && nu && nu !== loc) cerrarPorOtroDispositivo(); })
          .subscribe();
      }
    }catch(e){}
    try{ if(!SES_VIS_UNICA){ SES_VIS_UNICA=true; document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) chequearSesionUnica(); }); } }catch(e){}
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════════════
   UNA SOLA PUERTA (26 jul 2026 · decisión de Richard)

   Esta app ya no tiene ingreso propio. Antes traía usuarios y claves escritos
   dentro del archivo —y el archivo está publicado en internet, con la clave
   impresa en la propia pantalla—, más una entrada por huella que se compartía
   entre apps: la huella registrada en una servía para abrir otra y podía dar
   un rol que la persona no tenía.

   Ahora: se entra por el portal, con la cuenta de verdad. Si ya hay sesión
   abierta, esta pantalla ni se ve — la app entra sola, como siempre.
   ═══════════════════════════════════════════════════════════════════════ */
function PuertaPortal({ onAutenticado }){
  const [mirando, setMirando] = React.useState(true);
  /* PROVEEDOR_LOGIN_PROPIO · esta app tiene su propia llave de sesión (#125), así que
     necesita su propia puerta: correo + clave DENTRO de la app. El portal iniciaba sesión
     en la llave por defecto y esta app nunca la encontraba (se quedaba en el login). */
  const [correo, setCorreo] = React.useState("");
  const [clave, setClave]   = React.useState("");
  const [err, setErr]       = React.useState("");
  const [entrando, setEntrando] = React.useState(false);

  /* Comprueba la sesión de ESTA app (llave propia): si hay, lee el padrón y entra.
     Se reutiliza al arrancar y justo después del login del formulario. */
  const verificarSesion = React.useCallback(async ()=>{
    try{
      const { data:s } = await window.SB.auth.getSession();
      if(s && s.session){
        const { data:f } = await window.SB.from("usuarios")
          .select("usr_id,nombre,rol,activo").eq("auth_uid", s.session.user.id).maybeSingle();
        /* una cuenta dada de baja no entra, aunque su sesión siga viva */
        if(f && f.activo === false){ await window.SB.auth.signOut(); setErr("Tu cuenta está inactiva. Habla con el freelance."); setMirando(false); return false; }
        onAutenticado({
          nombre: (f && f.nombre) || s.session.user.email,
          codigo: (f && f.usr_id) || "",
          rol: (f && f.rol) || "",      /* el rol lo dice el padrón, no el código */
          zona: "Sesión real", real: true, correo: s.session.user.email,
        });
        try{ iniciarSesionUnica(); }catch(e){}
        return true;
      }
    }catch(e){}
    setMirando(false);
    return false;
  },[onAutenticado]);

  React.useEffect(()=>{ let vivo=true; (async()=>{ if(vivo) await verificarSesion(); })(); return ()=>{ vivo=false; }; },[verificarSesion]);

  const ingresar = async ()=>{
    const email=(correo||"").trim().toLowerCase();
    if(!email || !clave){ setErr("Escribe tu correo y tu clave."); return; }
    setErr(""); setEntrando(true);
    try{
      const { error } = await window.SB.auth.signInWithPassword({ email, password: clave });
      if(error){ setErr(/invalid|credential/i.test(error.message||"") ? "Correo o clave incorrectos." : (error.message||"No se pudo entrar.")); setEntrando(false); return; }
      /* login OK → la sesión quedó en la llave propia; volvemos a comprobar para entrar */
      setMirando(true);
      const ok = await verificarSesion();
      if(!ok) setEntrando(false);   /* p.ej. sin ficha en usuarios: verificarSesion ya mostró el form */
    }catch(e){ setErr("No se pudo entrar: revisa tu conexión."); setEntrando(false); }
  };

  const olvido = async ()=>{
    const email=(correo||"").trim().toLowerCase();
    if(!email){ setErr("Escribe tu correo arriba y toca otra vez «¿Olvidaste tu clave?»."); return; }
    try{ await window.SB.auth.resetPasswordForEmail(email); setErr(""); alert("Te enviamos un correo para restablecer tu clave (revisa también spam)."); }
    catch(e){ setErr("No se pudo enviar el correo de recuperación."); }
  };

  const caja = { maxWidth:340, margin:"0 auto", textAlign:"center", padding:"0 22px" };
  if(mirando) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"#123024",color:"#fff",fontFamily:"system-ui,sans-serif"}}>
      <div style={caja}><div style={{fontSize:15,opacity:.85}}>Un momento…</div></div>
    </div>
  );
  const inp = { width:"100%", boxSizing:"border-box", padding:"14px 15px", borderRadius:12,
    border:"1px solid rgba(255,255,255,.25)", background:"rgba(255,255,255,.10)", color:"#fff",
    fontSize:16, marginBottom:12, outline:"none" };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
      background:"linear-gradient(160deg,#123024,#1E5B3C)",color:"#fff",fontFamily:"system-ui,sans-serif"}}>
      <div style={caja}>
        <div style={{fontSize:44,marginBottom:10}}>🌾</div>
        <div style={{fontSize:26,fontWeight:800,letterSpacing:"-.02em",marginBottom:6}}>FREELANCE</div>
        <div style={{fontSize:14.5,lineHeight:1.55,opacity:.9,marginBottom:22}}>
          Ingresa con tu correo y tu clave.
        </div>
        <input type="email" value={correo} onChange={e=>setCorreo(e.target.value)}
          placeholder="Correo" autoCapitalize="none" autoCorrect="off" autoComplete="username"
          inputMode="email" style={inp}/>
        <input type="password" value={clave} onChange={e=>setClave(e.target.value)}
          placeholder="Clave" autoComplete="current-password" style={inp}
          onKeyDown={e=>{ if(e.key==="Enter") ingresar(); }}/>
        {err && <div style={{color:"#FFE0D8",background:"rgba(192,57,43,.28)",borderRadius:10,
          padding:"9px 11px",fontSize:13,marginBottom:12,lineHeight:1.4}}>{err}</div>}
        <button onClick={ingresar} disabled={entrando}
          style={{display:"block",width:"100%",background:"#F2A900",color:"#123024",fontWeight:800,
          fontSize:16,padding:"15px 18px",borderRadius:14,border:"none",cursor:"pointer",opacity:entrando?.6:1}}>
          {entrando ? "Entrando…" : "Ingresar"}</button>
        <button onClick={olvido} style={{marginTop:16,background:"none",border:"none",color:"#CFE6D8",
          fontSize:13.5,textDecoration:"underline",cursor:"pointer"}}>¿Olvidaste tu clave?</button>
      </div>
    </div>
  );
}

/* ══ FACTURAS YA CARGADAS (anti-duplicado) ══
   Una factura no se puede cargar dos veces: duplicaria la venta, la cartera del cliente
   y la comision del vendedor. Se controla en DOS niveles:
   · CLAVE DE ACCESO: los 49 digitos que el SRI da a cada comprobante. Es unica en el
     pais, asi que es la defensa buena — atrapa el mismo archivo aunque lo renombren.
   · NUMERO (estab-ptoEmi-secuencial): respaldo para archivos sin clave de acceso.
   En Fase 4 esta lista vive en Supabase con restriccion UNIQUE, y el control deja de
   depender del telefono. */
/* El mismo control sirve para NC, retenciones y guias: ninguna se registra dos veces. */
const COMPROB_KEY = "freelance_comprobantes_v1";
function comprobantesRegistrados(){
  try { return JSON.parse(localStorage.getItem(COMPROB_KEY) || "[]"); } catch(e){ return []; }
}
function registrarComprobante(c){
  const l = comprobantesRegistrados();
  l.unshift({ tipo:c.tipo||"", clave:c.clave||"", numero:c.numero||"",
    cliente:c.cliente||"", total:c.total||0,
    cuando:new Date().toISOString().slice(0,10), au:c.au||"" });
  try { localStorage.setItem(COMPROB_KEY, JSON.stringify(l.slice(0,300))); } catch(e){}
}
function comprobanteRepetido(c){
  const l = comprobantesRegistrados();
  if(c.clave)  { const p=l.find(x=>x.clave && x.clave===c.clave);                      if(p) return p; }
  if(c.numero) { const p=l.find(x=>x.tipo===c.tipo && x.numero && x.numero===c.numero); if(p) return p; }
  return null;
}

const FACTURAS_KEY = "freelance_facturas_cargadas_v1";

  l.unshift({ clave:f.clave||"", numero:f.numero||"", cliente:f.cliente||"",
    /* El RUC viene del XML y es lo unico que identifica al cliente sin equivocarse:

    clienteRuc:f.clienteRuc||"",

    cobrado:f.cobrado||0,

/* Devuelve la factura previa si ya se cargo, o null si es nueva. */
function facturaRepetida(f){
  const l = facturasCargadas();
  if(f.clave)  { const p = l.find(x=>x.clave && x.clave===f.clave);   if(p) return p; }

/* Segun la fecha de la factura decide la via legal correcta ante el SRI.
   Dentro de las 24h y sin cobros: se puede anular en linea.
   Fuera de ese plazo la unica via real es la Nota de Credito. */
function viaAnulacion(fechaFac, tieneCobros){
  let dias = 0;
  try {
    const p = String(fechaFac||"").split("/");
    const f = (p.length===3) ? new Date(+p[2], +p[1]-1, +p[0]) : new Date(fechaFac);
    dias = Math.floor((Date.now() - f.getTime())/86400000);
    if(!isFinite(dias) || dias<0) dias = 0;
  } catch(e){ dias = 0; }
  if(dias<=1 && !tieneCobros)
    return { via:"directa", dias, t:"Anulacion directa",
      d:"La factura es de hoy y no tiene cobros: se puede anular en linea en el portal del SRI." };
  return { via:"nc", dias, t:"Requiere Nota de credito",
    d:`La factura tiene ${dias} dia${dias!==1?"s":""}. El SRI ya no permite anularla en linea: la via correcta es emitir una Nota de credito.` };
}

    demo:!!a.demo,                         /* si nacio de la semilla, se va con ella */
    totalAnterior:a.totalAnterior||0,      /* el valor que tenia antes: no se pierde */
    motivo:a.motivo||"", nota:a.nota||"",
    via:a.via||"", cobros:a.cobros||0,     /* cuanto dinero hay que trasladar */
    destino:a.destino||"transito",         /* transito | numero de la factura nueva */
    saldoFavor:a.saldoFavor||0,
    cuando:new Date().toISOString().slice(0,10), au:a.au||""
  });
  guardarAnuladas(l);
}

/* ══ DINERO EN TRANSITO ══
   Cobros de facturas ANULADAS que todavia no se trasladan a la factura nueva.
   Es plata real del cliente parada, sin factura que la respalde: mientras no se
   cierre el traslado, la cartera del cliente miente. Solo el proveedor lo resuelve
   (el anulo). El Inicio lo muestra en banda ambar cuando existe. */
function dineroEnTransito(){
  const l = facturasAnuladas().filter(a=>a.destino==="transito" && (a.cobros||0)>0);
  return { casos:l.length, monto:l.reduce((a,x)=>a+(x.cobros||0),0), lista:l };
}
/* La banda del Inicio pide abrir la lista de facturas cargadas ya filtrada. */
let ABRIR_TRANSITO = false;

/* ══ SALDO A FAVOR DEL CLIENTE ══
   Sobrante de un cobro YA trasladado: la factura nueva valio menos que lo cobrado.
   Es plata del cliente que se quedo en la casa. Cada anulacion lo guarda por su lado,
   asi que aqui se junta POR CLIENTE: uno solo puede tener varias facturas anuladas y
   ver $30 aqui y $50 alla no sirve para devolverle nada.
   Se agrupa por RUC, no por nombre: el nombre se escribe distinto en cada factura y
   partiria el saldo del mismo cliente en dos.
   HOY solo se MUESTRA. Consumir el saldo contra una factura futura es cartera, y la
   cartera no vive en esta app: eso es Fase 4 con Supabase. */
function saldosAFavor(){
  const l = facturasAnuladas().filter(a=>a.destino!=="transito" && (a.saldoFavor||0)>0);
  const mapa = new Map();
  l.forEach(a=>{
    const id = a.clienteRuc || a.cliente || "s/n";
    const g = mapa.get(id) || { id, cliente:a.cliente||"Sin cliente", ruc:a.clienteRuc||"", monto:0, casos:[] };
    g.monto += (a.saldoFavor||0);
    if(!g.ruc && a.clienteRuc) g.ruc = a.clienteRuc;   /* si una factura vieja no traia RUC, sirve el de otra */
    g.casos.push(a);
    mapa.set(id, g);
  });
  const lista = Array.from(mapa.values()).sort((a,b)=>b.monto-a.monto);
  lista.forEach(g=>{ g.demo = g.casos.every(c=>c.demo); });   /* rotula solo si TODO el saldo es de prueba */
  return { clientes:lista.length, monto:lista.reduce((a,x)=>a+x.monto,0), lista };
}

/* ══ LECTOR DEL XML DEL SRI ══
   El archivo autorizado del SRI viene envuelto: la raiz es <autorizacion> y adentro,
   dentro de <comprobante>, viaja la factura como texto ESCAPADO (o en CDATA). Hay que
   desenvolverla antes de poder leer las lineas. Si el archivo ya es la factura directa
   (<factura> en la raiz), se lee tal cual.
   Nunca inventamos datos: lo que no se puede leer, se avisa. */
function textoDe(nodo, etiqueta){
  if(!nodo) return "";
  const e = nodo.getElementsByTagName(etiqueta)[0];
  return e ? (e.textContent||"").trim() : "";
}
/* Desenvuelve cualquier comprobante del SRI y devuelve su nodo raiz.
   Los 4 tipos son hermanos: <factura>, <notaCredito>, <comprobanteRetencion>,
   <guiaRemision>. Todos llegan escapados dentro de <comprobante> (o en CDATA). */
const TIPOS_SRI = {
  factura:              { etiqueta:"factura",              nombre:"Factura" },
  notaCredito:          { etiqueta:"notaCredito",           nombre:"Nota de crédito" },
  comprobanteRetencion: { etiqueta:"comprobanteRetencion",  nombre:"Retención" },
  guiaRemision:         { etiqueta:"guiaRemision",          nombre:"Guía de remisión" },
};
function desenvolverSRI(texto){
  const par = new DOMParser();
  let doc;
  try { doc = par.parseFromString(texto, "text/xml"); }
  catch(e){ return { error:"El archivo no es un XML válido." }; }
  if(!doc || doc.getElementsByTagName("parsererror").length)
    return { error:"El archivo no es un XML válido." };

  /* ══ VALIDACIÓN DE AUTORIZACIÓN DEL SRI ══
     Solo entran comprobantes AUTORIZADOS. El archivo autorizado viene envuelto en
     <autorizacion> con <estado>AUTORIZADO</estado>, su <numeroAutorizacion> y <fechaAutorizacion>.
     Si el estado no es AUTORIZADO, o si el archivo viene directo (<factura> sin envoltorio,
     es decir sin pasar por el SRI), se rechaza. La confirmación en vivo contra el SRI es Fase 4 (servidor). */
  const nodoAut = doc.getElementsByTagName("autorizacion")[0];
  let autorizacion = null;
  if(nodoAut){
    const estado = textoDe(nodoAut,"estado").toUpperCase();
    if(estado && estado !== "AUTORIZADO")
      return { error:"El comprobante no está AUTORIZADO por el SRI (estado: "+estado+"). Solo se aceptan documentos autorizados." };
    autorizacion = {
      numero: textoDe(nodoAut,"numeroAutorizacion"),
      fecha:  textoDe(nodoAut,"fechaAutorizacion"),
      estado: estado || "AUTORIZADO",
    };
  } else {
    return { error:"El archivo no viene autorizado por el SRI (falta el bloque de autorización). Sube el XML autorizado que te devolvió el SRI, no el generado antes de enviarlo." };
  }

  const buscar = (d)=>{
    for(const k in TIPOS_SRI){
      const n = d.getElementsByTagName(TIPOS_SRI[k].etiqueta)[0];
      if(n) return { tipo:k, nodo:n };
    }
    return null;
  };
  let hallado = buscar(doc);
  if(!hallado){
    const comp = doc.getElementsByTagName("comprobante")[0];
    if(comp){
      try{
        const dentro = par.parseFromString((comp.textContent||"").trim(), "text/xml");
        if(!dentro.getElementsByTagName("parsererror").length) hallado = buscar(dentro);
      }catch(e){}
    }
  }
  if(!hallado) return { error:"No se reconoce el tipo de comprobante del archivo." };
  return { ...hallado, autorizacion };
}
/* Datos que todos los comprobantes comparten (cabecera tributaria). */
function cabeceraSRI(nodo){
  const trib = nodo.getElementsByTagName("infoTributaria")[0];
  const est = textoDe(trib,"estab"), pto = textoDe(trib,"ptoEmi"), sec = textoDe(trib,"secuencial");
  return {
    numero: (est && pto && sec) ? (est+"-"+pto+"-"+sec) : "s/n",
    clave: textoDe(trib,"claveAcceso"),
    ruc: textoDe(trib,"ruc"),
    emisor: textoDe(trib,"razonSocial"),
  };
}
function fechaSRI(txt){
  const p = String(txt||"").split("/");
  return p.length===3 ? (p[2]+"-"+p[1]+"-"+p[0]) : String(txt||"");
}

/* ── NOTA DE CRÉDITO: qué factura corrige y por cuánto ── */
function leerNotaCreditoSRI(nodo){
  const c = cabeceraSRI(nodo);
  const info = nodo.getElementsByTagName("infoNotaCredito")[0];
  const lineas = [];
  const dets = nodo.getElementsByTagName("detalle");
  for(let i=0;i<dets.length;i++){
    const d = dets[i];
    const cod = textoDe(d,"codigoInterno") || textoDe(d,"codigoPrincipal") || textoDe(d,"codigoAdicional");
    const desc = textoDe(d,"descripcion");
    if(!cod && !desc) continue;
    lineas.push({ codProv: cod || "SIN-CODIGO", desc,
      cant: parseFloat(textoDe(d,"cantidad"))||0,
      precio: parseFloat(textoDe(d,"precioUnitario"))||0 });
  }
  return { tipo:"notaCredito", ...c,
    fecha: fechaSRI(textoDe(info,"fechaEmision")),
    cliente: textoDe(info,"razonSocialComprador") || "Cliente sin nombre",
    clienteRuc: textoDe(info,"identificacionComprador"),
    docModificado: textoDe(info,"numDocModificado"),   /* la factura que corrige */
    fechaModificado: fechaSRI(textoDe(info,"fechaEmisionDocSustento")),
    motivo: textoDe(info,"motivo"),
    total: parseFloat(textoDe(info,"valorModificacion"))||0,
    lineas };
}

/* ── RETENCIÓN: cuánto le retuvo el cliente y sobre qué factura ── */
function leerRetencionSRI(nodo){
  const c = cabeceraSRI(nodo);
  const info = nodo.getElementsByTagName("infoCompRetencion")[0];
  const items = [];
  const rets = nodo.getElementsByTagName("impuesto");
  for(let i=0;i<rets.length;i++){
    const r = rets[i];
    const cod = textoDe(r,"codigo");                      /* 1=renta, 2=IVA */
    const base = parseFloat(textoDe(r,"baseImponible"))||0;
    const pct  = parseFloat(textoDe(r,"porcentajeRetener"))||0;
    const val  = parseFloat(textoDe(r,"valorRetenido"))||0;
    const doc  = textoDe(r,"numDocSustento");
    if(!val && !pct) continue;
    items.push({ codigo:cod, clase: cod==="2" ? "IVA" : "Renta", base, pct, valor:val, docSustento:doc });
  }
  const total = items.reduce((a,x)=>a+x.valor,0);
  const docs = items.map(x=>x.docSustento).filter(Boolean);
  return { tipo:"comprobanteRetencion", ...c,
    fecha: fechaSRI(textoDe(info,"fechaEmision")),
    cliente: textoDe(info,"razonSocialSujetoRetenido") || "Cliente sin nombre",
    clienteRuc: textoDe(info,"identificacionSujetoRetenido"),
    docSustento: docs.length ? docs[0] : "",
    items, total };
}

/* ── GUÍA DE REMISIÓN: quién transporta, en qué placa y hacia dónde ── */
function leerGuiaSRI(nodo){
  const c = cabeceraSRI(nodo);
  const info = nodo.getElementsByTagName("infoGuiaRemision")[0];
  const destinos = [];
  const ds = nodo.getElementsByTagName("destinatario");
  for(let i=0;i<ds.length;i++){
    const d = ds[i];
    const lineas = [];
    const dets = d.getElementsByTagName("detalle");
    for(let k=0;k<dets.length;k++){
      const x = dets[k];
      const cod = textoDe(x,"codigoInterno") || textoDe(x,"codigoAdicional");
      const desc = textoDe(x,"descripcion");
      if(!cod && !desc) continue;
      lineas.push({ codProv: cod || "SIN-CODIGO", desc, cant: parseFloat(textoDe(x,"cantidad"))||0 });
    }
    destinos.push({
      cliente: textoDe(d,"razonSocialDestinatario") || "Destinatario sin nombre",
      clienteRuc: textoDe(d,"identificacionDestinatario"),
      direccion: textoDe(d,"dirDestinatario"),
      motivo: textoDe(d,"motivoTraslado"),
      docSustento: textoDe(d,"numDocSustento"),   /* la factura que ampara */
      lineas });
  }
  return { tipo:"guiaRemision", ...c,
    fecha: fechaSRI(textoDe(info,"fechaIniTransporte")),
    fechaFin: fechaSRI(textoDe(info,"fechaFinTransporte")),
    partida: textoDe(info,"dirPartida"),
    transportista: textoDe(info,"razonSocialTransportista"),
    transportistaRuc: textoDe(info,"rucTransportista"),
    placa: (textoDe(info,"placa")||"").toUpperCase(),
    destinos,
    cliente: destinos.length ? destinos[0].cliente : "Sin destinatario",
    total: 0 };
}

function leerFacturaSRI(texto){
  const env = desenvolverSRI(texto);
  if(env.error) return env;
  if(env.tipo !== "factura")
    return { error:"Este archivo es "+TIPOS_SRI[env.tipo].nombre+", no una factura." };
  const fac = env.nodo;

  const info = fac.getElementsByTagName("infoFactura")[0];
  const trib = fac.getElementsByTagName("infoTributaria")[0];

  /* 2) numero: estab-ptoEmi-secuencial */
  const est = textoDe(trib,"estab"), pto = textoDe(trib,"ptoEmi"), sec = textoDe(trib,"secuencial");
  const numero = (est && pto && sec) ? (est+"-"+pto+"-"+sec) : (textoDe(trib,"claveAcceso").slice(0,15) || "s/n");

  /* 3) fecha: el SRI la manda dd/mm/aaaa */
  let fecha = textoDe(info,"fechaEmision");
  const p = fecha.split("/");
  if(p.length===3) fecha = p[2]+"-"+p[1]+"-"+p[0];

  /* 4) lineas: codigoPrincipal es el codigo DEL PROVEEDOR (el que hay que emparejar) */
  const lineas = [];
  const dets = fac.getElementsByTagName("detalle");
  for(let i=0; i<dets.length; i++){
    const d = dets[i];
    const cod = textoDe(d,"codigoPrincipal") || textoDe(d,"codigoAuxiliar");
    const desc = textoDe(d,"descripcion");
    const cant = parseFloat(textoDe(d,"cantidad")) || 0;
    const precio = parseFloat(textoDe(d,"precioUnitario")) || 0;
    if(!cod && !desc) continue;
    lineas.push({ codProv: cod || "SIN-CODIGO", desc, cant, precio });
  }
  if(!lineas.length) return { error:"La factura no trae líneas de detalle." };

  return {
    numero, fecha,
    clave: textoDe(trib,"claveAcceso"),   /* 49 dígitos únicos en todo el país */
    ruc: textoDe(trib,"ruc"),
    cliente: textoDe(info,"razonSocialComprador") || "Cliente sin nombre",
    clienteRuc: textoDe(info,"identificacionComprador"),
    total: parseFloat(textoDe(info,"importeTotal")) || 0,
    autorizacion: env.autorizacion,   /* estado + número + fecha de autorización del SRI */
    lineas,
  };
}

/* Lee cualquier comprobante del SRI. Si se espera un tipo concreto y llega otro,
   se avisa claro en vez de intentar leerlo mal. */
function leerComprobanteSRI(texto, tipoEsperado){
  const env = desenvolverSRI(texto);
  if(env.error) return env;
  if(tipoEsperado && env.tipo !== tipoEsperado)
    return { error:"Subiste "+TIPOS_SRI[env.tipo].nombre+" y aquí va "+TIPOS_SRI[tipoEsperado].nombre+"." };
  let r;
  if(env.tipo==="notaCredito")               r = leerNotaCreditoSRI(env.nodo);
  else if(env.tipo==="comprobanteRetencion") r = leerRetencionSRI(env.nodo);
  else if(env.tipo==="guiaRemision")         r = leerGuiaSRI(env.nodo);
  else                                       return leerFacturaSRI(texto);
  if(env.tipo!=="guiaRemision" && !r.total && !(r.lineas||[]).length && !(r.items||[]).length)
    return { error:"El comprobante no trae valores para registrar." };
  return r;
}

/* Qué tan parecidas son dos descripciones: sirve para proponer, nunca para decidir solo. */
const parecido = (a,b) => {
  const lim = t => String(t||"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2);
  const A=lim(a), B=lim(b);
  if(!A.length || !B.length) return 0;
  const comunes = A.filter(w=>B.includes(w)).length;
  return Math.round(comunes / Math.max(A.length,B.length) * 100);
};

/* ══ AGRUPAR POR PRODUCTO ══
   Norma sellada: aceptado manda. La tarjeta lleva el estado de la presentación
   MÁS AVANZADA (aceptado > ofrecido > rechazado) y avisa si quedan pendientes.
   "desde" es el costo más bajo entre sus presentaciones. */
const ORDEN_ESTADO = { aceptado:0, ofrecido:1, rechazado:2 };
function agruparProd(filas){
  const mapa = new Map();
  filas.forEach(p=>{
    const k = p.prodId || p.id;
    if(!mapa.has(k)) mapa.set(k, { prodId:k, nombre:p.nombre, pres:[] });
    mapa.get(k).pres.push(p);
  });
  return [...mapa.values()].map(g=>{
    const orden = [...g.pres].sort((a,b)=>ORDEN_ESTADO[a.estado]-ORDEN_ESTADO[b.estado]);
    const estado = orden[0].estado;                       // aceptado manda
    const otros  = g.pres.filter(p=>p.estado!==estado).length;
    const bases  = g.pres.map(p=>p.base).filter(n=>n>0);
    return { ...g,
      estado,
      pendEstado: otros,                                   // presentaciones en otro estado
      desde: bases.length ? Math.min(...bases) : 0,
      unica: g.pres.length===1,
      propuestos: g.pres.filter(p=>p.propuesto!=null).length,
      stock: g.pres.reduce((a,p)=>a+(p.stock||0),0),
      promo: g.pres.some(p=>p.promo),
    };
  });
}

/* NOMBRE_CLIENTE_INTEGRIDAD · FUENTE ÚNICA del nombre del cliente para MOSTRAR (una sola verdad).
   Acepta el pedido {cli, razon, tipoCli, ruc} y la ficha de cliente {nombre, razon_social/
   razonSocial, tipo, ruc}. Reglas: jurídica si 3.er dígito del RUC 9/6, o tipo empresa/jurídica,
   o marca de empresa en la razón (S.A., S.A.S., Cía, Ltda, Compañía, Corp) → razón social;
   natural → primer nombre + primer apellido de la RAZÓN SOCIAL (3.ª palabra si hay 4+). SIEMPRE
   en MAYÚSCULAS. Misma lógica que el Sistema Web y las demás apps. */
function nombreClientePedido(p){
  if(!p) return "";
  const razon=String(p.razon||p.razonSocial||p.razon_social||"").trim();
  const comercial=String(p.cli||p.nombre||"").trim();
  const tipo=String(p.tipoCli||p.tipo||"");
  const ruc=String(p.ruc||"");
  const d3=ruc.length>=3?ruc.charAt(2):"";
  const rsUp=razon.toUpperCase().replace(/\./g,"");
  const juridica=d3==="9"||d3==="6"
    || /empres|jurid/i.test(tipo)
    || /\b(SA|SAS|CA|CIA|CÍA|LTDA|COMPANIA|COMPAÑIA|CORP)\b/.test(rsUp)
    || /(\bs\.?a\.?s?\b|\bc[ií]a\.?\b|\bltda\.?\b|compa[ñn][ií]a|\bcorp\b|s\.?a\.? de c\.?v)/i.test(razon);
  if(juridica) return (razon||comercial||"—").toUpperCase();
  const base=razon||comercial||"";
  const w=base.split(/\s+/).filter(Boolean);
  if(w.length<=1) return (base||"—").toUpperCase();
  return (w[0]+" "+(w.length>=4?w[2]:w[1])).toUpperCase();
}
async function vivoDecidir(){

    const mio = yo.prov_cod || null;   /* si el usuario es de una piladora, solo lo suyo */
    const [rp, ri, rc, rs, ro, rprod] = await Promise.all([
      window.SB.from("pedidos").select("*").order("creado",{ascending:false}).limit(300),
      window.SB.from("pedido_items").select("item_id,ped_id,descripcion,cantidad_qq,precio_usd,despachado_qq,gratis_qq,gratis_despachado_qq,tipo_precio,prod_id,pres_cod,promo_id,condicion,comision_usd,es_demo").limit(2000),
      window.SB.from("clientes").select("cli_id,nombre,razon_social,tipo").limit(2000),   /* NOMBRE_CLIENTE_INTEGRIDAD_3 · razon_social/tipo para el nombre canónico */
      window.SB.from("solicitudes").select("*").order("creado",{ascending:false}).limit(300),
      window.SB.from("ofertas_piladora").select("oferta_id,prod_id,prov_cod,pres_cod,presentacion,equiv_qq,precio_contado,precio_credito,activo,vigente_desde,vigente_hasta,es_demo").limit(3000),
      window.SB.from("productos").select("prod_id,nombre,estado").limit(1000),
    ]);
    /* NOMBRE_CLIENTE_INTEGRIDAD_3 · el índice guarda nombre + razón + tipo (no solo el comercial) */
    const nCli={}; ((rc&&rc.data)||[]).forEach(c=>{ nCli[c.cli_id]={nombre:c.nombre, razon:c.razon_social||null, tipoCli:c.tipo||null}; });
    const items=(ri&&ri.data)||[];
    const nomProd={}; ((rprod&&rprod.data)||[]).forEach(p=>{ if(p.estado==="activo") nomProd[p.prod_id]=p.nombre||p.prod_id; });
    const hoy=hoyECProveedor();
    const alternativas=((ro&&ro.data)||[]).filter(o=>o.activo!==false&&!o.es_demo&&nomProd[o.prod_id]
      &&(!mio||o.prov_cod===mio)
      &&(!o.vigente_desde||soloDia(o.vigente_desde)<=hoy)
      &&(!o.vigente_hasta||soloDia(o.vigente_hasta)>hoy))
      .map(o=>({ofertaId:o.oferta_id,prodId:o.prod_id,presCod:o.pres_cod,provCod:o.prov_cod,
        nombre:nomProd[o.prod_id],presentacion:o.presentacion||o.pres_cod,equiv:Number(o.equiv_qq)||1,
        precioContado:Number(o.precio_contado)||0,precioCredito:Number(o.precio_credito)||Number(o.precio_contado)||0}))
      .sort((a,b)=>(a.nombre+" "+a.presentacion).localeCompare(b.nombre+" "+b.presentacion));
    /* se incluye "anulado" a proposito: si no, la factura que acabas de anular
       desaparece de la lista al recargar y no queda constancia en pantalla de
       lo que hiciste. */
    let peds=((rp&&rp.data)||[]).filter(p=>p.estado==="enviado_proveedor" || p.estado==="facturado" || p.estado==="anulado");
    if(mio) peds=peds.filter(p=>p.prov_cod===mio);
    /* DISENO_LOGISTICA_DESPACHO_PARCIAL · líneas que la RUTA ACTIVA dejó fuera: NO se muestran al
       facturar (el servidor ya las rechaza; esto es solo para que la piladora no vea un producto
       "fantasma" que no puede despachar). Solo lectura. */
    const exclPorPed={};
    const pedIds=peds.map(p=>p.ped_id);
    if(pedIds.length){
      const rrp=await window.SB.from("ruta_pedidos")
        .select("ped_id,items_excluidos").in("ped_id",pedIds).eq("estado_asignacion","activo").limit(2000);
      (((rrp&&rrp.data))||[]).forEach(r=>{
        const ex=Array.isArray(r.items_excluidos)?r.items_excluidos:[];
        if(ex.length) exclPorPed[r.ped_id]=new Set(ex.map(String));
      });
    }
    const facturar=peds.map(p=>{
      const fuera=exclPorPed[p.ped_id]||null;   /* item_id que NO van en esta ruta */
      const its=items.filter(i=>i.ped_id===p.ped_id && !(fuera && fuera.has(String(i.item_id))));
      const qq=its.reduce((s,i)=>s+Number(i.cantidad_qq||0),0);
      const monto=its.reduce((s,i)=>s+Number(i.cantidad_qq||0)*Number(i.precio_usd||0),0);
      const _c=nCli[p.cli_id]||{};   /* NOMBRE_CLIENTE_INTEGRIDAD_3 · cliente crudo + razon/tipoCli para el nombre canónico */
      return { id:p.ped_id, cliente:_c.nombre||p.cli_id||"Cliente", razon:_c.razon||null, tipoCli:_c.tipoCli||null,
        detalle:(its.length?its[0].descripcion:"Pedido")+" · "+qq+" qq · "+(p.condicion==="contado"?"contado":"crédito"),
        monto, fecha:soloDia(p.creado),
        /* si aqui no se distingue "anulado", una factura anulada volveria a
           salir en ambar como "Por facturar" y alguien la volveria a facturar. */
        estado: p.estado==="facturado" ? "facturado" : p.estado==="anulado" ? "anulado" : "pendiente",
        factura:p.factura||null, demo:!!p.es_demo,
        /* la piladora del pedido: con ella se le pregunta a la base el tope del regalo */
        provCod:p.prov_cod||null, alternativas:alternativas.filter(a=>a.provCod===p.prov_cod),
        /* las líneas, para poder confirmar cuánto salió de cada producto.
           El regalo viaja completo: cuánto se prometió (gratis_qq), cuánto ya
           consta como entregado (gratis_despachado_qq: null = nadie se ha
           pronunciado, que NO es lo mismo que 0), y el tipo de precio
           (P3/P4/P6), que es el que dice DE QUIÉN es el costo del regalo. */
        lineas: its.map(i=>({ itemId:i.item_id, nombre:i.descripcion,
          pedido:Number(i.cantidad_qq||0), precio:Number(i.precio_usd||0),
          despachado: i.despachado_qq==null ? null : Number(i.despachado_qq),
          gratis:Number(i.gratis_qq||0),
          gratisDespachado: i.gratis_despachado_qq==null ? null : Number(i.gratis_despachado_qq),
          tipo:i.tipo_precio||null, prodId:i.prod_id||null,presCod:i.pres_cod||null,
          promoId:i.promo_id||null,condicion:i.condicion||p.condicion||null,
          comision:Number(i.comision_usd)||0,demo:!!i.es_demo })) };
    });
    let sols=((rs&&rs.data)||[]).filter(s=>s.destino==="proveedor");
    if(mio) sols=sols.filter(s=>!s.prov_cod || s.prov_cod===mio);
    const solics=sols.map(s=>({
      id:s.sol_id, tipo:TIPO_SOL_PROV[s.tipo]||("📌 "+(s.tipo||"Solicitud")),
      /* el tipo CRUDO y el pedido: sin ellos, una devolucion aceptada no se
         puede atar a la factura que hay que anular, y la cadena se corta justo
         en el paso que toca el dinero. */
      tipoRaw:s.tipo||"", pedId:s.ped_id||null,
      detalle:s.detalle||"", cliente:(nCli[s.cli_id]||{}).nombre||"—", fecha:soloDia(s.creado),
      estado:s.estado, motivoResp:s.motivo_resp||null, demo:!!s.es_demo,
    }));
    if(!facturar.length && !solics.length) return null;
    return { facturar, solics };
  }catch(e){ return null; }
}

/* ── LA NOTA DE CRÉDITO, DESPUÉS DE LA FACTURA ─────────────────────────
   Una devolución ya facturada se corrige con una nota de crédito POR
   PRODUCTO. Lo que decide si toca las comisiones NO es el motivo: es **de
   quién nació**. Si la piladora la hace por su cuenta, la absorbe ella y
   nadie del equipo pierde. Por eso el origen se pregunta siempre, y en
   palabras claras, no con un código. */
async function guardarNC({itemId, qq, valor, motivo, origen, numero}){
  try{
    const { data, error } = await window.SB.rpc("registrar_nc", {
      p_item:itemId, p_qq:Number(qq), p_valor:Number(valor),
      p_motivo:motivo, p_origen:origen, p_numero:numero||null });
    if(error) return { ok:false, motivo:error.message||"No se pudo registrar" };
    const r=(data&&data[0])||{};
    return { ok:true, aviso:r.aviso||"Nota de crédito registrada", estado:r.estado };
  }catch(e){ return { ok:false, motivo:String((e&&e.message)||e) }; }
}

/* ── LA CADENA DE LA DEVOLUCIÓN ────────────────────────────────────────
   Cuatro manos: el chofer reporta la novedad, el vendedor pide la devolución,
   la piladora la acepta, y solo entonces la piladora anula la factura.
   Aquí viven los dos últimos pasos.

   Ojo con la diferencia: una devolución NO se responde como las demás
   solicitudes. Las otras solo cambian su propio estado; esta abre la puerta a
   borrar una deuda de cartera y una comisión. Por eso va por su propia
   función de la base, que comprueba que la solicitud sea de esta piladora. */
async function resolverDevolucion(solId, aceptar, motivo){
  try{
    const { data, error } = await window.SB.rpc("resolver_devolucion", {
      p_sol_id:solId, p_aceptar:!!aceptar, p_motivo:motivo||"",
      p_op_id:(aceptar?"ACE-":"REC-")+solId });
    if(error) return { ok:false, motivo:error.message||"No se pudo responder" };
    return { ok:true, estado:data||(aceptar?"aprobada":"rechazada") };
  }catch(e){ return { ok:false, motivo:String((e&&e.message)||e) }; }
}

/* Anular NO es cambiar un estado: deshace las TRES cosas que nacieron al
   facturar —la deuda en cartera, la comisión del vendedor y el estado del
   pedido—. La base se niega si no hay devolución aceptada, si esa factura ya
   recibió dinero, o si la comisión ya se le pagó al vendedor. */
async function anularFacturaEnBase(pedId, motivo){
  try{
    const { data, error } = await window.SB.rpc("anular_factura", {
      p_ped_id:pedId, p_motivo:motivo||"", p_op_id:"ANU-"+pedId });
    if(error) return { ok:false, motivo:error.message||"No se pudo anular" };
    return { ok:true, estado:data||"anulado" };
  }catch(e){ return { ok:false, motivo:String((e&&e.message)||e) }; }
}

/* ── FACTURAR ES DECIR CUÁNTO SALIÓ ────────────────────────────────────
   Un pedido puede salir corto. Si la piladora solo teclea el número de
   factura, el sistema sigue creyendo que salió todo: le paga al vendedor
   comisión de quintales que nunca se cargaron y le cobra a Richard margen
   que no existió. Por eso al facturar se confirma producto por producto.
   Va en una sola llamada a la base: la factura y las cantidades juntas, o
   ninguna de las dos. */
/* ── EL REGALO SE CONFIRMA COMO LO VENDIDO ─────────────────────────────
   Los tres tipos de promoción salen físicamente de TU bodega, pero el costo
   lo absorbe uno distinto en cada caso, y eso se dice junto a cada regalo:
   P3 lo paga el vendedor con su comisión, P4 lo paga el freelance, P6 lo
   pagas tú. No es lo mismo regalar 2 qq que te van a pagar, que 2 qq que
   absorbes tú. Si el tipo no consta (líneas viejas), se dice que no consta:
   adivinar un bolsillo es peor que preguntar. */
function quienAsumeRegalo(tipo){
  if(tipo==="P3") return "te lo paga el vendedor: sale de su comisión";
  if(tipo==="P4") return "te lo paga el freelance";
  if(tipo==="P6") return "lo asumes tú: es tu promoción";
  return "no consta quién lo paga: confírmalo antes de despachar";
}

/* Cuánto regalo PUEDE salir, con lo que de verdad está saliendo. El número
   NO se calcula aquí: se le pregunta a `gratis_tope_al_despachar`, la MISMA
   función que usa la base al facturar. Si la app tuviera su propia fórmula,
   el día que una se corrija sin la otra la pantalla diría una cosa y el
   cerrojo otra. En despacho corto el regalo baja en proporción: pidieron
   100, salen 50, prometidos 2 → pueden salir 1.
   Devuelve: número = tope en qq · undefined = no se pudo preguntar (sin
   señal), y entonces la pantalla no bloquea a ciegas: manda el cerrojo de
   la base. */
async function topeRegaloAlDespachar({prodId, provCod, cantidadQq, despachadoQq, gratisQq, esDemo}){
  if(!window.SB || !window.SB.rpc) return undefined;
  try{
    const { data, error } = await window.SB.rpc("gratis_tope_al_despachar", {
      p_prod_id: prodId||null, p_prov_cod: provCod||null,
      p_cantidad_qq: Number(cantidadQq)||0, p_despachado_qq: Number(despachadoQq)||0,
      p_gratis_qq: Number(gratisQq)||0, p_es_demo: !!esDemo });
    if(error) return undefined;
    return (data===null || data===undefined) ? undefined : Number(data);
  }catch(e){ return undefined; }
}

async function guardarFactura(pedId, numero, lineas){
  try{
    const { data, error } = await window.SB.rpc("facturar_pedido", {
      p_ped: pedId, p_factura: numero,
      /* PROMO-02 · el regalo viaja JUNTO a lo vendido, en el mismo jsonb.
         La clave `gratis_despachado_qq` va solo si la piladora se pronunció;
         confirmar CERO es pronunciarse («no salió regalo»), así que el 0
         viaja como 0. Si no se pronunció, la clave no va y la base deja su
         constancia de regalo sin confirmar. */
      p_lineas: (lineas||[]).map(l=>{
        const fila = { item_id:l.itemId, despachado_qq:Number(l.despachado) };
        if(l.gratisDesp!==undefined && l.gratisDesp!==null) fila.gratis_despachado_qq = Number(l.gratisDesp);
        return fila;
      }),
    });
    if(error) return { ok:false, motivo:error.message||"No se pudo facturar" };
    const r=(data&&data[0])||{};
    return { ok:true, aviso:r.aviso||"Facturado", parcial:!!r.parcial };
  }catch(e){ return { ok:false, motivo:String((e&&e.message)||e) }; }
}
/* la respuesta a una solicitud queda guardada con su motivo y su fecha */
async function responderSolicitud(solId, estado, motivo){
  try{
    /* SOLIC_RPC · antes era UPDATE directo a la tabla (cualquier autenticado de la org
       resolvía lo que no le tocaba). Ahora va por el RPC, que valida rol y destino. La
       devolución se sigue ruteando aparte (resolverDevolucion, en aprobar/rechazar). */
    const opId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                 : ("RSL-"+solId+"-"+Date.now());
    const { error } = await window.SB.rpc("responder_solicitud", {
      p_sol_id: solId, p_aprueba: estado === "aprobada",
      p_motivo: motivo || null, p_op_id: opId });
    return !error;
  }catch(e){ return false; }
}
