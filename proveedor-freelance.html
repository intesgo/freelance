        {r.confirmada && r.autorizacion
          ? <div className="sub tiny num" style={{marginTop:6,wordBreak:"break-all"}}>
              Autorización {r.autorizacion}</div>
          : <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>
              Ya se descontó de la cartera del cliente. Confírmala cuando el SRI la autorice.</div>}
      </div>

      <div className="sec-gap" style={{height:16}} />
      {!r.confirmada && (
        <>
          <button className="btn btn-maiz" style={{width:"100%"}}
            onClick={()=>confirmarSri(r)}>Ya está confirmada en el SRI</button>
          <div className="sec-gap" style={{height:10}} />
        </>
      )}
      {anuladasRet.includes(r.id) ? (
        <div className="card card-pad" style={{borderColor:"#B5432E",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:14,color:"#B5432E"}}>✕ Retención anulada</div>
          <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>Queda registrada con su auditoría. La reversa en la cartera del cliente la aplica el sistema al sincronizar.</div>
        </div>
      ) : anulando ? (
        <div className="card card-pad" style={{borderColor:"#B5432E",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:8}}>¿Por qué se anula?</div>
          {ordUso("motivos_anular_ret", MOTIVOS_ANULAR_RET).map(m=>(
            <button key={m} className={"btn "+(motRet===m?"btn-maiz":"btn-ghost")} style={{width:"100%",marginBottom:8,textAlign:"left"}}
              onClick={()=>{ setMotRet(m); regUso("motivos_anular_ret", m); }}>{m}</button>
          ))}
          <textarea className="inp" rows={2} placeholder="Detalle (opcional)" value={notaRet}
            onChange={e=>setNotaRet(e.target.value)} style={{width:"100%",marginTop:4}} />
          <button className="btn btn-maiz" style={{width:"100%",marginTop:10}}
            onClick={()=>{
              if(!motRet){ toast("Elige el motivo de la anulación"); return; }
              const au=nuevoAuG();
              registrarAnulDoc(RET_ANULADAS_KEY,{ id:r.id, numero:r.numero, cliente:r.cli, total:r.total, motivo:motRet, nota:notaRet.trim(), au });
              setAnuladasRet(a=>[...a, r.id]); setAnulando(false); setMotRet(""); setNotaRet("");
              toast(`Retención ${r.numero} anulada · ${au}`);
            }}>Anular la retención</button>
          <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
            onClick={()=>{ setAnulando(false); setMotRet(""); setNotaRet(""); }}>Cancelar</button>
        </div>
      ) : (
        <button className="btn btn-ghost" style={{width:"100%",marginBottom:10,color:"#B5432E"}}
          onClick={()=>setAnulando(true)}>Anular retención</button>
      )}
      <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setSel(null)}>Volver</button>
      <Aviso/>
    </>);
  }

  /* ── LISTA ── */
  return (<>
    <div className="eyebrow">Lo que el cliente retiene para el SRI</div>
    <h1 className="h1">Retenciones</h1>
    <div className="sub" style={{marginTop:4}}>
      Bajan la deuda del cliente sin ser un cobro: ese dinero se fue al Estado.</div>

    <div className="sec-gap" style={{height:16}} />
    <div className="hero">
      <div className="lbl">Retenido este mes</div>
      <div className="big num">{money(totalMes)}</div>
      <div className="split">
        <div><div className="k">Comprobantes</div><div className="v num">{rets.length}</div></div>
        <div><div className="k">Sin confirmar</div>
          <div className="v num" style={{color:sinConfirmar.length?"var(--maiz)":undefined}}>
            {sinConfirmar.length}</div></div>
      </div>
    </div>

    <div className="sec-gap" style={{height:14}} />
    <button className="btn btn-maiz" style={{width:"100%"}} onClick={()=>{reset();setNueva(true);}}>
      + Registrar una retención</button>

    <div className="sec-gap" />
    {rets.length===0 && (
      <div className="card card-pad" style={{textAlign:"center"}}>
        <div className="sub">Aún no has registrado retenciones.</div>
      </div>

    {rets.map(r=>(

        <div className="row between">
          <div style={{minWidth:0,flex:1}}>

              textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.cli}</div>
            <div className="sub tiny">N° {r.numero} · factura {r.factura}</div>
            <div className="sub tiny" style={{color:r.confirmada?"#2E7D52":"var(--tinta)",
              fontWeight:600,marginTop:3}}>

          </div>

    {/* alta: tres pasos, uno por pantalla */}
    {nueva && (

        <div className="sheet" onClick={e=>e.stopPropagation()}>

function CuentasBancarias({irTab}){
  const [cuentas,setCuentas]=useState(CUENTAS_INI);
  const [sel,setSel]=useState(null);        // cuenta abierta
  const [nueva,setNueva]=useState(false);
  const [f,setF]=useState({banco:"",tipo:"Corriente",ult4:"",titular:PROVEEDOR.nombre,
                           ruc:"",dep:true,tra:true});
  const [aviso,setAviso]=useState("");
  /* Atrás: cierra el alta o el detalle antes de salir del módulo. */
  useRetrocesoP(()=>{
    if(nueva){ setNueva(false); return true; }
    if(sel){ setSel(null); return true; }
    return false;
  });
  const toast=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3200); };

  const HOY="2026-07-20";
  const vigente=(c)=> c.activa && (!c.hasta || c.hasta>=HOY);
  const activas =cuentas.filter(vigente);
  const cerradas=cuentas.filter(c=>!vigente(c));
  const fCorta=(d)=>{
    if(!d) return "sin fecha de fin";
    const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    const p=String(d).slice(0,10).split("-");
    return `${parseInt(p[2])} ${M[parseInt(p[1])-1]} ${p[0]}`;
  };
  const nuevoAu=()=>"AU-260720-"+Math.floor(1000+Math.random()*9000);

  const guardar=()=>{
    if(!f.banco){ toast("Elige el banco"); return; }
    if(f.ult4.replace(/\D/g,"").length!==4){ toast("Escribe los 4 últimos dígitos"); return; }
    if(!f.dep && !f.tra){ toast("Marca al menos una operación"); return; }
    const ops=[]; if(f.dep) ops.push("Depósito"); if(f.tra) ops.push("Transferencia");

        </div>
        <div className="row between" style={{padding:"5px 0"}}>
          <span className="sub tiny">Se puede usar para</span>
          <span style={{fontSize:14,fontWeight:600,textAlign:"right"}}>

        </div>
        {c.au && (

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad">
        
      </div>

      {viva

      <Aviso/>

  }

  /* ── LISTA ── */
  return (<>
    <div className="eyebrow">Dónde te pueden depositar</div>

    <div className="sec-gap" style={{height:16}} />
    {activas.length===0 && (

    <div className="sec-gap" style={{height:6}} />

    {cerradas.length>0 && (<>
      <div className="sec-gap" />

    {/* alta de cuenta */}
    {nueva && (
      <div className="scrim" onClick={()=>setNueva(false)}>
        <div className="sheet" onClick={e=>e.stopPropagation()}>

              border:"1px solid var(--linea)",fontSize:18,textAlign:"center",

          <div className="sub tiny" style={{marginBottom:6}}>Titular</div>
          <input value={f.titular} onChange={e=>setF({...f,titular:e.target.value})}
            style={{width:"100%",padding:"12px 14px",borderRadius:10,
              border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit",marginBottom:12}}/>

          <div className="sub tiny" style={{marginBottom:6}}>RUC (opcional)</div>
          <input value={f.ruc} inputMode="numeric"
            onChange={e=>setF({...f,ruc:e.target.value.replace(/\D/g,"")})}
            placeholder="0991234567001"
            style={{width:"100%",padding:"12px 14px",borderRadius:10,
              border:"1px solid var(--linea)",fontSize:14,fontFamily:"inherit",marginBottom:12}}/>

          <div className="sub tiny" style={{marginBottom:6}}>Se puede usar para</div>
          <div className="row" style={{gap:10,marginBottom:16}}>
            <button className="btn btn-ghost" style={{flex:1,
              borderColor:f.dep?"var(--maiz)":undefined,fontWeight:f.dep?700:500}}

            <button className="btn btn-ghost" style={{flex:1,
              borderColor:f.tra?"var(--maiz)":undefined,fontWeight:f.tra?700:500}}
              onClick={()=>setF({...f,tra:!f.tra})}>{f.tra?"✓ ":""}Transferencia</button>
          </div>

          <button className="btn btn-maiz" style={{width:"100%"}} onClick={guardar}>
            Autorizar cuenta</button>
          <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
            onClick={()=>setNueva(false)}>Cancelar</button>
        </div>
      </div>
    )}
    <Aviso/>
  </>);
}

/* ══ GUÍAS DE REMISIÓN ══
   Las emite el PROVEEDOR (factura y despacha directo al cliente). Aquí solo se cargan:
   nunca se emiten, porque emitir un comprobante electrónico exige firma digital y
   conexión con el SRI. La guía ampara la mercadería en tránsito: si el SRI para el
   camión y no está, la carga puede ser retenida.
   Un camión puede llevar carga de varios proveedores: son VARIAS guías por viaje,
   una por cada emisor. */
const GUIAS_INI = [];
/* ══ AJUSTES DEL PROVEEDOR ══
   5 pestañas: sin Impresora — el proveedor no imprime en campo, factura en su sistema. */
/* ═════ b42 · Perfil de negocio (estructura de Richard, 25 jul 2026) ═════
   Tres tarjetas: 1) Datos de la Piladora  2) Colaboradores  3) Con el Freelance.
   Con sesión real (portal): datos vivos de la base. Mientras las piladoras no
   tengan cuenta propia, un selector temporal permite elegir cuál piladora ver.
   Sin sesión: demostración rotulada. */
/* ═════ b47 · Avisos al teléfono (canal push del sistema) ═════
   Con sesión del portal, este teléfono queda suscrito al canal y recibe los
   avisos que le tocan por su rol, aunque la app esté cerrada. */
const VAPID_PUBLICA = "BH6rClWELQLw7218YApJHAanTLkyL6NZ230pYsTnkrbv8EEBsVg-3IjoYm_8c0LzyfmMuSvqOI6AGWSaFPp6y7Y";
function b64aUint8(b64){
  const p = "=".repeat((4 - b64.length % 4) % 4);
  const s = (b64 + p).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(s);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function TarjetaAvisosTelefono({ avisar }){
  const [estado,setEstado]=useState("cargando");
  const [correo,setCorreo]=useState(null);
  const [ocupado,setOcupado]=useState(false);
  React.useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        if(!("serviceWorker" in navigator) || !("PushManager" in window) || location.protocol!=="https:"){
          if(vivo) setEstado("no-soporta"); return;
        }
        if(window.SB){
          const { data } = await window.SB.auth.getSession();
          if(vivo && data && data.session) setCorreo(data.session.user.email);
        }
        const reg = await navigator.serviceWorker.ready;
        const sus = await reg.pushManager.getSubscription();
        if(vivo) setEstado(sus ? "activo" : "apagado");
      }catch(e){ if(vivo) setEstado("no-soporta"); }
    })();
    return ()=>{ vivo=false; };
  },[]);
  const activar=async()=>{
    if(ocupado) return;
    if(!correo){ avisar("Entra con tu cuenta (portal) para activar los avisos."); return; }
    setOcupado(true);
    try{
      const permiso = await Notification.requestPermission();
      if(permiso!=="granted"){ avisar("Sin permiso de avisos: actívalo en los ajustes del teléfono."); setOcupado(false); return; }
      const reg = await navigator.serviceWorker.ready;
      let sus = await reg.pushManager.getSubscription();
      if(!sus) sus = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64aUint8(VAPID_PUBLICA) });
      const j = sus.toJSON();
      let quien = {};
      try{
        const { data:s2 } = await window.SB.auth.getSession();
        const { data:u } = await window.SB.from("usuarios").select("usr_id,rol").eq("auth_uid", s2.session.user.id).maybeSingle();
        if(u) quien = { rol:u.rol, usr_id:u.usr_id };
      }catch(e){}
      const { error } = await window.SB.from("push_suscripciones").upsert(
        { sus_id:"PS-"+new Date().getTime(), usuario:correo, endpoint:j.endpoint,
          p256dh:j.keys.p256dh, auth:j.keys.auth, activo:true, ...quien },
        { onConflict:"endpoint" });
      if(error){ avisar("No se pudo registrar: "+(error.message||"error")); setOcupado(false); return; }
      setEstado("activo");
      avisar("Avisos activados en este teléfono ✓");
    }catch(e){ avisar("No se pudo activar: "+(e.message||"error")); }
    setOcupado(false);
  };
  const apagar=async()=>{
    if(ocupado) return;
    setOcupado(true);
    try{
      const reg = await navigator.serviceWorker.ready;
      const sus = await reg.pushManager.getSubscription();
      if(sus){
        const ep = sus.endpoint;
        await sus.unsubscribe();
        try{ await window.SB.from("push_suscripciones").update({activo:false}).eq("endpoint", ep); }catch(e){}
      }
      setEstado("apagado");
      avisar("Avisos apagados en este teléfono");
    }catch(e){ avisar("No se pudo apagar."); }
    setOcupado(false);
  };
  const probar=async()=>{
    if(ocupado) return;
    setOcupado(true);
    try{
      const { data, error } = await window.SB.functions.invoke("empujar-avisos", { body:{ modo:"prueba" } });
      if(error) avisar("No se pudo probar: "+(error.message||"error"));
      else if(data && data.enviados>0) avisar("Aviso de prueba enviado ✓ Mira la bandeja del teléfono.");
      else avisar((data&&data.motivo) || "No llegó a ningún teléfono.");
    }catch(e){ avisar("No se pudo probar el aviso."); }
    setOcupado(false);
  };
  return (
    <div className="aj-card" style={{marginBottom:14}}>
      <div className="aj-fila" style={{alignItems:"flex-start"}}>
        <div style={{flex:1,minWidth:0,paddingRight:10}}>
          <div style={{fontWeight:700,fontSize:13.5}}>📳 Avisos en este teléfono</div>
          <div className="aj-sub">
            {estado==="cargando" ? "Comprobando…"
             : estado==="no-soporta" ? "Disponible en la app instalada (HTTPS)"
             : estado==="activo" ? "Suena aunque la app esté cerrada"
             : "Actívalos y el teléfono avisará aunque la app esté cerrada"}</div>
        </div>
        {(estado==="activo"||estado==="apagado") && (
          <button className={"aj-sw"+(estado==="activo"?" on":"")} disabled={ocupado}
            onClick={()=>{ estado==="activo" ? apagar() : activar(); }}><span className="aj-kn"></span></button>
        )}
      </div>
      {estado==="activo" && (
        <button className="btn btn-ghost" style={{width:"100%",marginTop:8}} disabled={ocupado}
          onClick={probar}>🔔 Probar aviso ahora</button>
      )}
    </div>
  );
}

/* ═════ CHAT DEL EQUIPO · pantalla para las apps del celular ═════
   Conversaciones reales entre las personas del padrón (misma tabla que el
   sistema web, chat_mensajes). Llegan en tiempo real, con fotos y audios en
   depósito privado. Sin sesión, la pantalla lo dice con honestidad.
   Estilos en línea a propósito: así se ve igual en las 5 apps. */
function ChatEquipo({ usuario, toast }){
  const [miUsr,setMiUsr]=useState(null);
  const [contactos,setContactos]=useState([]);
  const [msgs,setMsgs]=useState([]);
  const [sel,setSel]=useState(null);
  const [txt,setTxt]=useState("");
  const [estado,setEstado]=useState("cargando");   /* cargando | vivo | sin-sesion */
  const [grabando,setGrabando]=useState(false);
  const [enviando,setEnviando]=useState(false);
  const recRef=React.useRef(null), iniRef=React.useRef(0), hiloRef=React.useRef(null);
  const ICONO={ freelance:"🌾", admin:"🛡️", comisionista:"🧑‍💼", socio:"🤝",
    proveedor:"🏭", transportista:"🚛", logistica:"🗺️", financiero:"🧮" };
  const ROL={ freelance:"Freelance", admin:"Administración", comisionista:"Comisionista",
    socio:"Socio comercial", proveedor:"Proveedor", transportista:"Transportista",
    logistica:"Logística", financiero:"Contadora" };
  const traducir=(m,yo)=>({ id:m.msg_id, con: m.de_usr===yo ? m.para_usr : m.de_usr,
    mio: m.de_usr===yo, aviso: m.tipo==="aviso", tipo:m.tipo, texto:m.texto||"",
    adjunto:m.adjunto||null, hora:String(m.creado||"").slice(11,16),
    fecha:String(m.creado||"").slice(0,10), leido:!!m.leido });

  React.useEffect(()=>{
    let vivo=true, canal=null;
    (async()=>{
      try{
        if(!window.SB){ if(vivo) setEstado("sin-sesion"); return; }
        const { data:s } = await window.SB.auth.getSession();
        if(!vivo) return;
        if(!s || !s.session){ setEstado("sin-sesion"); return; }
        const { data:yo } = await window.SB.from("usuarios").select("usr_id").eq("auth_uid", s.session.user.id).maybeSingle();
        if(!vivo) return;
        if(!yo){ setEstado("sin-sesion"); return; }
        setMiUsr(yo.usr_id);
        const [{ data:us }, { data:ms }] = await Promise.all([
          window.SB.from("usuarios").select("usr_id,nombre,rol,activo").neq("usr_id", yo.usr_id),
          window.SB.from("chat_mensajes").select("*").order("creado").limit(400),
        ]);
        if(!vivo) return;
        setContactos((us||[]).filter(u=>u.activo!==false).map(u=>({
          id:u.usr_id, nombre:u.nombre, rol:ROL[u.rol]||u.rol, ico:ICONO[u.rol]||"👤" })));
        setMsgs((ms||[]).map(m=>traducir(m, yo.usr_id)));
        setEstado("vivo");
        canal = window.SB.channel("chat-app")
          .on("postgres_changes", { event:"INSERT", schema:"public", table:"chat_mensajes" },
            (ev)=>{ const m=traducir(ev.new, yo.usr_id);
              setMsgs(prev => prev.some(x=>x.id===m.id) ? prev : [...prev, m]); })
          .subscribe();
      }catch(e){ if(vivo) setEstado("sin-sesion"); }
    })();
    return ()=>{ vivo=false; try{ if(canal) window.SB.removeChannel(canal); }catch(e){} };
  },[]);
  React.useEffect(()=>{ if(hiloRef.current) hiloRef.current.scrollTop=hiloRef.current.scrollHeight; },[msgs,sel]);
  /* el botón atrás cierra la conversación — solo en las apps que lo tienen */
  const usarRetro = (typeof useRetroceso === "function") ? useRetroceso : function(){};
  usarRetro(()=>{ if(sel){ setSel(null); return true; } return false; });

  const noLeidos=(cid)=>msgs.filter(m=>m.con===cid && !m.mio && !m.leido).length;
  const ultimo=(cid)=>msgs.filter(m=>m.con===cid).slice(-1)[0];
  const abrir=async(cid)=>{
    setSel(cid);
    setMsgs(prev=>prev.map(m=>m.con===cid && !m.mio ? {...m, leido:true} : m));
    try{ await window.SB.from("chat_mensajes").update({leido:true})
      .eq("de_usr", cid).eq("para_usr", miUsr).eq("leido", false); }catch(e){}
  };
  const mandar=async(tipo, extra)=>{
    if(enviando) return false;
    setEnviando(true);
    const fila={ msg_id:"CH-"+new Date().getTime()+"-"+Math.floor(Math.random()*1000),
      org_id:await orgActivaProveedor(), de_usr:miUsr, para_usr:sel, tipo,
      texto:(extra&&extra.texto)||null, adjunto:(extra&&extra.adjunto)||null, es_demo:false };
    const { error } = await window.SB.from("chat_mensajes").insert(fila);
    setEnviando(false);
    if(error){ toast && toast("No se pudo enviar: "+(error.message||"error")); return false; }
    setMsgs(prev => prev.some(x=>x.id===fila.msg_id) ? prev : [...prev,
      { id:fila.msg_id, con:sel, mio:true, aviso:false, tipo, texto:fila.texto||"",
        adjunto:fila.adjunto, hora:new Date().toTimeString().slice(0,5),
        fecha:new Date().toISOString().slice(0,10), leido:false }]);
    return true;
  };
  const enviarTexto=async()=>{
    const t=txt.trim(); if(!t) return;
    setTxt("");
    await mandar("texto", { texto:t });
  };
  const enviarFoto=async(f)=>{
    if(!f) return;
    if(f.size > 8*1024*1024){ toast && toast("La foto supera 8 MB."); return; }
    try{
      const ext=((f.name.match(/\.[^.]+$/)||[".jpg"])[0]).toLowerCase();
      const ruta=miUsr+"/"+new Date().getTime()+ext;
      const { error } = await window.SB.storage.from("chat-adjuntos").upload(ruta, f, { contentType:f.type||undefined });
      if(error){ toast && toast("No se pudo subir la foto."); return; }
      await mandar("imagen", { adjunto:ruta });
    }catch(e){ toast && toast("No se pudo enviar la foto."); }
  };
  const alternarAudio=async()=>{
    if(grabando){ try{ recRef.current && recRef.current.stop(); }catch(e){} setGrabando(false); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({ audio:true });
      const rec=new MediaRecorder(stream);
      const trozos=[];
      rec.ondataavailable=e=>trozos.push(e.data);
      rec.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        const seg=Math.max(1, Math.round((new Date().getTime()-iniRef.current)/1000));
        const dur=Math.floor(seg/60)+":"+String(seg%60).padStart(2,"0");
        const blob=new Blob(trozos, { type: rec.mimeType || "audio/webm" });
        try{
          const ruta=miUsr+"/"+new Date().getTime()+".webm";
          const { error } = await window.SB.storage.from("chat-adjuntos").upload(ruta, blob, { contentType:"audio/webm" });
          if(error){ toast && toast("No se pudo subir el audio."); return; }
          await mandar("audio", { adjunto:ruta, texto:dur });
        }catch(e){ toast && toast("No se pudo enviar el audio."); }
      };
      iniRef.current=new Date().getTime(); recRef.current=rec; rec.start(); setGrabando(true);
    }catch(e){ toast && toast("Permite el micrófono para grabar."); }
  };

  const VERDE="#2E7D52", VERDE_OSC="#25634153", LINEA="#E4EAE4", GRIS="#6B7A70", TINTA="#1E2B23";

  /* separadores por día, como en cualquier mensajería */
  const etiquetaDia=(f)=>{
    const hoy=new Date().toISOString().slice(0,10);

    const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

      <span style={{width:38,height:38,borderRadius:"50%",background:"#E9F3EC",display:"flex",
        alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,border:"2px solid #DCEAE1"}}>{c.ico}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:800,fontSize:15,color:TINTA,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.nombre}</div>
        <div style={{fontSize:11.5,color:GRIS,display:"flex",alignItems:"center",gap:5}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#1c7a44",display:"inline-block"}}></span>
          {c.rol}</div>
      </div>
    </div>
    <div ref={hiloRef} style={{background:"#F1F5F1",
      backgroundImage:"radial-gradient(rgba(46,125,82,.055) 1px, transparent 1px)",
      backgroundSize:"18px 18px",
      border:"1px solid "+LINEA,borderRadius:16,padding:"12px 11px",
      height:"calc(100dvh - 246px)",minHeight:240,overflowY:"auto",marginBottom:10,
      display:"flex",flexDirection:"column",justifyContent:hilo.length?"flex-start":"center"}}>
      {!hilo.length && (
        <div style={{textAlign:"center",color:GRIS,padding:"10px 16px"}}>
          <div style={{fontSize:34,marginBottom:8}}>💬</div>
          <div style={{fontSize:13.5,fontWeight:700,color:TINTA,marginBottom:3}}>Escríbele a {c.nombre}</div>

      {hilo.map((m,idx)=>{

        const seguido = !diaNuevo && idx>0 && hilo[idx-1].mio===m.mio && !hilo[idx-1].aviso && !m.aviso;

/* Los adjuntos viven en un depósito privado: enlace firmado por 1 hora. */
function AdjuntoChatApp({ ruta, tipo, dur, mio }){
  const [url,setUrl]=useState(null);
  React.useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        const { data } = await window.SB.storage.from("chat-adjuntos").createSignedUrl(ruta, 3600);
        if(vivo && data && data.signedUrl) setUrl(data.signedUrl);
      }catch(e){}
    })();
    return ()=>{ vivo=false; };
  },[ruta]);
  if(tipo==="audio") return url
    ? <audio controls src={url} style={{width:200,height:36,marginBottom:4}} />
    : <div style={{fontSize:12.5,padding:"3px 0"}}>🎤 Audio{dur?" · "+dur:""} · abriendo…</div>;
  return url
    ? <img src={url} alt="foto" style={{maxWidth:190,width:"100%",borderRadius:9,display:"block",marginBottom:5}} />
    : <div style={{width:170,height:100,borderRadius:9,background:mio?"rgba(255,255,255,.15)":"#EFF2EF",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,marginBottom:5}}>📷</div>;
}

function SelloVivoP({vivo}){

    border:vivo?"none":"1px solid var(--linea)"}}>{vivo?"🟢 Datos vivos":"⚪ Demostración"}</span>);
}
function PerfilNegocioProv({decir}){

        /* b43 · la cuenta manda: usuarios.prov_cod dice qué piladora es. La app
           SOLO trae los datos de esa piladora (nunca los de las demás). Mientras
           no existan cuentas de piladora, se usa San Agustín (AGU) para probar. */

        const cod=(u&&u.prov_cod)||"AGU";
        const [{data:pv},{data:fs},{data:cs},{data:ds},{data:og},{data:cf},{data:pd}] = await Promise.all([
          window.SB.from("proveedores").select("prov_cod,nombre").eq("prov_cod",cod).maybeSingle(),
          window.SB.from("proveedor_fichas").select("*").eq("prov_cod",cod),
          window.SB.from("proveedor_contactos").select("*").eq("prov_cod",cod).eq("activo",true).order("orden"),
          window.SB.from("proveedor_documentos").select("*").eq("prov_cod",cod).eq("activo",true).order("creado",{ascending:false}),
          window.SB.from("organizaciones").select("nombre,ruc,tel,correo").eq("org_id",await orgActivaProveedor()).maybeSingle(),
          window.SB.from("config_sistema").select("valor").eq("clave","colaboradores").maybeSingle(),
          /* b44 · crédito vigente con el freelance: pedidos a crédito sin cerrar ni anular */
          window.SB.from("pedidos").select("estado,pedido_items(cantidad_qq,precio_usd)")
            .eq("prov_cod",cod).eq("condicion","credito").eq("es_demo",false)

        const c={}; (cs||[]).forEach(x=>{ (c[x.prov_cod]=c[x.prov_cod]||[]).push(x); }); setContactos(c);
        const dd={}; (ds||[]).forEach(x=>{ (dd[x.prov_cod]=dd[x.prov_cod]||[]).push(x); }); setDocs(dd);
        setFlx({ org:og||null, colabs:(cf&&cf.valor&&cf.valor.lista)||[] });
        setUsado((pd||[]).reduce((a,p)=>a+(p.pedido_items||[]).reduce((b,i)=>b+(Number(i.cantidad_qq)||0)*(Number(i.precio_usd)||0),0),0));
      }catch(e){ if(vivo) setSes(null); }
    })();

  },[]);
  const audit=async(tabla,op,regId,valor)=>{
    try{
      const { data:cod } = await window.SB.rpc("au_codigo");

    }catch(e){ return null; }
  };

    const au=await audit("proveedor_fichas","UPDATE",sel,{representante:f.representante,ruc:f.ruc,telefono:f.telefono,correo:f.correo});
    setFichas(prev=>({...prev,[sel]:f})); setEditF(null);
    decir("Datos guardados en la base"+(au?" · "+au:""));

  const guardarColab=async()=>{
    if(!editC.nombre || !editC.nombre.trim()){ decir("El nombre es obligatorio"); return; }

    const { error } = await window.SB.from("proveedor_contactos").upsert(c);
    if(error){ decir("No se pudo guardar: "+(error.message||"error")); return; }
    const au=await audit("proveedor_contactos","UPSERT",c.contacto_id,c);
    setContactos(prev=>{ const l=(prev[sel]||[]).filter(x=>x.contacto_id!==c.contacto_id);
      return {...prev,[sel]:[...l,c].sort((a,b)=>(a.orden||0)-(b.orden||0))}; });

  const ficha=fichas[sel]||{prov_cod:sel};
  const lista=contactos[sel]||[];

  const org=(flx&&flx.org)||null;

      <div className="aj-card">
        <div className="aj-fila"><span>Piladora</span><b>{(provs[0]&&provs[0].nombre)||"—"}</b></div>
        <div className="aj-fila"><span>Representante</span><b>{ficha.representante||"—"}</b></div>

        <div className="aj-fila"><span>Teléfono</span><b className="num">{ficha.telefono||"—"}</b></div>

function AjustesProv(){
  const [pest,setPest]=useState("apariencia");
  const [tickAj,setTickAj]=useState(0);   // repinta tras borrar la semilla de prueba
  const [tema,setTema]=useState(temaGuardadoP());
  const [bio,setBio]=useState(!!huellaGuardadaP());
  const [sonido,setSonido]=useState(true);
  const [notCobros,setNotCobros]=useState(true);
  const [notProp,setNotProp]=useState(true);
  const [notCred,setNotCred]=useState(true);
  const [aviso,setAviso]=useState("");
  const [abreClave,setAbreClave]=useState(false);
  const [clAct,setClAct]=useState(""), [clNue,setClNue]=useState(""), [clRep,setClRep]=useState("");
  const [clVer,setClVer]=useState(false);
  const fza=fuerzaClaveP(clNue);
  const decir=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3000); };
  const cerrarClave=()=>{ setAbreClave(false); setClAct(""); setClNue(""); setClRep(""); setClVer(false); };
  const guardarNueva=()=>{
    if(!clAct.trim()){ decir("Escribe tu contraseña actual"); return; }
    if(!fza.valida){ decir("La nueva necesita "+fza.falta.join(", ")); return; }
    if(clNue!==clRep){ decir("La nueva y su repetición no coinciden"); return; }
    if(clAct===clNue){ decir("Debe ser distinta a la actual"); return; }
    if(claveRepetidaP(clNue)){ decir("Ya usaste esa contraseña antes."); return; }
    guardarClaveP(hashClaveP(clNue)); cerrarClave(); decir("Contraseña actualizada ✓");
  };
  const Sw=({on,set})=>(
    <button className={"aj-sw"+(on?" on":"")} onClick={()=>set(v=>!v)}><span className="aj-kn"></span></button>
  );
  const Aviso = () => aviso ? (
    <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
      background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
      fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.28)",maxWidth:"88%",textAlign:"center"}}
      onClick={()=>setAviso("")}>{aviso}</div>
  ) : null;

  return (<>
    <div className="eyebrow">Tu app</div>
    <h1 className="h1">Ajustes</h1>

    <div className="sec-gap" style={{height:14}} />
    <div className="pest-aj">
      {[["apariencia","Colores"],["perfil","Perfil"],["avisos","Avisos"],
        ["seguridad","Seguridad"],["datos","Datos"]].map(([k,t])=>(
        <button key={k} className={pest===k?"on":""} onClick={()=>setPest(k)}>{t}</button>
      ))}
    </div>

    {pest==="apariencia" && (<>
      <div className="aj-sec">Color de la app</div>
      {Object.keys(PALETAS_P).map(k=>{
        const p=PALETAS_P[k];
        return (
          <button key={k} className={"aj-pal"+(tema===k?" on":"")}
            onClick={()=>{ setTema(k); aplicarTemaP(k); decir("Tema: "+p.nombre); }}>
            <span className="aj-pal-m">
              <span style={{background:p.muestra[0]}}></span>
              <span style={{background:p.muestra[1]}}></span></span>
            <span style={{flex:1,minWidth:0,textAlign:"left"}}>
              <span className="aj-pal-n">{p.nombre}</span>
              <span className="aj-pal-d">{p.desc}</span></span>
            {tema===k && <span style={{color:"var(--ok)",fontWeight:700,flexShrink:0}}>✓</span>}
          </button>
        );
      })}
      <div className="aj-nota">El color queda guardado en este teléfono.</div>
    </>)}

    {pest==="perfil" && <PerfilNegocioProv decir={decir}/>}

    {pest==="avisos" && (<>
      <div className="aj-sec">Avisos del sistema</div>
      <TarjetaAvisosTelefono avisar={decir}/>
      <div className="aj-sec">Preferencias</div>
      <div className="aj-card">
        <div className="aj-fila"><span>Sonidos de avisos</span><Sw on={sonido} set={setSonido}/></div>
      </div>
      <div className="aj-sec">Qué quieres que te avise</div>
      <div className="aj-card">
        <div className="aj-fila"><span>Cobros por conciliar</span><Sw on={notCobros} set={setNotCobros}/></div>
        <div className="aj-fila"><span>Respuestas a propuestas</span><Sw on={notProp} set={setNotProp}/></div>
        <div className="aj-fila"><span>Créditos por aprobar</span><Sw on={notCred} set={setNotCred}/></div>
      </div>
      <div className="aj-nota">Los avisos push se activan al conectar el sistema.</div>
    </>)}

    {pest==="seguridad" && (<>
      <div className="aj-sec">Entrar a la app</div>
      <div className="aj-card">
        <div className="aj-fila" style={{alignItems:"flex-start"}}>
          <div style={{flex:1,minWidth:0,paddingRight:10}}>
            <div style={{fontWeight:700,fontSize:13.5,color:"var(--texto)"}}>Ingreso con huella o rostro</div>
            <div className="aj-sub">{puedeHuellaRealP()
              ? "El que tengas configurado en tu teléfono"
              : "Disponible en la app publicada"}</div>
          </div>
          <button className={"aj-sw"+(bio?" on":"")} disabled={!puedeHuellaRealP()}
            style={!puedeHuellaRealP()?{opacity:.45}:null}
            onClick={()=>{
              if(!puedeHuellaRealP()) return;
              if(bio){ borrarHuellaP(); setBio(false); decir("Ingreso biométrico desactivado."); return; }
              const reg=huellaGuardadaP()||{};
              crearHuellaP(reg.usuario||"RMOLINA", PROVEEDOR.contacto||"").then((credId)=>{
                if(!credId){ decir("No se pudo registrar. Revisa la huella de tu teléfono."); return; }
                guardarHuellaP({credId, usuario:reg.usuario||"RMOLINA", nombre:PROVEEDOR.contacto||""});
                setBio(true); decir("Listo ✓ La próxima vez entras con huella.");
              });
            }}><span className="aj-kn"></span></button>
        </div>
      </div>

      <div className="aj-sec">Tu contraseña</div>
      <div className="aj-card">
        <div className="aj-fila">
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:13.5,color:"var(--texto)"}}>Cambiar contraseña</div>
            <div className="aj-sub">Nadie puede verla, ni el freelance</div>
          </div>
          <button className="aj-btn" onClick={()=>abreClave?cerrarClave():setAbreClave(true)}>
            {abreClave?"Cancelar":"Cambiar"}</button>
        </div>
        {abreClave && (<div style={{marginTop:10}}>
          <div className="cl-l">Contraseña actual</div>
          <input className="cl-i" type={clVer?"text":"password"} value={clAct}
            onChange={e=>setClAct(e.target.value)} placeholder="Tu contraseña de ahora" />
          <div className="cl-l">Nueva contraseña</div>
          <div style={{position:"relative"}}>
            <input className="cl-i" type={clVer?"text":"password"} value={clNue}
              onChange={e=>setClNue(e.target.value)} placeholder="Mínimo 8, con letra y número" />
            <button className="cl-ojo" onClick={()=>setClVer(v=>!v)}>{clVer?"🙈":"👁"}</button>
          </div>
          {clNue.length>0 && (<>
            <div className="cl-bar"><i style={{width:((fza.nivel+1)*25)+"%",background:fza.color}} /></div>
            <div className="cl-n" style={{color:fza.color}}>
              {fza.texto}{fza.falta.length?" · falta "+fza.falta.join(", "):""}</div>
          </>)}
          <div className="cl-l">Repite la nueva</div>
          <input className="cl-i" type={clVer?"text":"password"} value={clRep}
            onChange={e=>setClRep(e.target.value)} placeholder="Escríbela otra vez"
            style={clRep.length>0 && clRep!==clNue ? {borderColor:"var(--alerta)"} : null} />
          {clRep.length>0 && clRep!==clNue &&
            <div className="cl-n" style={{color:"var(--alerta)"}}>No coinciden todavía</div>}
          <button className="btn btn-maiz" style={{width:"100%",marginTop:12}} onClick={guardarNueva}>
            Guardar contraseña</button>
          <div className="aj-nota">Se guarda cifrada: ni el sistema ni el freelance pueden verla.
            No puedes repetir tus últimas 3. Al conectar el sistema, el cambio viajará al servidor.</div>
        </div>)}
      </div>
    </>)}

    {pest==="datos" && (<>
      <div className="aj-sec">Datos en este teléfono</div>
      <div className="aj-card">
        <div className="aj-fila"><span>Modo</span><b>Demostración</b></div>
        <div className="aj-fila"><span>Comprobantes cargados</span><b>{comprobantesRegistrados().length}</b></div>
        <div className="aj-fila"><span>Versión</span><b>{VERSION.fecha} b{VERSION.n}</b></div>
      </div>
      {cuantasDemo()>0 && (<>
        <div className="aj-sec">Datos de prueba</div>
        <div className="aj-card">
          <div className="aj-fila"><span>Facturas de prueba</span><b className="num">{cuantasDemo()}</b></div>
          <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
            onClick={()=>{ borrarSemillaDemo(); setTickAj(t=>t+1); decir("Datos de prueba borrados ✓"); }}>
            Quitar datos de prueba</button>
        </div>
        <div className="aj-nota">Facturas inventadas, con el cobro ya puesto, para poder probar
          anular y trasladar el dinero. Van marcadas DEMO en todas las listas. Al quitarlas se
          van también las anulaciones que salieron de ellas, y no vuelven a aparecer solas.</div>
      </>)}
      <div className="aj-nota">La lista de comprobantes ya cargados evita registrar dos veces la misma
        factura, nota o guía. Hoy vive en el teléfono; al conectar el sistema pasa al servidor,
        donde el control es a prueba de cambios de equipo.</div>
    </>)}
    <Aviso/>
  </>);
}

function GuiasRemision(){
  const [guias,setGuias]=useState(GUIAS_INI);
  const [sel,setSel]=useState(null);
  const [aviso,setAviso]=useState("");
  const [anulandoG,setAnulandoG]=useState(false);
  const [motGuia,setMotGuia]=useState("");
  const [notaGuia,setNotaGuia]=useState("");
  const [anuladasGuia,setAnuladasGuia]=useState(()=>leerAnulados(GUIA_ANULADAS_KEY).map(a=>a.id));
  const xmlRef=React.useRef(null);
  /* Atrás: cierra el panel de anulación, luego el detalle, luego sale del módulo. */
  useRetrocesoP(()=>{ if(anulandoG){ setAnulandoG(false); setMotGuia(""); setNotaGuia(""); return true; } if(sel){ setSel(null); return true; } return false; });

  const alSubirGuia=(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value="";
    if(!f) return;
    const lec=new FileReader();
    lec.onerror=()=>setAviso("No se pudo leer el archivo.");
    lec.onload=()=>{
      const r=leerComprobanteSRI(String(lec.result||""),"guiaRemision");
      if(r.error){ setAviso(r.error); return; }
      if(comprobanteRepetido(r)){ setAviso("Esta guía ya fue cargada."); return; }
      const au=nuevoAuG();
      registrarComprobante({...r, au});
      setGuias(p=>[{...r, au, cargada:new Date().toISOString().slice(0,10)}, ...p]);
      setAviso(`Guía ${r.numero} cargada · placa ${r.placa||"sin placa"} · ${au}`);
    };
    lec.readAsText(f);
  };

  const Aviso = () => aviso ? (
    <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
      background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
      fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.28)",maxWidth:"88%",textAlign:"center"}}
      onClick={()=>setAviso("")}>{aviso}</div>
  ) : null;

  /* ── detalle de una guía ── */
  if(sel){
    const g=sel;
    return (<>
      <div className="eyebrow">Guía de remisión</div>
      <h1 className="h1">{g.numero}</h1>
      <div className="sub" style={{marginTop:4}}>{g.emisor}</div>

      <div className="sec-gap" style={{height:14}} />
      <div className="card card-pad">
        <div className="row between" style={{padding:"3px 0"}}>
          <span className="sub tiny">Transportista</span>
          <b style={{fontSize:13.5}}>{g.transportista||"—"}</b></div>
        <div className="row between" style={{padding:"3px 0"}}>
          <span className="sub tiny">Placa</span>
          <b className="num" style={{fontSize:14}}>{g.placa||"—"}</b></div>
        <div className="row between" style={{padding:"3px 0"}}>
          <span className="sub tiny">Traslado</span>
          <b style={{fontSize:12.5}}>{fCortaG(g.fecha)} → {fCortaG(g.fechaFin)}</b></div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="sub tiny" style={{marginBottom:6}}>Parte desde</div>
      <div className="card card-pad"><div style={{fontSize:13.5}}>{g.partida||"—"}</div></div>

      {(g.destinos||[]).map((d,i)=>(
        <div key={i}>
          <div className="sec-gap" style={{height:12}} />
          <div className="card card-pad">
            <div style={{fontWeight:600,fontSize:14.5}}>{d.cliente}</div>
            <div className="sub tiny" style={{marginTop:2}}>{d.direccion}</div>
            <div className="sub tiny" style={{marginTop:4}}>
              {d.motivo||"Traslado"}{d.docSustento ? " · ampara "+d.docSustento : ""}</div>
            {(d.lineas||[]).map((l,k)=>(
              <div key={k} className="row between" style={{padding:"5px 0",
                borderTop:"1px solid var(--linea)",marginTop:6}}>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:13}}>{l.desc}</div>
                  <div className="sub tiny">{l.codProv}</div></div>
                <b className="num" style={{fontSize:13.5,flexShrink:0,marginLeft:10}}>{l.cant} qq</b>
              </div>
            ))}
          </div>
        </div>
      ))}

      <div className="sec-gap" style={{height:14}} />
      {anuladasGuia.includes(g.clave||g.numero) ? (
        <div className="card card-pad" style={{borderColor:"#B5432E",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:14,color:"#B5432E"}}>✕ Guía anulada</div>
          <div className="sub tiny" style={{marginTop:6,lineHeight:1.5}}>Queda registrada con su auditoría. El transportista ya no debe usarla para salir a ruta.</div>
        </div>
      ) : anulandoG ? (
        <div className="card card-pad" style={{borderColor:"#B5432E",marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:8}}>¿Por qué se anula?</div>
          {ordUso("motivos_anular_guia", MOTIVOS_ANULAR_GUIA).map(m=>(
            <button key={m} className={"btn "+(motGuia===m?"btn-maiz":"btn-ghost")} style={{width:"100%",marginBottom:8,textAlign:"left"}}
              onClick={()=>{ setMotGuia(m); regUso("motivos_anular_guia", m); }}>{m}</button>
          ))}
          <textarea className="inp" rows={2} placeholder="Detalle (opcional)" value={notaGuia}
            onChange={e=>setNotaGuia(e.target.value)} style={{width:"100%",marginTop:4}} />
          <button className="btn btn-maiz" style={{width:"100%",marginTop:10}}
            onClick={()=>{
              if(!motGuia){ setAviso("Elige el motivo de la anulación"); return; }
              const au=nuevoAuG();
              registrarAnulDoc(GUIA_ANULADAS_KEY,{ id:(g.clave||g.numero), numero:g.numero, cliente:g.emisor, total:0, motivo:motGuia, nota:notaGuia.trim(), au });
              setAnuladasGuia(a=>[...a,(g.clave||g.numero)]); setAnulandoG(false); setMotGuia(""); setNotaGuia("");
              setAviso(`Guía ${g.numero} anulada · ${au}`);
            }}>Anular la guía</button>
          <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
            onClick={()=>{ setAnulandoG(false); setMotGuia(""); setNotaGuia(""); }}>Cancelar</button>
        </div>
      ) : (
        <button className="btn btn-ghost" style={{width:"100%",marginBottom:10,color:"#B5432E"}}
          onClick={()=>setAnulandoG(true)}>Anular guía</button>
      )}
      <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setSel(null)}>Volver</button>
      <Aviso/>
    </>);
  }

  /* ── lista ── */
  return (<>
    <div className="eyebrow">Mercadería en tránsito</div>
    <h1 className="h1">Guías de remisión</h1>
    <div className="sub" style={{marginTop:4}}>
      Sube el XML de la guía: el chofer la necesita para salir a ruta.</div>

    <div className="sec-gap" style={{height:16}} />
    <input ref={xmlRef} type="file" accept=".xml,text/xml,application/xml"
      style={{display:"none"}} onChange={alSubirGuia} />
    <button className="btn btn-maiz" style={{width:"100%"}}
      onClick={()=>xmlRef.current&&xmlRef.current.click()}>Subir el XML de la guía</button>

    {guias.length===0 ? (
      <>
        <div className="sec-gap" style={{height:16}} />
        <div className="card card-pad" style={{textAlign:"center",padding:"26px 18px"}}>
          <div style={{fontSize:34,marginBottom:8}}>🚚</div>
          <div style={{fontWeight:600,fontSize:14.5}}>Sin guías cargadas</div>
          <div className="sub tiny" style={{marginTop:5,lineHeight:1.5}}>
            Cuando subas una, el transportista la verá en su viaje.</div>
        </div>
      </>

      <div className="sec-gap" style={{height:14}} />
      <div className="h2" style={{marginBottom:10}}>Cargadas · {guias.length}</div>
      {guias.map((g,i)=>(
        <button key={i} className="card card-pad" style={{width:"100%",textAlign:"left",marginBottom:8}}
          onClick={()=>setSel(g)}>
          <div className="row between">
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:600,fontSize:14.5,overflow:"hidden",
                textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.numero}</div>
              <div className="sub tiny" style={{overflow:"hidden",
                textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.cliente}</div>
              <div className="sub tiny">{g.placa||"sin placa"} · {fCortaG(g.fecha)}</div>
            </div>
            <span style={{color:"var(--texto-3)",fontSize:20,flexShrink:0,marginLeft:10}}>›</span>
          </div>
        </button>
      ))}

    <Aviso/>
  </>);
}

function Conciliacion({irTab}){
  const [tab,setTab]=useState("pendiente");   // pendiente | aprobado | observado | rechazado
  const [aviso,setAviso]=useState("");
  const toast=(m)=>{ setAviso(m); setTimeout(()=>setAviso(""),3200); };
  const [sel,setSel]=useState(null);          // cobro abierto
  const [accion,setAccion]=useState(null);    // observar | rechazar
  const [motivo,setMotivo]=useState("");
  const [nota,setNota]=useState("");
  const [tick,setTick]=useState(0);
  /* Atrás: cierra el detalle del cobro antes de salir del módulo. */
  useRetrocesoP(()=>{ if(sel){ setSel(null); return true; } return false; });

  const COL={pendiente:"var(--maiz)", aprobado:"#2E7D52", observado:"#C77F00", rechazado:"#B5432E"};
  const LBL={pendiente:"Por revisar", aprobado:"Aprobados", observado:"Observados", rechazado:"Rechazados"};

  const cuenta=(e)=>COBROS_REPORTADOS.filter(c=>c.estado===e).length;
  const suma  =(e)=>COBROS_REPORTADOS.filter(c=>c.estado===e).reduce((a,c)=>a+c.monto,0);
  const lista = COBROS_REPORTADOS.filter(c=>c.estado===tab);

  const nuevoAu = ()=>"AU-260720-"+Math.floor(1000+Math.random()*9000);
  const ahora   = ()=>"20 jul 2026 "+new Date().toTimeString().slice(0,5);

  /* APROBAR: la única acción que libera la comisión */
  const aprobar=(c)=>{
    c.estado="aprobado"; c.verFecha=ahora(); c.au=nuevoAu();
    c.motivo=null; c.nota=null;
    setSel(null); setTick(t=>t+1);
    toast(`Cobro aprobado · la comisión queda liberada · ${c.au}`);
  };
  /* OBSERVAR: vuelve al cobrador para que él corrija el dato */
  const observar=()=>{
    const c=sel; if(!c) return;
    c.estado="observado"; c.motivo=motivo; c.nota=nota.trim();
    c.verFecha=ahora(); c.au=nuevoAu(); c.intentos=(c.intentos||0)+1;
    setAccion(null); setMotivo(""); setNota(""); setSel(null); setTick(t=>t+1);
    toast(`Observado · vuelve a ${c.cobrador} para que lo corrija`);
  };
  /* RECHAZAR: es un aviso al Freelance, no una anulación */
  const rechazar=()=>{
    const c=sel; if(!c) return;
    c.estado="rechazado"; c.motivo=motivo; c.nota=nota.trim();
    c.verFecha=ahora(); c.au=nuevoAu();
    setAccion(null); setMotivo(""); setNota(""); setSel(null); setTick(t=>t+1);
    toast("Rechazado · el Freelance decide si lo anula o lo devuelve");
  };

  /* ── FICHA DE UN COBRO ── */
  if(sel){
    const c = COBROS_REPORTADOS.find(x=>x.id===sel.id) || sel;
    return (<>
      <div className="eyebrow">Cobro reportado</div>
      <h1 className="h1">{c.cli}</h1>
      <div className="sub" style={{marginTop:4}}>{c.id} · {c.fecha} · {c.hora}</div>

      <div className="sec-gap" style={{height:16}} />
      <div className="hero">
        <div className="lbl">Monto reportado</div>
        <div className="big num">{money(c.monto)}</div>
        <div className="split">
          <div><div className="k">Forma</div><div className="v">{c.forma}</div></div>
          <div><div className="k">Banco</div><div className="v">{c.banco}</div></div>
          <div><div className="k">N° operación</div><div className="v num">{c.numero}</div></div>
        </div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad">
        <div className="sub tiny">Quién cobró</div>
        <div style={{fontWeight:600,fontSize:15,marginTop:2}}>{c.cobrador}</div>
        <div className="sub tiny">{c.rol}</div>
      </div>

      <div className="sec-gap" style={{height:12}} />
      <div className="card card-pad">
        <div className="sub tiny" style={{marginBottom:8}}>Facturas que cancela</div>
        {c.facturas.map((f,i)=>(
          <div className="row between" key={i} style={{padding:"5px 0"}}>
            <span style={{fontSize:14}}>{f.f}</span>
            <b className="num" style={{fontSize:14}}>{money(f.m)}</b>
          </div>
        ))}
      </div>

      {(c.estado==="observado"||c.estado==="rechazado") && (
        <>
          <div className="sec-gap" style={{height:12}} />
          <div className="card card-pad" style={{borderColor:COL[c.estado]}}>
            <div style={{fontWeight:700,fontSize:14,color:COL[c.estado]}}>
              {c.estado==="observado" ? "Observado" : "Rechazado"} · {c.motivo}</div>
            {c.nota && <div className="sub tiny" style={{marginTop:4}}>{c.nota}</div>}
            <div className="sub tiny" style={{marginTop:6}}>{c.verFecha} · {c.au}</div>
            {c.estado==="rechazado" && (
              <div className="sub tiny" style={{marginTop:8,fontWeight:600}}>
                El Freelance decide si lo anula o lo devuelve a revisión. Tú no anulas cobros.</div>
            )}
          </div>
        </>
      )}

      {c.estado==="aprobado" && (
        <>
          <div className="sec-gap" style={{height:12}} />
          <div className="card card-pad" style={{borderColor:"#2E7D52"}}>
            <div style={{fontWeight:700,fontSize:14,color:"#2E7D52"}}>✓ Aprobado · comisión liberada</div>
            <div className="sub tiny" style={{marginTop:6}}>{c.verFecha} · {c.au}</div>
          </div>
        </>
      )}

      {c.intentos>=3 && (
        <>
          <div className="sec-gap" style={{height:12}} />
          <div className="card card-pad" style={{borderColor:"var(--maiz)"}}>
            <div style={{fontWeight:700,fontSize:14}}>Observado {c.intentos} veces</div>
            <div className="sub tiny" style={{marginTop:4}}>
              Conviene que lo revise el Freelance directamente.</div>
          </div>
        </>
      )}

      {c.estado==="pendiente" && (<>
        <div className="sec-gap" style={{height:16}} />
        <div className="card card-pad">
          
          <button className="btn btn-maiz" onClick={()=>aprobar(c)}>✓ Aprobar</button>
          <div className="row" style={{gap:10,marginTop:10}}>
            <button className="btn btn-ghost" style={{flex:1}}
              onClick={()=>{setMotivo("");setNota("");setAccion("observar");}}>Observar</button>
            <button className="btn btn-ghost" style={{flex:1,color:"#B5432E",borderColor:"#B5432E"}}
              onClick={()=>{setMotivo("");setNota("");setAccion("rechazar");}}>Rechazar</button>
          </div>
        </div>
      </>)}

      <div className="sec-gap" style={{height:12}} />
      <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setSel(null)}>Volver</button>

    {aviso && (
      <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
        background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
        fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.35)",maxWidth:"88%"}}>{aviso}</div>
    )}

      {/* observar o rechazar: motivo obligatorio */}
      {accion && (
        <div className="scrim" onClick={()=>setAccion(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <h3>{accion==="observar" ? "¿Qué no calza?" : "¿Por qué lo rechazas?"}</h3>
            <div className="sub tiny" style={{margin:"6px 0 14px"}}>
              {accion==="observar"
                ? `Vuelve a ${c.cobrador} para que corrija el dato. Él tiene la foto del comprobante.`
                : "Se avisa al Freelance. Tú no anulas el cobro: él decide qué hacer."}
            </div>
            {(accion==="observar"?MOTIVOS_OBSERVAR:MOTIVOS_RECHAZAR).map(m=>(
              <button key={m} className="btn btn-ghost"
                style={{width:"100%",marginBottom:8,textAlign:"left",
                  fontWeight:motivo===m?700:500,
                  borderColor:motivo===m?"var(--maiz)":undefined}}
                onClick={()=>setMotivo(m)}>{motivo===m?"✓ ":""}{m}</button>
            ))}
            <input value={nota} onChange={e=>setNota(e.target.value)}
              placeholder="Explica brevemente (opcional)"
              style={{width:"100%",padding:"12px 14px",borderRadius:10,
                border:"1px solid var(--linea)",fontSize:14,marginTop:6,fontFamily:"inherit"}}/>
            <button className="btn btn-maiz" style={{marginTop:14}} disabled={!motivo}
              onClick={accion==="observar"?observar:rechazar}>
              {accion==="observar" ? "Devolver al cobrador" : "Avisar al Freelance"}</button>
            <button className="btn btn-ghost" style={{width:"100%",marginTop:10}}
              onClick={()=>setAccion(null)}>Cancelar</button>
          </div>
        </div>
      )}
    </>);
  }

  /* ── LISTA ── */
  return (<>
    <div className="eyebrow">Tu banco por fuera, tu decisión aquí</div>
    <h1 className="h1">Conciliación</h1>
    <div className="sub" style={{marginTop:4}}>
      Aprobar un cobro libera la comisión de quien lo hizo.</div>

    <div className="sec-gap" style={{height:14}} />
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {["pendiente","aprobado","observado","rechazado"].map(k=>(
        <button key={k} onClick={()=>setTab(k)}
          style={{background:tab===k?COL[k]:"var(--card)",
            border:`1px solid ${tab===k?COL[k]:"var(--linea)"}`,borderRadius:14,
            padding:"12px 13px",textAlign:"left",cursor:"pointer",fontFamily:"inherit"}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".03em",
            color:tab===k?"#fff":"var(--texto-3)"}}>{LBL[k]}</div>
          <div className="num" style={{fontSize:19,fontWeight:700,marginTop:3,
            color:tab===k?"#fff":COL[k]}}>{cuenta(k)}</div>
          <div className="num" style={{fontSize:12,
            color:tab===k?"rgba(255,255,255,.85)":"var(--texto-3)"}}>{money(suma(k))}</div>
        </button>
      ))}
    </div>

    <div className="sec-gap" style={{height:16}} />
    {lista.length===0 && (
      <div className="card card-pad" style={{textAlign:"center"}}>
        <div className="sub">
          {tab==="pendiente" ? "Nada por revisar. Todo al día."
           : tab==="aprobado" ? "Aún no has aprobado cobros."
           : tab==="observado" ? "Sin cobros observados."
           : "Sin cobros rechazados."}</div>
      </div>
    )}
    {lista.map(c=>(
      <button key={c.id} className="card card-pad" onClick={()=>setSel(c)}
        style={{width:"100%",textAlign:"left",marginBottom:10,
          borderColor:c.estado==="pendiente"?"var(--maiz)":"var(--linea)"}}>
        <div className="row between">
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontWeight:600,fontSize:15,overflow:"hidden",
              textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.cli}</div>
            <div className="sub tiny">{c.forma} · {c.fecha}</div>
            <div className="sub tiny">👤 {c.cobrador}</div>
            {c.motivo && <div className="sub tiny" style={{color:COL[c.estado],fontWeight:600,
              marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.motivo}</div>}
          </div>
          <b className="num" style={{fontSize:16,flexShrink:0,marginLeft:10}}>{money(c.monto)}</b>
        </div>
      </button>
    ))}

    {aviso && (
      <div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",zIndex:90,
        background:"#1E1B14",color:"#fff",borderRadius:12,padding:"12px 18px",fontSize:13,
        fontWeight:600,boxShadow:"0 6px 18px rgba(0,0,0,.35)",maxWidth:"88%"}}>{aviso}</div>
    )}
  </>);
}

function Creditos({ctx}){
  const {cred,setCred,contado,accion}=ctx;
  const [filtro,setFiltro]=useState("pendientes");
  const [ver,setVer]=useState(null);

  const pend=cred.filter(c=>c.estado==="pendiente");
  const hist=cred.filter(c=>c.estado!=="pendiente");
  const lista=filtro==="pendientes"?pend:hist;

  const resolver=(id,estado,extra)=> accion(()=>{
    setCred(prev=>prev.map(c=>c.id===id?{...c,estado,resuelta:"Hoy",...extra}:c));
    setVer(null);
  });

  return (
    <>
      <div className="eyebrow">Crédito de clientes</div>
      <h1 className="h1">Créditos</h1>
      <div className="sub" style={{marginTop:4}}>Clientes que piden comprar a crédito.</div>

      <div className="seg" style={{margin:"16px 0 14px"}}>
        <button className={filtro==="pendientes"?"on":""} onClick={()=>setFiltro("pendientes")}>Por aprobar · {pend.length}</button>
        <button className={filtro==="historial"?"on":""} onClick={()=>setFiltro("historial")}>Historial · {hist.length}</button>
      </div>

      {lista.length===0
        ? <div className="empty"><div className="ico">✓</div><div style={{marginTop:8,fontWeight:600}}>Sin créditos {filtro==="pendientes"?"por aprobar":"en historial"}</div></div>
        : <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {lista.map(c=> <CredCard key={c.id} c={c} onClick={()=>setVer(c)} />)}
          </div>}

      {/* Clientes de contado — solo referencia, sin aprobación */}
      {contado.length>0 &&
        <>
          <div className="sec-gap" />
          <div className="row between" style={{marginBottom:8}}>
            <div className="h2" style={{fontSize:16}}>Clientes de contado</div>
            <span className="chip chip-ok tiny" style={{padding:"3px 9px"}}>Sin aprobación</span>
          </div>
          <div className="sub tiny" style={{marginBottom:10}}>Compran de contado; no generan riesgo de cartera ni requieren tu visto bueno.</div>
          <div className="list-card">
            {contado.map(c=>(
              <div key={c.id} className="item">
                <div className="ava" style={{background:"var(--ok-suave)",color:"#1E5B40"}}>$</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14}}>{c.cliente}</div>
                  <div className="tiny muted">{c.ciudad} · {c.origen} · {c.fecha}</div>
                </div>
                <span className="tiny" style={{color:"var(--ok)",fontWeight:600}}>Contado</span>
              </div>
            ))}
          </div>
        </>}

      {ver && <CredSheet c={ver} onClose={()=>setVer(null)} onResolver={resolver} />}
    </>
  );
}

function CredCard({c,onClick}){
  const e=ESTADO[c.estado];
  const docsOk=c.docs.filter(d=>d.ok).length;
  return (
    <button className="card card-pad" style={{width:"100%",textAlign:"left"}} onClick={onClick}>
      <div className="row between">
        <span className="chip chip-az">💳 Crédito cliente</span>
        <span className={"chip "+e.chip}>{c.estado==="pendiente"?"Por aprobar":c.estado==="aprobada"?"Aprobado":"Rechazado"}</span>
      </div>
      <div style={{fontWeight:600,fontSize:15,margin:"10px 0 2px"}}>{c.cliente}</div>
      <div className="sub tiny">{c.ciudad} · RUC {c.ruc}</div>
      <div className="row between" style={{marginTop:12,paddingTop:12,borderTop:"1px solid var(--linea)"}}>
        <div className="tiny muted">{c.origen}</div>
        <div style={{textAlign:"right"}}>
          <div className="tiny muted">Cupo sugerido</div>
          <div className="num" style={{fontWeight:600}}>{f(c.cupoSugerido)}</div>
        </div>
      </div>
      <div className="tiny muted" style={{marginTop:8}}>{docsOk}/{c.docs.length} documentos · {c.fecha}</div>
    </button>
  );
}

function CredSheet({c,onClose,onResolver}){
  const e=ESTADO[c.estado];
  const ro=c.estado!=="pendiente";
  const [modo,setModo]=useState(null);          // null | aprobar | rechazar
  const [monto,setMonto]=useState(String(c.cupoSugerido));
  const [motivo,setMotivo]=useState("");
  const [doc,setDoc]=useState(null);             // documento abierto en el visor
  const montoN=+monto;
  const montoValido=monto && montoN>0;
  const ajustado=montoValido && montoN!==c.cupoSugerido;
  const docsOk=c.docs.filter(d=>d.ok).length;

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={ev=>ev.stopPropagation()}>
        <div className="grip" />
        <div className="row between">
          <span className="chip chip-az">💳 Crédito de cliente</span>
          <span className={"chip "+e.chip}>{c.estado==="pendiente"?"Por aprobar":c.estado==="aprobada"?"Aprobado":"Rechazado"}</span>
        </div>
        <div className="h2" style={{margin:"12px 0 2px"}}>{c.cliente}</div>
        <div className="sub">{c.ciudad} · RUC {c.ruc}</div>

        {/* Datos del cliente */}
        <div className="card card-pad" style={{margin:"16px 0"}}>
          <Dato k="Solicitado por" v={c.origen} />
          <Dato k="Revisado por" v={c.revisadoPor} />
          <Dato k="Antigüedad del cliente" v={c.antiguedad} />
          <Dato k="Venta mensual estimada" v={f(c.ventaMensual)} />
          <Dato k="Cupo sugerido por el freelance" v={f(c.cupoSugerido)} />
        </div>

        {/* Documentos — abribles */}
        <div className="row between" style={{marginBottom:8}}>
          <div className="h2" style={{fontSize:15}}>Documentos y fotos</div>
          <span className="tiny muted">{docsOk}/{c.docs.length} recibidos</span>
        </div>
        <div className="list-card" style={{marginBottom:16}}>
          {c.docs.map(d=>(
            <button key={d.n} className="item" style={{width:"100%",textAlign:"left",cursor:d.ok?"pointer":"default"}}
              onClick={()=> d.ok && setDoc(d)} disabled={!d.ok}>
              <div className={"doc-thumb "+(!d.ok?"doc-falta":d.tipo==="img"?"doc-img":"doc-pdf")}>
                {!d.ok ? "—" : d.tipo==="img" ? "🖼" : "PDF"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:500,fontSize:14}}>{d.n}</div>
                <div className="tiny" style={{color:d.ok?"var(--azul)":"var(--alerta)",fontWeight:600}}>
                  {d.ok? "Toca para ver · "+d.archivo : "Falta este documento"}
                </div>
              </div>
              {d.ok && <span style={{color:"var(--texto-3)",fontSize:18}}>⤢</span>}
            </button>
          ))}
        </div>

        {/* Nota del freelance */}
        {c.nota &&
          <div className="card card-pad" style={{background:"var(--azul-suave)",border:"none",marginBottom:16}}>
            <div className="tiny" style={{fontWeight:700,color:"#234A6E",marginBottom:4}}>NOTA DE {c.revisadoPor.toUpperCase()}</div>
            <div className="sub" style={{color:"#234A6E"}}>“{c.nota}”</div>
          </div>}

        {/* Resolución */}
        {ro
          ? <div className="card card-pad" style={{background:c.estado==="aprobada"?"var(--ok-suave)":"var(--alerta-suave)",border:"none"}}>
              <div style={{fontWeight:600,color:c.estado==="aprobada"?"#1E5B40":"#8A2A20"}}>
                {c.estado==="aprobada"? `Aprobado · cupo ${f(c.cupoAprobado)}` : "Rechazado"} · {c.resuelta}
              </div>
              {c.estado==="aprobada" && c.cupoAprobado!==c.cupoSugerido &&
                <div className="sub tiny" style={{marginTop:4}}>Ajustado desde el sugerido de {f(c.cupoSugerido)}.</div>}
              {c.motivoRechazo && <div className="sub tiny" style={{marginTop:4}}>{c.motivoRechazo}</div>}
            </div>
          : modo==="aprobar"
            ? <div>
                <div className="field">
                  <label>Cupo a aprobar</label>
                  <input type="number" value={monto} onChange={ev=>setMonto(ev.target.value)} placeholder={String(c.cupoSugerido)} />
                </div>
                {ajustado &&
                  <div className="tiny num" style={{fontWeight:600,margin:"8px 2px 0",color:montoN<c.cupoSugerido?"var(--espera)":"var(--ok)"}}>
                    {montoN<c.cupoSugerido?"Menor":"Mayor"} al sugerido · {f(Math.abs(montoN-c.cupoSugerido))} de diferencia
                  </div>}
                <div className="row" style={{gap:10,marginTop:16}}>
                  <button className="btn btn-ghost" onClick={()=>setModo(null)}>Atrás</button>
                  <button className="btn btn-ok" disabled={!montoValido} onClick={()=>onResolver(c.id,"aprobada",{cupoAprobado:montoN})}>Confirmar crédito</button>
                </div>
              </div>
          : modo==="rechazar"
            ? <div>
                <div className="field">
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}><label>Motivo del rechazo</label><MicBtnAsist onTexto={t=>setMotivo(m=> m ? m+" "+t : t)} /></div>
                  <textarea value={motivo} onChange={ev=>setMotivo(ev.target.value)} placeholder="Explica por qué no se aprueba el crédito…" />
                </div>
                <div className="row" style={{gap:10,marginTop:14}}>

function Reportes({ctx,irTab}){

  const fl=FREELANCE;

  // Ventas/pedidos en el tiempo
  const maxPed=Math.max(...R.pedidos);
  const totalPed=R.pedidos.reduce((a,b)=>a+b,0);
  const totalPag=R.pagado.reduce((a,b)=>a+b,0);
  const recaudoPeriodo=pct(totalPag,totalPed);

  // Top productos por monto
  const topOrden=[...R.topProductos].sort((a,b)=>b.monto-a.monto);
  const maxMonto=Math.max(...topOrden.map(p=>p.monto));

  // Propuestas y precios
  const propAprob=prop.filter(p=>p.estado==="aprobada").length;
  const propRech =prop.filter(p=>p.estado==="rechazada").length;
  const propPend =prop.filter(p=>p.estado==="pendiente").length;
  const preciosPend=cat.filter(p=>p.propuesto!=null).length;

  const exportar=()=>{
    exportarCsv("reporte-proveedor",
      ["Producto","Quintales","Monto"],
      topOrden.map(p=>[p.nombre, p.qq!=null?p.qq:"", p.monto]),
      "REPORTE · "+PROVEEDOR.nombre+" con "+fl.nombre);
  };

  return (
    <>
      <div className="eyebrow">Tu desempeño con {fl.nombre}</div>
      <h1 className="h1">Reportes</h1>

      {/* Resumen del periodo */}
      <div className="grid2" style={{margin:"16px 0 0"}}>
        <div className="tile">
          <div className="k">Pedidos · 6 meses</div>
          <div className="v num">{fk(totalPed)}</div>
          <div className="d up">Tu línea</div>
        </div>
        <div className="tile">
          <div className="k">Recaudo periodo</div>
          <div className="v num">{recaudoPeriodo}%</div>
          <div className="d muted">{fk(totalPag)} cobrado</div>
        </div>
      </div>

      {/* Pedidos de mi línea en el tiempo */}
      <div className="sec-gap" />
      <div className="h2" style={{marginBottom:4}}>Pedidos de tu línea</div>
      <div className="sub tiny" style={{marginBottom:12}}>Mensual · pedido vs. pagado</div>
      <div className="card card-pad">
        <div style={{display:"flex",alignItems:"flex-end",gap:10,height:140}}>
          {R.meses.map((m,i)=>(
            <div key={m} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <div style={{flex:1,width:"100%",display:"flex",alignItems:"flex-end",justifyContent:"center",gap:3}}>
                <div title={"Pedido "+f(R.pedidos[i])} style={{width:"42%",height:(R.pedidos[i]/maxPed*100)+"%",background:"var(--tinta)",borderRadius:"5px 5px 0 0"}} />
                <div title={"Pagado "+f(R.pagado[i])} style={{width:"42%",height:(R.pagado[i]/maxPed*100)+"%",background:"var(--maiz)",borderRadius:"5px 5px 0 0"}} />
              </div>
              <div className="tiny muted">{m}</div>
            </div>
          ))}
        </div>
        <div className="row" style={{gap:16,marginTop:12,paddingTop:12,borderTop:"1px solid var(--linea)"}}>
          <Leyenda color="var(--tinta)" lbl="Pedido" />
          <Leyenda color="var(--maiz)" lbl="Pagado" />
        </div>
      </div>

      {/* Recaudo y cartera */}
      <div className="sec-gap" />
      <div className="h2" style={{marginBottom:10}}>Recaudo y cartera</div>
      <div className="card card-pad">
        <div className="row between" style={{marginBottom:8}}>
          <span className="tiny muted">Pagado este mes</span>
          <span className="tiny num" style={{fontWeight:600,color:"var(--ok)"}}>{f(fl.pagado)}</span>
        </div>
        <div className="bar" style={{marginBottom:14}}><i style={{width:pct(fl.pagado,fl.pedidoMes)+"%",background:"var(--ok)"}}/></div>
        <div className="row between" style={{marginBottom:8}}>
          <span className="tiny muted">Por cobrar</span>
          <span className="tiny num" style={{fontWeight:600,color:"var(--maiz)"}}>{f(fl.porCobrar)}</span>
        </div>
        <div className="bar" style={{marginBottom:14}}><i style={{width:pct(fl.porCobrar,fl.pedidoMes)+"%",background:"var(--maiz)"}}/></div>
        <div className="row between" style={{marginBottom:8}}>
          <span className="tiny muted">Vencido</span>
          <span className="tiny num" style={{fontWeight:600,color:"var(--alerta)"}}>{f(fl.vencido)}</span>
        </div>
        <div className="bar"><i style={{width:pct(fl.vencido,fl.pedidoMes)+"%",background:"var(--alerta)"}}/></div>

      {/* Productos más pedidos */}
      <div className="sec-gap" />
      <div className="h2" style={{marginBottom:10}}>Productos más pedidos</div>
      <div className="card" style={{padding:"4px 16px 8px"}}>
        {topOrden.map((p,i)=>(
          <div key={p.nombre} style={{padding:"13px 0",borderBottom:i<topOrden.length-1?"1px solid var(--linea)":"none"}}>
            <div className="row between" style={{marginBottom:8}}>
              <div style={{fontWeight:600,fontSize:14}}>{p.nombre}</div>
              <div className="num" style={{fontWeight:600}}>{fk(p.monto)}</div>
            </div>
            <div className="bar"><i style={{width:(p.monto/maxMonto*100)+"%",background:"var(--tinta)"}}/></div>
            <div className="tiny muted" style={{marginTop:5}}>{p.unidades.toLocaleString("es-CO")} unidades</div>
          </div>
        ))}
      </div>

      {/* Propuestas y precios */}
      <div className="sec-gap" />
      <div className="h2" style={{marginBottom:10}}>Propuestas y precios</div>
      <button className="card card-pad row between" style={{width:"100%",textAlign:"left"}} onClick={()=>irTab("prop")}>
        <div className="row" style={{gap:18}}>
          <Cifra n={propAprob} lbl="aprobadas" color="var(--ok)" />
          <Cifra n={propRech} lbl="rechazadas" color="var(--alerta)" />
          <Cifra n={propPend} lbl="en espera" color="var(--espera)" />
        </div>
        <span style={{color:"var(--texto-3)",fontSize:22}}>›</span>
      </button>
      {preciosPend>0 &&
        <button className="card card-pad row between" style={{width:"100%",textAlign:"left",marginTop:12,borderColor:"var(--espera)"}} onClick={()=>irTab("precios")}>
          <div className="row" style={{gap:13}}>
            <div className="ava ava-m" style={{background:"var(--espera-suave)",color:"#8A5A12"}}>{preciosPend}</div>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>Ajustes de precio en espera</div>
              <div className="sub tiny">Esperan aprobación del freelance</div>
            </div>
          </div>
          <span style={{color:"var(--texto-3)",fontSize:22}}>›</span>
        </button>}

      <div className="sec-gap" style={{height:16}} />
      <button className="btn btn-ghost" style={{width:"100%"}} onClick={exportar}>
        ⬇ Exportar a Excel</button>
    </>
  );
}

function Cifra({n,lbl,color}){
  return <div><div className="num" style={{fontWeight:700,fontSize:22,color}}>{n}</div><div className="tiny muted">{lbl}</div></div>;
}

<script>
/* ═ Nivel 2 de notificaciones + modo offline + aviso de versión nueva ═
   El service worker se registra SOLO en HTTPS (GitHub Pages); abriendo el archivo
   local no hace nada ni molesta.

   AVISO DE VERSIÓN NUEVA (patrón único de las 5 apps): cuando hay una versión
   publicada, el service worker nuevo queda ESPERANDO en segundo plano y aquí se
   muestra una barra abajo. La app NO se recarga sola: si el usuario está a mitad
   de un pedido o un cobro, perdería el trabajo. Él decide, y puede posponerlo. ═ */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  var mostrarAvisoActualizar = function(reg){
    if (document.getElementById("aviso-actualizar")) return;
    var barra = document.createElement("div");
    barra.id = "aviso-actualizar";
    barra.style.cssText = "position:fixed;left:12px;right:12px;z-index:99999;"+
      "bottom:calc(78px + env(safe-area-inset-bottom,0px));"+
      "background:#0E2A20;color:#EAF0EA;border-radius:14px;padding:12px 14px;"+
      "display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);"+
      "font-family:inherit;font-size:13.5px";
    barra.innerHTML =
      '<span style="flex:1;min-width:0;line-height:1.3">Hay una versión nueva disponible.</span>'+
      '<button id="btn-actualizar" style="flex-shrink:0;background:#F2A900;color:#0E2A20;'+
      'border:none;border-radius:10px;padding:8px 15px;font-weight:800;font-size:13px;'+
      'font-family:inherit;cursor:pointer">Actualizar</button>'+
      '<button id="btn-despues" style="flex-shrink:0;background:transparent;'+
      'color:rgba(234,240,234,.72);border:none;font-size:12.5px;font-family:inherit;'+
      'cursor:pointer;padding:8px 2px">Después</button>';
    document.body.appendChild(barra);
    document.getElementById("btn-despues").onclick = function(){ barra.remove(); };
    document.getElementById("btn-actualizar").onclick = function(){
      var b = document.getElementById("btn-actualizar");
      b.textContent = "Actualizando…"; b.disabled = true;
      var esperando = reg.waiting;
      if (esperando) { esperando.postMessage({ tipo: "activar-ya" }); }
      /* 900 ms: le da tiempo al service worker nuevo a tomar el control. Con menos,
         a veces recarga con el viejo y el aviso vuelve a salir. */
      setTimeout(function(){ location.reload(); }, 900);
    };
  };
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    /* ya había una versión esperando al abrir */
    if (reg.waiting && navigator.serviceWorker.controller) mostrarAvisoActualizar(reg);
    /* llegó una versión nueva mientras la app estaba abierta */
    reg.addEventListener("updatefound", function(){
      var nuevo = reg.installing;
      if (!nuevo) return;
      nuevo.addEventListener("statechange", function(){
        /* controller existe = no es la primera instalación, es una actualización */
        if (nuevo.state === "installed" && navigator.serviceWorker.controller) {
          mostrarAvisoActualizar(reg);
        }
      });
    });
    /* revisa al abrir y cada vez que se vuelve a la app */
    reg.update();
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") reg.update();
    });
  }).catch(function(){ /* sin permiso o sin red: la app sigue normal */ });
  /* NO se recarga solo al cambiar el service worker: puede entrar en bucle y dejar
     la app cargando para siempre. El usuario decide con el botón. */
}
</script>
