  window.supa = (window.supabase && window.supabase.createClient)

  /* ‚ïê‚ïê 31/07/2026 ¬∑ QUE UN GUARDADO NUNCA FALLE EN SILENCIO ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
     La librer√≠a de Supabase NO lanza excepciones cuando la base rechaza algo:
     devuelve un objeto con `error` dentro. Por eso un `try/catch` alrededor de
     un guardado no sirve de nada ‚Äî el catch nunca se ejecuta y el fallo pasa
     sin dejar rastro. Varias pantallas guardaban as√≠.

     Lo que cost√≥: durante cinco d√≠as NADIE pudo crear un cliente (a la tabla
     le faltaba la pol√≠tica de escritura) y la pantalla dec√≠a que s√≠, porque

     que ves en pantalla NO est√° en la base, tienes que enterarte AHORA, antes
     de seguir trabajando encima de un dato que no existe. */
  window.avisarSiFallo = function (r, que) {
    if (r && r.error) {
      alert("\u26A0 NO SE GUARD√ì EN LA BASE\n\n¬∑ " + que + ": " +
            (r.error.message || "error") +
            "\n\nLo que ves en pantalla NO est√° guardado. Vuelve a intentarlo, " +
            "y si sigue igual avisa al equipo t√©cnico con este mensaje.");
    }
    return r;
  };

/* Fecha operativa √∫nica: Ecuador (evita que UTC adelante el d√≠a desde las 19:00). */
const ZONA_HORARIA_EC="America/Guayaquil";
const MODO_DEMO_WEB=typeof location!=="undefined" && new URLSearchParams(location.search).get("demo")==="1";
function hoyECWeb(fecha=new Date()){
  const p={}; new Intl.DateTimeFormat("en-CA",{timeZone:ZONA_HORARIA_EC,year:"numeric",month:"2-digit",day:"2-digit"})
    .formatToParts(fecha).forEach(x=>{if(x.type!=="literal")p[x.type]=x.value;});
  return `${p.year}-${p.month}-${p.day}`;
}
let ORG_ACTIVA_WEB={uid:null,org:null};
async function orgActivaWeb(){
  if(!window.supa||!window.supa.auth) throw new Error("Sin conexi√≥n con la organizaci√≥n activa.");
  const {data:s}=await window.supa.auth.getSession();
  const uid=s&&s.session&&s.session.user&&s.session.user.id;
  if(!uid) throw new Error("No hay una sesi√≥n activa.");
  if(ORG_ACTIVA_WEB.uid===uid&&ORG_ACTIVA_WEB.org) return ORG_ACTIVA_WEB.org;
  const {data,error}=await window.supa.rpc("mi_org_activa");
  if(error||!data) throw new Error((error&&error.message)||"El usuario no tiene organizaci√≥n activa.");
  ORG_ACTIVA_WEB={uid,org:String(data)}; return ORG_ACTIVA_WEB.org;
}
function registrarErrorWeb(contexto,error){
  const fila={fecha:new Date().toISOString(),contexto,mensaje:(error&&error.message)||String(error||"Error desconocido")};
  try{ const k="freelance_web_errores_v1",a=JSON.parse(localStorage.getItem(k)||"[]");a.unshift(fila);localStorage.setItem(k,JSON.stringify(a.slice(0,80))); }
  catch(storageError){ console.error("No se pudo guardar el error local",storageError); }
  console.error(`[${contexto}]`,error); return fila;
}

// ‚îÄ‚îÄ Paleta (espejo del m√≥dulo de Clientes web) ‚îÄ‚îÄ
/* ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê CONEXI√ìN A SUPABASE ¬∑ Fase 1 de la ruta maestra ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
   Proyecto de PRODUCCI√ìN (FREELANCE "EL BUENO"). La llave anon es P√öBLICA por dise√±o:
   la seguridad vive en las pol√≠ticas RLS de la base, no en esconder la llave.
   Fase 1 = LECTURA de vistas (v_*). La escritura llegar√° con Supabase Auth (fase 4). */
const SUPABASE_URL  = "https://ztpwtddrblfvcnnhbevq.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cHd0ZGRyYmxmdmNubmhiZXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MDc0MjUsImV4cCI6MjA5ODI4MzQyNX0.v-fOFxaGzo0QQWUGGvC4Oo1kx24yMTtV-5VP7WKJEeg";
async function sbLeer(recurso, params = "") {
  /* Lee una vista/tabla v√≠a PostgREST. Devuelve {ok, datos|error}. Jam√°s rompe la pantalla:
     si no hay internet o la base no responde, el sistema sigue en modo demostraci√≥n. */
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${recurso}${params ? "?" + params : ""}`, {
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` },
      signal: ctl.signal,
    });
    clearTimeout(t);
    if (!r.ok) return { ok:false, error:`HTTP ${r.status}` };
    return { ok:true, datos: await r.json() };
  } catch (e) {
    return { ok:false, error: e.name === "AbortError" ? "Sin respuesta (6s)" : String(e.message||e) };
  }
}
/* ‚îÄ‚îÄ Puente window.supa: el andamiaje de ClientesWeb (y futuros m√≥dulos) espera un cliente
   estilo supabase-js. Este puente m√≠nimo traduce .from(tabla).select(cols).order(col)
   al mensajero sbLeer (PostgREST directo) y devuelve { data, error }.
   FASE 4: el puente es SOLO RESPALDO. Si la librer√≠a supabase-js carg√≥, window.supa ya
   es el cliente REAL (creado en la cabecera), con Auth y escrituras bajo RLS ‚Äî antes
   este bloque lo pisaba y por eso el login y las escrituras no pod√≠an funcionar. ‚îÄ‚îÄ */
window.supa = window.supa || {
  from(tabla){
    /* LECTURA: select ‚Üí eq/order/limit/single encadenables; al hacer await responde { data, error } */
    const construir = (params, unico) => ({
      eq: (col, val) => construir(params + "&" + encodeURIComponent(col) + "=eq." + encodeURIComponent(val), unico),
      order: (col, opts) => construir(params + "&order=" + encodeURIComponent(col) + (opts && opts.ascending === false ? ".desc" : ""), unico),
      limit: (n) => construir(params + "&limit=" + n, unico),
      single: () => construir(params + "&limit=1", true),
      then: (res, rej) => sbLeer(tabla, params)
        .then(r => {
          if (!r.ok) return res({ data: null, error: r.error });
          res({ data: unico ? (r.datos[0] || null) : r.datos, error: unico && !r.datos.length ? "Sin resultados" : null });
        })
        .catch(rej),
    });
    /* ESCRITURA (Fase 4): rechazo elegante ‚Äî los m√≥dulos reciben { error } y conservan su camino local,
       la pantalla jam√°s se rompe. Se activa con Supabase Auth + endurecer_rls. */
    const soloLectura = () => {
      const err = { data: null, error: "Escritura disponible en Fase 4 (requiere inicio de sesi√≥n en la base)" };
      const enc = { eq: () => enc, select: () => enc, single: () => enc, then: (res) => res(err) };
      return enc;
    };
    return {
      select: (cols) => construir("select=" + encodeURIComponent(cols || "*"), false),
      insert: soloLectura, update: soloLectura, upsert: soloLectura, delete: soloLectura,
    };
  }
};

   Norma sellada (19 jul 2026, transversal a todas las apps y al sistema web):
   toda lista desplegable se ordena por las veces que cada opci√≥n fue elegida,
   de mayor a menor. El contador se guarda pero NUNCA se muestra en pantalla.
   Desempate alfab√©tico para que lo nunca usado no salga en orden aleatorio.
   En Fase 4 estos contadores viajan a Supabase por usuario. */
const USOS_SEMILLA = {
  bancos:{ "Banco Pichincha":24, "Banco Guayaquil":15, "Banco del Pac√≠fico":11,
           "Produbanco":7, "Cooperativa JEP":5, "Banco Bolivariano":3 },
  vendedores:{}, productos:{}, clientes:{}, zonas:{}, canales:{},
  listasPrecio:{}, segmentos:{}, variedades:{}, regimenes:{},
  tiposContribuyente:{}, modulos:{}, duenos:{},

};
/* Clave propia del sistema web. Las apps m√≥viles comparten el dominio de GitHub
   Pages y cada una guarda con su clave; esta va aparte para no pisar a nadie. */
const USOS_KEY = "freelance_usos_sistema_v1";
/* Mezcla lo guardado SOBRE la semilla (no la reemplaza): as√≠ lo aprendido se
   suma y las listas nuevas siguen arrancando con su orden escrito. */
function cargarUsos(){
  const base = JSON.parse(JSON.stringify(USOS_SEMILLA));
  try{
    const g = JSON.parse(localStorage.getItem(USOS_KEY) || "null");
    if(!g || typeof g!=="object") return base;
    for(const cat in g){
      if(!g[cat] || typeof g[cat]!=="object") continue;
      base[cat] = Object.assign(base[cat]||{}, g[cat]);
    }
  }catch(e){}
  return base;
}
function guardarUsos(){ try{ localStorage.setItem(USOS_KEY, JSON.stringify(USOS)); }catch(e){} }
const USOS = cargarUsos();
/* Categor√≠as donde el orden propio manda: nunca se reordenan por uso. */
const USO_FIJO = ["meses","estados","antiguedad","fechas","etapas","cupos","plazos","cuotas","filas"];
/* Opciones que siempre van al final, por m√°s que se usen: si "Otro" sube por uso,
   tapa las opciones de verdad y la lista deja de servir. */
const USO_ULTIMO = ["Otro","Otros","Ninguno","No aplica","Sin especificar"];
const usoClave = it => typeof it === "string" ? it
  : (it && (it.cod || it.id || it.nombre || it.nom || it.label)) || String(it);
/* Registra una selecci√≥n. */
const regUso = (cat, it) => {
  if (!cat || it == null) return it;
  const k = usoClave(it); if (!k) return it;
  (USOS[cat] = USOS[cat] || {});
  USOS[cat][k] = (USOS[cat][k] || 0) + 1;
  guardarUsos();
  return it;
};
/* Ordena una lista por uso (mayor‚Üímenor), con desempate alfab√©tico. */
const ordUso = (cat, lista) => {
  if (!cat || USO_FIJO.includes(cat) || !Array.isArray(lista)) return lista;
  const c = USOS[cat] || {};
  return lista.slice().sort((a,b) => {
    const ka = usoClave(a), kb = usoClave(b);
    const fa = USO_ULTIMO.includes(ka)?1:0, fb = USO_ULTIMO.includes(kb)?1:0;
    if(fa!==fb) return fa-fb;                     /* "Otro" siempre al fondo */
    return ((c[kb]||0) - (c[ka]||0)) || String(ka).localeCompare(String(kb), "es");
  });
};

function cargarPadronVendedores() {

// ‚îÄ‚îÄ Expediente de cr√©dito con archivos reales (dep√≥sito privado 'expedientes-credito') ‚îÄ‚îÄ
// Guarda un archivo por documento en la carpeta del cliente: {cli_id}/doc-1 ‚Ä¶ doc-7
function useExpediente(cliId, activo) {
  const BUCKET = "expedientes-credito";
  const [subidos, setSubidos] = React.useState([]);   // √≠ndices (0-based) que ya tienen archivo
  const [ocupado, setOcupado] = React.useState(-1);
  const ruta = (i) => cliId + "/doc-" + (i + 1);
  const recargar = React.useCallback(async () => {
    if (!activo || !cliId || !window.supa || !window.supa.storage) { setSubidos([]); return; }
    try {
      const { data, error } = await window.supa.storage.from(BUCKET).list(String(cliId), { limit: 100 });
      if (error) throw error;
      const idx = (data || []).map(f => { const m = String(f.name).match(/^doc-(\d+)$/); return m ? (parseInt(m[1], 10) - 1) : -1; }).filter(x => x >= 0);
      setSubidos(idx);
    } catch (e) { setSubidos([]); }
  }, [cliId, activo]);
  React.useEffect(() => { recargar(); }, [recargar]);
  const subir = async (i, file) => {
    if (!cliId) { alert("Primero guarda el cliente; luego puedes subir su expediente."); return; }
    if (!file) return;
    setOcupado(i);
    try {
      const { error } = await window.supa.storage.from(BUCKET).upload(ruta(i), file, { upsert: true, contentType: file.type || undefined });
      if (error) throw error;
      setSubidos(prev => prev.includes(i) ? prev : [...prev, i]);
    } catch (e) { alert("No se pudo subir el archivo: " + ((e && e.message) || e)); }
    setOcupado(-1);
  };
  const ver = async (i) => {
    if (!cliId) return;
    try {
      const { data, error } = await window.supa.storage.from(BUCKET).createSignedUrl(ruta(i), 3600);
      if (error) throw error;
      window.open(data.signedUrl, "_blank");
    } catch (e) { alert("No se pudo abrir el archivo: " + ((e && e.message) || e)); }
  };
  const eliminar = async (i) => {
    if (!cliId) return;
    if (!window.confirm("¬øEliminar este documento del expediente? Luego podr√°s subir uno nuevo.")) return;
    setOcupado(i);
    try {
      const { error } = await window.supa.storage.from(BUCKET).remove([ruta(i)]);
      if (error) throw error;
      setSubidos(prev => prev.filter(x => x !== i));
    } catch (e) { alert("No se pudo eliminar: " + ((e && e.message) || e)); }
    setOcupado(-1);
  };
  return { subidos, ocupado, subir, ver, eliminar, disponible: !!cliId };
}
// Bot√≥n por documento: "Ver" si ya hay archivo, "Subir"/"Cambiar" para adjuntarlo
function BotonExpediente({ exp, i, editable }) {
  const ref = React.useRef(null);
  const subido = exp.subidos.includes(i);
  const cargando = exp.ocupado === i;
  const btn = { fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:7, border:`1px solid ${COLOR.border}`, background:"#fff", cursor:"pointer" };
  return (
    <div style={{ display:"flex", alignItems:"center", gap:6 }} onClick={e=>e.stopPropagation()}>
      <input ref={ref} type="file" style={{ display:"none" }} accept="image/*,application/pdf,.pdf"
        onChange={e=>{ const f = e.target.files && e.target.files[0]; if (f) exp.subir(i, f); e.target.value=""; }} />
      {subido && <button onClick={()=>exp.ver(i)} style={{ ...btn, color:COLOR.teal }}>Ver</button>}
      {editable && <button disabled={cargando || !exp.disponible} onClick={()=>ref.current && ref.current.click()} style={{ ...btn, color: exp.disponible?COLOR.muted:"#bbb", cursor: exp.disponible?"pointer":"not-allowed" }}>{cargando ? "‚Ä¶" : (subido ? "Cambiar" : "Subir")}</button>}
      {editable && subido && <button disabled={cargando} onClick={()=>exp.eliminar(i)} style={{ ...btn, color: COLOR.red||"#c0392b" }}>Eliminar</button>}
      {!editable && !subido && <span style={{ fontSize:11, color:COLOR.muted, fontWeight:600 }}>Pendiente</span>}
    </div>
  );
}
// El SRI entrega a las personas naturales como "APELLIDOS NOMBRES" (ej. "CASTILLO ROSERO PEDRO RODRIGO").
// Aqu√≠ se normaliza a "NOMBRES APELLIDOS" (ej. "Pedro Rodrigo Castillo Rosero"), asumiendo 2 apellidos.
// Las empresas se dejan igual (solo se corrigen may√∫sculas, respetando siglas como S.A. o C√≠a.).
function normalizarNombreSRI(rs, esNatural) {
  const limpio = String(rs || "").trim().replace(/\s+/g, " ");
  if (!limpio) return limpio;
  if (!esNatural) return capitalizarNombreCli(limpio);
  const w = limpio.split(" ");
  if (w.length < 3) return capitalizarNombreCli(limpio);   // 1-2 palabras: no se reordena con seguridad
  const apellidos = w.slice(0, 2);
  const nombres = w.slice(2);
  return capitalizarNombreCli(nombres.concat(apellidos).join(" "));
}
// Reloj de cupo (veloc√≠metro): muestra en vivo cu√°nto del cupo de cr√©dito se est√° usando.
// Portado del flujo "tomar pedido" del freelance.
function ArcCupo({ total, usado, excede, money }) {
  if (!total || total <= 0) return null;
  const p = Math.max(0, Math.min(1.12, usado / total));
  const pa = Math.min(1, p);
  const color = excede ? "#C0392B" : p >= 0.7 ? "#C77F00" : COLOR.teal;
  const ang = -90 + 180 * Math.min(1, p);
  const disp = Math.round((total - usado) * 100) / 100;
  return (
    <div style={{ display:"flex", justifyContent:"center", marginBottom:6 }}>
      <svg viewBox="0 0 200 112" style={{ width:190, display:"block" }}>
        <path d="M 16 100 A 84 84 0 0 1 184 100" fill="none" stroke="#DDF0E6" strokeWidth="13" pathLength="1" strokeDasharray="0.7 1" strokeLinecap="round"/>
        <path d="M 16 100 A 84 84 0 0 1 184 100" fill="none" stroke="#FBF0D8" strokeWidth="13" pathLength="1" strokeDasharray="0.3 1" strokeDashoffset="-0.7"/>
        <path d="M 16 100 A 84 84 0 0 1 184 100" fill="none" stroke={color} strokeWidth="13" pathLength="1" strokeDasharray={`${pa} 1`} strokeLinecap="round" style={{ transition:"stroke-dasharray .35s ease, stroke .35s ease" }}/>
        <g style={{ transform:`rotate(${ang}deg)`, transformOrigin:"100px 100px", transition:"transform .35s cubic-bezier(.3,1.2,.4,1)" }}>
          <line x1="100" y1="100" x2="100" y2="36" stroke="#3A342A" strokeWidth="3" strokeLinecap="round"/>
        </g>
        <circle cx="100" cy="100" r="6" fill="#3A342A"/>
        <text x="100" y="82" textAnchor="middle" className="num" style={{ fontSize:17, fontWeight:700, fill: excede?"#C0392B":COLOR.tealDark }}>{excede ? "‚àí"+money(usado-total) : money(disp)}</text>
        <text x="100" y="95" textAnchor="middle" style={{ fontSize:8.5, fill:"#6B6455", fontWeight:600, letterSpacing:".04em" }}>{excede ? "EXCEDE EL CUPO" : "DISPONIBLE"}</text>
      </svg>
    </div>
  );
}
// Nombre corto para mostrar el cliente ya elegido:
//  ¬∑ Persona natural ‚Üí primer nombre + primer apellido (asumiendo nombres antes de apellidos): "Pedro Rodrigo Castillo Rosero" ‚Üí "Pedro Castillo"
//  ¬∑ Jur√≠dica (empresa) ‚Üí el nombre de la empresa completo: "Comercial Mendoza S.A."
function nombreCortoCliente(c) {
  if (!c) return "";
  const rs = String(c.razonSocial || c.razon_social || c.nombre || "").trim();
  if (!rs) return "";
  const ruc = String(c.ruc || "");
  const rsUp = rs.toUpperCase().replace(/\./g, "");
  const esJuridica = c.tipo === "Empresa" || c.tipo === "Jur√≠dica"
    || (ruc.length === 13 && ruc[2] === "9")
    || /\b(SA|SAS|CA|CIA|C√çA|LTDA|COMPANIA|COMPA√ëIA)\b/.test(rsUp);
  if (esJuridica) return rs;
  const w = rs.split(/\s+/).filter(Boolean);
  if (w.length <= 2) return rs;
  return w[0] + " " + w[w.length - 2];
}

// No toca preposiciones cortas (de, del, la, y...) salvo al inicio. No altera siglas (S.A., RUC).
function capitalizarNombreCli(txt) {
  if (!txt) return txt;
  const menores = ["de","del","la","las","los","y","e","o","a","en"];
  return txt.toLowerCase().split(/\s+/).map((p,i) => {
    if (p === "") return p;
    // Siglas tipo S.A., C√≠a. (cortas con punto): en may√∫scula
    if (/[.]/.test(p) && p.replace(/[.]/g,"").length <= 4) return p.toUpperCase();
    if (i>0 && menores.includes(p)) return p;               // de, del, la... (no al inicio)
    return p.charAt(0).toUpperCase() + p.slice(1);           // resto: May√∫scula inicial
  }).join(" ").trim();
}

// Detecci√≥n de duplicados por RUC ¬∑ tel√©fono ¬∑ nombre/raz√≥n social. excluirId = el propio cliente al editar.
function detectarDuplicadosCli(form, lista, excluirId) {
  const hits = [];
  const ruc = (form.ruc||"").trim();
  const tel = soloDigitosCli(form.telefono);
  const nom = (form.nombre||"").trim().toLowerCase();
  const raz = (form.razonSocial||"").trim().toLowerCase();
  for (const c of lista) {
    if (excluirId && c.id === excluirId) continue;
    if (ruc && (c.ruc||"").trim() === ruc) hits.push({ campo:"RUC / C√©dula", cliente:c });
    else if (tel && soloDigitosCli(c.telefono) === tel) hits.push({ campo:"Tel√©fono", cliente:c });
    else if (nom && ((c.nombre||"").trim().toLowerCase() === nom || (c.razonSocial||"").trim().toLowerCase() === raz)) hits.push({ campo:"Nombre / Raz√≥n social", cliente:c });
  }
  return hits;
}

// Validaci√≥n de c√©dula/RUC ecuatoriano (copiada del m√≥dulo de clientes)
const PROVINCIAS_VALIDAS_CLI = (() => { const s = new Set(); for (let i=1;i<=24;i++) s.add(i); s.add(30); return s; })();
/* ‚îÄ‚îÄ LA FORMA ¬∑ esto S√ç bloquea, igual que en la base (ident_forma_ok) ‚îÄ‚îÄ
   Separado a proposito del digito verificador. Al relajar el verificador me
   quedo sin querer aceptando provincia 99 en la pantalla mientras la base la
   rechazaba: pantalla y base decian cosas distintas, que es justo lo que hay
   que evitar. Lo cazo el arnes. */
function formaIdentOkCli(v) {
  const r = String(v||"").replace(/\D/g,"");
  if (r.length !== 10 && r.length !== 13) return false;
  const prov = parseInt(r.slice(0,2),10);
  if (!PROVINCIAS_VALIDAS_CLI.has(prov)) return false;
  const terc = parseInt(r[2],10);
  if (!(terc <= 5 || terc === 6 || terc === 9)) return false;
  if (r.length === 10) return terc < 6;              // c√©dula
  if (terc === 6) return r.slice(9) === "0001";      // sector p√∫blico
  return r.slice(10) === "001";                      // natural o sociedad
}
function validarCedulaCli(ci) {
  if (!/^\d{10}$/.test(ci)) return false;
  const prov = parseInt(ci.slice(0,2),10);
  if (!PROVINCIAS_VALIDAS_CLI.has(prov)) return false;
  if (parseInt(ci[2],10) >= 6) return false;
  const coef = [2,1,2,1,2,1,2,1,2];
  let suma = 0;
  for (let i=0;i<9;i++) { let p = parseInt(ci[i],10) * coef[i]; if (p >= 10) p -= 9; suma += p; }
  const dv = (suma % 10 === 0) ? 0 : 10 - (suma % 10);
  return dv === parseInt(ci[9],10);
}
function validarRUCCli(ruc) {
  if (!/^\d{13}$/.test(ruc)) return false;
  const prov = parseInt(ruc.slice(0,2),10);
  if (!PROVINCIAS_VALIDAS_CLI.has(prov)) return false;
  const tercer = parseInt(ruc[2],10);
  if (tercer < 6) return validarCedulaCli(ruc.slice(0,10)) && ruc.slice(10) === "001";
  if (tercer === 6) {
    const coef = [3,2,7,6,5,4,3,2]; let suma = 0;
    for (let i=0;i<8;i++) suma += parseInt(ruc[i],10) * coef[i];
    let dv = 11 - (suma % 11); if (dv === 11) dv = 0; if (dv === 10) return false;
    return dv === parseInt(ruc[8],10) && ruc.slice(9) === "0001";
  }
  if (tercer === 9) {
    const coef = [4,3,2,7,6,5,4,3,2]; let suma = 0;
    for (let i=0;i<9;i++) suma += parseInt(ruc[i],10) * coef[i];
    let dv = 11 - (suma % 11); if (dv === 11) dv = 0; if (dv === 10) return false;
    return dv === parseInt(ruc[9],10) && ruc.slice(10) === "001";
  }
  return false;
}
/* ‚îÄ‚îÄ EL DIGITO VERIFICADOR AVISA, NO BLOQUEA (L-016) ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
   El SRI ha emitido numeros que no cumplen el algoritmo clasico. Con la
   regla dura, un cliente REAL no se podia registrar y no se le podia
   facturar: peor que el problema que la regla evitaba.
   Lo que SIGUE bloqueando es la forma ‚Äî10 o 13 digitos, provincia real,
   terminacion del RUC‚Äî, que ahi si es un error de dedo seguro.
   El que no cuadra se guarda con `ruc_verificado = false` y sale en la
   lista de "por confirmar en el SRI". Misma regla que la base: si la
   pantalla y la base no dijeran lo mismo, una dejaria pasar lo que la
   otra rechaza y nadie entenderia por que. */
// Valida seg√∫n lo que el usuario eligi√≥ expl√≠citamente: "C√©dula" (10) o "RUC" (13)
function validarPorDocTipo(docTipo, valor) {
  const v = (valor||"").trim();
  if (!docTipo) return { ok:false, tipo:"", msg:"Primero elige C√©dula o RUC" };
  if (!v) return { ok:false, tipo:docTipo, msg:`Ingresa el n√∫mero de ${docTipo}` };
  if (!/^\d+$/.test(v)) return { ok:false, tipo:docTipo, msg:"Solo n√∫meros" };
  if (docTipo === "C√©dula") {
    if (v.length < 10) return { ok:false, tipo:"C√©dula", msg:`C√©dula incompleta (faltan ${10-v.length})` };
    if (v.length > 10) return { ok:false, tipo:"C√©dula", msg:"La c√©dula tiene 10 d√≠gitos" };
    return validarCedulaCli(v) ? { ok:true, tipo:"C√©dula", msg:"C√©dula v√°lida" }
      : (formaIdentOkCli(v) ? { ok:true, aviso:true, tipo:"C√©dula", msg:"El d√≠gito verificador no cuadra ¬∑ se guarda, pero conf√≠rmalo en el SRI" }
           : { ok:false, tipo:"C√©dula", msg:"Esa c√©dula no puede existir: revisa la provincia (los 2 primeros d√≠gitos)" });
  }
  // RUC
  if (v.length < 13) return { ok:false, tipo:"RUC", msg:`RUC incompleto (faltan ${13-v.length})` };
  if (v.length > 13) return { ok:false, tipo:"RUC", msg:"El RUC tiene 13 d√≠gitos" };
  return validarRUCCli(v) ? { ok:true, tipo:"RUC", msg:"RUC v√°lido" }
    : (formaIdentOkCli(v) ? { ok:true, aviso:true, tipo:"RUC", msg:"El d√≠gito verificador no cuadra ¬∑ se guarda, pero conf√≠rmalo en el SRI" }
         : { ok:false, tipo:"RUC", msg:"Ese RUC no puede existir: revisa la provincia y que termine en 001" });
}

// Valida tel√©fono ecuatoriano de 10 d√≠gitos. opcional=true permite vac√≠o (no obligatorio).
function validarTelefonoCli(valor, opcional) {
  const v = (valor||"").trim();

}

function validarIdentificacionCli(tipo, valor) {
  const v = (valor||"").trim();
  if (!v) return { ok:false, tipo:"", msg:"Ingresa la identificaci√≥n" };
  if (!/^\d+$/.test(v)) return { ok:false, tipo:"", msg:"Solo n√∫meros, sin guiones ni espacios" };
  if (tipo === "Natural") {
    // Persona natural: puede ser c√©dula (10) o RUC (13)
    if (v.length < 10) return { ok:false, tipo:"", msg:`C√©dula incompleta (faltan ${10-v.length} d√≠gitos)` };
    if (v.length === 10) return validarCedulaCli(v) ? { ok:true, tipo:"C√©dula", msg:"C√©dula v√°lida" }
      : (formaIdentOkCli(v) ? { ok:true, aviso:true, tipo:"C√©dula", msg:"El d√≠gito verificador no cuadra ¬∑ se guarda, pero conf√≠rmalo en el SRI" }
           : { ok:false, tipo:"C√©dula", msg:"Esa c√©dula no puede existir: revisa la provincia (los 2 primeros d√≠gitos)" });
    if (v.length > 10 && v.length < 13) return { ok:false, tipo:"", msg:`¬øRUC? faltan ${13-v.length} d√≠gitos (o es c√©dula de 10)` };
    if (v.length === 13) return validarRUCCli(v) ? { ok:true, tipo:"RUC", msg:"RUC v√°lido" }
    : (formaIdentOkCli(v) ? { ok:true, aviso:true, tipo:"RUC", msg:"El d√≠gito verificador no cuadra ¬∑ se guarda, pero conf√≠rmalo en el SRI" }
         : { ok:false, tipo:"RUC", msg:"Ese RUC no puede existir: revisa la provincia y que termine en 001" });
    return { ok:false, tipo:"", msg:"Debe ser c√©dula (10) o RUC (13 d√≠gitos)" };
  }
  // Empresa / Jur√≠dica: solo RUC (13)
  if (v.length < 13) return { ok:false, tipo:"", msg:`RUC incompleto (faltan ${13-v.length} d√≠gitos)` };
  if (v.length > 13) return { ok:false, tipo:"", msg:"El RUC tiene 13 d√≠gitos (sobran)" };
  return validarRUCCli(v) ? { ok:true, tipo:"RUC", msg:"RUC v√°lido" }
    : (formaIdentOkCli(v) ? { ok:true, aviso:true, tipo:"RUC", msg:"El d√≠gito verificador no cuadra ¬∑ se guarda, pero conf√≠rmalo en el SRI" }
         : { ok:false, tipo:"RUC", msg:"Ese RUC no puede existir: revisa la provincia y que termine en 001" });
}

// vinculos: tabla vendedor√óproducto (cada fila = qui√©n atiende qu√© producto a este cliente).

// ‚îÄ‚îÄ GPS: extraer coordenadas de links de Maps/WhatsApp, coordenadas sueltas o Plus Code ‚îÄ‚îÄ
function extraerCoordsTxtCli(texto) {
  if (!texto) return null;
  const t = texto.trim();
  let m = t.match(/[?&@](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  if (m) return { lat:parseFloat(m[1]), lng:parseFloat(m[2]) };
  m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat:parseFloat(m[1]), lng:parseFloat(m[2]) };
  m = t.match(/^(-?\d{1,2}\.\d+)[, ]+\s*(-?\d{1,3}\.\d+)$/);
  if (m) return { lat:parseFloat(m[1]), lng:parseFloat(m[2]) };
  m = t.match(/(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/);
  if (m) return { lat:parseFloat(m[1]), lng:parseFloat(m[2]) };
  return null;
}
const esLinkAcortadoCli = t => /maps\.app\.goo\.gl|goo\.gl\/maps/.test(t||"");
const OLC_ALFA_CLI = "23456789CFGHJMPQRVWX";
function esPlusCodeCli(t){ return /\b[23456789CFGHJMPQRVWX]{4,}\+[23456789CFGHJMPQRVWX]{0,3}\b/i.test((t||"").trim()); }
function plusCodeCompletoCli(code){ const c=(code||"").toUpperCase().replace(/\s+/g,""); return c.includes("+")&&c.indexOf("+")>=8; }
function decodificarPlusCodeCli(code){
  let c=(code||"").toUpperCase().replace(/\s+/g,"");
  if(!c.includes("+")||c.indexOf("+")<8) return null;
  const d=c.replace("+",""); for(const ch of d) if(!OLC_ALFA_CLI.includes(ch)) return null;
  let lat=-90,lng=-180,latRes=400,lngRes=400;
  for(let i=0;i+1<d.length&&i<10;i+=2){ latRes/=20;lngRes/=20; lat+=OLC_ALFA_CLI.indexOf(d[i])*latRes; lng+=OLC_ALFA_CLI.indexOf(d[i+1])*lngRes; }
  if(d.length>10){ let lg=latRes,ng=lngRes; for(let j=10;j<d.length&&j<15;j++){const v=OLC_ALFA_CLI.indexOf(d[j]);lg/=5;ng/=4;lat+=Math.floor(v/4)*lg;lng+=(v%4)*ng;} lat+=lg/2;lng+=ng/2; }
  else { lat+=latRes/2; lng+=lngRes/2; }
  return { lat:parseFloat(lat.toFixed(6)), lng:parseFloat(lng.toFixed(6)) };
}
function analizarPegadoCli(valor) {
  if (!valor || !valor.trim()) return { coords:null, aviso:"" };
  const c = extraerCoordsTxtCli(valor);
  if (c) return { coords:c, aviso:"" };
  if (esPlusCodeCli(valor)) {
    if (plusCodeCompletoCli(valor)) { const p=decodificarPlusCodeCli(valor.trim()); if(p) return { coords:p, aviso:"" }; }
    return { coords:null, aviso:"plus_corto" };
  }
  return { coords:null, aviso: esLinkAcortadoCli(valor) ? "acortado" : "no_detecta" };
}

// ‚îÄ‚îÄ SRI (simulado): la consulta real la ejecuta el servidor central ‚îÄ‚îÄ
function validarClienteSRICli(id) {
  return new Promise(resolve => {
    setTimeout(() => {
      const limpio = (id||"").replace(/\D/g,"");
      // Simular SRI ca√≠do ~ cuando el n√∫mero termina en 5 (para poder probar ese caso)
      if (limpio[limpio.length-1] === "5") { resolve({ error:true, estado:"SIN_RESPUESTA" }); return; }
      const v = limpio.length===10 ? validarCedulaCli(limpio) : validarRUCCli(limpio);
      if (!v) { resolve({ existe:false, estado:"NO_REGISTRADO", razonSocial:null }); return; }
      const ultimo = parseInt(limpio[limpio.length-1],10);
      const suspendido = ultimo === 0;
      resolve({
        existe: true,
        estado: suspendido ? "SUSPENDIDO" : "ACTIVO",
        // El SRI real devolver√≠a el nombre/raz√≥n social aqu√≠. El simulador NO lo inventa
        // (deja null) para que el usuario escriba el nombre real sin borrar texto de relleno.
        razonSocial: null,
        tipoContribuyente: limpio.length===13 && parseInt(limpio[2],10)===9 ? "Jur√≠dica" : "Natural",
        esAgenteRetencion: ultimo >= 8,
      });
    }, 700);
  });
}

// ‚îÄ‚îÄ Cargar Leaflet (mapa) por CDN bajo demanda ‚îÄ‚îÄ
function cargarLeafletCli() {
  return new Promise((resolve, reject) => {
    if (window.L) { resolve(window.L); return; }
    if (!document.getElementById("leaflet-css")) { const l=document.createElement("link"); l.id="leaflet-css"; l.rel="stylesheet"; l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(l); }
    if (document.getElementById("leaflet-js")) { const t=setInterval(()=>{if(window.L){clearInterval(t);resolve(window.L);}},100); setTimeout(()=>{clearInterval(t);if(!window.L)reject();},8000); return; }
    const s=document.createElement("script"); s.id="leaflet-js"; s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload=()=>resolve(window.L); s.onerror=()=>reject(); document.head.appendChild(s);
  });
}

// Mapa arrastrable sincronizado con campos lat/lng
function MapaCorregibleCli({ lat, lng, onMover, alto }) {
  const ref=useRef(null), mapRef=useRef(null), markRef=useRef(null);
  const [estado,setEstado]=useState("cargando");
  const valido = !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng));
  useEffect(()=>{ if(!valido) return; let act=true;
    cargarLeafletCli().then(L=>{ if(!act||!ref.current) return;
      const la=parseFloat(lat), ln=parseFloat(lng);
      if(!mapRef.current){
        mapRef.current=L.map(ref.current,{zoomControl:true,attributionControl:false}).setView([la,ln],16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(mapRef.current);
        const icon=L.divIcon({html:'<div style="font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">üìç</div>',className:"",iconSize:[30,30],iconAnchor:[15,28]});
        markRef.current=L.marker([la,ln],{icon,draggable:true}).addTo(mapRef.current);
        markRef.current.on("dragend",e=>{const p=e.target.getLatLng();onMover(p.lat.toFixed(6),p.lng.toFixed(6));});
        mapRef.current.on("click",e=>{markRef.current.setLatLng(e.latlng);onMover(e.latlng.lat.toFixed(6),e.latlng.lng.toFixed(6));});
      }
      setEstado("ok"); setTimeout(()=>{if(mapRef.current)mapRef.current.invalidateSize();},200);
    }).catch(()=>{if(act)setEstado("error");});
    return ()=>{act=false;};
  },[]);
  useEffect(()=>{ if(markRef.current&&mapRef.current&&valido){const la=parseFloat(lat),ln=parseFloat(lng);markRef.current.setLatLng([la,ln]);mapRef.current.setView([la,ln]);} },[lat,lng]);
  if(!valido) return (
    <div style={{ height: alto||180, borderRadius:10, border:`1px dashed ${COLOR.border}`, display:"flex", alignItems:"center", justifyContent:"center", background:COLOR.bg }}>
      <span style={{ fontSize:13, color:COLOR.muted }}>Ingresa coordenadas v√°lidas para ver el mapa</span>
    </div>
  );
  return (
    <div style={{ position:"relative", height: alto||180, borderRadius:10, overflow:"hidden", border:`1px solid ${COLOR.border}` }}>
      <div ref={ref} style={{ width:"100%", height:"100%" }} />
      {estado!=="ok" && <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:COLOR.bg, pointerEvents:"none" }}><span style={{ fontSize:12, color:COLOR.muted }}>{estado==="cargando"?"Cargando mapa‚Ä¶":"Mapa no disponible aqu√≠; las coordenadas son v√°lidas."}</span></div>}
      {estado==="ok" && <div style={{ position:"absolute", top:8, left:8, right:8, background:"rgba(255,255,255,0.92)", borderRadius:7, padding:"5px 9px", pointerEvents:"none" }}><span style={{ fontSize:10, fontWeight:700, color:COLOR.teal }}>‚úã Arrastra el pin o toca el mapa para corregir</span></div>}
    </div>
  );
}

   MARGEN_DEFECTO queda como respaldo para lo que no tenga margen propio. */

  const p = PRODUCTOS_WEB.find(x => x.id === prodId);
  const f = p ? familiaDeVariedad(p.variedad) : "";
  return MARGEN_FAMILIA[f] || MARGEN_DEFECTO;
};

function logPesoLinea(it){ return (LOG_PESO_PRES[(it.p.split("¬∑")[1]||"").trim()]||0) * it.q; }
function logPesoPedido(p){ return p.items.reduce((a,it)=>a+logPesoLinea(it),0); }
function logQQ(p){ return logPesoPedido(p)/LOG_QQ_KG; }
function logOrdenNS(ciudad){ const i=LOG_ORDEN_NS.indexOf(ciudad); return i<0?999:i; }
// Sugerir el cami√≥n m√°s peque√±o que alcance los qq dados
function logSugerirVehiculo(qq){
  const ord = VEHICULOS.slice().sort((a,b)=>a.capacidadQQ-b.capacidadQQ);
  for(let i=0;i<ord.length;i++){ if(ord[i].capacidadQQ>=qq) return ord[i]; }
  return ord[ord.length-1];
}

  const permitidasMap = {};

  // Grupos normales que tienen al menos una secci√≥n permitida
  const gruposNormales = GRUPOS_MENU
    .map(g => ({ ...g, items: g.keys.map(k => permitidasMap[k]).filter(Boolean) }))
    .filter(g => g.items.length > 0);

  // (Grupo "Frecuentes"/Accesos r√°pidos eliminado a pedido: cada m√≥dulo aparece una sola vez)
  const gruposVisibles = gruposNormales;

  // Por defecto: el grupo "Principal" siempre desplegado; de los dem√°s, solo el de la secci√≥n activa
  const [abiertos, setAbiertos] = useState(() => {
    const init = {};
    gruposNormales.forEach(g => { init[g.titulo] = g.titulo === "Principal" || g.items.some(s => s.key === active); });
    return init;
  });

  // Al abrir un grupo, los dem√°s se pliegan; si tocas el que ya est√° abierto, se cierra.
  const toggle = (t) => {
    if (t === "Principal") return;
    setAbiertos(prev => {
      const yaAbierto = !!prev[t];
      const next = {};
      gruposNormales.forEach(g => { next[g.titulo] = (g.titulo === "Principal"); });
      if (!yaAbierto) next[t] = true;
      return next;

          <div style={{ marginTop:8 }}>

function TrazabilidadWeb({ usuario }) {
  // ‚ïê‚ïê‚ïê LOG√çSTICA ¬∑ proceso en 5 pesta√±as: Rutas (escoger pedidos) ‚Üí Orden de entrega ‚Üí Despacho (nace el
  // viaje VJ) ‚Üí Seguimiento (estados separados) ¬∑ Zonas (regla del armado). El pago del flete y la estibada
  // se hace en su m√≥dulo propio (Fletes y estibada); aqu√≠ solo se produce el hecho: el viaje entregado. ‚ïê‚ïê‚ïê
  const soloLectura = usuario.rol === "Administrador de Plataforma";
  const esFreelance = usuario.rol === "Freelance";
  const [rutas, setRutas] = useState(LOG_RUTAS_INI);
  const [pedidos, setPedidos] = useState(LOG_PEDIDOS_INI);
  const [tab, setTab] = useState("rutas");
  const [aviso, setAviso] = useState("");
  const toast = (m) => { setAviso(m); setTimeout(()=>setAviso(""),2800); };

  /* ‚ïê‚ïê 31/07/2026 ¬∑ PEDIDOS DE VERDAD, NO DE MENTIRA ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
     Hasta hoy esta pantalla armaba rutas sobre `LOG_PEDIDOS_INI`, una lista
     inventada dentro del propio archivo. Se ve√≠a igual de bien y no serv√≠a
     para nada: los pedidos que se despachaban no exist√≠an.

     Ahora, con sesi√≥n, pide a la base los pedidos que de verdad est√°n listos
     para salir ‚Äî los `facturado` que siguen `sin_despachar` ‚Äî y arma las rutas
     sobre esos.

     DOS DECISIONES QUE CONVIENE ENTENDER:

     1) Si la consulta responde bien pero NO hay ning√∫n pedido, la lista se
        queda VAC√çA y se dice. No se vuelve a los de mentira. Otras pantallas
        de este archivo s√≠ lo hacen y es una trampa: ver√≠as pedidos de
        demostraci√≥n creyendo que son tuyos, y aqu√≠ eso termina en un cami√≥n
        cargado con algo que nadie pidi√≥.

     2) Se usa `despachado_qq` cuando existe, y solo si no, `cantidad_qq`. Lo
        que sube al cami√≥n es lo que la piladora despach√≥, no lo que se pidi√≥.
        En un despacho corto no son lo mismo. */
  const [fuenteLog, setFuenteLog] = useState("demo");
  const [cargandoLog, setCargandoLog] = useState(false);
  useEffect(() => {
    if (!window.supa || !window.supa.auth) return;
    let activo = true;
    setCargandoLog(true);
    (async () => {
      const { data: s } = await window.supa.auth.getSession().catch(()=>({data:null}));
      if (!activo || !s || !s.session) { setCargandoLog(false); return; }
      const { data, error } = await window.supa.from("pedidos")
        .select("ped_id,factura,creado,cli_id,estado,estado_logistico,ubicacion_id,retiro_bodega," +
                "clientes(nombre,ubicaciones_cliente(ubic_id,ciudad,provincia,direccion,barrio,contacto_tel,principal,tipo_entrega))," +
                "pedido_items(descripcion,cantidad_qq,despachado_qq)," +
                "proveedores(nombre),usuarios(nombre)")
        .eq("estado","facturado")
        /* CORREGIDO antes de publicar ¬∑ un despacho corto deja el pedido en
           `parcial`, NO en `sin_despachar`: lo hace facturar_pedido(). Con el
           filtro anterior, TODO pedido despachado a medias habria desaparecido
           de esta pantalla y no habria salido nunca. Lo cazo el arnes. */
        .in("estado_logistico", ["sin_despachar","parcial"])
        .eq("es_demo", false)
        .order("creado", { ascending:true }).limit(200);
      if (!activo) return;
      setCargandoLog(false);
      if (error) { toast("‚ö† No se pudieron traer los pedidos reales: " + (error.message||"")); return; }

      const enEc = (iso) => {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "‚Äî";
        const t = d.toLocaleString("sv-SE", { timeZone:"America/Guayaquil" });
        return t.slice(8,10) + "/" + t.slice(5,7) + " ¬∑ " + t.slice(11,16);
      };
      const vivos = (data||[]).map(p => {
        const ubs = (p.clientes && p.clientes.ubicaciones_cliente) || [];
        const u = (p.ubicacion_id && ubs.find(x=>x.ubic_id===p.ubicacion_id)) || ubs.find(x=>x.principal) || ubs[0] || {};
        return {
          id: p.ped_id,

          cliId: p.cli_id,          /* lo necesita la gu√≠a del viaje */
          cli: (p.clientes && p.clientes.nombre) || p.cli_id,
          zona: u.provincia || "‚Äî",
          sc: (p.usuarios && p.usuarios.nombre) || "‚Äî",

          provincia: u.provincia || "‚Äî",

          guia: "‚Äî",

          ref: u.barrio || "",
          tel: u.contacto_tel || "",
          facturadoEl: enEc(p.creado),
          estado: "facturado",
          items: (p.pedido_items||[]).map(i => ({
            p: i.descripcion || "producto",
            q: Number(i.despachado_qq != null ? i.despachado_qq : i.cantidad_qq) || 0,
            ok: false,
            prov: (p.proveedores && p.proveedores.nombre) || "‚Äî",
          })),
        };
      });
      setPedidos(vivos);
      setFuenteLog("vivo");
    })();
    return () => { activo = false; };
  }, []);
  const [rutaDetalle, setRutaDetalle] = useState(null);

  /* ‚îÄ‚îÄ FASE 4 ¬∑ Viajes vivos: con sesi√≥n, la pesta√±a Despacho muestra adem√°s los viajes

  const [viajesVivos, setViajesVivos] = useState([]);

  const EST_VJ = { armando:"#b45309", despachado:"#3b82f6", en_ruta:"#8b5cf6", entregado:"#1e8449", cerrado:"#6b7280", anulado:"#c0392b" };

  /* ‚îÄ‚îÄ EL RECORRIDO DEL CAMI√ìN ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ
     Se dibuja con SVG y no con una librer√≠a de mapas de internet: esta app

     ‚ö† Esto pinta D√ìNDE SELL√ì el chofer, no d√≥nde est√° ahora. Una app web no

  const [recorridos, setRecorridos] = useState({});   /* viaje_id -> puntos | "cargando" | "vacio" */
  const verRecorrido = async (viajeId) => {
    if (recorridos[viajeId]) { setRecorridos(r => { const c = { ...r }; delete c[viajeId]; return c; }); return; }
    setRecorridos(r => ({ ...r, [viajeId]: "cargando" }));

    } catch (e) { setRecorridos(r => ({ ...r, [viajeId]: "vacio" })); }
  };

  const MapaRecorrido = ({ puntos }) => {
    const pts = puntos.filter(p => p.lat != null && p.lng != null);
    if (!pts.length) return null;
    const lats = pts.map(p => Number(p.lat)), lngs = pts.map(p => Number(p.lng));
    const minLa = Math.min(...lats), maxLa = Math.max(...lats);
    const minLo = Math.min(...lngs), maxLo = Math.max(...lngs);
    /* si todos los sellos caen casi en el mismo sitio, sin este margen el
       dibujo se estirar√≠a hasta parecer un recorrido enorme que no existi√≥ */
    const dLa = Math.max(maxLa - minLa, 0.002), dLo = Math.max(maxLo - minLo, 0.002);
    const W = 100, H = 62, M = 9;
    const xy = (p) => [ M + ((Number(p.lng) - minLo) / dLo) * (W - 2*M),
                        M + ((maxLa - Number(p.lat)) / dLa) * (H - 2*M) ];
    const linea = pts.map(p => xy(p).join(",")).join(" ");
    const COLOR_M = { entrega:"#1e8449", novedad:"#c0392b", carga:"#b45309", salida:"#3b82f6", manual:"#6b7280" };
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", maxWidth:520, background:"#F7F9FB",
        border:`1px solid ${COLOR.border}`, borderRadius:10, display:"block", marginTop:8 }}>
        {pts.length > 1 && <polyline points={linea} fill="none" stroke="#9fb8c9" strokeWidth="0.7"

        {pts.map((p, i) => { const [x,y] = xy(p); return (

            <text x={x} y={y+0.9} textAnchor="middle" fontSize="2.4" fill="#fff" fontWeight="700">{i+1}</text>
          </g>
        ); })}
      </svg>
    );
  };
  const panelViajesVivos = () => fuenteVj !== "vivo" ? null : (
    <div style={{ border:"1px solid #bfe3cd", background:"#f2faf5", borderRadius:12, padding:"13px 15px", marginBottom:16 }}>

        <div key={v.id} style={{ background:"#fff", border:"1px solid #dcefe3", borderRadius:10, padding:"10px 13px", marginBottom:8 }}>

            <div style={{ fontSize:13.5, fontWeight:700, color:COLOR.text }}>
              <span className="num">{v.id}</span><ChipDemo si={v.demo}/> ¬∑ {v.ruta}
              <span style={{ fontWeight:500, color:COLOR.muted }}> ¬∑ {v.chofer} ¬∑ placa {v.placa}</span></div>
            <span style={{ padding:"2px 10px", borderRadius:20, fontSize:11, fontWeight:700,

          {/* ‚îÄ‚îÄ EL RECORRIDO ‚îÄ‚îÄ */}
          <div style={{ marginTop:9, paddingTop:8, borderTop:"1px solid #eef6f0" }}>
            <button onClick={()=>verRecorrido(v.id)}

                fontSize:12, fontWeight:700, color:"#1e6641", fontFamily:"inherit" }}>
              {recorridos[v.id] ? "‚ñæ Ocultar recorrido" : "‚ñ∏ Ver recorrido del cami√≥n"}
            </button>

            {recorridos[v.id] === "cargando" && (
              <div style={{ fontSize:12, color:COLOR.muted, marginTop:5 }}>Buscando los sellos‚Ä¶</div>)}

                Este viaje no tiene sellos de posici√≥n. El chofer los deja al confirmar una

              </div>

                  </span>

                    {/* la distancia al local es lo que se mira en un reclamo; la

                          a {p.metros_del_cliente} m del local</b>
                      : "sin coordenada del cliente todav√≠a"}
                    {p.precision_m != null ? " ¬∑ GPS ¬±" + p.precision_m + " m" : ""}
                    {" ¬∑ "}
                    <a href={"https://www.google.com/maps?q=" + p.lat + "," + p.lng}
                       target="_blank" rel="noopener noreferrer"
                       style={{ color:"#1e6641", fontWeight:700 }}>ver en el mapa</a>

          </div>

          {/* El total de vuelta, para saber si el cami√≥n regresa cargado. */}
          {(() => {

            if (!dev) return null;

                ‚Ü© Este viaje trae de vuelta <b className="num">{Math.round(dev*100)/100} qq</b> a la piladora
              </div>
            );
          })()}
        </div>
      ))}
    </div>
  );

  // ‚îÄ‚îÄ Estilos ‚îÄ‚îÄ
  const card = { background:"#fff", border:`1px solid ${COLOR.border}`, borderRadius:12, padding:18 };
  const th = { textAlign:"left", padding:"10px 12px", fontSize:12, color:COLOR.muted, textTransform:"uppercase", letterSpacing:.3, borderBottom:`2px solid ${COLOR.border}`, fontWeight:700 };
  const td = { padding:"11px 12px", fontSize:13.5, color:COLOR.text, borderBottom:`1px solid ${COLOR.border}` };
  const btn = (bg,fg) => ({ background:bg, color:fg||"#fff", border:"none", borderRadius:8, padding:"9px 16px", fontSize:13.5, fontWeight:700, cursor:"pointer" });
  const chip = (c) => ({ display:"inline-block", padding:"3px 10px", borderRadius:20, fontSize:11.5, fontWeight:700, background:c+"22", color:c });
  const pillTg = (activo) => ({ border:"none", cursor:"pointer", borderRadius:20, padding:"8px 16px", fontSize:13, fontWeight:700, background:activo?COLOR.tealDark:"#f3f5f7", color:activo?"#fff":COLOR.muted });

  // ‚îÄ‚îÄ Derivadas base ‚îÄ‚îÄ
  const enRuta = (id) => rutas.some(r => r.pedidos.indexOf(id)>=0);
  const disponibles = pedidos.filter(p => p.estado==="facturado" && !enRuta(p.id) && !p.retiroBodega);
  const retirosBodega = pedidos.filter(p => p.retiroBodega);
  const pedidosDe = (r) => r.pedidos.map(id=>pedidos.find(x=>x.id===id)).filter(Boolean);
  const qqRuta = (r) => pedidosDe(r).reduce((a,p)=>a+logQQ(p),0);
  const rutaDe = (id) => rutas.find(r => r.pedidos.indexOf(id)>=0);

  // ‚îÄ‚îÄ Selecci√≥n de pedidos (pesta√±a Rutas) ‚îÄ‚îÄ
  const [sel, setSel] = useState({});
  const [ordenP1, setOrdenP1] = useState("qq");
  const [ciudadAbierta, setCiudadAbierta] = useState({});
  const idsSel = Object.keys(sel).filter(k=>sel[k]);
  const qqSel = idsSel.reduce((a,id)=>{ const p=pedidos.find(x=>x.id===id); return a+(p?logQQ(p):0); },0);

  // ‚îÄ‚îÄ Regla de zonas (los grupos editables mandan) ‚îÄ‚îÄ
  const gruposActivos = gruposCiu.filter(g => g.activo);
  const gruposDeCiudad = (c) => gruposActivos.filter(g => g.ciudades.indexOf(c)>=0);
  const ciudadesSel = idsSel.map(id => (pedidos.find(x=>x.id===id)||{}).ciudad).filter((c,i,a)=>c && a.indexOf(c)===i);
  const gruposComunes = ciudadesSel.length ? gruposActivos.filter(g => ciudadesSel.every(c => g.ciudades.indexOf(c)>=0)) : gruposActivos;
  const zonaActiva = ciudadesSel.length ? (gruposComunes[0] || null) : null;
  const puedeCiudad = (c) => {
    if (gruposDeCiudad(c).length===0) return false;
    if (ciudadesSel.length===0) return true;
    return gruposComunes.some(g => g.ciudades.indexOf(c)>=0);
  };
  const motivoBloqueo = (c) => gruposDeCiudad(c).length===0
    ? c + " no est√° en ninguna zona. Agr√©gala en la pesta√±a Zonas."
    : "No se puede combinar " + c + (zonaActiva?" con "+zonaActiva.nombre:"") + ": no comparten zona.";
  const toggleSel = (id) => {
    if (!sel[id]) {
      const p = pedidos.find(x=>x.id===id);
      if (p && !puedeCiudad(p.ciudad)) { toast(motivoBloqueo(p.ciudad)); return; }
    }
    setSel(s => ({...s, [id]: !s[id]}));
  };
  const toggleCiudad = (lista) => {
    const todos = lista.every(p => sel[p.id]);
    if (!todos && !puedeCiudad(lista[0].ciudad)) { toast(motivoBloqueo(lista[0].ciudad)); return; }
    setSel(s => { const n = {...s}; lista.forEach(p => { n[p.id] = !todos; }); return n; });
  };

  // ‚îÄ‚îÄ Orden de entrega (utilidades puras sobre listas de ids) ‚îÄ‚îÄ
  const ordenarEntrega = (modo, base, restablecer) => {
    const lista = base.map(id=>pedidos.find(x=>x.id===id)).filter(Boolean);
    const grupos = {}; const secuencia = [];
    lista.forEach(p => { if(!grupos[p.ciudad]){ grupos[p.ciudad]=[]; secuencia.push(p.ciudad); } grupos[p.ciudad].push(p); });
    const idxDe = (id) => pedidos.findIndex(x=>x.id===id);
    const ciudades = restablecer ? secuencia.slice().sort((a,b)=>logOrdenNS(a)-logOrdenNS(b)) : secuencia;
    const out = [];
    ciudades.forEach(c => {
      let g = grupos[c];
      if (modo==="qq") g = g.slice().sort((a,b)=>logQQ(b)-logQQ(a));
      else if (restablecer) g = g.slice().sort((a,b)=>idxDe(a.id)-idxDe(b.id));
      g.forEach(p => out.push(p.id));
    });
    return out;
  };

  // ‚îÄ‚îÄ PESTA√ëA 1 ¬∑ RUTAS: escoger pedidos y guardar la ruta ‚îÄ‚îÄ
  const nombreInteligente = (ids) => {
    const cs = ids.map(id=>(pedidos.find(x=>x.id===id)||{}).ciudad).filter((c,i,a)=>c && a.indexOf(c)===i);
    if (cs.length===1) return "Ruta " + cs[0];
    const z = gruposActivos.find(g => cs.every(c=>g.ciudades.indexOf(c)>=0));
    if (z) return "Ruta " + z.nombre.replace("Zona ","");
    return "Ruta " + cs[0] + "‚Äì" + cs[cs.length-1];
  };
  const guardarRuta = () => {
    if (idsSel.length===0) { toast("Selecciona al menos un pedido."); return; }
    const orden = ordenarEntrega("ns", idsSel, true);   // orden inicial Norte‚ÜíSur; se afina en Orden de entrega
    const primer = pedidos.find(x=>x.id===orden[0]);
    const nueva = {
      id: "R-" + Date.now().toString().slice(-4),

      destino: primer ? primer.destino : "‚Äî",
      chofer: "Por asignar", placa: "Por asignar",

      estado: "armada", despachoEstado: null, viajeId: null,
      armado: { ts: Date.now(), texto: "reci√©n" },

    setRutas(r => [nueva, ...r]);
    setPedidos(ps => ps.map(p => idsSel.indexOf(p.id)>=0 ? {...p, estado:"armando"} : p));
    setSel({}); setCiudadAbierta({});
    toast("Ruta creada: " + nueva.nombre + " ¬∑ " + orden.length + " pedido(s). Sigue: Orden de entrega.");
  };

  const seleccionPedidos = () => {
    if (disponibles.length===0) return (
      <div style={{ ...card, textAlign:"center", padding:"26px 20px", marginBottom:16 }}>

    );
    const capMin = Math.min.apply(null, VEHICULOS.map(v=>v.capacidadQQ));
    const grupos = {};
    disponibles.forEach(p => { (grupos[p.ciudad] = grupos[p.ciudad] || []).push(p); });
    const ciudades = Object.keys(grupos).sort((a,b) => {
      if (ordenP1==="ns") return logOrdenNS(a)-logOrdenNS(b);
      const qa = grupos[a].reduce((x,p)=>x+logQQ(p),0), qb = grupos[b].reduce((x,p)=>x+logQQ(p),0);
      return qb-qa;
    });
    return (
      <div style={{ ...card, marginBottom:16 }}>
        <p style={{ fontSize:14, fontWeight:700, color:COLOR.text, marginBottom:4 }}>Escoger pedidos ¬∑ {disponibles.length} facturado(s) por armar</p>

          {[["qq","‚Üì Mayor qq"],["ns","‚Üï Norte ‚Üí Sur"]].map(([k,t])=>(
            <button key={k} onClick={()=>setOrdenP1(k)} style={pillTg(ordenP1===k)}>{t}</button>
          ))}
        </div>
        {ciudades.map(c => {
          const lista = grupos[c];
          const qqC = lista.reduce((a,p)=>a+logQQ(p),0);
          const nSel = lista.filter(p=>sel[p.id]).length;

  const proximoViaje = () => {
    let max = 0;
    EF_VIAJES_INI.forEach(v => { const n = parseInt((v.id||"").replace("VJ-",""))||0; if(n>max) max=n; });
    rutas.forEach(r => { const n = parseInt((r.viajeId||"").replace("VJ-",""))||0; if(n>max) max=n; });
    return "VJ-" + String(max+1).padStart(5,"0");
  };
  const abrirDespacho = (r) => { setDTr(null); setDTrTxt(""); setDNuevoTr(null); setDPlaca(""); setDDia(hoyECWeb()); setDHora("08:00"); setDespachar(r); };
  const crearTrDespacho = () => {
    if (!dNuevoTr || !dNuevoTr.nombre.trim() || !dNuevoTr.cedula.trim()) { toast("Nombre y c√©dula del transportista."); return; }
    if (trCat.some(t=>t.cedula===dNuevoTr.cedula.trim())) { toast("Ya existe un transportista con esa c√©dula."); return; }
    const t = { id:"TR-"+Date.now().toString().slice(-5), cedula:dNuevoTr.cedula.trim(), nombre:dNuevoTr.nombre.trim(), telefono:"", referencia:"", tarifas:[], activo:true };
    setTrCat(ts=>[...ts, t]); setDTr(t); setDTrTxt(t.nombre); setDNuevoTr(null);
  };
  /* ‚ïê‚ïê 31/07/2026 ¬∑ EL VIAJE NACE EN LA BASE, NO EN LA MEMORIA ‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê‚ïê
     Antes esto decia "Nacio el viaje VJ-xxx" y el viaje vivia en una variable:
     al recargar la pantalla desaparecia, y la app del transportista no tenia
     nada que confirmar porque no habia nada escrito en ninguna parte.

     Ahora se escriben las dos filas que hacen falta:
       viajes       ¬∑ el camion, su chofer, su placa y su capacidad
       viaje_guias  ¬∑ una por pedido, con su orden de entrega y sus quintales

     Se escribe ANTES de tocar la pantalla, y si falla NO se sigue: mas vale
     que el despacho no aparezca a que aparezca en la pantalla y no exista
     para el chofer. Es justo el error contrario al que veniamos arrastrando
     todo el dia. */
  const guardarDespachoEnBase = async (vj, ruta) => {
    const chofer = trCat.find(t => t.id === dTr.id);
    if (fuenteTr !== "vivo") {
      return { ok:false, motivo:"Los transportistas que ves son de demostraci√≥n. Entra con tu cuenta para despachar de verdad." };
    }
    const salida = new Date(dDia + "T" + (dHora||"08:00") + ":00").toISOString();
    const { error: e1 } = await window.supa.from("viajes").insert({
      viaje_id: vj, org_id: await orgActivaWeb(), ruta_nombre: ruta.nombre,
      transportista_id: chofer.id, placa: dPlaca.trim().toUpperCase(),
      /* `programado` no es un estado valido de viaje: la base solo acepta
         armando, despachado, en_ruta, entregado, cerrado y anulado. Un viaje
         al que se le acaba de asignar chofer y placa esta DESPACHADO. */
      /* la capacidad del camion que SALE, no null: sin ella, mirar un viaje
         viejo no dice si iba lleno o a medias. */
      capacidad_qq: (chofer && Number(chofer.capacidadQQ)) || null,
      estado: "despachado", salida,
    });
    if (e1) return { ok:false, motivo:"No se pudo crear el viaje: " + (e1.message||"") };

    const guias = (ruta.pedidos||[]).map((pid, i) => {
      const ped = pedidos.find(x => x.id === pid) || {};
      const qq = (ped.items||[]).reduce((a,it)=>a + (Number(it.q)||0), 0);
      return { guia_id: vj + "-G" + String(i+1).padStart(2,"0"), viaje_id: vj,
               ped_id: pid, cli_id: ped.cliId || null, orden_entrega: i+1,
               qq, estado_entrega: "pendiente", es_demo: false };
    });
    if (guias.length) {
      const { error: e2 } = await window.supa.from("viaje_guias").insert(guias);
      if (e2) {
        /* si fallan las guias se deshace el viaje: nunca un camion sin carga */
        try { await window.supa.from("viajes").delete().eq("viaje_id", vj); } catch (e3) {}
        return { ok:false, motivo:"No se pudieron crear las gu√≠as: " + (e2.message||"") };
      }
    }
    return { ok:true, guias: guias.length };
  };

  const guardarDespacho = async () => {
    if (!dTr) { toast("Elige el transportista del cat√°logo."); return; }
    if (!dPlaca.trim()) { toast("Ingresa la placa del cami√≥n."); return; }
    const vj = proximoViaje();

    if (fuenteLog === "vivo") {

            <p style={{ fontSize:14, fontWeight:800, color:COLOR.tealDark, margin:0 }}>üöõ Despachadas (con viaje) <span style={{fontWeight:600, fontSize:12, color:COLOR.teal}}>¬∑ {despachadas.length}</span></p>

          {despachadas.length===0

                  const ed = LOG_ESTADOS_DESPACHO[r.despachoEstado] || {t:r.despachoEstado, c:COLOR.muted};
                  const anulable = r.despachoEstado==="programado";   // punto de no retorno: la salida del cami√≥n
                  return (
                    <tr key={r.id}>
                      <td style={{...td, fontWeight:700}}>{r.nombre}<div style={{fontSize:11,color:COLOR.muted,fontWeight:400}}>{r.id}</div></td>
                      <td style={td}><span style={chip(COLOR.teal)} className="num">{r.viajeId}</span></td>

              return (
                <button key={c} disabled={soloLectura} onClick={()=>toggleCiudadGrupo(g.id, c)}

          </h1>

      {/* De d√≥nde salen los pedidos que se ven. Que esto no se pueda confundir

      <div style={{ marginBottom:12 }}>
